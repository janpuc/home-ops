---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/autoscaling/horizontalpodautoscaler_v2.json
# Holds an app that reads the NAS at 0 replicas while the NAS's NFS port does
# not answer (probe_success of job nfs_probe, through prometheus-adapter), and
# at 1 when it does. minReplicas 0 needs the HPAScaleToZero feature gate, set
# on the control plane in talos/controlplane.yaml.j2.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${APP}
spec:
  minReplicas: 0
  maxReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: ${CONTROLLER:=Deployment}
    name: ${APP}
  metrics:
    - type: External
      external:
        metric:
          name: ${ZEROSCALER_METRIC_NAME:=probe_success}
          selector:
            matchLabels:
              job: ${ZEROSCALER_JOB_NAME:=nfs_probe}
        target:
          type: Value
          value: "1"
  behavior:
    scaleDown:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
      stabilizationWindowSeconds: 0
    scaleUp:
      policies:
        - type: Pods
          value: 1
          periodSeconds: 15
