---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
  annotations:
    kopiur.home-operations.com/allow-identity-change: "true"
spec:
  compression:
    compressor: zstd
  copyMethod: ${KOPIUR_COPYMETHOD:=Direct}
  errorHandling:
    ignoreDirErrors: ${KOPIUR_IGNORE_DIR_ERRORS:=false}
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepDaily: 7
    keepHourly: 24
    keepMonthly: 6
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  verification:
    deep:
      schedule:
        cron: H 5 1 * *
    quick:
      # The worker count comes from `--file-parallelism`, not from kopia's
      # `--parallel` flag: the mover ships kopia v0.23.1, where `--parallel` is
      # parsed and silently discarded, and the verifier uses runtime.NumCPU()
      # file workers (8 on k8s-0) unless `--file-parallelism` is set. Every
      # worker waits on the NFS repository, and each waiting worker counts
      # towards the node's load average, so one mover job adds roughly 5 to
      # node_load1 on its node. The movers are not CPU bound (they wait on the
      # repo), so fewer workers cost little wall time and halve the load they
      # put on a node.
      fileParallelism: 4
      schedule:
        cron: H 3 * * *
        # `H` already resolves per schedule to a minute anywhere inside the
        # 03:00 hour, so the verifications do not start as one ~25 minute
        # burst. The jitter adds a deterministic per-schedule offset of up to
        # 30m on top of that minute, so the window becomes 03:00-04:30 local:
        # it moves starts later, it does not spread or narrow a burst, and how
        # many movers land on one node stays the scheduler's placement
        # decision. `fileParallelism` above is what lowers the load they make.
        jitter: 30m
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=miroir}
