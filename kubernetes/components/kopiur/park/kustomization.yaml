---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Temporary, per app, while its volume is rebuilt (e.g. a storage-class move):
# - the zeroscaler HorizontalPodAutoscaler is left out and the HelmRelease
#   renders the app's Deployment at 0 replicas, so the app can't run until the
#   rebuilt volume has been verified (an HPA cannot be paused, and one holding
#   1 replica while the NAS answers would start the app);
# - the SnapshotSchedule is suspended, so no scheduled backup can capture an
#   empty or half-restored volume and become the "latest" a later restore uses
#   (it happened during the 2026-09-03 migration).
# List it after the zeroscaler component. Remove it only after the new volume
# is verified.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: autoscaling
      kind: HorizontalPodAutoscaler
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: _
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/postRenderers
        value:
          - kustomize:
              patches:
                - target:
                    kind: ${CONTROLLER:=Deployment}
                    name: ${APP}
                  patch: |-
                    - op: add
                      path: /spec/replicas
                      value: 0
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotSchedule
    patch: |-
      - op: add
        path: /spec/schedule/suspend
        value: true
