---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/notification.toolkit.fluxcd.io/alert_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: alertmanager
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: FluxInstance
      name: "*"
    - kind: GitRepository
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: OCIRepository
      name: "*"
  # The dial.* entries drop whole failed fetches, not harmless noise: Go only
  # returns a dial error after every address it tried has failed. An IPv6
  # "network is unreachable" means no IPv4 connection was made either. One-off
  # blips heal on the next retry. A source that keeps failing is paged by
  # FluxResourceNotReady (flux-instance PrometheusRule) after 15m.
  exclusionList:
    - error.*lookup.*github
    - dial.*tcp.*timeout
    - dial.*tcp.*unreachable
    - waiting.*socket
  suspend: false
