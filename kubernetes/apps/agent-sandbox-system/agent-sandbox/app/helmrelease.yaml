---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
spec:
  interval: 1h
  chart:
    spec:
      chart: ./helm
      sourceRef:
        kind: GitRepository
        name: agent-sandbox
  values:
    replicaCount: 1
    namespace:
      create: false
      name: agent-sandbox-system
    image:
      repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
      tag: v1.0.12
      pullPolicy: IfNotPresent
    controller:
      # Serves the v1beta1 SandboxTemplate, SandboxClaim and SandboxWarmPool CRDs.
      extensions: true
      leaderElect: true
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    # k8s-0 has 99% of its memory requested, so stay on k8s-1 and k8s-2.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - k8s-1
                    - k8s-2
