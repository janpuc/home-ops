---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: agent-sandbox
  dependsOn:
    - name: gvisor
      namespace: kube-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: agent-sandbox
      namespace: agent-sandbox-system
  interval: 1h
  path: ./kubernetes/apps/agent-sandbox-system/agent-sandbox/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: agent-sandbox-system
  timeout: 10m
  wait: false
