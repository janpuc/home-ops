---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: pocket-id-operator
  values:
    instance:
      enabled: false
    operator:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 96Mi
  # TEMPORARY park for the move to replicated miroir-fast; revert at unpark.
  # The operator server-side-applies pocket-id's replicas and undoes the KEDA
  # pause; the chart schema rejects operator.replicas: 0, hence a post-renderer.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: pocket-id-operator
            patch: |
              - op: replace
                path: /spec/replicas
                value: 0
