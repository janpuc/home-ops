---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-instance-rules
spec:
  groups:
    - name: flux-instance.rules
      rules:
        - alert: FluxInstanceAbsent
          expr: |-
            absent(flux_instance_info{exported_namespace="flux-system", name="flux"})
          for: 15m
          annotations:
            summary: >-
              Flux instance metric is missing
          labels:
            severity: critical

        - alert: FluxInstanceNotReady
          expr: |-
            flux_instance_info{exported_namespace="flux-system", name="flux", ready!="True"}
          for: 15m
          annotations:
            summary: >-
              Flux instance {{ $labels.name }} is not ready
          labels:
            severity: critical

        - alert: FluxResourceNotReady
          expr: |-
            flux_resource_info{kind=~"HelmRelease|Kustomization|GitRepository|HelmRepository|OCIRepository", ready="False", suspended="False"} == 1
          for: 15m
          annotations:
            summary: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready
            description: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been
              not Ready for more than 15 minutes (reason: {{ $labels.reason }}). A reason of
              DependencyNotReady points at an upstream Flux resource that is failing too.
          labels:
            severity: critical
