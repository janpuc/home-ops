---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renplay-lab-tester-2
spec:
  chartRef:
    kind: OCIRepository
    name: renplay-lab-app-template
  interval: 1h
  values:
    controllers:
      # The second lab tester, the same as helmrelease-tester.yaml: the service plays one game on each.
      # The lab tester (renplay-org/lab, tester/): Chromium, headless, with software WebGL (SwiftShader),
      # and a small HTTP API for the service. It plays one installed game at a time against the lab
      # Renplay's own library UI and writes the results and screenshots to the NAS. Internal only: no route.
      renplay-lab-tester-2:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/renplay-org/lab
              # The same image as the service. Pin the same digest.
              tag: latest@sha256:25de14efc832c035071b2311ae915e3a11f6e72da478e9da23e22f07b6dc258b
            command: ["node", "tester/server.mjs"]
            env:
              PORT: "8080"
              GAMES_DIR: /games
              HOME: /tmp
              LAB_URL: http://renplay-lab.games.svc.cluster.local:8080
              # In the cluster the lab Renplay's nginx serves its UI and its API on one address.
              LAB_UI_URL: http://renplay-lab.games.svc.cluster.local:8080
              # A game over this size is parked by the service as too big for the automated tester.
              SMOKE_MAX_BYTES: "6000000000"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                # Chromium with software WebGL and a game's assets in memory.
                cpu: "4"
                memory: 8Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [3000]
    service:
      app:
        ports:
          http:
            port: 8080
    persistence:
      # Only the lab's folder: the tester writes _lab/_artifacts/<game>/ and nothing else.
      games:
        type: nfs
        server: bigmouth.internal
        path: /mnt/Vault/Media/Games/_lab
        globalMounts:
          - path: /games/_lab
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      # Chromium's shared memory.
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
