---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renplay-lab-service
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: renplay-lab-service-secret
    template:
      data:
        ITCH_API_KEY: "{{ .ITCH_API_KEY }}"
        F95_XF_USER: "{{ .F95_XF_USER }}"
        STEAMGRIDDB_API_KEY: "{{ .STEAMGRIDDB_API_KEY }}"
        # The renplay-lab GitHub App (owned by renplay-org, installed on the catalog only). 1Password keeps
        # the key with its line breaks turned into spaces: the service puts the PEM back.
        LAB_APP_ID: "{{ .LAB_APP_ID }}"
        LAB_APP_PRIVATE_KEY: "{{ .LAB_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: renplay-org
