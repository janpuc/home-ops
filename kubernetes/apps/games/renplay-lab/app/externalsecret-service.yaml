---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renplay-lab-service
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: renplay-lab-service-secret
    template:
      data:
        ITCH_API_KEY: "{{ .ITCH_API_KEY }}"
        F95_XF_USER: "{{ .F95_XF_USER }}"
        STEAMGRIDDB_API_KEY: "{{ .STEAMGRIDDB_API_KEY }}"
        # Covers made from a game's own pictures, on covers.renplay.org (R2).
        RENPLAY_COVERS_TOKEN: "{{ .CLOUDFLARE_R2_API_TOKEN }}"
        RENPLAY_COVERS_ACCOUNT: "{{ .CLOUDFLARE_ACCOUNT_ID }}"
        # The overview panel: Cloudflare analytics, Workers and D1 on the renplay.org account.
        CLOUDFLARE_API_TOKEN: "{{ .CLOUDFLARE_API_TOKEN }}"
        CLOUDFLARE_ACCOUNT_ID: "{{ .CLOUDFLARE_ACCOUNT_ID }}"
        # The renplay-lab GitHub App (owned by renplay-org, installed on the catalog only). 1Password keeps
        # the key with its line breaks turned into spaces: the service puts the PEM back.
        LAB_APP_ID: "{{ .LAB_APP_ID }}"
        LAB_APP_PRIVATE_KEY: "{{ .LAB_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: renplay-org
