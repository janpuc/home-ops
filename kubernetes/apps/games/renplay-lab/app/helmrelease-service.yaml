---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renplay-lab-service
spec:
  chartRef:
    kind: OCIRepository
    name: renplay-lab-app-template
  interval: 1h
  values:
    controllers:
      # The lab service (renplay-org/lab, service/): the queue, the steps, the API and the status page.
      # It downloads itch.io uploads into the lab Renplay's archives folder, installs them on the lab,
      # has the tester play them, drafts the recipe and opens the catalog pull request. One SQLite file
      # on its own volume, so one writer and a Recreate restart: a stop at any point is resumed.
      renplay-lab-service:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/renplay-org/lab
              # Pin the digest the image workflow prints, never the tag.
              tag: latest@sha256:1487668452c00fd9e904bb36c49c477e7ae4c803fca9c68fe5f3eba8f9561f8e
            command: ["node", "service/src/main.ts"]
            env:
              PORT: "8080"
              DB_PATH: /data/lab.db
              # The whole Games export: promote renames an archive from _lab/_archives to _archives.
              # The service's file code reaches only those two folders.
              GAMES_DIR: /games
              HOME: /tmp
              # The Renplays and the tester at their in-cluster addresses. Only promote reaches the main one.
              LAB_URL: http://renplay-lab.games.svc.cluster.local:8080
              MAIN_URL: http://renplay.games.svc.cluster.local:8080
              # The cluster's tester takes games up to 2 GB. Bigger ones go to the tester on sisyphus (an M3 Pro on
              # the LAN, native, reached through a relay in OrbStack on 8097, games up to 25 GB). When it is away they wait.
              TESTER_URLS: http://renplay-lab-tester.games.svc.cluster.local:8080,http://192.168.69.249:8097
              SMOKE_MINUTES: "2"
              # The deep test after a smoke pass: a walk through the script, verified at 90% coverage.
              LAB_DEEP_MINUTES: "2"
              # hold: a game waits at pr until it is retried. auto: it is promoted to the main Renplay by itself.
              LAB_PROMOTE: auto
              # A game's catalog pull request is merged by itself once GitHub allows it (its build check passed),
              # when the recipe has tags and a version. The rest wait on the review page.
              LAB_MERGE: auto
              PROMOTE_MIN_FREE: "1000000000000"
              # Games up to sisyphus's 25 GB, and two installed games waiting for the cluster's tester at most.
              MAX_DOWNLOAD_BYTES: "25000000000"
              INSTALLED_MAX: "2"
              # The review page (/review): sign-in with Pocket ID, the group id-admin only.
              REVIEW_URL: https://lab.janpuc.com
              REVIEW_OIDC_ISSUER: https://id.janpuc.com
              # The group's name in the token is Pocket ID's (synced from LLDAP), not the PocketIDUserGroup's.
              REVIEW_GROUP: ID-Admin
            envFrom:
              - secretRef:
                  name: renplay-lab-service-secret
              # REVIEW_OIDC_CLIENT_ID and REVIEW_OIDC_CLIENT_SECRET, made by the operator for pocketidoidcclient-review.yaml.
              - secretRef:
                  name: renplay-lab-review-oidc-credentials
                  optional: true
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  # The service's SQLite calls are synchronous: a busy moment can hold an answer for a second.
                  timeoutSeconds: 5
                  periodSeconds: 15
                  failureThreshold: 6
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 20m
                memory: 512Mi
              limits:
                # WebKit reads an itch.io page, and Chromium holds up to three pages of F95zone's check desk.
                memory: 2Gi
    defaultPodOptions:
      # Both Renplays write the games folders as uid 1000, group 3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [3000]
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        # The console. The old name goes once everything uses the new one.
        hostnames:
          - renplay-console.janpuc.com
          - lab.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: renplay-lab-service
        globalMounts:
          - path: /data
      games:
        type: nfs
        server: bigmouth.internal
        path: /mnt/Vault/Media/Games
        globalMounts:
          - path: /games
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
