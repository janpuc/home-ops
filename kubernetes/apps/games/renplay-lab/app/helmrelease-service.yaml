---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renplay-lab-service
spec:
  chartRef:
    kind: OCIRepository
    name: renplay-lab-app-template
  interval: 1h
  values:
    controllers:
      # The lab service (renplay-org/lab, service/): the queue, the steps, the API and the status page.
      # It downloads itch.io uploads into the lab Renplay's archives folder, installs them on the lab,
      # has the tester play them, drafts the recipe and opens the catalog pull request. One SQLite file
      # on its own volume, so one writer and a Recreate restart: a stop at any point is resumed.
      renplay-lab-service:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # One-off restage marker (2026-11-17). The volume lost a write under
          # the mounted filesystem again on 2026-11-16 at 21:16Z, this time
          # without a quorum loss, so the ext4 carries a latent writeback error
          # (miroir_volume_needs_restage). A new pod template makes a new pod;
          # a new pod unstages the volume and the next stage runs fsck. The
          # annotation can go once the volume is clean.
          annotations:
            miroir.home-operations.com/restage: "2026-11-17"
        containers:
          app:
            image:
              repository: ghcr.io/renplay-org/lab
              # Pin the digest the image workflow prints, never the tag.
              tag: latest@sha256:e0713bed827e9701bd09ba33e1f96c5ee9fa3c9daaef5240c1d1264f8fbfaccd
            command: ["node", "service/src/main.ts"]
            env:
              PORT: "8080"
              DB_PATH: /data/lab.db
              # The whole Games export: promote renames an archive from _lab/_archives to _archives.
              # The service's file code reaches only those two folders.
              GAMES_DIR: /games
              HOME: /tmp
              # The Renplays and the tester at their in-cluster addresses. Only promote reaches the main one.
              LAB_URL: http://renplay-lab.games.svc.cluster.local:8080
              MAIN_URL: http://renplay.games.svc.cluster.local:8080
              # The cluster's tester, games up to 2 GB.
              TESTER_URLS: http://renplay-lab-tester.games.svc.cluster.local:8080
              SMOKE_MINUTES: "2"
              # The deep test after a smoke pass: a walk through the script, verified at 90% coverage.
              LAB_DEEP_MINUTES: "2"
              # One longer walk for a game whose first walk ran out of time at 40% or more. 0 turns it off.
              LAB_DEEP_LONG_MINUTES: "15"
              # hold: a game waits at pr until it is retried. auto: it is promoted to the main Renplay by itself.
              LAB_PROMOTE: auto
              # A game's catalog pull request is merged by itself once GitHub allows it (its build check passed),
              # when the recipe has tags and a version. The rest wait on the review page.
              LAB_MERGE: auto
              # Version-watch pull requests merge once GitHub allows them too. off leaves them for a person.
              LAB_MERGE_WATCH: auto
              # The lab deletes a game's saves on the testbed when it forgets the game. off keeps them.
              LAB_DELETE_SAVES: "on"
              PROMOTE_MIN_FREE: "1000000000000"
              # Games up to the tester's 2 GB, and two installed games waiting for it at most.
              MAX_DOWNLOAD_BYTES: "2000000000"
              INSTALLED_MAX: "2"
              # The review page (/review): sign-in with Pocket ID, the group id-admin only.
              REVIEW_URL: https://renplay-console.janpuc.com
              REVIEW_OIDC_ISSUER: https://id.janpuc.com
              # The group's name in the token is Pocket ID's (synced from LLDAP), not the PocketIDUserGroup's.
              REVIEW_GROUP: ID-Admin
            envFrom:
              - secretRef:
                  name: renplay-lab-service-secret
              # REVIEW_OIDC_CLIENT_ID and REVIEW_OIDC_CLIENT_SECRET, made by the operator for pocketidoidcclient-review.yaml.
              - secretRef:
                  name: renplay-lab-review-oidc-credentials
                  optional: true
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  # The service's SQLite calls are synchronous: a busy moment can hold an answer for a second.
                  timeoutSeconds: 5
                  periodSeconds: 15
                  failureThreshold: 6
              readiness: *probe
              # Start-up opens the database and tidies old attempts before /health answers.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  timeoutSeconds: 5
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                # What it uses while it works (0.3 to 1.3 CPU on 2026-11-18), so a busy node does not starve its probes.
                cpu: 300m
                memory: 512Mi
              limits:
                # WebKit reads an itch.io page, and Chromium holds up to three pages of F95zone's check desk.
                memory: 2Gi
    defaultPodOptions:
      # Both Renplays write the games folders as uid 1000, group 3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [3000]
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        # The console: the overview, the queue, the F95zone check desk and the failures.
        hostnames:
          - renplay-console.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: renplay-lab-service
        globalMounts:
          - path: /data
      games:
        type: nfs
        server: bigmouth.internal
        path: /mnt/Vault/Media/Games
        globalMounts:
          - path: /games
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
