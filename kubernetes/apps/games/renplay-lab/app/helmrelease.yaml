---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# A second Renplay for preparing catalog games (renplay-org/lab): games are installed and played here
# before their recipes go to the catalog. Its games live on the NAS in Games/_lab, which the main
# Renplay ignores (it skips folders starting with "_").
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renplay-lab
spec:
  chartRef:
    kind: OCIRepository
    name: renplay
  interval: 1h
  values:
    # The lab runs Renplay's dev (the edge image, by digest) to test fixes before they are released.
    image:
      tag: edge
      digest: sha256:9c6b75f5a8095f615a8e564bd259e6f1e029993f6b059209f01764607fc26611
    config:
      extraEnv:
        - name: RENPLAY_IMAGE_CONCURRENCY
          value: "2"
        - name: RENPLAY_KEEP_DOWNLOADS
          value: "true"
        # Like the main Renplay: no sign-in. The lab is reached only through the internal gateway.
        - name: RENPLAY_AUTH
          value: "off"
    podSecurityContext:
      supplementalGroups: [3000]
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        cpu: "6"
        memory: 6Gi
    persistence:
      data:
        existingClaim: renplay-lab
      games:
        nfs:
          server: bigmouth.internal
          path: /mnt/Vault/Media/Games/_lab
    httpRoute:
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.janpuc.com"
      parentRefs:
        - name: envoy-internal
          namespace: network
