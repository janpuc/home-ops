---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# A second Renplay for preparing catalog games (renplay-org/lab): games are installed and played here
# before their recipes go to the catalog. Its games live on the NAS in Games/_lab, which the main
# Renplay ignores (it skips folders starting with "_").
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renplay-lab
spec:
  chartRef:
    kind: OCIRepository
    name: renplay
  interval: 1h
  values:
    # The lab runs a Renplay release by digest (an edge image of a branch when a fix needs testing first).
    image:
      tag: 4.10.0
      digest: sha256:17fcd4a8b8cdfe0e834c7064e5830ac7713ea369a643feef4f6804051f459672
    config:
      extraEnv:
        - name: RENPLAY_IMAGE_CONCURRENCY
          value: "2"
        - name: RENPLAY_KEEP_DOWNLOADS
          value: "true"
        # Like the main Renplay: no sign-in. The lab is reached only through the internal gateway.
        - name: RENPLAY_AUTH
          value: "off"
        # No earlier versions of saves: the tester's play overwrote autosaves thousands of times and filled
        # the 5 GB data volume with history nobody reads (2026-11-11). Saves a game deletes still stay 30 days.
        - name: RENPLAY_SAVE_HISTORY
          value: "0"
    podSecurityContext:
      supplementalGroups: [3000]
    resources:
      # Requests as the lab really uses them while it installs, so the scheduler never overfills a node.
      requests:
        cpu: 100m
        memory: 1536Mi
      limits:
        cpu: "3"
        memory: 3Gi
    persistence:
      data:
        existingClaim: renplay-lab
      games:
        nfs:
          server: bigmouth.internal
          path: /mnt/Vault/Media/Games/_lab
    httpRoute:
      enabled: true
      # The testbed: the Renplay where the console installs and tests games.
      hostnames:
        - renplay-testbed.janpuc.com
      parentRefs:
        - name: envoy-internal
          namespace: network
