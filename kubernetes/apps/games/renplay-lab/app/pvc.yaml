---
# The lab's library database and saves. Not backed up: everything in it can be installed again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renplay-lab
  labels:
    # Always, so a size change in git reaches the claim (the size grew from 5Gi to 10Gi
    # on 2026-11-16, when the daily save backups filled the volume).
    kustomize.toolkit.fluxcd.io/ssa: Always
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: miroir-fast
