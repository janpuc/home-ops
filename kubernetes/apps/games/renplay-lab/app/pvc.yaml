---
# The lab's library database and saves. Not backed up: everything in it can be installed again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renplay-lab
  labels:
    # Merge, so a size change in git reaches the claim (the size grew from 5Gi to 10Gi
    # on 2026-11-16, when the daily save backups filled the volume). The apply policy values
    # are Override, Merge, IfNotPresent and Ignore; IfNotPresent skips the claim and the
    # size change never reaches it. Merge keeps the fields the CSI driver sets on the bound
    # claim and applies the storage request from git.
    kustomize.toolkit.fluxcd.io/ssa: Merge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: miroir-fast
