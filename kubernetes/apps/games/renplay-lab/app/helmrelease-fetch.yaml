---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renplay-lab-fetch
spec:
  chartRef:
    kind: OCIRepository
    name: renplay-lab-fetch
  interval: 1h
  values:
    controllers:
      # Downloads itch.io uploads straight into the lab Renplay's archives folder on the NAS, and
      # moves games that passed the lab's tests into the main Renplay's (fetch.mjs). Internal
      # gateway only.
      renplay-lab-fetch:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/node
              tag: 26-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
            command: ["node", "/app/fetch.mjs"]
            env:
              ARCHIVES_DIR: /games/_lab/_archives
              MAIN_ARCHIVES_DIR: /games/_archives
              PORT: "8080"
            envFrom:
              - secretRef:
                  name: renplay-lab-fetch-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # Both Renplays write the games folders as uid 1000 (node), group 3000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        supplementalGroups: [3000]
    service:
      app:
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.janpuc.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # The whole games export, so moving a game from the lab to the main Renplay is a rename.
      games:
        type: nfs
        server: bigmouth.internal
        path: /mnt/Vault/Media/Games
        globalMounts:
          - path: /games
      code:
        type: configMap
        name: renplay-lab-fetch
        globalMounts:
          - path: /app
            readOnly: true
