---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./pvc.yaml
  - ./externalsecret-fetch.yaml
  - ./ocirepository-fetch.yaml
  - ./helmrelease-fetch.yaml
configMapGenerator:
  - name: renplay-lab-fetch
    files:
      - ./fetch.mjs
    options:
      annotations:
        # The script's own ${...} templates are JavaScript, not Flux variables.
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
