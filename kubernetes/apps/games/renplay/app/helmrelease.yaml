---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renplay
spec:
  chartRef:
    kind: OCIRepository
    name: renplay
  interval: 1h
  values:
    image:
      tag: 4.3.0
      digest: sha256:91a206fd8f2d87e2952ad627e7dd3a35d7acdd05eecddd7f077e84beafa9fccf
    config:
      extraEnv:
        - name: RENPLAY_IMAGE_CONCURRENCY
          value: "4"
        # Keep downloads after installing, to test reinstalls.
        - name: RENPLAY_KEEP_DOWNLOADS
          value: "true"
    podSecurityContext:
      # /games is owned by 3000:3000 (775); Renplay creates _archives/,
      # _renplay/ and new game folders there.
      supplementalGroups: [3000]
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 4Gi
    persistence:
      data:
        existingClaim: renplay
      games:
        nfs:
          server: bigmouth.internal
          path: /mnt/Vault/Media/Games
      # The downloads folder Renplay used inside /games, mounted where the chart expects it.
      # Downloads are recorded by name, so reinstalls keep working.
      downloads:
        enabled: true
        nfs:
          server: bigmouth.internal
          path: /mnt/Vault/Media/Games/_archives
    httpRoute:
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.janpuc.com"
      parentRefs:
        - name: envoy-internal
          namespace: network
