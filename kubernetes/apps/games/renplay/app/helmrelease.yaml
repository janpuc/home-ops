---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renplay
spec:
  chartRef:
    kind: OCIRepository
    name: renplay
  interval: 1h
  values:
    controllers:
      komf:
        containers:
          app:
            image:
              repository: ghcr.io/renplay-org/renplay
              tag: 2.10.0@sha256:e37ca258c277db1d32ebdfbc4eb37926744680f74da0a11fb83d4862e91f12e8
            env:
              # Keeps the pod up while an install job runs (scale-to-zero).
              RENPLAY_KEEPALIVE_URL: http://keda-add-ons-http-interceptor-proxy.observability.svc.cluster.local:8080
              RENPLAY_KEEPALIVE_HOST: ${HTTP_HOST}
              RENPLAY_IMAGE_CONCURRENCY: "4"
              # Keep downloads after installing, to test reinstalls.
              RENPLAY_DELETE_ARCHIVES: "false"
              # The Node process never gave memory back: the container's
              # working set grew about 1 GiB an hour until the 4 GiB limit
              # killed it (2026-11-04, twice). V8 sized its heap from the
              # node's memory, not from this container's limit, so it
              # collected too late. A smaller old space collects earlier,
              # and two malloc arenas keep glibc from holding freed memory
              # in a per-thread arena.
              NODE_OPTIONS: "--max-old-space-size=2048"
              MALLOC_ARENA_MAX: "2"
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # /games is owned by 3000:3000 (775); renplay creates _archives/,
        # _renplay/ and new game folders there.
        supplementalGroups: [3000]
    service:
      app:
        ports:
          http:
            port: ${HTTP_PORT}
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: bigmouth.internal
        path: /mnt/Vault/Media/Games
        globalMounts:
          - path: /games
      tmp:
        type: emptyDir
