---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renplay
spec:
  chartRef:
    kind: OCIRepository
    name: renplay
  interval: 1h
  values:
    controllers:
      komf:
        containers:
          app:
            image:
              repository: ghcr.io/renplay-web/renplay
              tag: edge@sha256:42a09e19282bfb72b4f05ddcc36b804568a3b6acea402bd60989bd0c7dbb2062
            env:
              # Keeps the pod up while an install job runs (scale-to-zero).
              RENPLAY_KEEPALIVE_URL: http://keda-add-ons-http-interceptor-proxy.observability.svc.cluster.local:8080
              RENPLAY_KEEPALIVE_HOST: ${HTTP_HOST}
              RENPLAY_IMAGE_CONCURRENCY: "4"
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # /games is owned by 3000:3000 (775); renplay creates _archives/,
        # _renplay/ and new game folders there.
        supplementalGroups: [3000]
    service:
      app:
        ports:
          http:
            port: ${HTTP_PORT}
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: bigmouth.internal
        path: /mnt/Vault/Media/Games
        globalMounts:
          - path: /games
      tmp:
        type: emptyDir
