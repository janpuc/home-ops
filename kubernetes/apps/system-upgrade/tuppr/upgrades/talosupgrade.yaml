---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.2
  policy:
    # Flux helm-controller and Prometheus take up to 600s to stop; talosctl's 5m
    # default failed the first k8s-0 attempt on 2026-10-04.
    drainTimeout: 15m
    rebootMode: powercycle
  healthChecks:
    - apiVersion: miroir.home-operations.com/v1alpha1
      kind: MiroirVolume
      expr: |-
        status.phase == 'Ready'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.phase != 'Running'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])
