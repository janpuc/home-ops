---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polyglot
spec:
  chartRef:
    kind: OCIRepository
    name: polyglot
  interval: 1h
  values:
    controllers:
      polyglot:
        annotations:
          reloader.stakater.com/auto: "true"
        # One writer on the SQLite volume.
        strategy: Recreate
        containers:
          app:
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-credentials"
            env:
              POLYGLOT_DB: /data/polyglot.db
              POLYGLOT_PUBLIC_URL: https://polyglot.janpuc.com
              POLYGLOT_AUTH_MODE: oidc
              POLYGLOT_OIDC_ISSUER: https://id.janpuc.com
              # Exact match against the token's groups claim (Pocket ID's names).
              POLYGLOT_OIDC_ALLOWED_GROUPS: ID-Users,ID-Admin
              # The tutor key, from the LiteLLMVirtualKey in this app. The chart schema has no optional.
              POLYGLOT_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              POLYGLOT_LLM_KEY:
                valueFrom:
                  secretKeyRef:
                    name: polyglot-litellm
                    key: POLYGLOT_LLM_KEY
              # Speech check service in this namespace (speech.yaml). Unset turns the automatic checks off.
              POLYGLOT_SPEECH_URL: http://polyglot-speech.selfhosted.svc.cluster.local:8080
            image:
              repository: ghcr.io/janpuc/polyglot
              tag: sha-e9f223d@sha256:d77aba6c869b4bb32b616885ac6f0a9500fa39243fbcaaed59e291fec51977b6
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.janpuc.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
