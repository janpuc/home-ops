---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: polyglot
spec:
  # Stage 2: the practice record lives in SQLite on a kopiur backed volume, sign-in is Pocket ID.
  # Backup only, no zeroscaler.
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
    - name: pocket-id-instance
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/selfhosted/polyglot/app
  postBuild:
    substitute:
      APP: polyglot
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_COPYMETHOD: Direct
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
