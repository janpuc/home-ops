---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: polyglot
spec:
  # Stage 1: stateless. Authored scenes and prebuilt audio only, no database, so no kopiur backup
  # and no Pocket ID yet. Both come with stage 2, before any personal data is stored.
  interval: 1h
  path: ./kubernetes/apps/selfhosted/polyglot/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
