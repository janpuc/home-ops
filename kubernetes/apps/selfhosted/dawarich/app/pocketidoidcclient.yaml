---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: dawarich
spec:
  name: Dawarich
  callbackUrls:
    - "https://timeline.janpuc.com/users/auth/openid_connect/callback"
  pkceEnabled: true
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-users
      namespace: security
  secret:
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER
