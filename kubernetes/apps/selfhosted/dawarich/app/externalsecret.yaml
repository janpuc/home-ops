---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dawarich
spec:
  length: 128
  digits: 32
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - SECRET_KEY_BASE
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dawarich
spec:
  # Generated in the cluster, once: a new key would end every session and
  # make Dawarich's encrypted columns unreadable.
  refreshPolicy: CreatedOnce
  target:
    name: dawarich-secret
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dawarich
