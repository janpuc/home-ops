---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dawarich-pgdump
spec:
  # Before Kopiur's 2-hourly snapshot of the volume; keeps a week of dumps.
  schedule: "15 3 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pgdump
              # The cluster's own image, so pg_dump matches the server.
              image: ghcr.io/cloudnative-pg/postgis:18.6-3.7.0-standard-bookworm
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  out="/dumps/dawarich-$(date -u +%Y%m%dT%H%MZ).dump"
                  pg_dump --format=custom --no-owner --dbname="$DATABASE_URL" --file="$out.part"
                  mv "$out.part" "$out"
                  ls -1t /dumps/dawarich-*.dump | tail -n +8 | xargs -r rm -f --
                  ls -lh /dumps
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: dawarich-postgres-app
                      key: uri
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: dawarich-pgdump
