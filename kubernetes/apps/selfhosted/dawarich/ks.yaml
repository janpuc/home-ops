---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dawarich-database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: dawarich
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: miroir-config
      namespace: miroir-system
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: dawarich-postgres
      namespace: selfhosted
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/selfhosted/dawarich/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  timeout: 15m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dawarich
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/dragonfly
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: dawarich-database
    - name: dragonfly-operator
      namespace: database
    - name: kopiur
      namespace: kopiur-system
    - name: pocket-id-instance
      namespace: security
    - name: miroir-config
      namespace: miroir-system
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
  interval: 1h
  path: ./kubernetes/apps/selfhosted/dawarich/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_COPYMETHOD: Direct
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dawarich-pgdump
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: dawarich
  # The nightly database dump lands on its own volume, which Kopiur backs up
  # to the NAS like every other app volume. CloudNativePG has no backup here.
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: dawarich-database
    - name: kopiur
      namespace: kopiur-system
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/selfhosted/dawarich/backup
  postBuild:
    substitute:
      APP: dawarich-pgdump
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_COPYMETHOD: Direct
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
