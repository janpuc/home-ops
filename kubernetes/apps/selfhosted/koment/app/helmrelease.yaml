---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: koment
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: koment
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: koment
    repositories:
      - id: home-ops
        name: home-ops
        provider: github
        remote: janpuc/home-ops
        defaultBranch: main
        default: true
    syncInterval: 5m
    github:
      existingSecret: koment-secret
      tokenKey: github-token
    auth:
      existingSecret: koment-secret
      credentialsKey: credentials.yaml
      humanWrites: false
      trustedProxies:
        - 10.42.0.0/16
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
