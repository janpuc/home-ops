---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: apple-health
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # VictoriaMetrics' own plugin, not Grafana's Prometheus type: a Prometheus
  # datasource shows up in every dashboard's Prometheus picker, and sorting
  # first it became their default. Metric names are <metric>_<unit>_<field>,
  # e.g. step_count_count_qty.
  plugins:
    - name: victoriametrics-metrics-datasource
      version: 0.26.1
  datasource:
    type: victoriametrics-metrics-datasource
    name: apple-health
    access: proxy
    url: http://apple-health-victoria-metrics.selfhosted.svc.cluster.local:8428
