---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: apple-health
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # VictoriaMetrics answers PromQL, so Grafana's Prometheus type reads it.
  # Metric names are <measurement>_<field>, e.g. step_count_qty.
  datasource:
    type: prometheus
    name: apple-health
    access: proxy
    url: http://apple-health-victoria-metrics.selfhosted.svc.cluster.local:8428
