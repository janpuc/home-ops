---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  force: true
  interval: 1h
  path: ./kubernetes/apps/selfhosted/atuin/app
  postBuild:
    substitute:
      APP: atuin
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_COPYMETHOD: Direct
      KOPIUR_STORAGECLASS: miroir-fast-local
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
