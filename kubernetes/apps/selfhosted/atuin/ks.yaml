---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: atuin
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/park
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  # Temporary park while the PVC moves storage class (no zeroscaler here):
  # the app stays at 0 replicas until its rebuilt volume is verified.
  patches:
    - target:
        kind: HelmRelease
        name: atuin
      patch: |-
        - op: add
          path: /spec/values/controllers/atuin/replicas
          value: 0
  path: ./kubernetes/apps/selfhosted/atuin/app
  postBuild:
    substitute:
      APP: atuin
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_COPYMETHOD: Direct
      KOPIUR_STORAGECLASS: miroir-fast-local
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: selfhosted
  wait: false
