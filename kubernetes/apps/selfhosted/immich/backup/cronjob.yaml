---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-pgdump
spec:
  # After litellm's 01:10 and kritika's 01:40 dumps, and away from Kopiur's
  # 03:00-04:30 verification window; the next two-hourly snapshot of the dump
  # volume picks it up.
  schedule: "20 2 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          # The dump carries the vchord and vector extensions as CREATE EXTENSION
          # statements plus the vchordrq index definitions, so pg_dump needs no
          # special flags for them. A restore only replays those into a cluster
          # that already has the vchord extension image and vchord in
          # shared_preload_libraries (this one does): a plain postgres image fails
          # at CREATE EXTENSION vchord, the vchordrq indexes are rebuilt rather
          # than copied, and CREATE EXTENSION needs a superuser, so restore into a
          # database the Database CR has already created.
          containers:
            - name: pgdump
              # The cluster's own image, so pg_dump matches the server.
              image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  # A dump killed mid-write leaves a .part file the retention below never matches.
                  rm -f /dumps/immich-*.dump.part
                  out="/dumps/immich-$(date -u +%Y%m%dT%H%MZ).dump"
                  pg_dump --format=custom --no-owner --dbname="$DATABASE_URL" --file="$out.part"
                  mv "$out.part" "$out"
                  ls -1t /dumps/immich-*.dump | tail -n +8 | xargs -r rm -f --
                  ls -lh /dumps
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: immich-postgres-app
                      key: uri
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: immich-pgdump
