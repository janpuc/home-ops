---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pocketidoidcclient.yaml
  - ./pvc.yaml
# Immich's settings, with placeholders the init container fills from the
# Pocket ID client's secret. A config file makes those settings read-only in
# the admin page: change them here.
configMapGenerator:
  - name: immich-config
    files:
      - ./resources/immich.json
generatorOptions:
  disableNameSuffixHash: true
