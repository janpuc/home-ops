---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: immich
spec:
  name: Immich
  # The web sign-in, the account-linking page, and the mobile app.
  callbackUrls:
    - "https://photos.janpuc.com/auth/login"
    - "https://photos.janpuc.com/user-settings"
    - "app.immich:///oauth-callback"
  allowedUserGroups:
    - name: id-admin
      namespace: security
    - name: id-users
      namespace: security
  secret:
    keys:
      clientID: OIDC_CLIENT_ID
      clientSecret: OIDC_CLIENT_SECRET
      issuerUrl: OIDC_ISSUER
