---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
spec:
  cluster:
    name: immich-postgres
  name: immich
  owner: immich
  # The extensions Immich needs, created here because the immich role is not a
  # superuser. cube before earthdistance, which depends on it.
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      version: "1.1.1"
      ensure: present
    - name: cube
      ensure: present
    - name: earthdistance
      ensure: present
