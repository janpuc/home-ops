---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dispatch-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch-operator
  namespaceSelector:
    matchNames:
      - dispatch
  endpoints:
    - port: metrics
      path: /metrics
