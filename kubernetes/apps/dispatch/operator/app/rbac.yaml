---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dispatch-operator
rules:
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["dispatch.janpuc.com"]
    resources: ["agents", "triggers", "workspaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dispatch.janpuc.com"]
    resources: ["sessions"]
    verbs: ["get", "list", "patch", "update", "watch"]
  - apiGroups: ["dispatch.janpuc.com"]
    resources: ["sessions/status", "workspaces/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dispatch-operator
subjects:
  - kind: ServiceAccount
    name: dispatch-operator
    namespace: dispatch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-agent-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dispatch-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: dispatch-agent-readonly
    namespace: dispatch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatch-agent-minimal
automountServiceAccountToken: false
