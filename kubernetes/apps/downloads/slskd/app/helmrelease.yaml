---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slskd
spec:
  chartRef:
    kind: OCIRepository
    name: slskd
  interval: 1h
  values:
    controllers:
      slskd:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            restartPolicy: Always
            env:
              DOT: "off"
              DNS_ADDRESS: 127.0.0.2
              VPN_SERVICE_PROVIDER: protonvpn
              VPN_TYPE: wireguard
              VPN_INTERFACE: wg0
              VPN_PORT_FORWARDING: on
              FIREWALL_INPUT_PORTS: "80,9999"
              HEALTH_SERVER_ADDRESS: ":9999"
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/24,10.43.0.0/16
              VPN_PORT_FORWARDING_UP_COMMAND: /config/update-port.sh
            envFrom:
              - secretRef:
                  name: qbittorrent
            lifecycle:
              postStart:
                exec:
                  command:
                    - "/bin/sh"
                    - "-c"
                    - "(ip rule del table 51820; ip -6 rule del table 51820) || true"
            probes:
              liveness: &gProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /check
                    port: 9999
              readiness: *gProbes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /check
                    port: 9999
                  initialDelaySeconds: 10
            securityContext:
              capabilities: { add: ["NET_ADMIN"] }
              allowPrivilegeEscalation: false
        containers:
          app:
            image:
              repository: ghcr.io/slskd/slskd
              tag: 0.26.0@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
            env:
              DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
              SLSKD_CONFIG: /tmp/slskd.yaml
              SLSKD_APP_DIR: /config
              SLSKD_HTTP_PORT: &port 80
              SLSKD_NO_AUTH: true
              SLSKD_NO_HTTPS: true
              SLSKD_NO_VERSION_CHECK: true
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        forceRename: "{{ .Release.Name }}"
        primary: true
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.janpuc.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    configMaps:
      config:
        data:
          slskd.yaml: |-
            soulseek:
              listenPort: 50429
            directories:
              downloads: /media/Downloads/soulseek/complete
              incomplete: /media/Downloads/soulseek/incomplete
            transfers:
              download:
                destination:
                  permissions:
                    mode: 750
                retry:
                  partial: resume
                  attempts: 3
                  delay: 5000
                  max_delay: 60000
            shares:
              directories:
                - /media/Downloads/soulseek/shared
              filters:
                - \.ini$
                - Thumbs.db$
                - \.DS_Store$
          update-port.sh: |-
            #!/bin/sh
            set -eu

            : "$${PORT:?PORT environment variable is required}"

            IN="/config/slskd.yaml"
            OUT="/tmp/slskd.yaml"

            case "$$PORT" in
            	''|*[!0-9]*)
            		echo "ERROR: PORT must be an integer, got: $$PORT" >&2
            		exit 2
            		;;
            esac
            if [ "$$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            	echo "ERROR: PORT must be in range 1..65535, got: $$PORT" >&2
            	exit 2
            fi

            if [ ! -r "$$IN" ]; then
            	echo "ERROR: input config not readable: $$IN" >&2
            	exit 1
            fi

            tmp="$$(mktemp "$${OUT}.XXXXXX")"
            cleanup() { rm -f "$$tmp"; }
            trap cleanup EXIT INT TERM

            sed -E "s/^([[:space:]]*listenPort:).*/\1 $${PORT}/" "$$IN" > "$$tmp"

            if ! grep -Eq '^[[:space:]]*listenPort:[[:space:]]*[0-9]+' "$$tmp"; then
            	echo "ERROR: listenPort: key not found or not updated in $$IN" >&2
            	exit 3
            fi

            mv -f "$$tmp" "$$OUT"
            trap - EXIT INT TERM

            chown 2000:2000 "$$OUT"

            echo "Updated listenPort to $$PORT in $$OUT"
    persistence:
      config-file:
        type: configMap
        identifier: config
        defaultMode: 0550
        advancedMounts:
          slskd:
            gluetun:
              - path: /config/slskd.yaml
                subPath: slskd.yaml
              - path: /config/update-port.sh
                subPath: update-port.sh
      media:
        type: nfs
        server: bigmouth.internal
        path: /mnt/Vault/Media
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
