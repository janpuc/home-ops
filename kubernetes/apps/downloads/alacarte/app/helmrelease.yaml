---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alacarte
spec:
  chartRef:
    kind: OCIRepository
    name: alacarte
  interval: 1h
  values:
    controllers:
      alacarte:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          wrapper:
            image:
              repository: ghcr.io/janpuc/alacarte-wrapper
              tag: main@sha256:091beb9934d96b8b78703dea6cd9c1686c5b63c6e11270ebc2aa46506434ce96
            restartPolicy: OnFailure
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 11020
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 11020
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 11020
                  initialDelaySeconds: 2
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            env:
              LD_PRELOAD: /app/libwrapper_strtok_fix.so
              WRAPPER_DEBUG: "true"
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                add:
                  - SYS_ADMIN
                  - MKNOD
                  - SYS_CHROOT
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETUID
                  - SETGID
          web:
            image:
              repository: ghcr.io/janpuc/alacarte-web
              tag: main@sha256:f28dc65bb400a8d3b377b1491e615007a69cad00876f393625edafe0fa86246a
            env:
              PORT: &port 7373
              AMDL_WRAPPER_HOST: localhost
              AMDL_WRAPPER_DECRYPT_PORT: &decryptPort "10020"
              AMDL_WRAPPER_M3U8_PORT: &m3u8Port "20020"
              AMDL_WRAPPER_ACCOUNT_PORT: &accountPort "30020"
              AMDL_MUSIC_PATH: /media/Downloads/manual/music/
              AMDL_CONFIG_DIR: /config
              AUTH_DISABLED: "true"
              TRUST_PROXY: loopback
              WRAPPER_LOGIN_DEBUG: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      alacarte:
        controller: alacarte
        ports:
          web:
            port: 7373
    route:
      alacarte:
        hostnames:
          - alacarte.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: alacarte
                port: 7373
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          alacarte:
            web:
              - path: /config
              - path: /wrapper-data
                subPath: wrapper
            wrapper:
              - path: /app/rootfs/data
                subPath: wrapper
      dev-null:
        type: hostPath
        hostPath: /dev/null
        hostPathType: CharDevice
        advancedMounts:
          alacarte:
            wrapper:
              - path: /app/rootfs/dev/null
                readOnly: true
      dev-urandom:
        type: hostPath
        hostPath: /dev/urandom
        hostPathType: CharDevice
        advancedMounts:
          alacarte:
            wrapper:
              - path: /app/rootfs/dev/urandom
                readOnly: true
      dev-random:
        type: hostPath
        hostPath: /dev/random
        hostPathType: CharDevice
        advancedMounts:
          alacarte:
            wrapper:
              - path: /app/rootfs/dev/random
                readOnly: true
      dev-zero:
        type: hostPath
        hostPath: /dev/zero
        hostPathType: CharDevice
        advancedMounts:
          alacarte:
            wrapper:
              - path: /app/rootfs/dev/zero
                readOnly: true
      media:
        type: nfs
        server: bigmouth.internal
        path: /mnt/Vault/Media
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
