---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: suwayomi
spec:
  chartRef:
    kind: OCIRepository
    name: suwayomi
  interval: 1h
  values:
    controllers:
      suwayomi:
        containers:
          app:
            image:
              repository: ghcr.io/suwayomi/tachidesk
              tag: v2.4.2476@sha256:97e1a6d10fbd1217ffdf68aefa8610fd4be8a041488a1c674d14aea0fdeb5c45
            env:
              AUTO_DOWNLOAD_EXCLUDE_UNREAD: false
              AUTO_DOWNLOAD_CHAPTERS: true
              BIND_PORT: &port 80
              DOWNLOAD_AS_CBZ: true
              EXTENSION_REPOS: '["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]'
              FLARESOLVERR_ENABLED: true
              FLARESOLVERR_URL: http://flaresolverr.selfhosted.svc.cluster.local:8191
              UPDATE_EXCLUDE_UNREAD: false
              UPDATE_EXCLUDE_STARTED: false
              UPDATE_EXCLUDE_COMPLETED: false
              WEB_UI_CHANNEL: preview
            resources:
              requests:
                cpu: 10m
                # The request is the scheduler's reservation, not a cap: the pod's
                # working set peaked at 900 MiB over 30 days (473 MiB on the
                # current build, 267-303 MiB on days 2-4) and about 700 MiB on the
                # builds before it. 1280Mi reserved 1280Mi from k8s-0, the node
                # with the least room; memoryLimit keeps the ceiling where it was.
                memory: 1024Mi
              limits:
                memory: 1792Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.janpuc.com"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/suwayomi/.local/share/Tachidesk
      media:
        type: nfs
        server: bigmouth.internal
        path: /mnt/Vault/Media/Comics
        globalMounts:
          - path: /home/suwayomi/.local/share/Tachidesk/downloads/mangas
