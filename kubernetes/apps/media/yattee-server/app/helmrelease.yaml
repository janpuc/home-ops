---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yattee-server
spec:
  chartRef:
    kind: OCIRepository
    name: yattee-server
  interval: 1h
  values:
    controllers:
      yattee-server:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # yt-dlp needs curl_cffi to impersonate a browser; without it Patreon (Cloudflare) answers 403
          # even with valid cookies. The ytdlp-config ConfigMap below turns impersonation on for every run.
          # The image doesn't ship it, so install it next to the app and expose it via PYTHONPATH
          # (--no-deps: its deps cffi and certifi already come with the image).
          python-extras:
            image: &image
              repository: docker.io/yattee/yattee-server
              tag: 1.0.10@sha256:e54e36648535396c54cbe9687b51d702f698f3987cdab5ce26ba696e3e939176
            command:
              - /bin/sh
              - -c
              - pip install --no-cache-dir --no-deps --disable-pip-version-check --target /opt/python-extras "curl_cffi==$CURL_CFFI_VERSION"
            env:
              # renovate: datasource=pypi depName=curl_cffi
              CURL_CFFI_VERSION: 0.16.3
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
          # v1.0.9 creates keys lazily as 0600; fsGroup alone cannot make those readable by kopiur.
          # Create missing keys in the upstream formats before the app starts; never replace existing keys.
          # Set group 1000 explicitly, including when fsGroup's OnRootMismatch skips an existing volume.
          data-permissions:
            image: *image
            command:
              - python
              - -c
              - |
                import os
                import secrets
                import stat
                from pathlib import Path
                from cryptography.fernet import Fernet

                data = Path(os.environ["DATA_DIR"])
                data.mkdir(parents=True, exist_ok=True)
                for name, generate in (
                    (".encryption_key", Fernet.generate_key),
                    (".stream_token_secret", lambda: secrets.token_urlsafe(32).encode()),
                ):
                    path = data / name
                    flags = os.O_NOFOLLOW | os.O_NONBLOCK
                    try:
                        fd = os.open(path, flags | os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                    except FileExistsError:
                        fd = os.open(path, flags | os.O_RDONLY)
                        created = False
                    else:
                        created = True
                    with os.fdopen(fd, "wb" if created else "rb") as key:
                        metadata = os.fstat(key.fileno())
                        if not stat.S_ISREG(metadata.st_mode):
                            raise RuntimeError("Key path must be a regular file")
                        if created:
                            key.write(generate())
                            key.flush()
                        if metadata.st_gid != 1000:
                            os.fchown(key.fileno(), -1, 1000)
                        if stat.S_IMODE(metadata.st_mode) != 0o640:
                            os.fchmod(key.fileno(), 0o640)
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            env:
              PORT: &port 8085
              PYTHONPATH: /opt/python-extras
              SECURE_COOKIES: "true"
              YT_POT_ENABLED: "true"
            envFrom:
              - secretRef:
                  name: yattee-server-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            # The image installs deno under /root and runs as root
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    configMaps:
      ytdlp-config:
        data:
          # yt-dlp reads /etc/yt-dlp.conf on every run; Yattee Server has no setting for --impersonate.
          yt-dlp.conf: |
            --impersonate chrome
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          # Everything else needs Basic Auth and answers 401.
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
            path: /health
        hostnames:
          - yattee.janpuc.com
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      ytdlp-config:
        type: configMap
        identifier: ytdlp-config
        advancedMounts:
          yattee-server:
            app:
              - path: /etc/yt-dlp.conf
                subPath: yt-dlp.conf
                readOnly: true
      python-extras:
        type: emptyDir
        globalMounts:
          - path: /opt/python-extras
      downloads:
        type: emptyDir
        sizeLimit: 30Gi
        globalMounts:
          - path: /downloads
