---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yattee-server
spec:
  chartRef:
    kind: OCIRepository
    name: yattee-server
  interval: 1h
  values:
    controllers:
      yattee-server:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # yt-dlp needs curl_cffi to impersonate a browser; without it Patreon (Cloudflare) answers 403
          # even with valid cookies. The ytdlp-config ConfigMap below turns impersonation on for every run.
          # The image doesn't ship it, so install it next to the app and expose it via PYTHONPATH
          # (--no-deps: its deps cffi and certifi already come with the image).
          python-extras:
            image: &image
              repository: docker.io/yattee/yattee-server
              tag: 1.0.9@sha256:b0b27ef2068b0dd897d1597d3d472855d8f91c62a1c9b7c3eee2ae0c8251fe39
            command:
              - /bin/sh
              - -c
              - pip install --no-cache-dir --no-deps --disable-pip-version-check --target /opt/python-extras "curl_cffi==$CURL_CFFI_VERSION"
            env:
              # renovate: datasource=pypi depName=curl_cffi
              CURL_CFFI_VERSION: 0.17.0
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
          # The app (root) creates its key files as 0600; the kopiur mover reads as uid 1000
          # and the files are already group 1000 (setgid data dir), so give the group read.
          # The app only sets 0600 when it first creates a file, so this sticks.
          data-permissions:
            image: *image
            command:
              - /bin/sh
              - -c
              - for f in /app/data/.encryption_key /app/data/.stream_token_secret; do [ -f "$f" ] && chmod 0640 "$f"; done; true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            env:
              PORT: &port 8085
              PYTHONPATH: /opt/python-extras
              SECURE_COOKIES: "true"
              YT_POT_ENABLED: "true"
            envFrom:
              - secretRef:
                  name: yattee-server-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            # The image installs deno under /root and runs as root
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    configMaps:
      ytdlp-config:
        data:
          # yt-dlp reads /etc/yt-dlp.conf on every run; Yattee Server has no setting for --impersonate.
          yt-dlp.conf: |
            --impersonate chrome
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          # Everything else needs Basic Auth and answers 401.
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
            path: /health
        hostnames:
          - yattee.janpuc.com
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      ytdlp-config:
        type: configMap
        identifier: ytdlp-config
        advancedMounts:
          yattee-server:
            app:
              - path: /etc/yt-dlp.conf
                subPath: yt-dlp.conf
                readOnly: true
      python-extras:
        type: emptyDir
        globalMounts:
          - path: /opt/python-extras
      downloads:
        type: emptyDir
        sizeLimit: 30Gi
        globalMounts:
          - path: /downloads
