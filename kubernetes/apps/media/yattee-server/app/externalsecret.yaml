---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: yattee-server
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: yattee-server-secret
    template:
      data:
        ADMIN_USERNAME: "{{ .YATTEE_ADMIN_USERNAME }}"
        ADMIN_PASSWORD: "{{ .YATTEE_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: yattee
