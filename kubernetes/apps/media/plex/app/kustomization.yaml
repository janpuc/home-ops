---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
patches:
  - target:
      kind: Restore
    patch: |
      - op: replace
        path: /spec/source
        value:
          snapshotRef:
            name: plex-20260831221700
      - op: replace
        path: /spec/policy/onMissingSnapshot
        value: Fail
