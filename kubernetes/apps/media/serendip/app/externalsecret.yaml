---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: serendip
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: serendip-secret
    template:
      data:
        # name=<sha256 of the Authorization header the Yattee app sends>. Derived from the item
        # that provisions Yattee Server's user, so a password change updates both. serendip
        # recognises the app's requests by this hash and never forwards their credentials.
        SERENDIP_USERS: '{{ .YATTEE_ADMIN_USERNAME }}={{ printf "%s:%s" .YATTEE_ADMIN_USERNAME .YATTEE_ADMIN_PASSWORD | b64enc | printf "Basic %s" | sha256sum }}'
        # The login serendip uses for its own background calls to Yattee Server (feed fetches and
        # follow-ups). The admin user for now, for simplicity; a non-admin user would be tighter.
        SERENDIP_YATTEE_USERNAME: "{{ .YATTEE_ADMIN_USERNAME }}"
        SERENDIP_YATTEE_PASSWORD: "{{ .YATTEE_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: yattee
