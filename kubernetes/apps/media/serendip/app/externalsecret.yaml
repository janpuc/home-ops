---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: serendip
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: serendip-secret
    template:
      data:
        # name=<sha256 of the Authorization header the Yattee app sends>. Derived from the item
        # that provisions Yattee Server's user, so a password change updates both. serendip
        # never sees the password and never forwards a credential.
        SERENDIP_USERS: '{{ .YATTEE_ADMIN_USERNAME }}={{ printf "%s:%s" .YATTEE_ADMIN_USERNAME .YATTEE_ADMIN_PASSWORD | b64enc | printf "Basic %s" | sha256sum }}'
  dataFrom:
    - extract:
        key: yattee
