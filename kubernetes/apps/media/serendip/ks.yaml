---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: serendip
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
    # Its route sends part of yattee.janpuc.com to the yattee-server Service.
    - name: yattee-server
  interval: 1h
  path: ./kubernetes/apps/media/serendip/app
  postBuild:
    substitute:
      APP: serendip
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_COPYMETHOD: Direct
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
