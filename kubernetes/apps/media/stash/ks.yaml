---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stash
spec:
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/media/stash/app
  postBuild:
    substitute:
      APP: stash
      # The Stash data volume (config, blobs, generated) filled 4.16 GiB of
      # its 5 GiB on 2026-10-30 and grows about 9 MiB a day with the
      # generated files, so it would have been full in about 11 weeks.
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_COPYMETHOD: Direct
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stash-tools
spec:
  dependsOn:
    - name: stash
      namespace: media
  interval: 1h
  path: ./kubernetes/apps/media/stash/tools
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
