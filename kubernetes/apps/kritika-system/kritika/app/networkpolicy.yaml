---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
# The chart's policies restrict ingress to kritika's server and runner pods. On
# this cluster's Cilium (netkit datapath, socketLB.hostNamespaceOnly), the reply
# to a connection a policy-restricted pod opens through a ClusterIP whose
# backend is on the same node comes back carrying the Service IP and misses
# conntrack, so the ingress policy drops it: the SYN-ACK from kritika-postgres
# to a kritika pod sharing its node was denied (identity postgres -> kritika).
# Allow ingress from the backends these pods dial so their replies get through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kritika-same-node-replies
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kritika
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Postgres, for the server and runner pods
        - podSelector:
            matchLabels:
              cnpg.io/cluster: kritika-postgres
        # the server's gateway, for runner pods
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kritika
        # LiteLLM and the bge-m3 embedder
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
