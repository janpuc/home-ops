---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    replicas: 2
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    config:
      webUrl: https://{{ .Release.Name }}.janpuc.com
      runnerRuntimeClass: gvisor
    configFile:
      apps:
        github:
          accounts: [janpuc]
          clientId: { env: KRITIKA_GITHUB_CLIENT_ID }
          privateKey: { env: KRITIKA_GITHUB_PRIVATE_KEY }
          webhookSecret: { env: KRITIKA_GITHUB_WEBHOOK_SECRET }
      providers:
        litellm:
          type: openai
          baseUrl: http://litellm.ai.svc.cluster.local:4000/v1
          apiKey: { env: KRITIKA_LITELLM_API_KEY }
          retries: 2
        bge:
          type: openai
          baseUrl: http://bge-embedding-m3.ai.svc.cluster.local:8080/v1
          apiKey: { env: KRITIKA_BGE_API_KEY }
      # bge-m3 runs with a 2048-token ubatch (llmkube/models/bge-embedding-m3.yaml),
      # so each input must stay well under it; it is general-purpose rather than
      # code-tuned, hence the higher similarity floor the docs suggest.
      embedding:
        model: bge/bge-m3
        dims: 1024
        maxBatch: 8
        maxBatchChars: 16000
        maxItemChars: 4000
        similarFloor: 0.7
      egress:
        allowHosts: [raw.githubusercontent.com]
      # Reviews run on MiniMax M3 (its own plan, with room to spare) instead of the
      # shared OpenCode Go allowance; Kimi K2.7 Code on Go is the fallback.
      defaults:
        models:
          review: litellm/minimax/MiniMax-M3
          fallback: litellm/opencode-go/kimi-k2.7-code
        # kritika's built-in limits are 60 steps / 4M tokens; infra PRs that read a lot
        # of cluster config ran out of steps before submitting (#1477, #1512, #1515)
        # and #1462 hit the token budget. Reviews run on MiniMax's own plan, so the
        # extra headroom is cheap.
        agent:
          commands: [gh, curl, jq, yq, rg, fd]
          maxSteps: 100
          maxTokens: 6000000
    envFrom:
      - secretRef:
          name: kritika-secret
    database:
      app:
        existingSecret: kritika-postgres-app
      owner:
        existingSecret: kritika-postgres-credentials
      runner:
        existingSecret: kritika-postgres-runner
    runner:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 1Gi
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
          path: /api/v1/meta
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.janpuc.com"
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    networkPolicy:
      enabled: true
      # LiteLLM (4000) and the bge-m3 llama.cpp server (8080) on top of the forges
      egressPorts:
        - 443
        - 4000
        - 8080
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
