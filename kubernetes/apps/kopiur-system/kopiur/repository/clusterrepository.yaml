---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: bigmouth.internal
          path: /mnt/Vault/Kopiur
  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: H * * * *
      full:
        cron: H 5 * * *
    takeoverPolicy: Force
  parameters:
    epoch:
      minDuration: 1h
  moverDefaults:
    cache:
      capacity: 10Gi
      # Kopia's own defaults are 5000 MiB per budget, and the metadata budget
      # applies twice (kopia caps the index-blobs cache at the same size), so
      # left alone the caches can grow to ~15000 MiB - more than the 10Gi cache
      # volume, which then fills up before the sweeper ever trims it.
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
      mode: Ephemeral
      storageClassName: miroir-fast-local
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    scratch:
      capacity: 60Gi
      storageClassName: miroir-fast-local
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    ttlSecondsAfterFinished: 300
  scheduleDefaults:
    timezone: Europe/Warsaw
