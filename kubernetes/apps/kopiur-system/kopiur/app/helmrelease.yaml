---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    # The admission webhook answers in milliseconds, but the API server it
    # calls back into can stall for tens of seconds when the etcd members are
    # slow (their fsync p99 is 95 ms on k8s-0 and 174 ms on k8s-2 against
    # 6 ms on k8s-1). With the default 10 s timeout the API server gave up
    # on the webhook first and the apply failed hard, which is what left
    # Flux Kustomizations ReconciliationFailed.
    webhook:
      timeoutSeconds: 30
    extraVolumes:
      - name: repo
        nfs:
          server: bigmouth.internal
          path: /mnt/Vault/Kopiur
    extraVolumeMounts:
      - name: repo
        mountPath: /repo
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
