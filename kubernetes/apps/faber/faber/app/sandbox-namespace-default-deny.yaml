# Namespace default-deny NetworkPolicy for Tier 1 gVisor sandboxes.
# Blocks all ingress and egress by default, including RFC1918 and tailnet 100.64.0.0/10.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-namespace-default-deny
  namespace: faber
  labels:
    app.kubernetes.io/part-of: faber
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
