---
# Syncs the dedicated narrow faber GitHub App credentials from 1Password into the
# faber namespace only. Requires Jan to create the faber GitHub App (contents: write,
# pull_requests: write, metadata: read on janpuc/home-ops only, excluded from
# MainProtec bypass) and the matching 1Password item named "faber".
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: faber-github-app
  namespace: faber
  labels:
    app.kubernetes.io/part-of: faber
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: faber-github-app
    creationPolicy: Owner
    template:
      data:
        appId: "{{ .FABER_GITHUB_APP_ID }}"
        installationId: "{{ .FABER_GITHUB_INSTALLATION_ID }}"
        privateKey: "{{ .FABER_GITHUB_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: faber
