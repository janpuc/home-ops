---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: gitopsrepositories.faber.janpuc.com
spec:
  group: faber.janpuc.com
  names:
    kind: GitOpsRepository
    listKind: GitOpsRepositoryList
    plural: gitopsrepositories
    shortNames:
      - gitopsrepo
      - grepo
    singular: gitopsrepository
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.github.owner
          name: Owner
          type: string
        - jsonPath: .spec.github.repo
          name: Repo
          type: string
        - jsonPath: .spec.github.defaultBranch
          name: Branch
          type: string
        - jsonPath: .status.ready
          name: Ready
          type: boolean
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            GitOpsRepository declares a managed GitOps repository, its curated standards
            and its repository-wide hard guardrails.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: GitOpsRepositorySpec defines the desired state of a GitOpsRepository.
              properties:
                context:
                  description: Context supplies curated repository standards pinned
                    into the cached prompt prefix.
                  properties:
                    configMapRef:
                      description: ConfigMapRef loads curated repository conventions
                        from a ConfigMap in the same namespace.
                      properties:
                        key:
                          description: Key within the ConfigMap data map.
                          minLength: 1
                          type: string
                        name:
                          description: Name of the ConfigMap in the same namespace.
                          minLength: 1
                          type: string
                      required:
                        - key
                        - name
                      type: object
                    inline:
                      description: Inline holds concise repository conventions directly
                        in the CR (~1 to 2 KiB recommended).
                      maxLength: 8192
                      type: string
                  type: object
                github:
                  description: GitHub configures the target GitHub repository and GitHub
                    App credentials.
                  properties:
                    apiBaseUrl:
                      description: APIBaseURL overrides the GitHub API endpoint (optional,
                        for testing or GitHub Enterprise).
                      type: string
                    appId:
                      description: AppID is the numeric GitHub App identifier.
                      format: int64
                      minimum: 1
                      type: integer
                    branchPrefix:
                      default: agent/
                      description: BranchPrefix prefixes branches created by faber for
                        pull requests.
                      minLength: 1
                      type: string
                    defaultBranch:
                      default: main
                      description: DefaultBranch is the target base branch for pull
                        requests.
                      minLength: 1
                      type: string
                    installationId:
                      description: InstallationID is the numeric GitHub App installation
                        identifier for the repository.
                      format: int64
                      minimum: 1
                      type: integer
                    owner:
                      description: Owner is the GitHub organization or user owning the
                        repository.
                      minLength: 1
                      type: string
                    privateKeySecretRef:
                      description: PrivateKeySecretRef points to the Secret key holding
                        the GitHub App PEM private key.
                      properties:
                        key:
                          description: Key within the Secret data map.
                          minLength: 1
                          type: string
                        name:
                          description: Name of the Secret in the same namespace.
                          minLength: 1
                          type: string
                      required:
                        - key
                        - name
                      type: object
                    repo:
                      description: Repo is the GitHub repository name.
                      minLength: 1
                      type: string
                  required:
                    - appId
                    - installationId
                    - owner
                    - privateKeySecretRef
                    - repo
                  type: object
                guardrails:
                  description: Guardrails configures repository-wide hard safety gates
                    enforced by the operator.
                  properties:
                    denyPaths:
                      default:
                        - talos/**
                        - .github/workflows/**
                        - flux/**
                      description: |-
                        DenyPaths lists repository path globs that faber may never modify.
                        The operator always enforces talos/**, .github/workflows/** and flux/**
                        in addition to any paths configured here.
                      items:
                        type: string
                      type: array
                    maxChangedFiles:
                      default: 20
                      description: MaxChangedFiles caps the number of files modified
                        by any single PR.
                      format: int32
                      minimum: 1
                      type: integer
                    maxChangedLines:
                      default: 500
                      description: MaxChangedLines caps the total added and removed
                        lines in any single PR.
                      format: int32
                      minimum: 1
                      type: integer
                    protectedPodSelectors:
                      description: |-
                        ProtectedPodSelectors protects sensitive workloads (such as GPU pods)
                        from automated resource reduction or disallowed edits.
                      items:
                        description: |-
                          ProtectedPodSelector identifies workloads whose resource settings or manifests
                          are protected from automated reduction (for example GPU pods whose iGPU GTT
                          memory is invisible to cgroup metrics).
                        properties:
                          forbidMemoryReduction:
                            default: true
                            description: ForbidMemoryReduction prevents lowering memory
                              requests or limits for matching workloads.
                            type: boolean
                          labelSelector:
                            description: LabelSelector matches pods or manifests carrying
                              matching labels.
                            properties:
                              matchExpressions:
                                description: matchExpressions is a list of label selector
                                  requirements. The requirements are ANDed.
                                items:
                                  description: |-
                                    A label selector requirement is a selector that contains values, a key, and an operator that
                                    relates the key and values.
                                  properties:
                                    key:
                                      description: key is the label key that the selector
                                        applies to.
                                      type: string
                                    operator:
                                      description: |-
                                        operator represents a key's relationship to a set of values.
                                        Valid operators are In, NotIn, Exists and DoesNotExist.
                                      type: string
                                    values:
                                      description: |-
                                        values is an array of string values. If the operator is In or NotIn,
                                        the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                        the values array must be empty. This array is replaced during a strategic
                                        merge patch.
                                      items:
                                        type: string
                                      type: array
                                      x-kubernetes-list-type: atomic
                                  required:
                                    - key
                                    - operator
                                  type: object
                                type: array
                                x-kubernetes-list-type: atomic
                              matchLabels:
                                additionalProperties:
                                  type: string
                                description: |-
                                  matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                  map is equivalent to an element of matchExpressions, whose key field is "key", the
                                  operator is "In", and the values array contains only "value". The requirements are ANDed.
                                type: object
                            type: object
                            x-kubernetes-map-type: atomic
                          name:
                            description: Name is a human-readable identifier for this
                              protection rule.
                            minLength: 1
                            type: string
                          namespaces:
                            description: Namespaces scopes this rule to specific namespaces.
                              Empty matches all namespaces.
                            items:
                              type: string
                            type: array
                          pathPatterns:
                            description: PathPatterns matches repository file path globs
                              belonging to protected workloads.
                            items:
                              type: string
                            type: array
                          reason:
                            description: Reason explains why these workloads are protected.
                            maxLength: 512
                            type: string
                          workloadNames:
                            description: WorkloadNames matches deployment, statefulset,
                              daemonset, helmrelease or pod names.
                            items:
                              type: string
                            type: array
                        required:
                          - name
                        type: object
                      type: array
                    secretScan:
                      default: true
                      description: SecretScan requires scanning proposed diffs for secrets
                        before opening a PR.
                      type: boolean
                  type: object
                validation:
                  description: Validation configures default sandbox validation commands
                    and template.
                  properties:
                    commands:
                      description: |-
                        Commands lists default validation shell commands run inside the sandbox
                        (for example flate, helm template, kubeconform).
                      items:
                        type: string
                      type: array
                    sandboxTemplateRef:
                      description: SandboxTemplateRef references the default agent-sandbox
                        SandboxTemplate.
                      properties:
                        name:
                          description: Name of the referenced object.
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace of the referenced object. Defaults
                            to the referrer's namespace when omitted.
                          type: string
                      required:
                        - name
                      type: object
                    timeout:
                      description: Timeout bounds default validation execution time
                        inside the sandbox.
                      type: string
                  type: object
              required:
                - github
              type: object
            status:
              description: GitOpsRepositoryStatus defines the observed state of a GitOpsRepository.
              properties:
                conditions:
                  description: Conditions represent the latest available observations
                    of the repository state.
                  items:
                    description: Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedGeneration:
                  description: ObservedGeneration is the most recent generation observed
                    by the controller.
                  format: int64
                  type: integer
                ready:
                  description: Ready indicates whether repository configuration and
                    credentials are valid.
                  type: boolean
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
