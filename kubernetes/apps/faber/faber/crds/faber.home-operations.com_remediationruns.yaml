---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: remediationruns.faber.home-operations.com
spec:
  group: faber.home-operations.com
  names:
    kind: RemediationRun
    listKind: RemediationRunList
    plural: remediationruns
    shortNames:
      - remrun
      - rr
    singular: remediationrun
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.policyRef.name
          name: Policy
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.tier
          name: Tier
          type: integer
        - jsonPath: .status.steps
          name: Steps
          type: integer
        - jsonPath: .status.pr.number
          name: PR
          type: integer
        - jsonPath: .spec.dryRun
          name: DryRun
          type: boolean
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: RemediationRun records one immutable execution of a MaintenancePolicy.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: RemediationRunSpec defines the immutable execution inputs
                of one RemediationRun.
              properties:
                dedupeKey:
                  description: DedupeKey identifies the logical target used for deduplication,
                    cooldown and history lookup.
                  maxLength: 256
                  type: string
                dryRun:
                  description: DryRun runs investigation, sandbox validation and diff
                    gates without creating or updating a PR.
                  type: boolean
                input:
                  description: Input carries structured JSON input validated against
                    MaintenancePolicy.spec.inputSchema.
                  x-kubernetes-preserve-unknown-fields: true
                policyRef:
                  description: PolicyRef references the MaintenancePolicy in the same
                    namespace.
                  properties:
                    name:
                      description: Name of the referenced object in the same namespace.
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                triggerSource:
                  description: TriggerSource identifies what created this run (cron,
                    webhook, cloudevent, manual, gui, policy).
                  maxLength: 64
                  minLength: 1
                  type: string
              required:
                - policyRef
                - triggerSource
              type: object
            status:
              description: |-
                RemediationRunStatus holds compact execution metadata kept strictly under 64 KiB
                for etcd hygiene. Full turn transcripts, raw tool stdout/stderr and full diffs
                live in internal/store and are referenced via TranscriptRef.
              properties:
                conditions:
                  description: Conditions represent the latest available observations
                    of the run state.
                  items:
                    description: Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                error:
                  description: Error holds a short summary when the run failed.
                  maxLength: 2048
                  type: string
                finishedAt:
                  description: FinishedAt records when execution reached a terminal
                    phase.
                  format: date-time
                  type: string
                observedGeneration:
                  description: ObservedGeneration is the most recent generation observed
                    by the controller.
                  format: int64
                  type: integer
                output:
                  description: Output holds compact structured JSON matching MaintenancePolicy.spec.outputSchema.
                  x-kubernetes-preserve-unknown-fields: true
                phase:
                  description: Phase is the current lifecycle phase of the run.
                  enum:
                    - Pending
                    - Settling
                    - Running
                    - Verifying
                    - WaitingApproval
                    - Succeeded
                    - Failed
                    - Skipped
                    - Cancelled
                  type: string
                pr:
                  description: PR holds pull request metadata created or updated by
                    this run.
                  properties:
                    branch:
                      description: Branch is the head branch name used for the pull
                        request (agent/<policy>/<key>).
                      type: string
                    commitSha:
                      description: CommitSHA is the latest commit SHA created via GitHub
                        GraphQL createCommitOnBranch.
                      type: string
                    number:
                      description: Number is the GitHub pull request number.
                      format: int32
                      type: integer
                    state:
                      description: State is the last observed state of the pull request.
                      enum:
                        - open
                        - merged
                        - closed
                        - skipped
                        - failed
                      type: string
                    url:
                      description: URL is the HTML URL of the pull request.
                      type: string
                    verified:
                      description: Verified reports whether the commit carries a GitHub
                        Verified signature.
                      type: boolean
                  type: object
                sandboxClaimName:
                  description: SandboxClaimName records the ephemeral agent-sandbox
                    SandboxClaim name when Tier 1 ran.
                  maxLength: 253
                  type: string
                startedAt:
                  description: StartedAt records when execution started.
                  format: date-time
                  type: string
                steps:
                  description: Steps is the number of ReAct steps executed.
                  format: int32
                  type: integer
                suggestedRule:
                  description: SuggestedRule holds an optional human-reviewed repository
                    rule proposed by the run.
                  maxLength: 2048
                  type: string
                tier:
                  description: Tier records the highest execution tier used (0 for read-only,
                    1 for sandboxed edits).
                  format: int32
                  maximum: 1
                  minimum: 0
                  type: integer
                transcriptRef:
                  description: |-
                    TranscriptRef is an opaque reference pointing to the full run record and
                    artifacts stored off-etcd in internal/store.
                  maxLength: 256
                  type: string
                usage:
                  description: Usage summarizes token counts and estimated USD spend.
                  properties:
                    cachedTokens:
                      description: CachedTokens is the subset of input tokens served
                        from prompt cache.
                      format: int64
                      type: integer
                    costUsd:
                      description: CostUSD is the cumulative estimated cost in USD as
                        a decimal string.
                      pattern: ^[0-9]+(\.[0-9]+)?$
                      type: string
                    inputTokens:
                      description: InputTokens is the total input token count across
                        all LLM turns.
                      format: int64
                      type: integer
                    outputTokens:
                      description: OutputTokens is the total output token count across
                        all LLM turns.
                      format: int64
                      type: integer
                    reasoningTokens:
                      description: ReasoningTokens is the reasoning token count reported
                        by reasoning models.
                      format: int64
                      type: integer
                  type: object
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
