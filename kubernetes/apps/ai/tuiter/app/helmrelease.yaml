---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuiter
spec:
  chartRef:
    kind: OCIRepository
    name: tuiter
  interval: 15m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      tuiter:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        type: deployment
        initContainers:
          migrate:
            image: &image
              repository: ghcr.io/janpuc/tuiter
              tag: 1.0.2@sha256:541f7b558e8e1fb617de8942e57e3477a6cf5f5af6f4a0787785f59611da4b88
            command:
              - python
              - /app/migrations/migrate.py
            env:
              TUITER_DB_PATH: /data/tuiter.db
              TUITER_EMBEDDING_DIM: "1024"
            securityContext: &appSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            env:
              TUITER_VERSION: "1.0.2"
              TUITER_DB_PATH: /data/tuiter.db
              TUITER_WORK_DIR: /work
              TUITER_LITELLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000
              TUITER_PROPOSER_MODEL: minimax/MiniMax-M3
              # Won the 2026-10-01 bake-off of six judges: 9 of its top 10 picks
              # were clips the operator would post.
              TUITER_JUDGE_MODEL: opencode-go/kimi-k3
              TUITER_CAPTION_MODEL: opencode-go/kimi-k3
              TUITER_LLM_MAX_TOKENS: "12000"
              TUITER_MONTHLY_BUDGET_USD: "25"
              TUITER_READ_PROVIDER: cdp
              TUITER_CDP_URL: http://tuiter-chrome-reader.ai.svc.cluster.local:9223
              TUITER_POSTER_CDP_URL: http://tuiter-chrome-poster.ai.svc.cluster.local:9223
              TUITER_READER_UI_URL: https://tuiter-reader.janpuc.com
              TUITER_POSTER_UI_URL: https://tuiter-poster.janpuc.com
              TUITER_TIMEZONE: Europe/Warsaw
              # Pipeline: on first, so the review queue fills before anything posts.
              TUITER_PIPELINE_ENABLED: "true"
              TUITER_CHANNEL: hasanabi
              TUITER_BACKFILL_DAYS: "2"
              TUITER_TRANSCRIBER: auto
              TUITER_WHISPER_MODEL: small.en
              TUITER_WHISPER_THREADS: "6"
              TUITER_PICKS_PER_VOD: "20"
              TUITER_JUDGE_CONCURRENCY: "6"
              TUITER_LEGACY_ENABLED: "true"
              TUITER_LEGACY_MIN_AGE_DAYS: "60"
              TUITER_LEGACY_PER_DAY: "6"
              # Posting: off until the review queue has proven itself. The
              # poster is pinned to TUITER_POSTER_HANDLE from the secret.
              TUITER_PUBLISHING_ENABLED: "false"
              TUITER_MODE: review
              TUITER_AUTO_THRESHOLD: "0.45"
              TUITER_POST_WINDOW_START: "13:00"
              TUITER_POST_WINDOW_END: "05:00"
              # Start low and raise it as the queue proves itself.
              TUITER_DAILY_CAP: "6"
              TUITER_MIN_GAP_MINUTES: "25"
              TUITER_CLIP_MAX_AGE_HOURS: "72"
              # Posts that are not clips: quote-takes from the reader's
              # timeline (reviewed) and go-live alerts (automatic).
              TUITER_NOTE_MODEL: opencode-go/kimi-k3
              TUITER_QUOTES_ENABLED: "true"
              TUITER_QUOTE_SCAN_MINUTES: "20"
              TUITER_LIVE_ALERTS: "true"
              TUITER_LIVE_ALERTS_AUTO: "true"
              # Model caches live on the work volume; the root filesystem is read-only.
              HF_HOME: /work/models/hf
              TUITER_WHISPER_CACHE: /work/models
              XDG_CACHE_HOME: /work/cache
            envFrom:
              - secretRef:
                  name: tuiter-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probe
            # Whisper on a seven-hour stream, ffmpeg renders and up to six
            # concurrent judge calls. Bursty: idle most of the day.
            resources:
              requests:
                cpu: 500m
                memory: 1536Mi
              limits:
                memory: 8Gi
            securityContext: *appSecurity
      chrome-reader:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        type: deployment
        containers:
          app:
            image: &chrome
              repository: ghcr.io/linuxserver/chromium
              tag: latest@sha256:2d32e1b2b28aa92973aa0f58c433c0b045db6e1224d7001eeaa9cde1a474ce13
            env: &chromeEnv
              PUID: "1000"
              PGID: "1000"
              TZ: Europe/Warsaw
              CHROME_CLI: >-
                --remote-debugging-port=9222
                --remote-debugging-address=0.0.0.0
                --remote-allow-origins=*
                --no-first-run
                --no-default-browser-check
                --disable-features=Translate
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext: &chromeSecurity
              seccompProfile:
                type: Unconfined
          cdp-forward:
            image: &socat
              repository: docker.io/alpine/socat
              tag: 1.8.1.3@sha256:82ad20f6f6e29b91ff33b6662d24063522b1378f08fd8569cd3ab412cac13f50
            args: &socatArgs
              - TCP-LISTEN:9223,fork,reuseaddr
              - TCP:127.0.0.1:9222
            resources: &socatResources
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext: &socatSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              capabilities:
                drop:
                  - ALL
      chrome-poster:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        type: deployment
        containers:
          app:
            image: *chrome
            env: *chromeEnv
            resources:
              requests:
                cpu: 50m
                memory: 768Mi
              limits:
                memory: 3Gi
            securityContext: *chromeSecurity
          cdp-forward:
            image: *socat
            args: *socatArgs
            resources: *socatResources
            securityContext: *socatSecurity

    service:
      app:
        controller: tuiter
        ipFamilies:
          - IPv4
        ports:
          http:
            port: *port
      chrome-reader:
        controller: chrome-reader
        ports:
          http:
            port: &kasm 3000
          cdp:
            port: &cdp 9223
      chrome-poster:
        controller: chrome-poster
        ports:
          http:
            port: *kasm
          cdp:
            port: *cdp
    route:
      app:
        hostnames:
          - tuiter.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      chrome-reader:
        hostnames:
          - tuiter-reader.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: chrome-reader
                port: *kasm
      chrome-poster:
        hostnames:
          - tuiter-poster.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: chrome-poster
                port: *kasm
    persistence:
      data:
        existingClaim: tuiter
        advancedMounts:
          tuiter:
            app:
              - path: /data
            migrate:
              - path: /data
      work:
        existingClaim: tuiter-work
        advancedMounts:
          tuiter:
            app:
              - path: /work
      reader-profile:
        existingClaim: tuiter-reader-profile
        advancedMounts:
          chrome-reader:
            app:
              - path: /config
      poster-profile:
        existingClaim: tuiter-poster-profile
        advancedMounts:
          chrome-poster:
            app:
              - path: /config
      tmp:
        type: emptyDir
        advancedMounts:
          tuiter:
            app:
              - path: /tmp
            migrate:
              - path: /tmp
      home:
        type: emptyDir
        advancedMounts:
          tuiter:
            app:
              - path: /home/tuiter
            migrate:
              - path: /home/tuiter
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        advancedMounts:
          chrome-reader:
            app:
              - path: /dev/shm
          chrome-poster:
            app:
              - path: /dev/shm
