---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuiter
spec:
  chartRef:
    kind: OCIRepository
    name: tuiter
  interval: 15m
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      tuiter:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        type: deployment
        initContainers:
          migrate:
            image: &image
              repository: ghcr.io/janpuc/tuiter
              tag: 0.8.2@sha256:9aff11c26301bf2fbb8e276d48b4dd059dc6b641678890bd36d795384ad7fdb5
            command:
              - python
              - /app/migrations/migrate.py
            env:
              TUITER_DB_PATH: /data/tuiter.db
              TUITER_EMBEDDING_DIM: "1024"
            securityContext: &appSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            env:
              TUITER_DB_PATH: /data/tuiter.db
              TUITER_PERSONA_DIR: /persona
              TUITER_LITELLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000
              TUITER_DRAFT_MODEL: minimax/MiniMax-M2-7
              TUITER_ESCALATION_MODEL: minimax/MiniMax-M3
              TUITER_EMBEDDING_MODEL: bge-embedding-m3
              TUITER_EMBEDDING_BASE_URL: http://bge-embedding-m3.ai.svc.cluster.local:8080
              TUITER_EMBEDDING_DIM: "1024"
              TUITER_SEARXNG_URL: http://searxng.selfhosted.svc.cluster.local:8080
              TUITER_RERANKER_URL: http://bge-reranker-v2-m3.ai.svc.cluster.local:8080
              TUITER_FETCHER_URL: http://flaresolverr.selfhosted.svc.cluster.local:8191
              TUITER_READ_PROVIDER: cdp
              TUITER_CDP_URL: http://tuiter-chrome-reader.ai.svc.cluster.local:9223
              TUITER_POSTER_CDP_URL: http://tuiter-chrome-poster.ai.svc.cluster.local:9223
              TUITER_READER_UI_URL: https://tuiter-reader.janpuc.com
              TUITER_POSTER_UI_URL: https://tuiter-poster.janpuc.com
              TUITER_TIMEZONE: Europe/Warsaw
              TUITER_WAKE_AT: "07:00"
              TUITER_SLEEP_AT: "00:30"
              TUITER_PRIMARY_LANG: en
              TUITER_SECONDARY_LANG: pl
              TUITER_SECONDARY_VALIDATED: "false"
              TUITER_ACCOUNT_TIER: premium
              TUITER_MONTHLY_BUDGET_USD: "150"
              TUITER_COLD_START: "true"
              TUITER_MODE_ORIGINAL: review
              TUITER_MODE_REPLY: review
              TUITER_MODE_QUOTE: review
              TUITER_MODE_REPOST: review
              TUITER_RUNNER_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: tuiter-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probe
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext: *appSecurity
      chrome-reader:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        type: deployment
        containers:
          app:
            image: &chrome
              repository: ghcr.io/linuxserver/chromium
              tag: latest@sha256:4c7b9086d2e5054b61c9e6b0f75efceece5befeff2bec3ff543d52e000cee21d
            env: &chromeEnv
              PUID: "1000"
              PGID: "1000"
              TZ: Europe/Warsaw
              CHROME_CLI: >-
                --remote-debugging-port=9222
                --remote-debugging-address=0.0.0.0
                --remote-allow-origins=*
                --no-first-run
                --no-default-browser-check
                --disable-features=Translate
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext: &chromeSecurity
              seccompProfile:
                type: Unconfined
          cdp-forward:
            image: &socat
              repository: docker.io/alpine/socat
              tag: 1.8.1.3@sha256:3d9e7966201dd3a065df591020a09fd3c70845de7e7086e3531ea69db774406b
            args: &socatArgs
              - TCP-LISTEN:9223,fork,reuseaddr
              - TCP:127.0.0.1:9222
            resources: &socatResources
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext: &socatSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              capabilities:
                drop:
                  - ALL
      chrome-poster:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        type: deployment
        containers:
          app:
            image: *chrome
            env: *chromeEnv
            resources:
              requests:
                cpu: 50m
                memory: 768Mi
              limits:
                memory: 3Gi
            securityContext: *chromeSecurity
          cdp-forward:
            image: *socat
            args: *socatArgs
            resources: *socatResources
            securityContext: *socatSecurity

    service:
      app:
        controller: tuiter
        ipFamilies:
          - IPv4
        ports:
          http:
            port: *port
      chrome-reader:
        controller: chrome-reader
        ports:
          http:
            port: &kasm 3000
          cdp:
            port: &cdp 9223
      chrome-poster:
        controller: chrome-poster
        ports:
          http:
            port: *kasm
          cdp:
            port: *cdp
    route:
      app:
        hostnames:
          - tuiter.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      chrome-reader:
        hostnames:
          - tuiter-reader.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: chrome-reader
                port: *kasm
      chrome-poster:
        hostnames:
          - tuiter-poster.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: chrome-poster
                port: *kasm
    persistence:
      data:
        existingClaim: tuiter
        advancedMounts:
          tuiter:
            app:
              - path: /data
            migrate:
              - path: /data
      persona:
        type: secret
        name: tuiter-persona
        advancedMounts:
          tuiter:
            app:
              - path: /persona
                readOnly: true
      reader-profile:
        existingClaim: tuiter-reader-profile
        advancedMounts:
          chrome-reader:
            app:
              - path: /config
      poster-profile:
        existingClaim: tuiter-poster-profile
        advancedMounts:
          chrome-poster:
            app:
              - path: /config
      tmp:
        type: emptyDir
        advancedMounts:
          tuiter:
            app:
              - path: /tmp
            migrate:
              - path: /tmp
      home:
        type: emptyDir
        advancedMounts:
          tuiter:
            app:
              - path: /home/tuiter
            migrate:
              - path: /home/tuiter
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        advancedMounts:
          chrome-reader:
            app:
              - path: /dev/shm
          chrome-poster:
            app:
              - path: /dev/shm
