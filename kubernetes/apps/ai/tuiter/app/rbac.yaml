---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuiter
  labels:
    app.kubernetes.io/instance: tuiter
    app.kubernetes.io/name: tuiter
---
# Grants the recycle CronJob exactly the permissions `kubectl rollout restart`
# needs on the one deployment it touches, in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tuiter-chrome-reader-recycle
  labels:
    app.kubernetes.io/instance: tuiter
    app.kubernetes.io/name: tuiter
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["tuiter-chrome-reader"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tuiter-chrome-reader-recycle
  labels:
    app.kubernetes.io/instance: tuiter
    app.kubernetes.io/name: tuiter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tuiter-chrome-reader-recycle
subjects:
  - kind: ServiceAccount
    name: tuiter
