---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: austerity-watcher
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    - name: pocket-id-instance
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/ai/austerity-watcher/app
  postBuild:
    substitute:
      APP: austerity-watcher
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_COPYMETHOD: Direct
      KOPIUR_STORAGECLASS: miroir-fast-local
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
