---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: austerity-watcher-reader-profile
  annotations:
    kopiur.home-operations.com/allow-identity-change: "true"
spec:
  errorHandling:
    ignoreFileErrors: true
    ignoreDirErrors: true
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepDaily: 7
  sources:
    - pvc:
        name: austerity-watcher-reader-profile
  copyMethod: Direct
  volumeSnapshotClassName: miroir
---
# The kopiur backup component creates a SnapshotSchedule for every policy. These
# two policies are written by hand, so they need one each: without it kopiur
# never runs them and the browser profiles are never backed up.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: austerity-watcher-reader-profile
spec:
  policyRef:
    name: austerity-watcher-reader-profile
  schedule:
    cron: H */2 * * *
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: austerity-watcher-reader-profile
spec:
  failurePolicy:
    backoffLimit: 8
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: austerity-watcher-reader-profile
      offset: 0
  target:
    populator: {}

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
