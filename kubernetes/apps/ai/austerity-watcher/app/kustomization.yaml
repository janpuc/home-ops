  # client stay so that un-commenting the four lines below brings everything back with its data.
  - ./externalsecret.yaml
  - ./pvc.yaml
  - ./profile-backup.yaml
  - ./networkpolicy.yaml
  - ./pocketidoidcclient.yaml
  # - ./ocirepository.yaml
  # - ./helmrelease.yaml
  # - ./servicemonitor.yaml
  # - ./prometheusrule.yaml
  - ./curator.yaml
