---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: austerity-watcher
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: austerity-watcher-secret
    template:
      data:
        # Fine-grained token: janpuc/austerity-watch only, Contents read and write.
        # Reads data/watch and data/cities from main, writes exports to the watch branch.
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
        # The reader is tuiter's reader account. The watcher refuses to read unless
        # the browser's twid cookie is this account id.
        READER_ACCOUNT_ID: "{{ .READER_ACCOUNT_ID }}"
        # The Instagram reader's numeric id, from its ds_user_id cookie. Checked the
        # same way before anything is read through the Instagram browser.
        INSTAGRAM_ACCOUNT_ID: "{{ .INSTAGRAM_ACCOUNT_ID }}"
  dataFrom:
    - extract:
        key: austerity-watcher
