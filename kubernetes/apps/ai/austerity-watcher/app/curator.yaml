---
# The curator bot (janpuc/austerity-watch docs/curator.md): twice a day it reads the admin's
# queue, researches each lead with Sol through the Codex CLI, and writes through the admin API.
# Its PRs merge themselves only when every check passes. Suspended until the one-time login.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: austerity-curator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: austerity-curator
  data:
    # Its own Pushover application ("austerity.watch curator"), and Jan's user key.
    - secretKey: PUSHOVER_TOKEN
      remoteRef:
        key: austerity-watcher
        property: CURATOR_PUSHOVER_TOKEN
    - secretKey: PUSHOVER_USER
      remoteRef:
        key: pushover
        property: PUSHOVER_USER_KEY
---
# Holds the Codex CLI's ChatGPT login so it can refresh itself. Not backed up: a lost volume
# means one new device login.
#
# A single-replica fast-local volume pins the only pod that mounts it to one node. On
# 2026-11-15 the 14:00Z run stayed Pending for its whole 100 minute deadline: the scheduler
# had 0/3 nodes available, two of them for memory requests and the third excluded by this
# volume's node affinity. k8s-0 and k8s-1 held 14608 Mi and 14576 Mi of memory requests
# against 14628 Mi allocatable, while k8s-2 had 3580 Mi free. A 1 Gi file of login tokens
# is not worth a node pin: on the two-replica pool the pod can follow the rest of this app
# to k8s-2. The new name forces one fresh device login (docs/curator.md in janpuc/austerity-watch).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: austerity-curator-codex-fast
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: miroir-fast
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: austerity-curator
spec:
  suspend: false
  # k8tz sets every CronJob to Europe/Warsaw, so the schedule is in Warsaw time: twice a day,
  # well after the watcher's 00:05 UTC export.
  schedule: "0 3,15 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # The curator stops starting new work at its own 65 minute budget, but an
      # item already running can take longer: each Codex call is capped at 8
      # minutes and a research item runs research, facts, evidence and safety,
      # with the evidence check retried once. That is up to about 50 minutes for
      # the last item, so the deadline has to sit above 65 + 50 plus the
      # summary write. At 75 minutes Kubernetes killed the run of 2026-10-30
      # mid-item, which deleted the pod, lost the logs and left no summary.
      activeDeadlineSeconds: 6000
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: austerity-curator
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: curator
              image: ghcr.io/janpuc/austerity-curator:0.2.1@sha256:98c1750672ddbdd45762962c558ed6c2cbe187cf6b39724bedf0e6ca0e9a4765
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              env:
                - name: ADMIN_API_BASE_URL
                  value: http://austerity-watcher-app.ai.svc.cluster.local:8080
                - name: ADMIN_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: austerity-watcher-secret
                      key: ADMIN_API_TOKEN
                - name: CURATOR_MODEL
                  value: gpt-6.1-sol
                - name: CURATOR_SAFETY_MODEL
                  value: gpt-6.1-sol
                - name: PUSHOVER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: austerity-curator
                      key: PUSHOVER_TOKEN
                - name: PUSHOVER_USER
                  valueFrom:
                    secretKeyRef:
                      name: austerity-curator
                      key: PUSHOVER_USER
              volumeMounts:
                - name: codex
                  mountPath: /home/curator/.codex
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: codex
              persistentVolumeClaim:
                claimName: austerity-curator-codex-fast
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
