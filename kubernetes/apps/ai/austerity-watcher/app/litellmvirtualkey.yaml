---
# The analyst's own LiteLLM key: only the two local m3pro models, one request at a
# time, so it can never call a cloud model or crowd out other users of the m3pro.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: austerity-watcher
spec:
  proxyRef: litellm
  keyAlias: austerity-watcher
  models:
    - m3pro-local/qwen3.6-35b-a3b
    - m3pro-local/qwen3.8-27b
  maxParallelRequests: 1
  secretName: austerity-watcher-litellm
  secretKey: LITELLM_API_KEY
