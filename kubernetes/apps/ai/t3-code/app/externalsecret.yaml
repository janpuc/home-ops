---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: t3-code-config
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: t3-code-config
    creationPolicy: Owner
    template:
      data:
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .CLAUDE_CODE_OAUTH_TOKEN }}"
        LITELLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        CONTEXT7_API_KEY: "{{ .CONTEXT7_API_KEY }}"
        GH_TOKEN: "{{ .GITHUB_PAT }}"
        GITHUB_TOKEN: "{{ .GITHUB_PAT }}"
        GITHUB_PERSONAL_ACCESS_TOKEN: "{{ .GITHUB_PAT }}"
  data:
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
  dataFrom:
    - extract:
        key: t3-code
    - extract:
        key: litellm
    - extract:
        key: context7-mcp
    - extract:
        key: github-mcp
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: t3-code-git-signing
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: t3-code-git-signing
    creationPolicy: Owner
    template:
      data:
        id_signing: "{{ .SSH_SIGNING_KEY }}"
        id_signing.pub: "{{ .SSH_SIGNING_PUB }}"
  dataFrom:
    - extract:
        key: t3-code
