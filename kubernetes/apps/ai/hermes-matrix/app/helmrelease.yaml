---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-matrix
spec:
  chartRef:
    kind: OCIRepository
    name: hermes-matrix
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes-matrix:
        annotations:
          reloader.stakater.com/auto: "true"
        # Single replica with Recreate: two Matrix clients on one account /
        # crypto store would clash over device identity.
        replicas: 1
        strategy: Recreate
        type: deployment
        initContainers:
          # THIS DEPLOYMENT RUNS A PATCHED gateway/platforms/matrix.py.
          #
          # The upstream image is hermes v0.15.2 (2026.5.29.2) and never wires
          # per-channel prompts into MessageEvent for Matrix (Telegram and Slack
          # do). Everything else is already present in the image, so the patch
          # only touches the two MessageEvent constructions. See the long
          # comment in configmap.yaml for the full rationale and the removal
          # condition.
          #
          # The patch is anchored: if a base-image bump changes those blocks,
          # this container exits non-zero and the pod stays down rather than
          # quietly reverting every room to a single shared persona.
          patch-matrix:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/hermes-matrix
              tag: 0.15.2-33e1668
            command:
              - sh
              - -c
              - |
                set -eu
                python3 /run/config/patch-matrix.py \
                  /usr/local/lib/python3.12/site-packages/gateway/platforms/matrix.py \
                  /patched/matrix.py
                # Per-room personas. Rendered by the hermes-matrix-config
                # ExternalSecret (private room IDs), and copied in because the
                # proxy reads config.yaml from HERMES_HOME, which is the PVC.
                cp /run/secret/config.yaml /data/config.yaml
                chmod 600 /data/config.yaml
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/hermes-matrix
              tag: 0.15.2-33e1668
            env:
              HERMES_HOME: /data
              MATRIX_ENCRYPTION: "true"
              # Proxy mode — forward decrypted text to the main agent's API server.
              GATEWAY_PROXY_URL: http://hermes.ai.svc.cluster.local:8642
              # MATRIX_HOME_ROOM comes from the hermes-matrix secret and now
              # resolves to the dedicated Notify room — room IDs stay private.
            envFrom:
              - secretRef:
                  name: hermes-matrix
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: hermes-matrix
        advancedMounts:
          hermes-matrix:
            patch-matrix:
              - path: /data
            app:
              - path: /data
      # Patched matrix.py, produced by the init container and mounted over the
      # site-packages copy for the app container only.
      patched:
        type: emptyDir
        advancedMounts:
          hermes-matrix:
            patch-matrix:
              - path: /patched
            app:
              - path: /usr/local/lib/python3.12/site-packages/gateway/platforms/matrix.py
                subPath: matrix.py
      # Patch script only — no room IDs, safe to keep in git.
      config:
        type: configMap
        name: hermes-matrix-configmap
        advancedMounts:
          hermes-matrix:
            patch-matrix:
              - path: /run/config
      # Rendered config.yaml with the private room IDs substituted in.
      config-secret:
        type: secret
        name: hermes-matrix-config
        defaultMode: 0o400
        advancedMounts:
          hermes-matrix:
            patch-matrix:
              - path: /run/secret
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
