---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-matrix
spec:
  chartRef:
    kind: OCIRepository
    name: hermes-matrix
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes-matrix:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        type: deployment
        initContainers:
          patch-matrix:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/hermes-matrix
              tag: 0.15.2-33e1668
            command:
              - sh
              - -c
              - |
                set -eu
                python3 /run/config/patch-matrix.py \
                  /usr/local/lib/python3.12/site-packages/gateway/platforms/matrix.py \
                  /patched/matrix.py
                cp /run/secret/config.yaml /data/config.yaml
                chmod 600 /data/config.yaml
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: registry.erwanleboucher.dev/eleboucher/hermes-matrix
              tag: 0.15.2-33e1668
            env:
              HERMES_HOME: /data
              MATRIX_ENCRYPTION: "true"
              GATEWAY_PROXY_URL: http://hermes.ai.svc.cluster.local:8642
            envFrom:
              - secretRef:
                  name: hermes-matrix
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: hermes-matrix
        advancedMounts:
          hermes-matrix:
            patch-matrix:
              - path: /data
            app:
              - path: /data
      patched:
        type: emptyDir
        advancedMounts:
          hermes-matrix:
            patch-matrix:
              - path: /patched
            app:
              - path: /usr/local/lib/python3.12/site-packages/gateway/platforms/matrix.py
                subPath: matrix.py
      config:
        type: configMap
        name: hermes-matrix-configmap
        advancedMounts:
          hermes-matrix:
            patch-matrix:
              - path: /run/config
      config-secret:
        type: secret
        name: hermes-matrix-config
        defaultMode: 0o400
        advancedMounts:
          hermes-matrix:
            patch-matrix:
              - path: /run/secret
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
