---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-matrix
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-matrix
    creationPolicy: Owner
    template:
      data:
        MATRIX_HOMESERVER: "{{ .MATRIX_HOMESERVER }}"
        MATRIX_USER_ID: "{{ .MATRIX_USER_ID }}"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_ACCESS_TOKEN }}"
        MATRIX_ALLOWED_USERS: "{{ .MATRIX_ALLOWED_USERS }}"
        MATRIX_HOME_ROOM: "{{ .MATRIX_ROOM_NOTIFY }}"
        MATRIX_HOME_ROOM_NAME: "Hermes · Notify"
        GATEWAY_PROXY_KEY: "{{ .API_SERVER_KEY }}"
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: hermes
    - extract:
        key: hermes-rooms
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-matrix-config
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-matrix-config
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: hermes-matrix-configmap
            items:
              - key: config.yaml
  dataFrom:
    - extract:
        key: hermes-rooms
