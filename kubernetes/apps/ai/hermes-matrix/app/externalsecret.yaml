---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-matrix
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-matrix
    creationPolicy: Owner
    template:
      data:
        MATRIX_HOMESERVER: "{{ .MATRIX_HOMESERVER }}"
        MATRIX_USER_ID: "{{ .MATRIX_USER_ID }}"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_ACCESS_TOKEN }}"
        MATRIX_ALLOWED_USERS: "{{ .MATRIX_ALLOWED_USERS }}"
        # Scheduled output and reminders land in the dedicated Notify room so
        # the conversational rooms can be muted without losing them.
        MATRIX_HOME_ROOM: "{{ .MATRIX_ROOM_NOTIFY }}"
        MATRIX_HOME_ROOM_NAME: "Hermes · Notify"
        GATEWAY_PROXY_KEY: "{{ .API_SERVER_KEY }}"
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: hermes
    # Private Matrix room IDs. Kept in their own Secure Note rather than the
    # `hermes` item because every PASSWORD-category item in this vault has an
    # empty password field, which makes `op item edit` fail the CLI validator
    # ("Password item requires ps value") — they are only editable via the
    # Connect API or the GUI. A Secure Note has no such constraint.
    - extract:
        key: hermes-rooms
---
# Separate Secret so the rendered config.yaml never reaches the app container
# via envFrom (a key named "config.yaml" is not a valid env var identifier and
# would be skipped with a warning event on every start).
#
# The room IDs are private, so config.yaml is assembled here from the personas
# in hermes-matrix-configmap plus MATRIX_ROOM_* values out of the 1Password
# `hermes` item. Nothing room-identifying is committed to git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-matrix-config
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-matrix-config
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: hermes-matrix-configmap
            items:
              - key: config.yaml
  dataFrom:
    - extract:
        key: hermes-rooms
