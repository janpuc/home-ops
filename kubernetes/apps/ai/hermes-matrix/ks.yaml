---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-matrix
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: hermes-matrix
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: hermes
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/hermes-matrix/app
  postBuild:
    substitute:
      APP: hermes-matrix
      KOPIUR_COPYMETHOD: Direct
      KOPIUR_STORAGECLASS: miroir-fast-local
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
