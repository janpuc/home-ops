---
# Read-only access for Pi Pocket, Jan's assistant on aether (outside the cluster; see
# janpuc/dotfiles docs/aether.md). The built-in view role, which Flux's roles aggregate into:
# workloads, logs, events and Flux objects, never Secrets. Changes go through this repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${APP}
---
# A long-lived token for the kubeconfig that `pocket-kube-sync` on Jan's Mac installs on aether.
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-token
  annotations:
    kubernetes.io/service-account.name: ${APP}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${APP}-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: ${APP}
    namespace: ai
---
# view has no cluster-scoped nodes; triage of node alerts needs to read them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${APP}-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${APP}-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${APP}-nodes
subjects:
  - kind: ServiceAccount
    name: ${APP}
    namespace: ai
---
# Read-only access to the storage and backup resources the built-in view role does not cover
# (CRDs only join view when they opt in). The agent's maintenance preflight checks that every
# Miroir volume is ready and that no kopiur or CSI snapshot or restore is running before Jan
# merges a Talos or Kubernetes upgrade; without this it could not, and held the upgrade.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${APP}-storage-read
rules:
  - apiGroups:
      - miroir.home-operations.com
      - kopiur.home-operations.com
      - snapshot.storage.k8s.io
      - groupsnapshot.storage.k8s.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${APP}-storage-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${APP}-storage-read
subjects:
  - kind: ServiceAccount
    name: ${APP}
    namespace: ai
