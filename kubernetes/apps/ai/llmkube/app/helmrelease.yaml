---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  chartRef:
    kind: OCIRepository
    name: llmkube
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    modelCache:
      enabled: true
      mode: perService
      size: 20Gi
      # The fast pool is the NVMe disk. The slow pool is the SATA SSD that also
      # carries the Talos OS disk and etcd's WAL on every node, and a model
      # load reads the whole weight file from the cache: on the slow pool that
      # read stalled the API server's etcd requests and the controllers that
      # renew their leases. The class of a claim never changes, so the claims
      # that already exist stay where they are; the services that use them
      # name a claim of their own (see models/model-cache-pvc.yaml).
      storageClass: miroir-fast-local
    prometheus:
      inferencePodMonitor:
        enabled: false
