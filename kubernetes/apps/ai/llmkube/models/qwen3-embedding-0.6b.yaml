---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-embedding-0.6b
spec:
  format: gguf
  hardware:
    accelerator: cpu
    gpu:
      enabled: false
  quantization: Q8_0
  source: https://huggingface.co/enacimie/Qwen3-Embedding-0.6B-Q4_K_M-GGUF/resolve/main/qwen3-embedding-0.6b-q4_k_m.gguf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-embedding-0.6b
spec:
  modelRef: qwen3-embedding-0.6b
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-b10133@sha256:3e8914c1aab600a330ada97c10fb5fb02ff1c15ac39f2ece218db125cf54594e
  replicas: 1
  # per-slot ctx = contextSize/parallelSlots; 2 slots = 4096, enough for long memini docs.
  contextSize: 4096
  parallelSlots: 2
  batchSize: 2048
  uBatchSize: 512
  resources:
    cpu: 4000m
    memory: 4Gi
  extraArgs:
    # Qwen3-Embedding uses last-token pooling with left padding;
    # --embedding + --pooling last exposes the OpenAI-compatible
    # /v1/embeddings endpoint.
    - --embedding
    - --pooling
    - last
    - --cache-ram
    - "0"
    - --threads
    - "4"
    - --threads-batch
    - "4"
    - --cont-batching
    - --sleep-idle-seconds
    - "300"
    - --alias
    - qwen3-embedding-0.6b
    - --metrics
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
