---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: bge-reranker-v2-m3
spec:
  format: gguf
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      layers: 99
      vendor: amd
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models-gpu
  quantization: Q8_0
  source: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q8_0.gguf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: bge-reranker-v2-m3
spec:
  modelRef: bge-reranker-v2-m3
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b12199@sha256:5f372e6bbbd8ec1fd505d3094b5d9812b3caff052a9f24c52e269fe4f33cb39e
  replicas: 1
  contextSize: 4096
  parallelSlots: 2
  batchSize: 1024
  uBatchSize: 1024
  # The request is the scheduler's reservation. The model lives in the iGPU,
  # not in RAM: the pod's working set peaks at 226 MiB and its usage (the
  # mapped weights included) at 793 MiB over the last 19 hours, with no OOM
  # kill. 2 GiB reserved 2 GiB from k8s-2, the node with the least room.
  # memoryLimit keeps the ceiling where it was, so the workload can still
  # burst.
  resources:
    cpu: 100m
    memory: 1Gi
    memoryLimit: 2Gi
  extraArgs:
    - --reranking
    - --pooling
    - rank
    - --embedding
    - --threads
    - "4"
    - --cache-ram
    - "0"
    - --load-mode
    - none
    - --sleep-idle-seconds
    - "300"
    - --alias
    - bge-reranker-v2-m3
    - --metrics
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
