---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: bge-reranker-v2-m3
spec:
  format: gguf
  hardware:
    accelerator: vulkan
    gpu:
      enabled: true
      layers: 99
      vendor: amd
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models-gpu
  quantization: Q8_0
  source: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q8_0.gguf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: bge-reranker-v2-m3
spec:
  modelRef: bge-reranker-v2-m3
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10830@sha256:da40dad3f891100d3d01a89509f7de6192820b7e9ba57e96bf55d1e17cbeae76
  replicas: 1
  contextSize: 4096
  parallelSlots: 2
  batchSize: 1024
  uBatchSize: 1024
  resources:
    cpu: 100m
    memory: 2Gi
  extraArgs:
    - --reranking
    - --pooling
    - rank
    - --embedding
    - --threads
    - "4"
    - --cache-ram
    - "0"
    - --no-mmap
    - --sleep-idle-seconds
    - "300"
    - --alias
    - bge-reranker-v2-m3
    - --metrics
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
