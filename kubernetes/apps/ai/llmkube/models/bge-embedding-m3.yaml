---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: bge-embedding-m3
spec:
  format: gguf
  hardware:
    # Back on the iGPU (k8s-0's is the free one; k8s-1 has Plex, k8s-2 the
    # reranker): on CPU it managed ~100 tokens/s, so kritika's bulk indexing
    # starved memini's 5s recall-embed budget and recall fell back to keyword-only.
    accelerator: vulkan
    gpu:
      enabled: true
      layers: 99
      vendor: amd
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models-gpu
  quantization: Q8_0
  source: https://huggingface.co/gpustack/bge-m3-GGUF/resolve/main/bge-m3-Q8_0.gguf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: bge-embedding-m3
spec:
  modelRef: bge-embedding-m3
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11429@sha256:cf254eed909277abed1d33d6342ead0fd945c0247671f0bd45934c64408306c0
  replicas: 1
  contextSize: 8192
  parallelSlots: 2
  batchSize: 2048
  uBatchSize: 2048
  resources:
    cpu: 100m
    memory: 3Gi
  extraArgs:
    - --embedding
    - --pooling
    - cls
    - --threads
    - "4"
    - --cont-batching
    - --cache-ram
    - "0"
    - --sleep-idle-seconds
    - "300"
    - --alias
    - bge-m3
    - --metrics
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 30
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
