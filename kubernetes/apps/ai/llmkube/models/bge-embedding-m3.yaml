---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: bge-embedding-m3
spec:
  format: gguf
  hardware:
    # Back on the iGPU (k8s-0's is the free one; k8s-1 has Plex, k8s-2 the
    # reranker): on CPU it managed ~100 tokens/s, so kritika's bulk indexing
    # starved memini's 5s recall-embed budget and recall fell back to keyword-only.
    accelerator: vulkan
    gpu:
      enabled: true
      layers: 99
      vendor: amd
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llmkube-models-gpu
  quantization: Q8_0
  source: https://huggingface.co/gpustack/bge-m3-GGUF/resolve/main/bge-m3-Q8_0.gguf
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: bge-embedding-m3
spec:
  modelRef: bge-embedding-m3
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b12004@sha256:98b45d5444dad686e05022a0a96334076f2fdafd6a89c45eddfd8d1b156c9e88
  replicas: 1
  contextSize: 8192
  parallelSlots: 2
  # An embedding input must fit in one ubatch, and the non-causal attention
  # buffer grows with ubatch²: at 2048 it pushed the iGPU past its 2 GiB GTT cap
  # (amdgpu "Not enough memory for command submission" -> ErrorDeviceLost).
  # The dense text measured against this model tokenises at 2.33-2.37
  # chars/token, so a client bound of 2500 chars was 1055-1073 tokens and the
  # server refused it ("input (1055 tokens) is too large to process"). memini's
  # MEMINI_EMBED_MAX_ITEM_CHARS and kritika's maxItemChars/maxBatchChars are
  # kept at 1800 chars, which is 760-770 tokens here.
  batchSize: 1024
  uBatchSize: 1024
  # The request is the scheduler's reservation. The model lives in the iGPU,
  # not in RAM: the pod's working set peaks at 273 MiB and its usage peaks at
  # 890 MiB (the page cache of the mapped weights), so 3 GiB reserved 3 GiB
  # from k8s-0, the node that has the least room. memoryLimit keeps the
  # ceiling where it was, so the workload can still burst.
  resources:
    cpu: 100m
    memory: 1Gi
    memoryLimit: 3Gi
  extraArgs:
    - --embedding
    - --pooling
    - cls
    - --threads
    - "4"
    - --cont-batching
    - --cache-ram
    - "0"
    - --sleep-idle-seconds
    - "300"
    - --alias
    - bge-m3
    - --metrics
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 60
    # /health stays green after the Vulkan device is lost, so run a real embed.
    # Skipped while the model sleeps, and the period is longer than
    # --sleep-idle-seconds so the probe alone never keeps it awake.
    liveness:
      exec:
        command:
          - sh
          - -c
          - >-
            curl -sf -m 5 http://localhost:8080/props | grep -q '"is_sleeping":true' ||
            curl -sf -m 15 -o /dev/null -H 'Content-Type: application/json'
            -d '{"input":"ok"}' http://localhost:8080/v1/embeddings
      periodSeconds: 420
      timeoutSeconds: 25
      failureThreshold: 2
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
