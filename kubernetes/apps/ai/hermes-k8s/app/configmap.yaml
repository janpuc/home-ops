        timeout: 300
        capabilities:
          - orchestration
          - user_context
          - scheduling
      hermes-home:
        url: http://hermes-home.ai.svc.cluster.local:9900
        auth:
          type: bearer
          token: "$${A2A_TOKEN}"
        timeout: 240
        capabilities:
          - home_assistant
          - smart_home
  SOUL.md: |-
    # hermes-k8s

    You are the cluster specialist of Jan's homelab: the janpuc/home-ops
    cluster (3-node Talos control plane, Cilium CNI, miroir/DRBD storage,
    Envoy Gateway, Flux-managed). Other agents reach you over A2A and expect an
    on-call SRE.

    Rules:
    - Lead with evidence. Run the read-only check before asserting anything.
    - State what you verified and what you inferred, separately.
    - On miroir, judge data safety by per-node diskState and splitBrain,
      never by readyReplicas. That field goes stale when an agent wedges.
    - The home-ops checkout under the workspace is read-only: pull first,
      never commit, and propose changes as diffs for Jan to apply.
    - Never remediate anything that touches storage, reboots nodes, or
      deletes resources. Report the finding and the single next step.
    - Alerts: answer three things in order. Is it real or an artifact of a
      stale component? What is the blast radius right now? What is the next
      diagnostic step?
    - Be terse. Tables and command output over prose.
  hook-home-ops-guard.py: |-
    """Block git write operations inside a home-ops checkout.

    Wire protocol (agent/shell_hooks.py): a JSON payload arrives on stdin;
    printing {"decision": "block", "reason": ...} refuses the call. Any other
    output - or none - lets it through. Failing open is deliberate: a broken
    guard must not wedge the agent.
    """
    import json
    import shlex
    import sys

    WRITE_SUBCOMMANDS = {
        "commit", "push", "merge", "rebase", "cherry-pick", "revert",
        "reset", "clean", "am", "apply", "restore", "checkout", "switch",
        "stash", "filter-branch", "update-ref", "gc", "prune", "mv", "rm",
    }
    CONDITIONAL = {"tag": ("-d", "-D", "--delete"), "branch": ("-D", "--delete")}

    SPLITTERS = ("&&", "||", ";", "|", "\n")


    def segments(command):
        """Split a compound shell command into individual invocations."""
        parts = [command]
        for sep in SPLITTERS:
            nxt = []
            for chunk in parts:
                nxt.extend(chunk.split(sep))
            parts = nxt
        return [p.strip() for p in parts if p.strip()]


    def offending_subcommand(segment):
        """Return the git subcommand if this segment is a git write, else None."""
        try:
            tokens = shlex.split(segment)
        except ValueError:
            return None
        while tokens and ("=" in tokens[0].split(" ")[0] or tokens[0] == "sudo"):
            tokens.pop(0)
        if not tokens or tokens[0] != "git":
            return None
        rest = tokens[1:]
        while rest and rest[0].startswith("-"):
            if rest[0] in ("-C", "-c", "--git-dir", "--work-tree"):
                rest = rest[2:]
            else:
                rest = rest[1:]
        if not rest:
            return None
        sub = rest[0]
        if sub in WRITE_SUBCOMMANDS:
            return sub
        flags = CONDITIONAL.get(sub)
        if flags and any(f in rest[1:] for f in flags):
            return sub
        return None


    def main():
        try:
            payload = json.load(sys.stdin)
        except Exception:
            return
        if payload.get("tool_name") != "terminal":
            return
        command = (payload.get("tool_input") or {}).get("command") or ""
        cwd = payload.get("cwd") or ""

        if "home-ops" not in cwd and "home-ops" not in command:
            return

        for segment in segments(command):
            sub = offending_subcommand(segment)
            if sub:
                print(json.dumps({
                    "decision": "block",
                    "reason": (
                        "Blocked 'git " + sub + "' in a home-ops checkout. "
                        "home-ops is read-only for the agent: pull first, never "
                        "auto-commit, and only edit when explicitly asked. Report "
                        "the change you want to make and let the user run it, or "
                        "ask for confirmation first."
                    ),
                }))
                return


    main()
  bootstrap.sh: |-
    #!/bin/sh
    set -eu
    W=/opt/data/workspace/home-ops
    if [ -d "$W/.git" ]; then
      git -C "$W" fetch --quiet --depth 1 origin main
      git -C "$W" reset --quiet --hard origin/main
    else
      git clone --quiet --depth 1 https://github.com/janpuc/home-ops.git "$W"
    fi
