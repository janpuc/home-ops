---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 15m
  values:
    defaultPodOptions:
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        type: deployment
        initContainers:
          copy-agent-source:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
            command:
              - /bin/sh
              - -c
              - |
                set -e
                # hermes-agent >= v2026.7.x ships root-only playwright .deps files;
                # tolerate those but still fail on any other copy error.
                cp -r /opt/hermes/. /agent-src/ 2>/tmp/cp.err || true
                if grep -v 'Permission denied' /tmp/cp.err; then exit 1; fi
                test -e /agent-src/.venv
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsUser: 1000
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /opt/data
                cp /run/config/config.yaml /opt/data/config.yaml
                chmod 600 /opt/data/config.yaml
                # pre_tool_call shell hook. config.yaml invokes it as
                # "/usr/bin/python3 .../home-ops-guard.py" (shlex.split,
                # shell=False), so no exec bit is required - but it must be
                # readable by the agent's uid.
                mkdir -p /opt/data/hook-scripts
                cp /run/config/home-ops-guard.py /opt/data/hook-scripts/home-ops-guard.py
                chmod 644 /opt/data/hook-scripts/home-ops-guard.py
                # matrix-post: deliver into a named Matrix room from cron jobs
                # and skills. /opt/data/.local/bin is already on PATH; this init
                # container runs before install-tools, so create it first.
                mkdir -p /opt/data/.local/bin
                cp /run/config/matrix-post.py /opt/data/.local/bin/matrix-post
                chmod 755 /opt/data/.local/bin/matrix-post
                # Weekly rollup for the #digest room. The generator goes on
                # PATH; the cron wrapper must live under HERMES_HOME/scripts,
                # which is the only location `hermes cron --script` accepts.
                cp /run/config/weekly-digest.py /opt/data/.local/bin/weekly-digest
                chmod 755 /opt/data/.local/bin/weekly-digest
                mkdir -p /opt/data/scripts
                cp /run/config/weekly-digest-run.sh /opt/data/scripts/weekly-digest-run.sh
                chmod 755 /opt/data/scripts/weekly-digest-run.sh
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsUser: 1000
          install-tools:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
            command:
              - /bin/sh
              - -c
              - |
                set -e
                mkdir -p /opt/data/.local/bin /opt/data/.local/go

                rm -f /opt/data/.local/bin/hermes /opt/data/.local/bin/docker

                if [ ! -f /opt/data/.local/bin/gh ]; then
                  cd /tmp
                  curl -fsSL https://github.com/cli/cli/releases/download/v2.61.0/gh_2.61.0_linux_amd64.tar.gz -o gh.tar.gz
                  tar xzf gh.tar.gz
                  cp gh_2.61.0_linux_amd64/bin/gh /opt/data/.local/bin/
                  rm -rf gh.tar.gz gh_2.61.0_linux_amd64
                fi

                if [ ! -f /opt/data/.local/go/bin/go ]; then
                  cd /tmp
                  curl -fsSL https://go.dev/dl/go1.23.5.linux-amd64.tar.gz -o go.tar.gz
                  tar xzf go.tar.gz
                  mv go /opt/data/.local/
                  rm -rf go.tar.gz
                fi

                if [ ! -f /opt/data/.local/homebrew/bin/brew ]; then
                  export HOMEBREW_PREFIX=/opt/data/.local/homebrew
                  mkdir -p $HOMEBREW_PREFIX
                  git clone --depth 1 https://github.com/Homebrew/brew $HOMEBREW_PREFIX
                fi

                if [ ! -f /opt/data/plugins/memini/plugin.yaml ]; then
                  mkdir -p /opt/data/plugins
                  cd /tmp
                  rm -rf memini-src
                  git clone --depth 1 --branch v0.7.14 https://github.com/eleboucher/memini memini-src
                  mv memini-src/integrations/hermes/plugin/memini /opt/data/plugins/memini
                  rm -rf memini-src
                fi

                # --- Language servers + linters for `hermes lsp` ------------
                # `hermes lsp status` warned: "bash-language-server is installed
                # but shellcheck is missing - diagnostics will be empty", and
                # only pyright was registered. Everything lands under
                # /opt/data/.local/bin, which is already on PATH.

                # ShellCheck itself - static binary, no runtime deps.
                # (Comment deliberately not written as "shellcheck: ..." - that
                # form parses as a lint directive and errors out SC1073.)
                if [ ! -f /opt/data/.local/bin/shellcheck ]; then
                  cd /tmp
                  curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o sc.tar.xz
                  tar xJf sc.tar.xz
                  cp shellcheck-v0.10.0/shellcheck /opt/data/.local/bin/
                  rm -rf sc.tar.xz shellcheck-v0.10.0
                fi

                # Node-based servers. --prefix keeps them out of the image's
                # read-only /usr/local and inside the PVC.
                if [ ! -f /opt/data/.local/bin/typescript-language-server ]; then
                  npm install -g --prefix /opt/data/.local \
                    typescript@5.7.2 typescript-language-server@4.3.3
                fi

                # yaml-language-server: this repo is almost entirely YAML, and
                # it validates against the # yaml-language-server: $schema=
                # comments already at the top of every manifest here.
                if [ ! -f /opt/data/.local/bin/yaml-language-server ]; then
                  npm install -g --prefix /opt/data/.local \
                    yaml-language-server@1.15.0
                fi

                # gopls. GOBIN (not GOPATH/bin) so it lands on PATH directly.
                if [ ! -f /opt/data/.local/bin/gopls ]; then
                  GOBIN=/opt/data/.local/bin \
                  GOPATH=/opt/data/go \
                  GOCACHE=/opt/data/.cache/go-build \
                  /opt/data/.local/go/bin/go install golang.org/x/tools/gopls@v0.17.1
                fi

                # --- Workspace bootstrap ------------------------------------
                # Kanban board, project and skill bundles. Declared here rather
                # than created by hand in the pod so a rebuilt PVC comes back
                # identical. HERMES_HOME must be set explicitly: this init
                # container does not inherit the app container's env.
                export HOME=/opt/data
                export HERMES_HOME=/opt/data
                HERMES=/opt/hermes/.venv/bin/hermes

                # Documented idempotent.
                $HERMES kanban init >/dev/null 2>&1 || true

                # Board slugs are immutable, so guard on the slug.
                if ! $HERMES kanban boards list 2>/dev/null | grep -qw home-ops; then
                  $HERMES kanban boards create home-ops --name "home-ops" || true
                fi

                # Project = named multi-folder workspace, bound to that board.
                if ! $HERMES project list 2>/dev/null | grep -qw home-ops; then
                  $HERMES project create "home-ops" \
                    /opt/data/workspace/home-ops \
                    /opt/data/workspace/home-ops-sync \
                    --slug home-ops \
                    --board home-ops \
                    --description "Flux-managed homelab cluster. Primary checkout plus the fork-sync clone." || true
                fi

                # Bundles become /slash commands. --force keeps this block the
                # single source of truth rather than whatever is on the PVC.
                $HERMES bundles create briefing --force \
                  -s morning-briefing -s weather-forecast -s news-curated \
                  -s file-delivery-to-chat \
                  -d "Daily brief: weather, curated news, delivered to chat" || true

                $HERMES bundles create cluster --force \
                  -s cluster-resource-pressure-investigation \
                  -s homelab-mcp-debugging -s home-ops-flux-app-template \
                  -s flux-operator-stack-debugging -s hermes-cron-debugging \
                  -d "Homelab cluster debugging: resource pressure, Flux, MCP, cron" || true

                # Weekly digest into the #digest Matrix room, Monday 08:00.
                # --no-agent means no LLM runs at all: the script IS the job.
                # It posts to Matrix itself and prints nothing, so a healthy
                # run is silent and costs nothing. `schedule` is positional.
                if ! $HERMES cron list 2>/dev/null | grep -q "weekly-digest"; then
                  $HERMES cron create "0 8 * * 1" \
                    --name weekly-digest \
                    --script weekly-digest-run.sh \
                    --no-agent \
                    --deliver local || true
                fi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsGroup: 1000
              runAsUser: 1000
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.7.7.2@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
            args:
              - gateway
              - run
              - --no-supervise
            env:
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: API_SERVER_KEY
              GOPATH: /opt/data/go
              HERMES_GID: "1000"
              HERMES_HOME: /opt/data
              HERMES_UID: "1000"
              HERMES_CRON_TIMEOUT: 0
              HOME: /opt/data
              HOMEBREW_CELLAR: /opt/data/.local/homebrew/Cellar
              HOMEBREW_PREFIX: /opt/data/.local/homebrew
              HOMEBREW_REPOSITORY: /opt/data/.local/homebrew
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: LITELLM_API_KEY
              MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
              # Hermes writes at the ROOT of the namespace tree (renamed from the
              # flat "hermes" on 2026-07-30). It is a general assistant, not a
              # per-project agent, so its durable facts belong where every project
              # below can inherit them. Its session churn stays put regardless:
              # the ancestor cascade reads durable tiers ONLY, so working/episodic
              # writes here never leak into homelab/* reads.
              MEMINI_NAMESPACE: homelab
              # Personal namespace, merged read-only into every recall. Required
              # for the morning brief: Janek's profile, voice preferences and
              # news framing live here, not in homelab.
              MEMINI_HOME: personal/jan
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: MEMINI_API_KEY
              HOMELAB_GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: GH_TOKEN
              PATH: /opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/go/bin:/opt/data/.local/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              SEARXNG_URL: http://searxng.selfhosted.svc.cluster.local:8080
              SUMMARY_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: LITELLM_API_KEY
              SUMMARY_LLM_MODEL: opencode-go/deepseek-v4-flash
              SUMMARY_LLM_URL: http://litellm.ai:4000/v1
              TERM: xterm-256color
              TERMINAL_MAX_FOREGROUND_TIMEOUT: "1800"
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes.janpuc.com
              HERMES_DASHBOARD_OIDC_ISSUER: https://id.janpuc.com
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-oidc-credentials"
              # MATRIX_HOMESERVER / MATRIX_ACCESS_TOKEN / MATRIX_ROOM_* — read
              # whole so the private room IDs stay out of this manifest. Used by
              # matrix-post.
              - secretRef:
                  name: hermes-matrix-access
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - FSETID
                  - SETGID
                  - SETUID
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsGroup: 0
              runAsNonRoot: false
              runAsUser: 0
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.130.0@sha256:fa367e7eddd303a95c736f7aede351cdee9036a7383cecfd8786bb5bbe78c13b
            args:
              - --auth
              - none
              - --user-data-dir
              - /opt/data/.vscode
              - --extensions-dir
              - /opt/data/.vscode
              - --port
              - "12321"
              - /opt/data
            env:
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-config
                    key: GH_TOKEN
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: hermes
        ipFamilies:
          - IPv4
        ports:
          codeserver:
            port: 12321
          gateway:
            port: 8642
          dashboard:
            port: 9119
    route:
      app:
        hostnames:
          - hermes.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9119
      codeserver:
        hostnames:
          - hermes-code.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 12321
    persistence:
      agent-source:
        type: emptyDir
        advancedMounts:
          hermes:
            copy-agent-source:
              - path: /agent-src
            install-tools:
              - path: /opt/hermes
            app:
              - path: /opt/hermes
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            init:
              - path: /opt/data
            install-tools:
              - path: /opt/data
            app:
              - path: /opt/data
            codeserver:
              - path: /opt/data
      config-yaml:
        type: configMap
        name: hermes-configmap
        defaultMode: 0o755
        advancedMounts:
          hermes:
            init:
              - path: /run/config/config.yaml
                subPath: config.yaml
              - path: /run/config/home-ops-guard.py
                subPath: home-ops-guard.py
              - path: /run/config/matrix-post.py
                subPath: matrix-post.py
              - path: /run/config/weekly-digest.py
                subPath: weekly-digest.py
              - path: /run/config/weekly-digest-run.sh
                subPath: weekly-digest-run.sh
      config:
        type: secret
        name: hermes-config
        defaultMode: 0o400
        advancedMounts:
          hermes:
            init:
              - path: /run/config/env
                subPath: env
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            app:
              - path: /run
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    rbac:
      roles:
        hermes-read-all:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - pods
                - pods/log
                - nodes
                - services
                - namespaces
                - configmaps
                - persistentvolumes
                - persistentvolumeclaims
                - endpoints
                - resourcequotas
                - limitranges
                - serviceaccounts
                - events
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "apps"
              resources:
                - deployments
                - daemonsets
                - statefulsets
                - replicasets
                - controllerrevisions
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "batch"
              resources:
                - "jobs"
                - "cronjobs"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "networking.k8s.io"
              resources:
                - "ingresses"
                - "ingressclasses"
                - "networkpolicies"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "storage.k8s.io"
              resources:
                - storageclasses
                - csinodes
                - csidrivers
                - volumeattachments
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "helm.toolkit.fluxcd.io"
              resources:
                - "helmreleases"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "kustomize.toolkit.fluxcd.io"
              resources:
                - "kustomizations"
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "source.toolkit.fluxcd.io"
              resources:
                - gitrepositories
                - helmrepositories
                - ocirepositories
                - buckets
                - helmcharts
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "external-secrets.io"
              resources:
                - externalsecrets
                - secretstores
                - clustersecretstores
              verbs:
                - "get"
                - "list"
                - "watch"
            # Storage and backup state. Without these the agent is blind to the
            # exact layer that caused the 2026-07-31 snapshot-freeze incident -
            # it could not have triaged the alert storm even if asked. Read-only.
            - apiGroups:
                - "miroir.home-operations.com"
              resources:
                - miroirvolumes
                - miroirnodes
                - miroirnodegroups
                - miroirsnapshots
                - miroirsnapshotgroups
              verbs:
                - "get"
                - "list"
                - "watch"
            - apiGroups:
                - "kopiur.home-operations.com"
              resources:
                - snapshots
                - snapshotpolicies
                - snapshotschedules
                - restores
                - repositories
                - clusterrepositories
              verbs:
                - "get"
                - "list"
                - "watch"
            # Certificate expiry for the digest.
            - apiGroups:
                - "cert-manager.io"
              resources:
                - certificates
                - certificaterequests
                - issuers
                - clusterissuers
              verbs:
                - "get"
                - "list"
                - "watch"
            # kubectl top - capacity trends.
            - apiGroups:
                - "metrics.k8s.io"
              resources:
                - nodes
                - pods
              verbs:
                - "get"
                - "list"
        hermes-pod-delete:
          type: ClusterRole
          rules:
            - apiGroups:
                - ""
              resources:
                - "pods"
              verbs:
                - "delete"
        hermes-exec-deploy:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - "pods/exec"
              verbs:
                - "create"
            - apiGroups:
                - "apps"
              resources:
                - "deployments"
              verbs:
                - "patch"
                - "update"
      bindings:
        hermes-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-read-all
          subjects:
            - identifier: hermes
              serviceAccount: hermes
        hermes-pod-delete:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-pod-delete
          subjects:
            - identifier: hermes
              serviceAccount: hermes
        hermes-exec-deploy:
          type: RoleBinding
          roleRef:
            identifier: hermes-exec-deploy
          subjects:
            - identifier: hermes
              serviceAccount: hermes
              namespace: ai
    serviceAccount:
      hermes: {}
