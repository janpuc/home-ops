---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-config
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-config
    creationPolicy: Owner
    template:
      data:
        API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
        GH_TOKEN: "{{ .GH_TOKEN }}"
        LITELLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
      templateFrom:
        - configMap:
            name: hermes-configmap
            items:
              - key: env
  data:
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: hermes
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-matrix-access
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-matrix-access
    creationPolicy: Owner
    template:
      data:
        MATRIX_HOMESERVER: "{{ .MATRIX_HOMESERVER }}"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_ACCESS_TOKEN }}"
        MATRIX_ROOM_CLUSTER: "{{ .MATRIX_ROOM_CLUSTER }}"
        MATRIX_ROOM_ASSISTANT: "{{ .MATRIX_ROOM_ASSISTANT }}"
        MATRIX_ROOM_HOME: "{{ .MATRIX_ROOM_HOME }}"
        MATRIX_ROOM_NOTIFY: "{{ .MATRIX_ROOM_NOTIFY }}"
        MATRIX_ROOM_ALERTS: "{{ .MATRIX_ROOM_ALERTS }}"
        MATRIX_ROOM_DIGEST: "{{ .MATRIX_ROOM_DIGEST }}"
        MATRIX_ROOM_INBOX: "{{ .MATRIX_ROOM_INBOX }}"
        MATRIX_ROOM_DM: "{{ .MATRIX_ROOM_DM }}"
  dataFrom:
    - extract:
        key: hermes
    - extract:
        key: hermes-rooms
