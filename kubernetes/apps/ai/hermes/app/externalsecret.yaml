---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-config
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-config
    creationPolicy: Owner
    template:
      data:
        API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
        GH_TOKEN: "{{ .GH_TOKEN }}"
        LITELLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
      templateFrom:
        - configMap:
            name: hermes-configmap
            items:
              - key: env
  data:
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: hermes
---
# Matrix posting credentials for the MAIN agent.
#
# The agent had no Matrix credentials at all, so anything it produced outside a
# live chat turn — cron output, a generated file — could only reach a room via
# the file-delivery-to-chat skill, which scraped MATRIX_ACCESS_TOKEN out of the
# running hermes-matrix pod with kubectl at runtime. That works but is fragile
# and couples a skill to a pod name.
#
# Handing the agent its own read of the same credentials lets `matrix-post`
# deliver to a named room directly, which is what the digest cron and any
# future alert triage need.
#
# Separate Secret (not merged into hermes-config) so it can be envFrom'd whole:
# the room IDs are private and belong in env, not in the committed manifest.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-matrix-access
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-matrix-access
    creationPolicy: Owner
    template:
      data:
        MATRIX_HOMESERVER: "{{ .MATRIX_HOMESERVER }}"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_ACCESS_TOKEN }}"
        MATRIX_ROOM_CLUSTER: "{{ .MATRIX_ROOM_CLUSTER }}"
        MATRIX_ROOM_ASSISTANT: "{{ .MATRIX_ROOM_ASSISTANT }}"
        MATRIX_ROOM_HOME: "{{ .MATRIX_ROOM_HOME }}"
        MATRIX_ROOM_NOTIFY: "{{ .MATRIX_ROOM_NOTIFY }}"
        MATRIX_ROOM_ALERTS: "{{ .MATRIX_ROOM_ALERTS }}"
        MATRIX_ROOM_DIGEST: "{{ .MATRIX_ROOM_DIGEST }}"
        MATRIX_ROOM_INBOX: "{{ .MATRIX_ROOM_INBOX }}"
        MATRIX_ROOM_DM: "{{ .MATRIX_ROOM_DM }}"
  dataFrom:
    - extract:
        key: hermes
    - extract:
        key: hermes-rooms
