            - kubectl-gitops_source_get_tool
            - kubectl-get_current_context
            - kubectl-get_server_config_status
            - kubectl-compare_namespaces
      # Biggest offender by bytes: 78 tools / ~72.2k tok, because the config_set_*
      # and manage_* schemas are enormous (ha_manage_addon alone is 15.8 KB).
      # Kept the read/query surface plus the service call and todo tools the
      # ha-car-status and ev-charge-reminder skills use: ~14.4k tok.
      ha:
        url: http://litellm.ai:4000/mcp/ha/
        headers:
          Authorization: "Bearer $${LITELLM_API_KEY}"
        tools:
          include:
            - ha-ha_get_state
            - ha-ha_search
