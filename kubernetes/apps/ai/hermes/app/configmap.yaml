            - kubectl-node_top_tool
            - kubectl-node_stats_summary_tool
            - kubectl-node_logs_tool
            - kubectl-node_management
            - kubectl-exec_in_pod
            - kubectl-kubectl_generic
            - kubectl-kubectl_describe
            - kubectl-kubectl_explain
