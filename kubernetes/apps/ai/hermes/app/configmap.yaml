      # 275 tools upstream (~44.9k tok) -> 95 (~16.8k tok). Dropped whole
      # families this cluster does not run: kind, vind, kubevirt, istio, capi,
      # keda, argo-rollouts, flagger, velero backup/restore, multi-cluster and
      # the ~35 helm_* tools (Flux owns Helm here).
