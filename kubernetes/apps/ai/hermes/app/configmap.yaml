apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-configmap
data:
  config.yaml: |-
    custom_providers:
      - name: litellm
        base_url: http://litellm.ai:4000/v1
        key_env: LITELLM_API_KEY
        models:
          minimax/MiniMax-M3:
            context_length: 1000000
          opencode-go/minimax-m3:
            context_length: 1000000
          opencode-go/glm-5.2:
            context_length: 1000000
          opencode-go/deepseek-v4-flash:
            context_length: 1000000
          opencode-go/mimo-v2.5:
            context_length: 1000000
          opencode-go/qwen3.6-plus:
            context_length: 1000000
          opencode-go/kimi-k3:
            context_length: 1048576
          opencode-go/kimi-k2.7-code:
            context_length: 262144
          opencode-go/deepseek-v4-pro:
            context_length: 1000000
          opencode-go/qwen3.7-max:
            context_length: 1000000
          opencode-go/qwen3.7-plus:
            context_length: 1000000
          opencode-go/mimo-v2.5-pro:
            context_length: 1048576
          opencode-go/grok-4.5:
            context_length: 500000
          opencode-go/minimax-m2.7:
            context_length: 204800
    model:
      default: minimax/MiniMax-M3
      provider: custom:litellm
      context_length: 1000000
    model_aliases:
      qwen:
        model: opencode-go/qwen3.6-plus
        provider: custom:litellm
      minimax:
        model: minimax/MiniMax-M3
        provider: custom:litellm
      glm:
        model: opencode-go/glm-5.2
        provider: custom:litellm
      flash:
        model: opencode-go/deepseek-v4-flash
        provider: custom:litellm
      mimo:
        model: opencode-go/mimo-v2.5
        provider: custom:litellm
      k3:
        model: opencode-go/kimi-k3
        provider: custom:litellm
      kimi-code:
        model: opencode-go/kimi-k2.7-code
        provider: custom:litellm
      deepseek:
        model: opencode-go/deepseek-v4-pro
        provider: custom:litellm
      grok:
        model: opencode-go/grok-4.5
        provider: custom:litellm
      qwen-max:
        model: opencode-go/qwen3.7-max
        provider: custom:litellm
    fallback_providers:
      - provider: custom:litellm
        model: opencode-go/minimax-m3
      - provider: custom:litellm
        model: opencode-go/glm-5.2
      - provider: custom:litellm
        model: opencode-go/deepseek-v4-flash
    auxiliary:
      approval:
        provider: custom:litellm
        model: minimax/MiniMax-M3
        timeout: 60
      compression:
        provider: custom:litellm
        model: minimax/MiniMax-M3
      web_extract:
        provider: custom:litellm
        model: minimax/MiniMax-M3
      session_search:
        provider: custom:litellm
        model: opencode-go/deepseek-v4-flash
      vision:
        provider: custom:litellm
        model: minimax/MiniMax-M3
      goal_judge:
        provider: custom:litellm
        model: opencode-go/deepseek-v4-flash
      title_generation:
        provider: custom:litellm
        model: opencode-go/deepseek-v4-flash
      profile_describer:
        provider: custom:litellm
        model: opencode-go/deepseek-v4-flash
      triage_specifier:
        provider: custom:litellm
        model: opencode-go/deepseek-v4-flash
      kanban_decomposer:
        provider: custom:litellm
        model: opencode-go/deepseek-v4-flash
      curator:
        provider: custom:litellm
        model: opencode-go/deepseek-v4-flash
        timeout: 600
    memory:
      provider: memini
    plugins:
      enabled:
        - memini
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 900
      lifetime_seconds: 1800
      persistent_shell: true
    compression:
      enabled: true
      protect_last_n: 20
      threshold: 0.5
    streaming:
      enabled: false
    approvals:
      mode: smart
      timeout: 60
      # cron_mode is binary: "deny" blocks every approval-gated command in a
      # cron session, "approve" auto-approves ALL of them. approvals.mode: smart
      # does NOT apply to cron - approval.py::_get_cron_approval_mode only ever
      # returns deny or approve. Switched to approve so scheduled jobs can act
      # (remediate, commit, restart) instead of only reading.
      cron_mode: approve
      # The guardrail that makes the above safe. These fnmatch globs are matched
      # against terminal commands BEFORE the approve/--yolo/mode:off bypass, so
      # they hold even under cron_mode: approve. Case-insensitive.
      deny:
        # Cluster-destroying Talos operations
        - "*talosctl*reset*"
        - "*talosctl*wipe*"
        - "*talosctl*upgrade*"
        # Irreversible git history rewrites / working-tree destruction
        - "git push*--force*"
        - "git push*-f *"
        - "git reset --hard*"
        - "git clean*-*f*"
        - "git filter-branch*"
        # Flux/Helm teardown - prune is fine, deleting the controllers is not
        - "*flux uninstall*"
        - "*helm uninstall*"
        - "*helm delete*"
        # Blanket kubectl deletes
        - "*kubectl delete*--all*"
        - "*kubectl delete ns*"
        - "*kubectl delete namespace*"
        - "*kubectl delete pvc*"
        - "*kubectl delete pv *"
        # Storage / filesystem
        - "*mkfs*"
        - "*rm -rf /*"
        - "*dd if=*of=/dev/*"
        - "*wipefs*"
        # Piping the internet into a shell
        - "*curl*|*sh*"
        - "*wget*|*sh*"
    # Shell hooks (agent/shell_hooks.py). A pre_tool_call hook may return
    # {"decision": "block", "reason": "..."} on stdout to refuse a tool call.
    # Commands run via shlex.split with shell=False, so the interpreter is
    # named explicitly rather than relying on a shebang + exec bit.
    hooks:
      pre_tool_call:
        - command: /usr/bin/python3 /opt/data/hook-scripts/home-ops-guard.py
          matcher: terminal
          timeout: 10
    # Required: registration prompts for consent on first use of each
    # (event, command) pair and writes ~/.hermes/shell-hooks-allowlist.json.
    # The gateway and cron have no TTY, so without this the hook silently
    # never registers.
    hooks_auto_accept: true
    security:
      redact_secrets: true
      website_blocklist:
        enabled: true
        domains:
          - "169.254.169.254"
          - "metadata.google.internal"
    privacy:
      redact_pii: true
    agent:
      max_turns: 150
      gateway_timeout: 1800
      gateway_timeout_warning: 900
      restart_drain_timeout: 60
      api_max_retries: 3
      reasoning_effort: medium
    delegation:
      model: opencode-go/deepseek-v4-flash
      max_concurrent_children: 8
      max_spawn_depth: 2
    moa:
      default_preset: council
      presets:
        # Four distinct pretraining lineages (Moonshot / Zhipu / DeepSeek /
        # Qwen) so the members fail differently, all served by opencode-go.
        # The aggregator is deliberately a fifth family on a *different*
        # provider, so aggregation survives an opencode-go outage and is not
        # biased toward any one reference.
        council:
          enabled: true
          reference_models:
            - provider: custom:litellm
              model: opencode-go/kimi-k3
            - provider: custom:litellm
              model: opencode-go/glm-5.2
            - provider: custom:litellm
              model: opencode-go/deepseek-v4-pro
            - provider: custom:litellm
              model: opencode-go/qwen3.7-max
          aggregator:
            provider: custom:litellm
            model: minimax/MiniMax-M3
          reference_temperature: 0.6
          aggregator_temperature: 0.4
          # Advisors run ONCE per user turn, then MiniMax-M3 works the task
          # alone. The default (per_iteration) re-polls all four advisors after
          # every tool result, so a 25-iteration kubectl/terminal task would
          # cost 100 advisor calls instead of 4.
          fanout: user_turn
          # Advisor generation dominates MoA turn latency (~0.88 correlation
          # with output tokens) and the aggregator only needs the gist of each
          # judgement, not a full answer.
          reference_max_tokens: 600
          # NOTE: as of v2026.7.7 the preset's max_tokens does NOT cap the
          # aggregator - moa_loop passes the caller's value straight through so
          # the acting model uses its real maximum. Kept for forward compat.
          max_tokens: 16384
        # Three calls instead of five, for when a council is overkill.
        quick:
          enabled: true
          reference_models:
            - provider: custom:litellm
              model: opencode-go/deepseek-v4-flash
            - provider: custom:litellm
              model: opencode-go/qwen3.6-plus
          aggregator:
            provider: custom:litellm
            model: opencode-go/glm-5.2
          reference_temperature: 0.7
          aggregator_temperature: 0.3
          # Deliberately left on the default per_iteration fanout: only two
          # advisors, so refreshing their advice each iteration stays cheap.
          reference_max_tokens: 400
          max_tokens: 8192
    platforms:
      matrix:
        enabled: false
    matrix:
      require_mention: false
      auto_thread: false
      dm_mention_threads: false
    display:
      platforms:
        matrix:
          tool_progress: "off"
    # One Hermes entry per upstream MCP server instead of a single aggregated
    # "homelab" pointing at http://litellm.ai:4000/mcp. Two reasons:
    #
    #   1. The aggregate registered all 418 tools unfiltered (mcp_tool.py
    #      _register_server_tools: "neither include nor exclude set -> register
    #      all tools"), costing ~154k tokens of schema JSON on EVERY request.
    #      Note `hermes prompt-size` does NOT show this - it runs offline and
    #      only counts the 35 built-in tools.
    #   2. Split entries become separate `mcp-<name>` toolsets, so they can be
    #      scoped per platform via `platform_toolsets:` later if wanted.
    #
    # LiteLLM routes a single server at /mcp/<name>/ - the TRAILING SLASH is
    # required; /mcp/<name>/mcp returns 0 tools.
    #
    # Tool names change as a result: mcp__homelab__kubectl_get_pods is now
    # mcp__kubectl__kubectl_get_pods. Skills under /opt/data/skills were
    # rewritten to match.
    mcp_servers:
      # 275 tools upstream (~44.9k tok) -> 95 (~16.8k tok). Dropped whole
      # families this cluster does not run: kind, vind, kubevirt, istio, capi,
      # keda, argo-rollouts, flagger, velero backup/restore, multi-cluster and
      # the ~35 helm_* tools (Flux owns Helm here).
      kubectl:
        url: http://litellm.ai:4000/mcp/kubectl/
        headers:
          Authorization: "Bearer $${LITELLM_API_KEY}"
        tools:
          include:
            - kubectl-get_pods
            - kubectl-get_nodes
            - kubectl-get_nodes_summary
            - kubectl-get_node_metrics
            - kubectl-get_pod_metrics
            - kubectl-get_deployments
            - kubectl-get_statefulsets
            - kubectl-get_daemonsets
            - kubectl-get_replicasets
            - kubectl-get_services
            - kubectl-get_endpoints
            - kubectl-get_ingress
            - kubectl-get_configmaps
            - kubectl-get_secrets
            - kubectl-get_namespaces
            - kubectl-get_events
            - kubectl-get_pod_events
            - kubectl-get_pod_conditions
            - kubectl-get_pvcs
            - kubectl-get_persistent_volumes
            - kubectl-get_storage_classes
            - kubectl-get_jobs
            - kubectl-get_hpa
            - kubectl-get_pdb
            - kubectl-get_crds
            - kubectl-get_api_resources
            - kubectl-get_cluster_info
            - kubectl-get_cluster_version
            - kubectl-get_logs
            - kubectl-get_previous_logs
            - kubectl-get_resource_quotas
            - kubectl-get_service_accounts
            - kubectl-get_rbac_roles
            - kubectl-get_cluster_roles
            - kubectl-health_check
            - kubectl-check_pod_health
            - kubectl-diagnose_pod_crash
            - kubectl-check_dns_resolution
            - kubectl-diagnose_network_connectivity
            - kubectl-detect_pending_pods
            - kubectl-get_evicted_pods
            - kubectl-trace_service_chain
            - kubectl-analyze_pod_security
            - kubectl-analyze_network_policies
            - kubectl-audit_rbac_permissions
            - kubectl-check_crd_exists
            - kubectl-get_resource_usage
            - kubectl-get_resource_trends
            - kubectl-get_resource_recommendations
            - kubectl-get_overprovisioned_resources
            - kubectl-get_idle_resources
