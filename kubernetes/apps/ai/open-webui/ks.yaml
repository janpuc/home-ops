---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: open-webui
  components:
    - ../../../../components/dragonfly
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/park
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
    - name: dragonfly-operator
      namespace: database
    - name: pocket-id-instance
      namespace: security
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
  interval: 1h
  # Temporary park while the PVC moves storage class (no zeroscaler here):
  # the app stays at 0 replicas until its rebuilt volume is verified.
  patches:
    - target:
        kind: HelmRelease
        name: open-webui
      patch: |-
        - op: add
          path: /spec/values/controllers/open-webui/replicas
          value: 0
  path: ./kubernetes/apps/ai/open-webui/app
  postBuild:
    substitute:
      APP: open-webui
      KOPIUR_COPYMETHOD: Direct
      KOPIUR_STORAGECLASS: miroir-fast-local
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
