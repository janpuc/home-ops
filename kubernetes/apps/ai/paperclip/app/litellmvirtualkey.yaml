---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: paperclip
spec:
  # The Pi agents Jan runs in Paperclip. The weekly cap counts all four models at LiteLLM's
  # list price. MiniMax M3.1 Flash is notional (0.15 in, 0.60 out per M tokens, its public
  # pay-as-you-go price), the OpenAI and Anthropic API keys are really billed. No Opus.
  keyAlias: paperclip
  models:
    - minimax/MiniMax-M3.1-Flash
    - openai/gpt-6.2-sol
    - anthropic/claude-sonnet-5-5
    - anthropic/claude-haiku-5-5
  maxBudget: "15"
  budgetDuration: 7d
  proxyRef: litellm
  proxyNamespace: ai
  secretName: paperclip-litellm
  secretKey: LITELLM_API_KEY
