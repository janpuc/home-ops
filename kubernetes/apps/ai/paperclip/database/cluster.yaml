---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperclip-postgres
spec:
  # One instance: a trial app, and node memory requests are nearly full.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: false
  storage:
    size: 5Gi
    storageClass: miroir-fast-local
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
  # No secret: CloudNativePG generates paperclip-postgres-app, whose uri key is
  # Paperclip's DATABASE_URL.
  bootstrap:
    initdb:
      database: paperclip
      owner: paperclip
