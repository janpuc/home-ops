---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: litellm
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
    - name: miroir-config
      namespace: miroir-system
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: litellm-postgres
      namespace: ai
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 15m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
spec:
  components:
    - ../../../../components/dragonfly
  dependsOn:
    - name: litellm-database
    - name: dragonfly-operator
      namespace: database
    - name: litellm-operator
      namespace: ai
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/app
  postBuild:
    substitute:
      APP: litellm
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-pgdump
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: litellm
  # The nightly dump lands on its own volume, which Kopiur backs up to the NAS
  # like every other app volume. CloudNativePG has no backup here.
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: litellm-database
    - name: kopiur
      namespace: kopiur-system
    - name: miroir-config
      namespace: miroir-system
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/backup
  postBuild:
    substitute:
      APP: litellm-pgdump
      # Seven dumps of about 4 MB each: 2Gi also leaves room for the spend log,
      # the one table that only grows.
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_COPYMETHOD: Direct
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
