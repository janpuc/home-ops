# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: opencode-go-deepseek-v4-1-flash
spec:
  modelName: opencode-go/deepseek-v4.1-flash
  params:
    model: openai/deepseek-v4.1-flash
    apiBase: https://opencode.ai/zen/go/v1
    apiKeyRef:
      name: litellm
      key: OPENCODE_GO_API_KEY
    dropParams: true
    additional:
      extra_headers:
        x-opencode-session: litellm-janpuc-com
  info:
    maxInputTokens: 1000000
    maxOutputTokens: 384000
    supportsFunctionCalling: true
    supportsPromptCaching: true
    extra:
      supports_reasoning: true
      # LiteLLM's price for opencode_go/deepseek-v4.1-flash. The openai/ model name has no
      # entry of its own, so without these the spend is $0 and key budgets never trip.
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.000000006
