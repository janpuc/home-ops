# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: opencode-go-deepseek-v4-1-flash
spec:
  modelName: opencode-go/deepseek-v4.1-flash
  params:
    model: openai/deepseek-v4.1-flash
    apiBase: https://opencode.ai/zen/go/v1
    apiKeyRef:
      name: litellm
      key: OPENCODE_GO_API_KEY
    dropParams: true
    additional:
      extra_headers:
        x-opencode-session: litellm-janpuc-com
  info:
    maxInputTokens: 1000000
    maxOutputTokens: 384000
    supportsFunctionCalling: true
    supportsPromptCaching: true
    extra:
      supports_reasoning: true
      # What OpenCode Go meters for deepseek-v4.1-flash (cost block of
      # https://opencode.ai/inference/go/v1/models, 2026-11-27), half of the Zen list
      # price LiteLLM carries for opencode_go/deepseek-v4.1-flash. Go doubles the price on
      # weekdays 01:00-04:00 and 06:00-10:00 UTC, which LiteLLM cannot model, so this is
      # the base price. The openai/ model name has no entry of its own, so without these
      # the spend is $0 and key budgets never trip.
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
      cache_read_input_token_cost: 0.000000003
