---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: m3pro-qwen3-8-27b
spec:
  # M3 Pro (sisyphus) behind llama-swap: Stock Qwen3.8-27B UD-IQ3_XXS: the best local coder and tool caller (on-box eval
  # 2026-10-14: coding 15/16, tool-call JSON 32/32). Not uncensored, no vision, 96K. Slow (about
  # 9 tok/s writing, 70 tok/s prompt reading).
  # A request loads it there (about 10-15 s if another model is in); ordinary tasks can fall
  # back to MiniMax M3 (routerSettings.fallbacks). Private material goes to m3pro-local/ instead.
  modelName: m3pro/qwen3.8-27b
  params:
    # Must match the llama-swap model ID on the box.
    model: openai/qwen3.8-27b
    apiBase: http://192.168.69.249:8090/v1
    apiKeyRef:
      name: litellm
      key: M3PRO_API_KEY
    dropParams: true
    additional:
      # A full 86K prompt reads in about 20 minutes at ~70 tok/s; the router's 600 s is too short.
      timeout: 3600
      stream_timeout: 3600
  info:
    # 98304 context (96K: 128K left too little memory on the box), split 7:1; llama-server does
    # not enforce the split.
    maxTokens: 98304
    maxInputTokens: 86016
    maxOutputTokens: 12288
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      # The box runs --reasoning-budget 0: thinking is off for reliable tool calls.
      supports_reasoning: false
      # llama-swap on the box starts whichever model a request names, so a health
      # check would load this model and evict the one working. No polling.
      disable_background_health_check: true
