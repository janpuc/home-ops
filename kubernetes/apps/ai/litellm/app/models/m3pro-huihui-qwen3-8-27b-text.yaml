---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: m3pro-huihui-qwen3-8-27b-text
spec:
  # M3 Pro (sisyphus) behind llama-swap: Huihui Qwen3.8-27B abliterated, uncensored, text only,
  # 128K context (the vision model's weights without its projector). Smarter than the Heretic
  # 35B, but slow (about 9 tok/s writing, 70 tok/s prompt reading: a full 110K prompt takes about
  # 26 minutes; the timeout below allows an hour).
  # A request loads it there (about 10-15 s if another model is in); ordinary tasks can fall
  # back to MiniMax M3 (routerSettings.fallbacks). Private material goes to m3pro-local/ instead.
  modelName: m3pro/huihui-qwen3.8-27b-text
  params:
    # Must match the llama-swap model ID on the box.
    model: openai/huihui-qwen3.8-27b-text
    apiBase: http://192.168.69.249:8090/v1
    apiKeyRef:
      name: litellm
      key: M3PRO_API_KEY
    dropParams: true
    additional:
      # A full 110K prompt reads in about 26 minutes at ~70 tok/s; the router's 600 s
      # is too short.
      timeout: 3600
      stream_timeout: 3600
  info:
    # 131072 context, split as the box advises; llama-server does not enforce the split.
    maxTokens: 131072
    maxInputTokens: 114688
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsVision: false
    extra:
      # The box runs --reasoning-budget 0: thinking is off for reliable tool calls.
      supports_reasoning: false
      # llama-swap on the box starts whichever model a request names, so a health
      # check would load this model and evict the one working. No polling.
      disable_background_health_check: true
