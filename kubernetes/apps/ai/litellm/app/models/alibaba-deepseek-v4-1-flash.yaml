---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: alibaba-deepseek-v4-1-flash
spec:
  # A non-Qwen chat model on the same Token Plan and OpenAI-compatible base: the plan
  # bills credits so spend reads $0, its terms cover interactive use only, and this
  # alias is in no fallback list.
  modelName: alibaba/deepseek-v4.1-flash
  params:
    model: openai/deepseek-v4.1-flash
    apiBase: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    apiKeyRef:
      name: litellm
      key: ALIBABA_API_KEY
    dropParams: true
  info:
    # 1M context, 64K output.
    maxTokens: 1000000
    maxInputTokens: 1000000
    maxOutputTokens: 65536
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      supports_reasoning: true
      # Token Plan credits, not USD: record $0 explicitly (no price page in USD, checked 2026-11-27).
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
      # A health check is a billed chat completion on the plan, so no polling.
      disable_background_health_check: true
