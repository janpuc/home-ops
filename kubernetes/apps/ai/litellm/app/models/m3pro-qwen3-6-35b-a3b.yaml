---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: m3pro-qwen3-6-35b-a3b
spec:
  # Always-on M3 Pro worker. Ordinary tasks can fall back to MiniMax M3
  # (routerSettings.fallbacks). Private material goes to m3pro-local/ instead.
  modelName: m3pro/qwen3.6-35b-a3b
  params:
    # Must match LLAMA_ARG_ALIAS on the box.
    model: openai/qwen3.6-35b-a3b
    apiBase: http://192.168.69.249:8090/v1
    apiKeyRef:
      name: litellm
      key: M3PRO_API_KEY
    dropParams: true
  info:
    # 131072 context, split as the box advises; llama-server does not enforce it.
    maxTokens: 131072
    maxInputTokens: 114688
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    extra:
      # The box runs --reasoning-budget 0: with thinking on, Qwen3.6 emits invalid
      # tool-call JSON and llama-server answers 500.
      supports_reasoning: false
      # Always on, no idle unload: polling is useful, unlike the gaming BC250.
      disable_background_health_check: false
      # Keep the mirrored timeout while cold model loading remains unmeasured.
      health_check_timeout: 90
