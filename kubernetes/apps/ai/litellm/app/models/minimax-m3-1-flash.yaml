---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: minimax-m3-1-flash
spec:
  modelName: minimax/MiniMax-M3.1-Flash
  params:
    model: minimax/MiniMax-M3.1-Flash
    apiBase: https://api.minimax.io/v1
    apiKeyRef:
      name: litellm
      key: MINIMAX_API_KEY
    additional:
      extra_body:
        reasoning_split: true
  info:
    maxTokens: 1000000
    maxInputTokens: 1000000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      supports_reasoning: true
      # MiniMax pricing page, checked 2026-11-27 (dotfiles subscription review), USD per
      # token. The Token Plan is flat, so spend is notional, but key budgets count it.
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
      cache_read_input_token_cost: 0.000000015
