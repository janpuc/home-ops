---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: pi-pocket
spec:
  proxyRef: litellm
  keyAlias: pi-pocket-aether
  # Pi Pocket's agents on aether fall back to the M3 Pro when every metered
  # model is out of quota. They run as the user that reads this key, so it
  # allows that one model and nothing else; an empty list would allow all.
  models:
    - m3pro/huihui-qwen3.8-27b
  # The M3 Pro serves one request at a time.
  maxParallelRequests: 1
  secretName: pi-pocket-litellm-key
  secretKey: LITELLM_API_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pi-pocket-litellm-key
spec:
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: pi-pocket-litellm-key
  # ai-sync on aether reads it from op://Kubernetes/pi-pocket-litellm/LITELLM_API_KEY.
  data:
    - match:
        secretKey: &key LITELLM_API_KEY
        remoteRef:
          remoteKey: pi-pocket-litellm
          property: *key
