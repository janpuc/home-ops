---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.97.0@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
  replicas: 1
  generalSettings:
    health_check_endpoint: /v1/health
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    num_retries: 3
    timeout: 600
    context_window_fallbacks:
      - opencode-go/glm-5.2: ["minimax/MiniMax-M3"]
      - opencode-go/glm-5.3: ["opencode-go/glm-5.2", "minimax/MiniMax-M3"]
      - opencode-go/gpt-5.6-luna: ["minimax/MiniMax-M3"]
      - opencode-go/hy3: ["minimax/MiniMax-M3"]
      - opencode-go/kimi-k2.6: ["minimax/MiniMax-M3"]
      - opencode-go/kimi-k2.7-code: ["minimax/MiniMax-M3"]
      - opencode-go/kimi-k3: ["minimax/MiniMax-M3"]
      - opencode-go/mimo-v2.5: ["opencode-go/glm-5.2", "minimax/MiniMax-M3"]
      - opencode-go/qwen3.7-max: ["minimax/MiniMax-M3"]
      - opencode-go/qwen3.6-plus: ["minimax/MiniMax-M3"]
      - opencode-go/deepseek-v4-flash: ["opencode-go/glm-5.2", "minimax/MiniMax-M3"]
      - opencode-go/deepseek-v4-flash-vision-exp: ["minimax/MiniMax-M3"]
      - opencode-go/deepseek-v4-pro: ["minimax/MiniMax-M3"]
      - opencode-go/grok-4.5: ["minimax/MiniMax-M3"]
      - opencode-go/qwen3.7-plus: ["minimax/MiniMax-M3"]
      - opencode-go/qwen3.8-max: ["opencode-go/qwen3.7-max", "minimax/MiniMax-M3"]
      - opencode-go/ox-alpha-free: ["minimax/MiniMax-M3"]
      - opencode-go/mimo-v2.5-pro: ["opencode-go/mimo-v2.5", "minimax/MiniMax-M3"]
      - opencode-go/minimax-m2.7: ["minimax/MiniMax-M3"]
      - opencode-go/minimax-m3: ["minimax/MiniMax-M3"]
      - minimax/MiniMax-M3: ["opencode-go/minimax-m3"]
      - minimax/MiniMax-M3-anthropic: ["minimax/MiniMax-M3"]
      - minimax/MiniMax-M2-7: ["minimax/MiniMax-M3"]
      - minimax/MiniMax-M2-7-anthropic: ["minimax/MiniMax-M2-7", "minimax/MiniMax-M3"]
  litellmSettings:
    success_callback:
      - prometheus
    prometheus_adapter: true
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
    drop_params: true
    merge_reasoning_content_in_choices: true
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: litellm-dragonfly.ai.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_MASTER_KEY
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2.5Gi
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 18
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames:
      - litellm.janpuc.com
    parentRefs:
      - name: envoy-external
        namespace: network
