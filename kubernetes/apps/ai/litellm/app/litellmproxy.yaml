---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.109.1@sha256:11175975a3093e05e92faee2fe2fe3412a3ae2fcaa849eb0fe25d5f0d8bcb2e9
  replicas: 1
  # The admin API the operator creates virtual keys and teams through. Models and MCP
  # servers stay file-backed: applyMode is left at its default.
  apiAccess:
    masterKeyRef:
      name: litellm
      key: LITELLM_MASTER_KEY
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    num_retries: 3
    timeout: 600
    # A 429 from OpenCode Go is almost always the plan's usage limit (GoUsageLimitError,
    # "resets in N days"), which no retry fixes: it goes straight to the fallback
    # below. Scoped to the Go model group so MiniMax still retries transient 429s
    # (num_retries); other errors keep num_retries everywhere.
    model_group_retry_policy:
      opencode-go/deepseek-v4.1-flash:
        RateLimitErrorRetries: 0
      # The always-on M3 Pro (sisyphus) has one slot, which would queue a retried
      # timeout behind itself: one attempt, then the fallback or the error. Covers
      # APIConnectionError, which has no per-type entry.
      m3pro/huihui-qwen3.8-27b:
        DefaultRetries: 0
      m3pro-local/huihui-qwen3.8-27b:
        DefaultRetries: 0
      m3pro-local/qwen3.8-27b:
        DefaultRetries: 0
      m3pro-local/qwen3.6-35b-a3b:
        DefaultRetries: 0
      # Image jobs run minutes on the same single box: a retry would only queue behind itself.
      m3pro/lustify-v2:
        DefaultRetries: 0
      m3pro/noobai-xl-1.1:
        DefaultRetries: 0
    # The one Go model fails over to MiniMax M3.1 Flash on its own plan. M3.1 Flash
    # has no fallback: a Go-hosted MiniMax is billed per token, and sending MiniMax's
    # overflow there (1,218 requests, 72M tokens in the week to 2026-11-03, mostly
    # kritika) emptied the Go month. When the MiniMax plan is out, callers get its
    # limit error and wait for the reset.
    fallbacks:
      - opencode-go/deepseek-v4.1-flash: ["minimax/MiniMax-M3.1-Flash"]
      # Ordinary chat on the M3 Pro moves to the cloud while the box is down.
      # The m3pro-local/ aliases are deliberately absent here and from
      # context_window_fallbacks: they carry private material and must fail
      # instead. Keep it that way, and keep default_fallbacks unset.
      - m3pro/huihui-qwen3.8-27b: ["minimax/MiniMax-M3.1-Flash"]
    # Only where the target has a larger context window (the M3 Pro's 32K to 1M).
    # While this list is set, a context error on a model not listed here is
    # returned as-is, not sent to the fallbacks above.
    context_window_fallbacks:
      - m3pro/huihui-qwen3.8-27b: ["minimax/MiniMax-M3.1-Flash"]
  litellmSettings:
    success_callback:
      - prometheus
    prometheus_adapter: true
    # Opt-in per request (`cache: {use-cache: true}`): it served no hits as an
    # always-on cache, and a Redis error then sits on every request's path.
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      mode: default_off
    drop_params: true
    merge_reasoning_content_in_choices: true
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: litellm-dragonfly.ai.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_MASTER_KEY
    # Keys, teams and spend. No LITELLM_SALT_KEY: it only encrypts credentials stored
    # in the database, and none are (store_model_in_db false). Set one before that changes.
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-postgres-app
          key: uri
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2.5Gi
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 18
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames:
      - litellm.janpuc.com
    parentRefs:
      - name: envoy-external
        namespace: network
