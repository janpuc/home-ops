---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.104.0@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
  replicas: 1
  generalSettings:
    health_check_endpoint: /v1/health
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    num_retries: 3
    timeout: 600
    # A 429 from OpenCode Go is almost always the plan's usage limit (GoUsageLimitError,
    # "resets in N days"), which no retry fixes: those groups go straight to the
    # fallbacks below. Scoped per model group so MiniMax and anything else still
    # retry transient 429s (num_retries); other errors keep num_retries everywhere.
    model_group_retry_policy:
      opencode-go/deepseek-v4-flash:
        RateLimitErrorRetries: 0
      opencode-go/deepseek-v4-flash-vision-exp:
        RateLimitErrorRetries: 0
      opencode-go/deepseek-v4-pro:
        RateLimitErrorRetries: 0
      opencode-go/deepseek-v4.1-flash:
        RateLimitErrorRetries: 0
      opencode-go/glm-5.2:
        RateLimitErrorRetries: 0
      opencode-go/glm-5.3:
        RateLimitErrorRetries: 0
      opencode-go/glm-5.3-flash:
        RateLimitErrorRetries: 0
      opencode-go/gpt-6-luna:
        RateLimitErrorRetries: 0
      opencode-go/grok-4.7:
        RateLimitErrorRetries: 0
      opencode-go/hy3:
        RateLimitErrorRetries: 0
      opencode-go/hy4-preview:
        RateLimitErrorRetries: 0
      opencode-go/kimi-k2.7-code:
        RateLimitErrorRetries: 0
      opencode-go/kimi-k3:
        RateLimitErrorRetries: 0
      opencode-go/longcat-2.0:
        RateLimitErrorRetries: 0
      opencode-go/mimo-v2.6-flash:
        RateLimitErrorRetries: 0
      opencode-go/mimo-v2.6-pro:
        RateLimitErrorRetries: 0
      opencode-go/minimax-m2.7:
        RateLimitErrorRetries: 0
      opencode-go/minimax-m3:
        RateLimitErrorRetries: 0
      opencode-go/qwen3.7-plus:
        RateLimitErrorRetries: 0
      opencode-go/qwen3.8-flash:
        RateLimitErrorRetries: 0
      opencode-go/qwen3.8-max:
        RateLimitErrorRetries: 0
    # Every Go model shares one weighted allowance, so all of them fail over to
    # MiniMax M3 on its own plan, and MiniMax M3 to its Go-hosted copy. Fallbacks
    # chain (a fallback's own fallbacks are tried) and LiteLLM skips a model group it
    # has already tried for the request, so the M3 pair cannot loop.
    fallbacks:
      - opencode-go/deepseek-v4-flash: ["minimax/MiniMax-M3"]
      - opencode-go/deepseek-v4-flash-vision-exp: ["minimax/MiniMax-M3"]
      - opencode-go/deepseek-v4-pro: ["minimax/MiniMax-M3"]
      - opencode-go/deepseek-v4.1-flash: ["minimax/MiniMax-M3"]
      - opencode-go/glm-5.2: ["minimax/MiniMax-M3"]
      - opencode-go/glm-5.3: ["minimax/MiniMax-M3"]
      - opencode-go/glm-5.3-flash: ["minimax/MiniMax-M3"]
      - opencode-go/gpt-6-luna: ["minimax/MiniMax-M3"]
      - opencode-go/grok-4.7: ["minimax/MiniMax-M3"]
      - opencode-go/hy3: ["minimax/MiniMax-M3"]
      - opencode-go/hy4-preview: ["minimax/MiniMax-M3"]
      - opencode-go/kimi-k2.7-code: ["minimax/MiniMax-M3"]
      - opencode-go/kimi-k3: ["minimax/MiniMax-M3"]
      - opencode-go/longcat-2.0: ["minimax/MiniMax-M3"]
      - opencode-go/mimo-v2.6-flash: ["minimax/MiniMax-M3"]
      - opencode-go/mimo-v2.6-pro: ["minimax/MiniMax-M3"]
      - opencode-go/minimax-m2.7: ["minimax/MiniMax-M3"]
      - opencode-go/minimax-m3: ["minimax/MiniMax-M3"]
      - opencode-go/qwen3.7-plus: ["minimax/MiniMax-M3"]
      - opencode-go/qwen3.8-flash: ["minimax/MiniMax-M3"]
      - opencode-go/qwen3.8-max: ["minimax/MiniMax-M3"]
      - minimax/MiniMax-M3: ["opencode-go/minimax-m3"]
      - minimax/MiniMax-M3.1-Flash-Preview: ["minimax/MiniMax-M3"]
    # Only where the target has a larger context window: a request that overflows a
    # 1M model overflows the 1M target too. While this list is set, a context error
    # on a model not listed here is returned as-is, not sent to the fallbacks above.
    context_window_fallbacks:
      - opencode-go/gpt-6-luna: ["minimax/MiniMax-M3"]
      - opencode-go/grok-4.7: ["minimax/MiniMax-M3"]
      - opencode-go/hy3: ["minimax/MiniMax-M3"]
      - opencode-go/kimi-k2.7-code: ["minimax/MiniMax-M3"]
      - opencode-go/minimax-m2.7: ["minimax/MiniMax-M3"]
      - minimax/MiniMax-M2-7: ["minimax/MiniMax-M3"]
      - minimax/MiniMax-M2-7-anthropic: ["minimax/MiniMax-M3"]
  litellmSettings:
    success_callback:
      - prometheus
    prometheus_adapter: true
    # Opt-in per request (`cache: {use-cache: true}`): it served no hits as an
    # always-on cache, and a Redis error then sits on every request's path.
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      mode: default_off
    drop_params: true
    merge_reasoning_content_in_choices: true
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: litellm-dragonfly.ai.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm
          key: LITELLM_MASTER_KEY
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2.5Gi
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 18
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames:
      - litellm.janpuc.com
    parentRefs:
      - name: envoy-external
        namespace: network
