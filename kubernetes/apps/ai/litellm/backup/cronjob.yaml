---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-pgdump
spec:
  # Away from dawarich's 03:15 dump and from Kopiur's 03:00-04:30 verification
  # window; the next two-hourly snapshot of the dump volume picks it up.
  schedule: "10 1 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pgdump
              # The cluster's own image, so pg_dump matches the server.
              image: ghcr.io/cloudnative-pg/postgresql:19.0-standard-bookworm
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  # A dump killed mid-write leaves a .part file the retention below never matches.
                  rm -f /dumps/litellm-*.dump.part
                  out="/dumps/litellm-$(date -u +%Y%m%dT%H%MZ).dump"
                  pg_dump --format=custom --no-owner --dbname="$DATABASE_URL" --file="$out.part"
                  mv "$out.part" "$out"
                  ls -1t /dumps/litellm-*.dump | tail -n +8 | xargs -r rm -f --
                  ls -lh /dumps
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: litellm-postgres-app
                      key: uri
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: litellm-pgdump
