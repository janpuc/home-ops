---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aether-fleet
spec:
  dependsOn:
    - name: grafana
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/ai/aether-fleet/app
  postBuild:
    substitute:
      APP: aether-fleet
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
