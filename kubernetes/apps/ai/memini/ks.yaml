---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memini
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/park
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
  interval: 1h
  # Temporary park while the PVC moves storage class (no zeroscaler here):
  # main stays at 0 and the daily fsck CronJob (which mounts the data volume) is suspended until the rebuilt volume is verified.
  patches:
    - target:
        kind: HelmRelease
        name: memini
      patch: |-
        - op: replace
          path: /spec/values/controllers/main/replicas
          value: 0
        - op: add
          path: /spec/values/controllers/fsck/cronjob/suspend
          value: true
  path: ./kubernetes/apps/ai/memini/app
  postBuild:
    substitute:
      APP: memini
      KOPIUR_COPYMETHOD: Direct
      KOPIUR_STORAGECLASS: miroir-fast-local
      KOPIUR_MOVER_UID: "1000"
      KOPIUR_MOVER_GID: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
