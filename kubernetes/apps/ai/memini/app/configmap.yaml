---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memini-keys-template
data:
  keys.yaml: |-
    keys:
      # Humans: one admin key per person (memini docs: guides/access-control.md).
      # Interactive clients on the laptop (Claude Code, Codex, opencode) and the
      # UI. The tool is recorded per memory by the plugins (metadata.source).
      - name: jan
        hash: "{{ index . "MEMINI_API_KEY_jan" | sha256sum }}"
        home: personal/jan
        admin: true
      # Always-on workstation running agent sessions: non-admin, revocable on
      # its own without touching the laptop's key.
      - name: aether
        hash: "{{ index . "MEMINI_API_KEY_aether" | sha256sum }}"
        home: personal/jan
      # Unattended agents: non-admin.
      - name: hermes-main
        hash: "{{ index . "MEMINI_API_KEY_hermes-main" | sha256sum }}"
        home: personal/jan
        default_namespace: homelab/hermes
        settings:
          recall_limit: 8
      - name: hermes-home
        hash: "{{ index . "MEMINI_API_KEY_hermes-home" | sha256sum }}"
        home: personal/jan
        default_namespace: homelab/home-assistant
        settings:
          capture_turns: false
          session_digest: false
          recall_limit: 5
      - name: hermes-k8s
        hash: "{{ index . "MEMINI_API_KEY_hermes-k8s" | sha256sum }}"
        home: personal/jan
        default_namespace: homelab/home-ops
        settings:
          capture_turns: false
          session_digest: false
          recall_limit: 6
      - name: hermes-aether
        hash: "{{ index . "MEMINI_API_KEY_hermes-aether" | sha256sum }}"
        home: personal/jan
        default_namespace: homelab/aether
        settings:
          capture_turns: false
          session_digest: false
          recall_limit: 6
