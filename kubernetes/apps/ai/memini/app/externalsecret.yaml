---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini-secret
    template:
      data:
        LITELLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
  dataFrom:
    - extract:
        key: memini
    - extract:
        key: litellm
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memini-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: memini-keys
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: memini-keys-template
            items:
              - key: keys.yaml
  dataFrom:
    - extract:
        key: memini
