---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: memini-litellm
spec:
  # Fact extraction on Haiku 5.5 (Anthropic API credit), capped weekly at LiteLLM's list
  # prices. The Go model and MiniMax M3.1 Flash are listed for LiteLLM's fallback from
  # Haiku and count at their list price.
  keyAlias: memini
  models:
    - anthropic/claude-haiku-5-5
    - opencode-go/deepseek-v4.1-flash
    - minimax/MiniMax-M3.1-Flash
  maxBudget: "15"
  budgetDuration: 7d
  proxyRef: litellm
  secretName: memini-litellm
  secretKey: LITELLM_API_KEY
