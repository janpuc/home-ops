---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memini
spec:
  chartRef:
    kind: OCIRepository
    name: memini
  interval: 30m
  values:
    controllers:
      main:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          main:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_CLIENT_DEFAULTS: '{"inject_briefing_pinned":10,"inject_briefing_max_tok":3000,"recall_limit":5,"inject_recall_max_tok":400}'
              MEMINI_DEDUP_SIMILARITY: "0.80"
              MEMINI_DEDUP_TIERS: semantic,procedural
              MEMINI_DEDUP_LLM_MERGE: "true"
              MEMINI_SHORT_TERM_CAP: "300"
              MEMINI_DEMOTE_AFTER: 1440h
              MEMINI_EMBED_BASE_URL: http://bge-embedding-m3.ai.svc.cluster.local:8080/v1
              MEMINI_EMBED_MODEL: bge-m3
              MEMINI_EMBED_DIMS: "1024"
              MEMINI_EMBED_MAX_CONCURRENCY: "2"
              MEMINI_LOG_FORMAT: json
              MEMINI_LLM_API: openai
              MEMINI_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MEMINI_LLM_MODEL: opencode-go/glm-5.2
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: LITELLM_API_KEY
              MEMINI_TOMBSTONE_TTL: 720h
              MEMINI_WRITE_EMBED_TIMEOUT: "30s"
              MEMINI_RECALL_EMBED_TIMEOUT: "10s"
              MEMINI_RERANK: http://bge-reranker-v2-m3.ai.svc.cluster.local:8080/v1
              MEMINI_RERANK_MODEL: bge-reranker-v2-m3
              MEMINI_RERANK_POOL: "10"
              MEMINI_RERANK_MAX_DOC_CHARS: "1024"
              MEMINI_RERANK_MAX_BATCH_CHARS: "48000"
              MEMINI_RERANK_TIMEOUT: "10s"
              MEMINI_RERANK_MIN_SCORE: "0"
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      fsck:
        enabled: true
        cronjob:
          schedule: "0 5 * * *"
        containers:
          fsck:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini-secret
                    key: MEMINI_API_KEY
    persistence:
      data:
        existingClaim: memini
    route:
      ui:
        enabled: true
        annotations:
          gatus.home-operations.com/enabled: "false"
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - memini.janpuc.com
    serviceMonitor:
      main:
        enabled: true
    grafanaDashboards:
      enabled: true
      folder: ai
