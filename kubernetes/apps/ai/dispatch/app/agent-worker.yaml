---
apiVersion: dispatch.janpuc.com/v1alpha1
kind: Agent
metadata:
  name: worker
spec:
  description: >-
    Execution agent the guardian delegates scoped tasks to. Runs MiniMax M3
    through the litellm anthropic endpoint, so its token spend never touches
    the Claude subscription window.
  runner:
    image: ghcr.io/janpuc/dispatch-runner:main@sha256:2cd3af547ad0821a09cd86c9e2f83325c44e95dccb462dd5451d7dd33ea5fb17
    cli: claude
    credentialsRef:
      name: dispatch-minimax
  models:
    session: minimax/MiniMax-M3-anthropic
  workspaceRef:
    name: homeops-worker
  serviceAccountName: dispatch-agent-readonly
  git:
    author: "Dispatch Worker <worker@dispatch.janpuc.com>"
    pushBranches:
      - dispatch/*
  budgets:
    maxConcurrentSessions: 1
    perSession:
      maxTurns: 60
      timeout: 30m
    daily:
      maxSessions: 40
