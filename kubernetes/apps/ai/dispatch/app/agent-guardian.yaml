---
apiVersion: dispatch.janpuc.com/v1alpha1
kind: Agent
metadata:
  name: guardian
spec:
  description: >-
    Watch officer for the homelab. Investigates firing alerts with read-only
    cluster access and a home-ops checkout, proposes fixes as dispatch/*
    branches, and delegates bulk work to MiniMax-backed worker sessions.
    Never merges, never mutates the cluster.
  runner:
    image: ghcr.io/janpuc/dispatch-runner:main@sha256:16ad54c8014b26cbef4c501b00f3c84458bb717b4183f60de337f0b12013fd4d
    cli: claude
    credentialsRef:
      name: claude-max-primary
  models:
    session: claude-opus-5
    triage: claude-haiku-4-5
  workspaceRef:
    name: homeops
  serviceAccountName: dispatch-agent-coordinator
  git:
    author: "Guardian <guardian@dispatch.janpuc.com>"
    pushBranches:
      - dispatch/*
  budgets:
    maxConcurrentSessions: 1
    perSession:
      maxTurns: 80
      timeout: 45m
    daily:
      maxSessions: 20
      maxCostUSD: 15
    subscriptionWindowReserve: "0.25"
