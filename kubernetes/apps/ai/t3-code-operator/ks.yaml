---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: t3-code-operator
spec:
  dependsOn:
    - name: litellm
      namespace: ai
    - name: memini
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/t3-code-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
