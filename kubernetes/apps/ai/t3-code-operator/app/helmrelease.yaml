---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: t3-code-operator
spec:
  chartRef:
    kind: OCIRepository
    name: t3-code-operator
  interval: 15m
  install:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: 3
  values:
    operator:
      image:
        repository: ghcr.io/janpuc/t3-code-operator
        tag: ""
        digest: sha256:13770f1801e728c95ecddac1daa09348d524ef080fc1ee63bd3c6093a296a6b1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    smb:
      image:
        repository: ghcr.io/janpuc/t3-code-smbd
        tag: ""
        digest: sha256:7ab81d952b6addf8042f305bc6784b365803ba986c502e8b35b22bebd7b49778
    rbac:
      secretResourceNames:
        - t3-code-config
        - t3-code-git-signing
