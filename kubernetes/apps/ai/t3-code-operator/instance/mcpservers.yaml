---
apiVersion: t3code.janpuc.com/v1alpha1
kind: MCPServer
metadata:
  name: koment
spec:
  config:
    command: koment
    args:
      - mcp
      - --write
---
apiVersion: t3code.janpuc.com/v1alpha1
kind: MCPServer
metadata:
  name: memini
spec:
  config:
    url: http://memini.ai.svc.cluster.local:8080/mcp
  bearerTokenSecretRef:
    name: t3-code-config
    key: MEMINI_API_KEY
  headers:
    - name: X-Memini-Home
      value: personal/jan
---
apiVersion: t3code.janpuc.com/v1alpha1
