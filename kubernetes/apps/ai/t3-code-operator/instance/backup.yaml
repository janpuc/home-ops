---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: t3-code-data
  annotations:
    kopiur.home-operations.com/allow-identity-change: "true"
spec:
  copyMethod: Direct
  errorHandling:
    ignoreDirErrors: true
    ignoreFileErrors: true
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepDaily: 7
    keepHourly: 24
    keepMonthly: 6
    keepWeekly: 4
  sources:
    - pvc:
        name: t3-code-data
  verification:
    quick:
      schedule:
        cron: H 3 * * *
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: t3-code-data
spec:
  policyRef:
    name: t3-code-data
  schedule:
    cron: H */2 * * *
