---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ${APP}
spec:
  values:
    controllers:
      ${APP}:
        containers:
          app:
            env:
              # The component advertises the ClusterIP name, which only pods can dial. Point
              # peers at the internal-gateway route instead: hermes-aether lives outside the
              # cluster and the A2A client follows the agent card's transport over whatever
              # URL it was configured with, so the card has to carry a reachable address.
              A2A_PUBLIC_URL: https://hermes-a2a.janpuc.com
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-matrix
                    key: API_SERVER_KEY
              # remove after nousresearch/hermes-agent#109089 lands in the running image
              HERMES_CONCURRENT_TOOL_TIMEOUT_S: "3600"
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_OIDC_ISSUER: https://id.janpuc.com
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes.janpuc.com
              MATRIX_E2EE_MODE: optional
            envFrom:
              - secretRef:
                  name: ${APP}-matrix
              - secretRef:
                  name: ${APP}-oidc-credentials
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
          # Alertmanager -> Hermes bridge; see alert-relay.py in the configmap. The bearer
          # Alertmanager holds, the key this signs with and the secret the webhook route
          # checks are all one field, so no end can be rotated out from under the others.
          alertrelay:
            image:
              repository: docker.io/library/python
              tag: 3.14-alpine@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01
            command:
              - python3
              - /run/agent/alert-relay.py
            env:
              RELAY_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-webhook
                    key: HERMES_WEBHOOK_TOKEN
              WEBHOOK_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-webhook
                    key: HERMES_WEBHOOK_TOKEN
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8645
                  periodSeconds: 30
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.137.0@sha256:57ac684d44deb6fa94317b3e8f3e128dd7fb897fffd95b4efcd16f56ce607971
            args:
              - --auth
              - none
              - --user-data-dir
              - /opt/data/.vscode
              - --extensions-dir
              - /opt/data/.vscode
              - --port
              - "12321"
              - /opt/data
            env:
              GH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-matrix
                    key: GH_TOKEN
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        ports:
          api:
            port: 8642
          codeserver:
            port: 12321
          dashboard:
            port: 9119
          alertrelay:
            port: 8645
    route:
      app:
        hostnames:
          - hermes.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9119
      # The webhook relay for callers outside the cluster: aether's t3-approver posts its
      # escalations to /hook/t3-approval here, bearer-checked and HMAC-signed by the relay.
      hooks:
        hostnames:
          - hermes-hooks.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 8645
      a2a:
        hostnames:
          - hermes-a2a.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 9900
      codeserver:
        hostnames:
          - hermes-code.janpuc.com
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 12321
    persistence:
      agent-config:
        advancedMounts:
          ${APP}:
            alertrelay:
              - path: /run/agent
      data:
        advancedMounts:
          ${APP}:
            codeserver:
              - path: /opt/data
