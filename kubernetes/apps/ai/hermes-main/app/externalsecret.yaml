---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-main-matrix
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-main-matrix
    creationPolicy: Owner
    template:
      data:
        API_SERVER_KEY: "{{ .API_SERVER_KEY }}"
        GH_TOKEN: "{{ .GH_TOKEN }}"
        MATRIX_HOMESERVER: "{{ .MATRIX_HOMESERVER }}"
        MATRIX_USER_ID: "{{ .MATRIX_USER_ID }}"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_ACCESS_TOKEN }}"
        MATRIX_ALLOWED_USERS: "{{ .MATRIX_ALLOWED_USERS }}"
        MATRIX_ALLOWED_ROOMS: "{{ .MATRIX_ROOM_CLUSTER }},{{ .MATRIX_ROOM_ASSISTANT }},{{ .MATRIX_ROOM_HOME }},{{ .MATRIX_ROOM_NOTIFY }},{{ .MATRIX_ROOM_ALERTS }},{{ .MATRIX_ROOM_DIGEST }},{{ .MATRIX_ROOM_INBOX }},{{ .MATRIX_ROOM_DEV }},{{ .MATRIX_ROOM_DM }}"
        MATRIX_HOME_ROOM: "{{ .MATRIX_ROOM_NOTIFY }}"
        MATRIX_HOME_ROOM_NAME: "Hermes · Notify"
        MATRIX_HOME_CHANNEL: "{{ .MATRIX_ROOM_NOTIFY }}"
        MATRIX_HOME_CHANNEL_NAME: "Hermes · Notify"
        MATRIX_ROOM_CLUSTER: "{{ .MATRIX_ROOM_CLUSTER }}"
        MATRIX_ROOM_ASSISTANT: "{{ .MATRIX_ROOM_ASSISTANT }}"
        MATRIX_ROOM_HOME: "{{ .MATRIX_ROOM_HOME }}"
        MATRIX_ROOM_NOTIFY: "{{ .MATRIX_ROOM_NOTIFY }}"
        MATRIX_ROOM_ALERTS: "{{ .MATRIX_ROOM_ALERTS }}"
        MATRIX_ROOM_DIGEST: "{{ .MATRIX_ROOM_DIGEST }}"
        MATRIX_ROOM_INBOX: "{{ .MATRIX_ROOM_INBOX }}"
        MATRIX_ROOM_DEV: "{{ .MATRIX_ROOM_DEV }}"
        MATRIX_ROOM_DM: "{{ .MATRIX_ROOM_DM }}"
  dataFrom:
    - extract:
        key: hermes
    - extract:
        key: hermes-rooms
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-main-config
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-main-config-secret
    creationPolicy: Owner
    template:
      templateFrom:
        - configMap:
            name: hermes-main-config-template
            items:
              - key: agent.yaml
  dataFrom:
    - extract:
        key: hermes-rooms
    - extract:
        key: hermes-a2a
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-main-webhook
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-main-webhook
    creationPolicy: Owner
    template:
      data:
        # The only copy of the Alertmanager webhook token on this side: the relay checks
        # the bearer against it and signs with it, and Alertmanager reads the same field
        # through alertmanager-secret. It stays out of hermes-main-secret so rotating it
        # does not touch the A2A token the other agents share through the component.
        HERMES_WEBHOOK_TOKEN: "{{ .HERMES_WEBHOOK_TOKEN }}"
  dataFrom:
    - extract:
        key: hermes-a2a
