---
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: claude-code
spec:
  service: true
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: claude-code
    spec:
      serviceAccountName: claude-code
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap
          image: docker.io/library/node:22-bookworm
          command: ["/bin/sh", "/opt/claude-code/bootstrap.sh"]
          env:
            - name: HOME
              value: /home/agent
            - name: CLAUDE_CODE_VERSION
              # renovate: datasource=github-releases depName=anthropics/claude-code extractVersion=^v(?<version>.+)$
              value: "2.1.240"
            - name: GH_CLI_VERSION
              # renovate: datasource=github-releases depName=cli/cli extractVersion=^v(?<version>.+)$
              value: "2.98.0"
            - name: KOMENT_CLI_VERSION
              # renovate: datasource=github-releases depName=koment-dev/koment extractVersion=^v(?<version>.+)$
              value: "3.1.5"
            - name: KUBECTL_VERSION
              # renovate: datasource=github-releases depName=kubernetes/kubernetes extractVersion=^v(?<version>.+)$
              value: "1.36.3"
            - name: FLUX_CLI_VERSION
              # renovate: datasource=github-releases depName=fluxcd/flux2 extractVersion=^v(?<version>.+)$
              value: "2.9.4"
            - name: GO_VERSION
              # renovate: datasource=golang-version depName=golang
              value: "1.27.0"
            - name: OPENCODE_VERSION
              # renovate: datasource=npm depName=opencode-ai
              value: "1.18.21"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: nas
              mountPath: /nas
            - name: bootstrap
              mountPath: /opt/claude-code
              readOnly: true
      containers:
        - name: workbench
          image: docker.io/library/node:22-bookworm
          command: ["/bin/sh", "/opt/claude-code/run-native.sh"]
          workingDir: /workspace
          env:
            - name: HOME
              value: /home/agent
            - name: NPM_CONFIG_PREFIX
              value: /home/agent/.npm-global
            - name: MEMINI_BASE_URL
              value: http://memini.ai.svc.cluster.local:8080
            - name: MEMINI_NAMESPACE_PREFIX
              value: homelab
            - name: PATH
              value: /home/agent/.local/bin:/home/agent/.local/go/bin:/home/agent/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          envFrom:
            - secretRef:
                name: claude-code-secret
          ports:
            - name: otel
              containerPort: 9464
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: workspace
              mountPath: /workspace
            - name: nas
              mountPath: /nas
            - name: bootstrap
              mountPath: /opt/claude-code
              readOnly: true
            - name: signing
              mountPath: /etc/claude-code/signing
              readOnly: true
        - name: t3serve
          image: docker.io/library/node:22-bookworm
          command: ["/bin/sh", "/opt/claude-code/run-t3.sh"]
          env:
            - name: HOME
              value: /home/agent
          envFrom:
            - secretRef:
                name: claude-code-secret
          ports:
            - name: t3
              containerPort: 7333
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: workspace
              mountPath: /workspace
            - name: nas
              mountPath: /nas
            - name: bootstrap
              mountPath: /opt/claude-code
              readOnly: true
        - name: agents-bridge
          image: docker.io/library/node:22-bookworm
          command: ["python3", "/opt/claude-code/agents-bridge.py"]
          envFrom:
            - secretRef:
                name: claude-code-secret
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: nas
              mountPath: /nas
            - name: bootstrap
              mountPath: /opt/claude-code
              readOnly: true
        - name: alert-intake
          image: docker.io/library/node:22-bookworm
          command: ["python3", "/opt/claude-code/alert-intake.py"]
          ports:
            - name: alerts
              containerPort: 9096
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: nas
              mountPath: /nas
            - name: bootstrap
              mountPath: /opt/claude-code
              readOnly: true
        - name: codeserver
          # renovate: datasource=docker depName=ghcr.io/coder/code-server
          image: ghcr.io/coder/code-server:4.133.0
          args:
            - --auth
            - none
            - --bind-addr
            - 0.0.0.0:8443
            - --disable-telemetry
            - /nas
          env:
            - name: HOME
              value: /home/agent
          ports:
            - name: http
              containerPort: 8443
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: workspace
              mountPath: /workspace
            - name: nas
              mountPath: /nas
      volumes:
        - name: bootstrap
          configMap:
            name: claude-code-bootstrap
        - name: signing
          secret:
            secretName: claude-code-signing
            defaultMode: 288
        - name: nas
          nfs:
            server: bigmouth.internal
            path: /mnt/Vault/AI
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: workspace
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
