---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./rbac.yaml
  - ./sandbox.yaml
  - ./httproute.yaml
  - ./podmonitor.yaml
  - ./grafanadashboard.yaml
  - ./dashboard
configMapGenerator:
  - name: agents-scripts
    files:
      - ./scripts/bootstrap.sh
      - ./scripts/orchestrator.sh
      - ./scripts/queue-loop.sh
      - ./scripts/queue-finish.py
      - ./scripts/surface-t3.sh
      - ./scripts/intake-alerts.py
      - ./scripts/bridge-matrix.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
