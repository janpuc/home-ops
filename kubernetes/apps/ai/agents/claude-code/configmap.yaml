---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-code-bootstrap
data:
  bootstrap.sh: |-
    #!/bin/sh
    set -eu
    BIN="$HOME/.local/bin"
    mkdir -p "$BIN" "$HOME/.npm-global"
    installed="$("$BIN/claude" --version 2>/dev/null | cut -d" " -f1 || true)"
    if [ "$installed" != "$CLAUDE_CODE_VERSION" ]; then
      curl -fsSL "https://downloads.claude.ai/claude-code-releases/${CLAUDE_CODE_VERSION}/linux-x64/claude" -o "$BIN/claude.partial"
      chmod 755 "$BIN/claude.partial"
      mv "$BIN/claude.partial" "$BIN/claude"
    fi
    if ! [ -x "$HOME/.npm-global/bin/t3" ]; then
      npm install --global --prefix "$HOME/.npm-global" t3@latest
    fi
    ghinstalled="$("$BIN/gh" --version 2>/dev/null | head -1 | cut -d" " -f3 || true)"
    if [ "$ghinstalled" != "$GH_CLI_VERSION" ]; then
      curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp
      install -m 755 "/tmp/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" "$BIN/gh"
      rm -rf "/tmp/gh_${GH_CLI_VERSION}_linux_amd64"
    fi
    if ! [ "$(cat "$BIN/.koment-version" 2>/dev/null)" = "$KOMENT_CLI_VERSION" ]; then
      curl -fsSL "https://github.com/koment-dev/koment/releases/download/v${KOMENT_CLI_VERSION}/koment_${KOMENT_CLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp koment
      install -m 755 /tmp/koment "$BIN/koment"
      rm -f /tmp/koment
      printf %s "$KOMENT_CLI_VERSION" > "$BIN/.koment-version"
    fi
    if ! [ "$(cat "$BIN/.kubectl-version" 2>/dev/null)" = "$KUBECTL_VERSION" ]; then
      curl -fsSL "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$BIN/kubectl.partial"
      chmod 755 "$BIN/kubectl.partial"
      mv "$BIN/kubectl.partial" "$BIN/kubectl"
      printf %s "$KUBECTL_VERSION" > "$BIN/.kubectl-version"
    fi
    if ! [ "$(cat "$BIN/.flux-version" 2>/dev/null)" = "$FLUX_CLI_VERSION" ]; then
      curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_CLI_VERSION}/flux_${FLUX_CLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp flux
      install -m 755 /tmp/flux "$BIN/flux"
      rm -f /tmp/flux
      printf %s "$FLUX_CLI_VERSION" > "$BIN/.flux-version"
    fi
    git config --global user.name >/dev/null 2>&1 || git config --global user.name "janpuc"
    git config --global user.email >/dev/null 2>&1 || git config --global user.email "janpuc@proton.me"
    git config --global credential.helper >/dev/null 2>&1 || git config --global credential.helper "!$BIN/gh auth git-credential"
    if ! git config --global gpg.format >/dev/null 2>&1; then
      git config --global gpg.format ssh
      git config --global user.signingkey /etc/claude-code/signing/id_ed25519
      git config --global commit.gpgsign true
    fi
    if [ "${AGENT_PROFILE:-coordinator}" = "worker" ] && ! [ -f "$HOME/.claude/settings.json" ]; then
      mkdir -p "$HOME/.claude"
      cat > "$HOME/.claude/settings.json" <<'SETTINGS'
    {
      "env": {
        "ANTHROPIC_BASE_URL": "http://litellm.ai:4000",
        "ANTHROPIC_MODEL": "minimax/MiniMax-M3-anthropic",
        "ANTHROPIC_SMALL_FAST_MODEL": "minimax/MiniMax-M2-7-anthropic",
        "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
        "DISABLE_TELEMETRY": "1"
      },
      "apiKeyHelper": "/bin/sh -c \"echo $LITELLM_API_KEY\""
    }
    SETTINGS
    fi
    if ! [ -d "$HOME/.claude/plugins/marketplaces/memini" ]; then
      "$BIN/claude" plugin marketplace add eleboucher/memini || echo "[bootstrap] memini marketplace add failed (non-fatal)"
    fi
    if ! grep -qs "memini@memini" "$HOME/.claude/plugins/installed_plugins.json"; then
      "$BIN/claude" plugin install memini@memini || echo "[bootstrap] memini plugin install failed (non-fatal)"
    fi
    if [ -d /nas ]; then
      mkdir -p /nas/queue/backlog /nas/queue/claimed /nas/queue/review /nas/queue/done /nas/roles /nas/repos /nas/worktrees /nas/logs
      if ! [ -f /nas/roles/cluster-guardian.md ]; then
        cat > /nas/roles/cluster-guardian.md <<'ROLE'
    Role: cluster-guardian

    You are the cluster guardian for the home-ops Kubernetes cluster. An
    Alertmanager alert triggered this run. Your job: triage it, resolve it if
    that is safely within your power, and leave a clear result note.

    Rules, in order:
    1. Diagnose first with read-only commands (kubectl get/describe/logs,
       flux get). State the evidence before acting.
    2. You may: delete stuck pods, patch workload annotations for rollout
       restarts, annotate Flux resources to reconcile or retry.
    3. You must NEVER: remove node taints (miroir's storage-wedged taint is
       protective), scale or delete stateful workloads during storage
       degradation, delete PVCs or Sandboxes (their PVCs cascade), or touch
       anything in the kopiur, miroir-system, or flux-system namespaces
       beyond reads and reconcile annotations.
    4. A wedged-storage alert means: report and stop. The fix is a human
       hard power reset. Say so in the result.
    5. If the root cause looks like a miroir bug, write an evidence pack
       (timestamps, log excerpts, resource states) suitable for a fork
       issue. Facts only, no drafted prose.
    6. End the result with: what happened, what you did, what remains for
       the human.
    ROLE
      fi
      if ! [ -f /nas/roles/pr-review.md ]; then
        cat > /nas/roles/pr-review.md <<'ROLE'
    Role: pr-review

    You review pull requests on janpuc's repositories (home-ops, koment,
    and others). Produce a per-PR risk report with a recommended merge
    order. You never merge, push, or approve - report only. For home-ops,
    agent-coupled components (ai namespace bridges) always merge last.
    ROLE
      fi
    fi
    "$BIN/claude" --version
  run-native.sh: |-
    #!/bin/sh
    set -u
    PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
    export PATH
    /bin/sh /opt/claude-code/run-guardian.sh &
    cd /workspace
    export CLAUDE_CODE_ENABLE_TELEMETRY=1
    export OTEL_METRICS_EXPORTER=prometheus
    while true; do
      claude remote-control || true
      sleep 30
    done
  run-guardian.sh: |-
    #!/bin/sh
    set -u
    PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
    export PATH
    QUEUE=/nas/queue
    ROLE=/nas/roles/cluster-guardian.md
    LOGS=/nas/logs/guardian
    mkdir -p "$QUEUE/backlog" "$QUEUE/claimed/coordinator" "$QUEUE/done" "$LOGS"
    cd /workspace
    while true; do
      task=$(ls "$QUEUE/backlog" 2>/dev/null | head -1)
      if [ -n "$task" ]; then
        mv "$QUEUE/backlog/$task" "$QUEUE/claimed/coordinator/$task" 2>/dev/null || continue
        ts=$(date -u +%Y%m%dT%H%M%SZ)
        jsonl="$LOGS/${task%.md}-$ts.jsonl"
        err="$LOGS/${task%.md}-$ts.stderr"
        start=$(date +%s)
        {
          cat "$ROLE" 2>/dev/null
          printf "\n\nTask:\n\n"
          cat "$QUEUE/claimed/coordinator/$task"
        } | claude -p --verbose --output-format stream-json > "$jsonl" 2> "$err"
        rc=$?
        cat "$jsonl"
        python3 /opt/claude-code/guardian-finish.py "$task" "$jsonl" "$err" "$rc" "$start" > "$QUEUE/done/${task%.md}.result.md" || true
        mv "$QUEUE/claimed/coordinator/$task" "$QUEUE/done/$task" 2>/dev/null || true
      fi
      sleep 30
    done
  guardian-finish.py: |-
    """Close out one guardian run: extract the result, update run metrics.

    Reads the stream-json transcript, prints the final result text to stdout
    (which the loop redirects into the queue's .result.md), and folds the
    run's cost/token/duration numbers into metrics.json for the intake
    /metrics endpoint. A run with a nonzero exit or an empty result counts
    as a failure, and the result note then carries the stderr tail so silent
    failures leave a visible trace instead of an empty file.
    """
    import json
    import os
    import sys
    import time

    task, jsonl, err, rc, start = (
        sys.argv[1],
        sys.argv[2],
        sys.argv[3],
        int(sys.argv[4]),
        int(sys.argv[5]),
    )
    METRICS = "/nas/logs/guardian/metrics.json"

    result_text = ""
    cost = 0.0
    tokens_in = 0
    tokens_out = 0
    try:
        with open(jsonl) as f:
            for line in f:
                try:
                    d = json.loads(line)
                except ValueError:
                    continue
                if d.get("type") == "result":
                    result_text = d.get("result") or ""
                    cost = float(d.get("total_cost_usd") or 0)
                    usage = d.get("usage") or {}
                    tokens_in = int(usage.get("input_tokens") or 0)
                    tokens_out = int(usage.get("output_tokens") or 0)
    except OSError:
        pass

    failed = rc != 0 or not result_text.strip()

    try:
        with open(METRICS) as f:
            m = json.load(f)
    except (OSError, ValueError):
        m = {}
    m["runs_total"] = m.get("runs_total", 0) + 1
    m["failures_total"] = m.get("failures_total", 0) + (1 if failed else 0)
    m["tokens_input_total"] = m.get("tokens_input_total", 0) + tokens_in
    m["tokens_output_total"] = m.get("tokens_output_total", 0) + tokens_out
    m["cost_usd_total"] = round(m.get("cost_usd_total", 0.0) + cost, 6)
    m["last_run_timestamp"] = int(time.time())
    m["last_run_duration_seconds"] = int(time.time()) - start
    tmp = METRICS + ".partial"
    with open(tmp, "w") as f:
        json.dump(m, f)
    os.rename(tmp, METRICS)

    if failed:
        print(f"GUARDIAN RUN FAILED (exit {rc}) for {task}")
        print(f"Transcript: {jsonl}")
        try:
            with open(err) as f:
                tail = f.read()[-2000:]
            if tail.strip():
                print("\nstderr tail:\n")
                print(tail)
        except OSError:
            pass
    else:
        print(result_text)
  alert-intake.py: |-
    """Turn Alertmanager webhook posts into guardian queue tasks.

    One task per Alertmanager GROUP, never per alert: the route groups by
    alertname/cluster/job, and a single incident (like a storage wedge) can
    fan out into 100+ alert fingerprints that all share one root cause.
    Task identity is the hash of the groupKey, deduped across every queue
    state, so a still-firing group never spawns a second task while the
    first is anywhere in flight. Resolved-only notifications are ignored on
    purpose. Fail-open HTTP 200 always - Alertmanager retries on non-2xx
    and a poison payload must not wedge the receiver.
    """
    import hashlib
    import json
    import os
    import re
    from http.server import BaseHTTPRequestHandler, HTTPServer

    QUEUE = "/nas/queue"
    METRICS = "/nas/logs/guardian/metrics.json"
    MAX_LISTED = 20


    def render_metrics():
        lines = []
        for state, sub in (
            ("backlog", "backlog"),
            ("claimed", "claimed/coordinator"),
            ("review", "review"),
            ("done", "done"),
        ):
            root = os.path.join(QUEUE, sub)
            try:
                count = len([n for n in os.listdir(root) if n.endswith(".md")])
            except OSError:
                count = 0
            lines.append(f'agents_queue_tasks{{state="{state}"}} {count}')
        try:
            with open(METRICS) as f:
                m = json.load(f)
        except (OSError, ValueError):
            m = {}
        lines.append(f"agents_guardian_runs_total {m.get('runs_total', 0)}")
        lines.append(f"agents_guardian_failures_total {m.get('failures_total', 0)}")
        lines.append(
            f'agents_guardian_tokens_total{{type="input"}} {m.get("tokens_input_total", 0)}'
        )
        lines.append(
            f'agents_guardian_tokens_total{{type="output"}} {m.get("tokens_output_total", 0)}'
        )
        lines.append(f"agents_guardian_cost_usd_total {m.get('cost_usd_total', 0.0)}")
        lines.append(
            f"agents_guardian_last_run_timestamp_seconds {m.get('last_run_timestamp', 0)}"
        )
        lines.append(
            f"agents_guardian_last_run_duration_seconds {m.get('last_run_duration_seconds', 0)}"
        )
        return "\n".join(lines) + "\n"


    def seen(group_id):
        for state in ("backlog", "claimed/coordinator", "review", "done"):
            root = os.path.join(QUEUE, state)
            if not os.path.isdir(root):
                continue
            for name in os.listdir(root):
                if group_id in name:
                    return True
        return False


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.rstrip("/") == "/metrics":
                body = render_metrics().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.end_headers()
                self.wfile.write(body)
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            try:
                raw = self.rfile.read(int(self.headers.get("Content-Length", 0)))
                payload = json.loads(raw)
                firing = [a for a in payload.get("alerts", []) if a.get("status") == "firing"]
                if not firing:
                    raise ValueError("nothing firing")
                group_id = hashlib.sha256(
                    payload.get("groupKey", "nokey").encode()
                ).hexdigest()[:12]
                if seen(group_id):
                    raise ValueError("group already queued")
                name = payload.get("commonLabels", {}).get("alertname") or firing[0].get(
                    "labels", {}
                ).get("alertname", "unknown")
                slug = re.sub(r"[^A-Za-z0-9_-]", "-", name)[:40]
                os.makedirs(os.path.join(QUEUE, "backlog"), exist_ok=True)
                path = os.path.join(QUEUE, "backlog", f"alert-{slug}-{group_id}.md")
                tmp = path + ".partial"
                with open(tmp, "w") as f:
                    f.write(f"Alert group: {name} ({len(firing)} firing)\n\n")
                    f.write("role: cluster-guardian\n\nCommon labels:\n\n")
                    for k, v in sorted(payload.get("commonLabels", {}).items()):
                        f.write(f"- {k}: {v}\n")
                    f.write("\nCommon annotations:\n\n")
                    for k, v in sorted(payload.get("commonAnnotations", {}).items()):
                        f.write(f"- {k}: {v}\n")
                    f.write("\nMember alerts:\n\n")
                    for alert in firing[:MAX_LISTED]:
                        labels = alert.get("labels", {})
                        detail = ", ".join(
                            f"{k}={v}"
                            for k, v in sorted(labels.items())
                            if k not in payload.get("commonLabels", {})
                        )
                        f.write(f"- {detail or 'identical to common labels'}\n")
                    if len(firing) > MAX_LISTED:
                        f.write(f"- ... and {len(firing) - MAX_LISTED} more\n")
                    f.write(f"\nstartsAt: {firing[0].get('startsAt', '')}\n")
                os.rename(tmp, path)
            except Exception:
                pass
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass


    HTTPServer(("0.0.0.0", 9096), Handler).serve_forever()
