---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-code-bootstrap
data:
  bootstrap.sh: |-
    #!/bin/sh
    set -eu
    BIN="$HOME/.local/bin"
    mkdir -p "$BIN" "$HOME/.npm-global"
    installed="$("$BIN/claude" --version 2>/dev/null | cut -d" " -f1 || true)"
    if [ "$installed" != "$CLAUDE_CODE_VERSION" ]; then
      curl -fsSL "https://downloads.claude.ai/claude-code-releases/${CLAUDE_CODE_VERSION}/linux-x64/claude" -o "$BIN/claude.partial"
      chmod 755 "$BIN/claude.partial"
      mv "$BIN/claude.partial" "$BIN/claude"
    fi
    if ! [ -x "$HOME/.npm-global/bin/t3" ]; then
      npm install --global --prefix "$HOME/.npm-global" t3@latest
    fi
    if ! [ "$("$HOME/.npm-global/bin/opencode" --version 2>/dev/null)" = "$OPENCODE_VERSION" ]; then
      npm install --global --prefix "$HOME/.npm-global" "opencode-ai@$OPENCODE_VERSION"
    fi
    if ! [ -f "$HOME/.config/opencode/opencode.json" ]; then
      mkdir -p "$HOME/.config/opencode"
      cat > "$HOME/.config/opencode/opencode.json" <<'OCCFG'
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "LiteLLM",
          "options": {
            "baseURL": "http://litellm.ai:4000/v1",
            "apiKey": "{env:LITELLM_API_KEY}"
          },
          "models": {
            "minimax/MiniMax-M3": {},
            "opencode-go/glm-5.2": {},
            "opencode-go/deepseek-v4-flash-vision-exp": {},
            "opencode-go/hy3": {}
          }
        }
      }
    }
    OCCFG
    fi
    ghinstalled="$("$BIN/gh" --version 2>/dev/null | head -1 | cut -d" " -f3 || true)"
    if [ "$ghinstalled" != "$GH_CLI_VERSION" ]; then
      curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp
      install -m 755 "/tmp/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" "$BIN/gh"
      rm -rf "/tmp/gh_${GH_CLI_VERSION}_linux_amd64"
    fi
    if ! [ "$(cat "$BIN/.koment-version" 2>/dev/null)" = "$KOMENT_CLI_VERSION" ]; then
      curl -fsSL "https://github.com/koment-dev/koment/releases/download/v${KOMENT_CLI_VERSION}/koment_${KOMENT_CLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp koment
      install -m 755 /tmp/koment "$BIN/koment"
      rm -f /tmp/koment
      printf %s "$KOMENT_CLI_VERSION" > "$BIN/.koment-version"
    fi
    if ! [ "$(cat "$BIN/.kubectl-version" 2>/dev/null)" = "$KUBECTL_VERSION" ]; then
      curl -fsSL "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$BIN/kubectl.partial"
      chmod 755 "$BIN/kubectl.partial"
      mv "$BIN/kubectl.partial" "$BIN/kubectl"
      printf %s "$KUBECTL_VERSION" > "$BIN/.kubectl-version"
    fi
    if ! [ "$(cat "$BIN/.flux-version" 2>/dev/null)" = "$FLUX_CLI_VERSION" ]; then
      curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_CLI_VERSION}/flux_${FLUX_CLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp flux
      install -m 755 /tmp/flux "$BIN/flux"
      rm -f /tmp/flux
      printf %s "$FLUX_CLI_VERSION" > "$BIN/.flux-version"
    fi
    if ! [ "$(cat "$HOME/.local/.go-version" 2>/dev/null)" = "$GO_VERSION" ]; then
      curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
      rm -rf "$HOME/.local/go"
      tar -xz -C "$HOME/.local" -f /tmp/go.tgz
      rm -f /tmp/go.tgz
      printf %s "$GO_VERSION" > "$HOME/.local/.go-version"
    fi
    git config --global user.name >/dev/null 2>&1 || git config --global user.name "janpuc"
    git config --global user.email >/dev/null 2>&1 || git config --global user.email "janpuc@proton.me"
    git config --global credential.helper >/dev/null 2>&1 || git config --global credential.helper "!$BIN/gh auth git-credential"
    if ! git config --global gpg.format >/dev/null 2>&1; then
      git config --global gpg.format ssh
      git config --global user.signingkey /etc/claude-code/signing/id_ed25519
      git config --global commit.gpgsign true
    fi
    if [ "${AGENT_PROFILE:-coordinator}" = "worker" ] && ! [ -f "$HOME/.claude/settings.json" ]; then
      mkdir -p "$HOME/.claude"
      cat > "$HOME/.claude/settings.json" <<'SETTINGS'
    {
      "env": {
        "ANTHROPIC_BASE_URL": "http://litellm.ai:4000",
        "ANTHROPIC_MODEL": "minimax/MiniMax-M3-anthropic",
        "ANTHROPIC_SMALL_FAST_MODEL": "minimax/MiniMax-M2-7-anthropic",
        "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
        "DISABLE_TELEMETRY": "1"
      },
      "apiKeyHelper": "/bin/sh -c \"echo $LITELLM_API_KEY\""
    }
    SETTINGS
    fi
    if ! [ -d "$HOME/.claude/plugins/marketplaces/memini" ]; then
      "$BIN/claude" plugin marketplace add eleboucher/memini || echo "[bootstrap] memini marketplace add failed (non-fatal)"
    fi
    if ! grep -qs "memini@memini" "$HOME/.claude/plugins/installed_plugins.json"; then
      "$BIN/claude" plugin install memini@memini || echo "[bootstrap] memini plugin install failed (non-fatal)"
    fi
    if [ -d /nas ]; then
      mkdir -p /nas/queue/backlog /nas/queue/claimed /nas/queue/review /nas/queue/done /nas/roles /nas/repos /nas/worktrees /nas/logs
      if ! [ -f /nas/roles/cluster-guardian.md ]; then
        cat > /nas/roles/cluster-guardian.md <<'ROLE'
    Role: cluster-guardian

    You are the cluster guardian for the home-ops Kubernetes cluster. An
    Alertmanager alert triggered this run. Your job: triage it, resolve it if
    that is safely within your power, and leave a clear result note.

    Rules, in order:
    1. Diagnose first with read-only commands (kubectl get/describe/logs,
       flux get). State the evidence before acting.
    2. You may: delete stuck pods, patch workload annotations for rollout
       restarts, annotate Flux resources to reconcile or retry.
    3. You must NEVER: remove node taints (miroir's storage-wedged taint is
       protective), scale or delete stateful workloads during storage
       degradation, delete PVCs or Sandboxes (their PVCs cascade), or touch
       anything in the kopiur, miroir-system, or flux-system namespaces
       beyond reads and reconcile annotations.
    4. A wedged-storage alert means: report and stop. The fix is a human
       hard power reset. Say so in the result.
    5. If the root cause looks like a miroir bug, write an evidence pack
       (timestamps, log excerpts, resource states) suitable for a fork
       issue. Facts only, no drafted prose.
    6. End the result with: what happened, what you did, what remains for
       the human.

    Access note: kubectl and flux read commands in your allowlist run
    without approval. Probe with kubectl get nodes, never kubectl version.
    If a command is denied, say which exact command and proceed with the
    allowed ones.

    Model policy: routine runs use opus. Critical-severity alerts arrive
    pre-marked "model: fable". If a routine run hits the limit of what you
    can untangle, end the result with a single line "ESCALATE: requeue with
    model: fable" so a deeper run can be dispatched.
    ROLE
      fi
      if ! [ -f /nas/roles/guardian-permissions.json ]; then
        cat > /nas/roles/guardian-permissions.json <<'PERMS'
    {
      "permissions": {
        "allow": [
          "Bash(kubectl get:*)",
          "Bash(kubectl describe:*)",
          "Bash(kubectl logs:*)",
          "Bash(kubectl top:*)",
          "Bash(kubectl events:*)",
          "Bash(kubectl auth can-i:*)",
          "Bash(kubectl annotate:*)",
          "Bash(kubectl delete pod:*)",
          "Bash(kubectl rollout:*)",
          "Bash(flux get:*)",
          "Bash(flux reconcile:*)",
          "Bash(flux suspend:*)",
          "Bash(flux resume:*)",
          "Bash(kubectl version:*)",
          "Bash(kubectl api-resources:*)",
          "Bash(kubectl explain:*)",
          "Bash(flux stats:*)",
          "Bash(flux version:*)",
          "Bash(git:*)",
          "Bash(go build:*)",
          "Bash(go test:*)",
          "Bash(go vet:*)",
          "Bash(go mod:*)",
          "Bash(gofmt:*)",
          "Bash(gh repo clone:*)",
          "Bash(gh pr create:*)",
          "Bash(gh pr view:*)",
          "Bash(gh pr list:*)",
          "Edit",
          "Write"
        ],
        "additionalDirectories": ["/nas"]
      }
    }
    PERMS
      fi
      if ! [ -f /nas/roles/miroir-dev.md ]; then
        cat > /nas/roles/miroir-dev.md <<'ROLE'
    Role: miroir-dev

    You develop on Janek's miroir fork: github.com/janpuc/miroir. This
    cluster runs that fork (chart oci://ghcr.io/janpuc/charts/miroir), so
    every fix you land ships here through his pipeline.

    Workflow:
    1. Clone or fetch the fork under /nas/repos/miroir; create a worktree
       under /nas/worktrees/coordinator/<branch> and work there.
    2. Branch names: fix/<short-topic>. Never commit to main, never push
       main. Commits are signed automatically by your git config.
    3. Reproduce understanding before changing code: read the relevant
       reconciler paths, cite file:line evidence in your notes.
    4. go build ./... and go test ./... must pass before you push. Go is
       at $HOME/.local/go/bin.
    5. Push the branch to the fork and open a DRAFT pull request against
       the fork's main with gh pr create --draft --repo janpuc/miroir.
       The PR body: evidence first (timestamps, log excerpts, resource
       states), then the fix rationale. Janek reviews and merges.
    6. Cluster interaction is read-only diagnosis. Never kubectl apply,
       never touch miroir-system beyond reads. Deployment is Janek's
       pipeline, not yours.
    7. End the result with: branch name, PR URL, test output tail, and
       what remains for the human.
    ROLE
      fi
      if ! [ -f /nas/roles/pr-review.md ]; then
        cat > /nas/roles/pr-review.md <<'ROLE'
    Role: pr-review

    You review pull requests on janpuc's repositories (home-ops, koment,
    and others). Produce a per-PR risk report with a recommended merge
    order. You never merge, push, or approve - report only. For home-ops,
    agent-coupled components (ai namespace bridges) always merge last.
    ROLE
      fi
    fi
    "$BIN/claude" --version
  run-native.sh: |-
    #!/bin/sh
    set -u
    PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
    export PATH
    /bin/sh /opt/claude-code/run-guardian.sh &
    cd /workspace
    export CLAUDE_CODE_ENABLE_TELEMETRY=1
    export OTEL_METRICS_EXPORTER=prometheus
    while true; do
      claude remote-control || true
      sleep 30
    done
  run-guardian.sh: |-
    #!/bin/sh
    set -u
    PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
    export PATH
    QUEUE=/nas/queue
    LOGS=/nas/logs/guardian
    mkdir -p "$QUEUE/backlog" "$QUEUE/claimed/coordinator" "$QUEUE/done" "$LOGS"
    for stranded in "$QUEUE/claimed/coordinator"/*.md; do
      [ -f "$stranded" ] && mv "$stranded" "$QUEUE/backlog/" 2>/dev/null
    done
    cd /workspace
    while true; do
      task=$(ls "$QUEUE/backlog" 2>/dev/null | head -1)
      if [ -n "$task" ]; then
        mv "$QUEUE/backlog/$task" "$QUEUE/claimed/coordinator/$task" 2>/dev/null || continue
        ts=$(date -u +%Y%m%dT%H%M%SZ)
        jsonl="$LOGS/${task%.md}-$ts.jsonl"
        err="$LOGS/${task%.md}-$ts.stderr"
        start=$(date +%s)
        model=$(sed -n "s/^model: //p" "$QUEUE/claimed/coordinator/$task" | head -1)
        [ -z "$model" ] && model=opus
        rolename=$(sed -n "s/^role: //p" "$QUEUE/claimed/coordinator/$task" | head -1)
        ROLE="/nas/roles/${rolename:-cluster-guardian}.md"
        [ -f "$ROLE" ] || ROLE=/nas/roles/cluster-guardian.md
        {
          cat "$ROLE" 2>/dev/null
          printf "\n\nTask:\n\n"
          cat "$QUEUE/claimed/coordinator/$task"
        } | claude -p --verbose --output-format stream-json --model "$model" --settings /nas/roles/guardian-permissions.json > "$jsonl" 2> "$err"
        rc=$?
        cat "$jsonl"
        python3 /opt/claude-code/guardian-finish.py "$task" "$jsonl" "$err" "$rc" "$start" > "$QUEUE/done/${task%.md}.result.md"
        finishrc=$?
        if [ "$finishrc" = "42" ]; then
          rm -f "$QUEUE/done/${task%.md}.result.md"
          mv "$QUEUE/claimed/coordinator/$task" "$QUEUE/backlog/$task" 2>/dev/null || true
          sleep 1800
        else
          mv "$QUEUE/claimed/coordinator/$task" "$QUEUE/done/$task" 2>/dev/null || true
        fi
      fi
      sleep 30
    done
  guardian-finish.py: |-
    """Close out one guardian run: extract the result, update run metrics.

    Reads the stream-json transcript, prints the final result text to stdout
    (which the loop redirects into the queue's .result.md), and folds the
    run's cost/token/duration numbers into metrics.json for the intake
    /metrics endpoint. A run with a nonzero exit or an empty result counts
    as a failure, and the result note then carries the stderr tail so silent
    failures leave a visible trace instead of an empty file.
    """
    import json
    import os
    import sys
    import time

    task, jsonl, err, rc, start = (
        sys.argv[1],
        sys.argv[2],
        sys.argv[3],
        int(sys.argv[4]),
        int(sys.argv[5]),
    )
    METRICS = "/nas/logs/guardian/metrics.json"

    result_text = ""
    cost = 0.0
    tokens_in = 0
    tokens_out = 0
    rate_limited = False
    try:
        with open(jsonl) as f:
            for line in f:
                try:
                    d = json.loads(line)
                except ValueError:
                    continue
                if d.get("type") == "rate_limit_event":
                    rate_limited = True
                if d.get("type") == "result":
                    result_text = d.get("result") or ""
                    cost = float(d.get("total_cost_usd") or 0)
                    usage = d.get("usage") or {}
                    tokens_in = int(usage.get("input_tokens") or 0)
                    tokens_out = int(usage.get("output_tokens") or 0)
    except OSError:
        pass

    failed = rc != 0 or not result_text.strip()
    if "session limit" in result_text.lower():
        failed = True

    try:
        with open(METRICS) as f:
            m = json.load(f)
    except (OSError, ValueError):
        m = {}
    m["runs_total"] = m.get("runs_total", 0) + 1
    m["failures_total"] = m.get("failures_total", 0) + (1 if failed and not rate_limited else 0)
    m["tokens_input_total"] = m.get("tokens_input_total", 0) + tokens_in
    m["tokens_output_total"] = m.get("tokens_output_total", 0) + tokens_out
    m["cost_usd_total"] = round(m.get("cost_usd_total", 0.0) + cost, 6)
    m["last_run_timestamp"] = int(time.time())
    m["last_run_duration_seconds"] = int(time.time()) - start
    tmp = METRICS + ".partial"
    with open(tmp, "w") as f:
        json.dump(m, f)
    os.rename(tmp, METRICS)

    if failed and rate_limited:
        print(f"RATE LIMITED for {task}; requeued for retry after backoff")
        sys.exit(42)
    if failed:
        print(f"GUARDIAN RUN FAILED (exit {rc}) for {task}")
        print(f"Transcript: {jsonl}")
        try:
            with open(err) as f:
                tail = f.read()[-2000:]
            if tail.strip():
                print("\nstderr tail:\n")
                print(tail)
        except OSError:
            pass
    else:
        print(result_text)
  run-t3.sh: |-
    #!/bin/sh
    set -u
    PATH="$HOME/.local/bin:$HOME/.npm-global/bin:$PATH"
    export PATH
    cd /workspace
    while true; do
      t3 serve --host 0.0.0.0 --port 7333 --no-browser --auto-bootstrap-project-from-cwd /workspace || true
      sleep 10
    done
  agents-bridge.py: |-
    """Matrix bridge: Janek's guidance interface to the agents queue.

    Commands in the room (anyone but the bot's own account):
      !g <text>    queue a cluster-guardian task
      !dev <text>  queue a miroir-dev task on fable
      !pr <text>   queue a pr-review task
      !fable <cmd> <text>  force fable for any of the above (!fable g ...)
      !queue       reply with queue state
    Results are posted back to the room as they land in done/, truncated
    with the full path for code-server. The since token and seen-results
    state live on the NAS so pod restarts neither replay old commands nor
    repost old results. Failures never crash the loop - the bridge is a
    convenience, the queue files remain the source of truth.
    """
    import json
    import os
    import re
    import threading
    import time
    import urllib.parse
    import urllib.request

    HS = os.environ["MATRIX_HOMESERVER"].rstrip("/")
    TOKEN = os.environ["MATRIX_ACCESS_TOKEN"]
    ROOM = os.environ["AGENTS_ROOM"]
    QUEUE = "/nas/queue"
    STATE = "/nas/logs/bridge"
    ROLES = {"g": ("cluster-guardian", None), "dev": ("miroir-dev", "fable"), "pr": ("pr-review", None)}


    def api(path, data=None, method=None, timeout=40):
        req = urllib.request.Request(
            HS + path,
            data=json.dumps(data).encode() if data is not None else None,
            headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"},
            method=method,
        )
        return json.loads(urllib.request.urlopen(req, timeout=timeout).read())


    def send(text):
        try:
            txn = f"agents-{time.time_ns()}"
            api(
                f"/_matrix/client/v3/rooms/{urllib.parse.quote(ROOM)}/send/m.room.message/{txn}",
                {"msgtype": "m.notice", "body": text},
                method="PUT",
            )
        except Exception:
            pass


    def queue_state():
        parts = []
        for state, sub in (("backlog", "backlog"), ("claimed", "claimed/coordinator"), ("done", "done")):
            try:
                names = sorted(n for n in os.listdir(os.path.join(QUEUE, sub)) if n.endswith(".md") and not n.endswith(".result.md"))
            except OSError:
                names = []
            parts.append(f"{state} ({len(names)}): " + (", ".join(names[:6]) or "-"))
        return "\n".join(parts)


    def handle(body):
        m = re.match(r"!(fable\s+)?(g|dev|pr|queue)\s*(.*)", body, re.S)
        if not m:
            return
        force_fable, cmd, text = bool(m.group(1)), m.group(2), m.group(3).strip()
        if cmd == "queue":
            send(queue_state())
            return
        if not text:
            send(f"!{cmd} needs a task description")
            return
        role, model = ROLES[cmd]
        if force_fable:
            model = "fable"
        name = f"manual-mx-{time.strftime('%Y%m%dT%H%M%S')}.md"
        os.makedirs(os.path.join(QUEUE, "backlog"), exist_ok=True)
        path = os.path.join(QUEUE, "backlog", name)
        with open(path + ".partial", "w") as f:
            f.write(f"Task from Matrix\n\nrole: {role}\n")
            if model:
                f.write(f"model: {model}\n")
            f.write(f"\n{text}\n")
        os.rename(path + ".partial", path)
        send(f"queued {name} (role {role}{', model ' + model if model else ''})")


    def results_watcher():
        os.makedirs(STATE, exist_ok=True)
        seen_path = os.path.join(STATE, "seen-results.txt")
        try:
            seen = set(open(seen_path).read().split())
        except OSError:
            seen = set()
        if not seen:
            try:
                seen = {n for n in os.listdir(os.path.join(QUEUE, "done")) if n.endswith(".result.md")}
                open(seen_path, "w").write("\n".join(sorted(seen)))
            except OSError:
                pass
        while True:
            try:
                for name in sorted(os.listdir(os.path.join(QUEUE, "done"))):
                    if not name.endswith(".result.md") or name in seen:
                        continue
                    body = open(os.path.join(QUEUE, "done", name)).read()
                    head = body[:1500] + ("\n[...truncated]" if len(body) > 1500 else "")
                    send(f"result: {name}\n\n{head}\n\nfull: /nas/queue/done/{name}")
                    seen.add(name)
                    open(seen_path, "w").write("\n".join(sorted(seen)))
            except Exception:
                pass
            time.sleep(30)


    def main():
        me = api("/_matrix/client/v3/account/whoami")["user_id"]
        threading.Thread(target=results_watcher, daemon=True).start()
        os.makedirs(STATE, exist_ok=True)
        since_path = os.path.join(STATE, "since.txt")
        since = ""
        try:
            since = open(since_path).read().strip()
        except OSError:
            pass
        while True:
            try:
                qs = f"timeout=30000&filter=" + urllib.parse.quote(json.dumps({"room": {"rooms": [ROOM], "timeline": {"limit": 20}}}))
                if since:
                    qs += "&since=" + urllib.parse.quote(since)
                resp = api("/_matrix/client/v3/sync?" + qs, timeout=60)
                new_since = resp.get("next_batch", "")
                first_sync = not since
                for ev in ((resp.get("rooms", {}).get("join", {}).get(ROOM, {}) or {}).get("timeline", {}) or {}).get("events", []):
                    if first_sync or ev.get("sender") == me or ev.get("type") != "m.room.message":
                        continue
                    body = (ev.get("content") or {}).get("body") or ""
                    if body.startswith("!"):
                        handle(body)
                since = new_since
                open(since_path, "w").write(since)
            except Exception:
                time.sleep(10)


    main()
  alert-intake.py: |-
    """Turn Alertmanager webhook posts into guardian queue tasks.

    One task per Alertmanager GROUP, never per alert: the route groups by
    alertname/cluster/job, and a single incident (like a storage wedge) can
    fan out into 100+ alert fingerprints that all share one root cause.
    Task identity is the hash of the groupKey, deduped across every queue
    state, so a still-firing group never spawns a second task while the
    first is anywhere in flight. Resolved-only notifications are ignored on
    purpose. Fail-open HTTP 200 always - Alertmanager retries on non-2xx
    and a poison payload must not wedge the receiver.
    """
    import hashlib
    import json
    import os
    import re
    from http.server import BaseHTTPRequestHandler, HTTPServer

    QUEUE = "/nas/queue"
    METRICS = "/nas/logs/guardian/metrics.json"
    MAX_LISTED = 20


    def render_metrics():
        lines = []
        for state, sub in (
            ("backlog", "backlog"),
            ("claimed", "claimed/coordinator"),
            ("review", "review"),
            ("done", "done"),
        ):
            root = os.path.join(QUEUE, sub)
            try:
                count = len([n for n in os.listdir(root) if n.endswith(".md")])
            except OSError:
                count = 0
            lines.append(f'agents_queue_tasks{{state="{state}"}} {count}')
        try:
            with open(METRICS) as f:
                m = json.load(f)
        except (OSError, ValueError):
            m = {}
        lines.append(f"agents_guardian_runs_total {m.get('runs_total', 0)}")
        lines.append(f"agents_guardian_failures_total {m.get('failures_total', 0)}")
        lines.append(
            f'agents_guardian_tokens_total{{type="input"}} {m.get("tokens_input_total", 0)}'
        )
        lines.append(
            f'agents_guardian_tokens_total{{type="output"}} {m.get("tokens_output_total", 0)}'
        )
        lines.append(f"agents_guardian_cost_usd_total {m.get('cost_usd_total', 0.0)}")
        lines.append(
            f"agents_guardian_last_run_timestamp_seconds {m.get('last_run_timestamp', 0)}"
        )
        lines.append(
            f"agents_guardian_last_run_duration_seconds {m.get('last_run_duration_seconds', 0)}"
        )
        return "\n".join(lines) + "\n"


    def seen(group_id):
        for state in ("backlog", "claimed/coordinator", "review", "done"):
            root = os.path.join(QUEUE, state)
            if not os.path.isdir(root):
                continue
            for name in os.listdir(root):
                if group_id in name:
                    return True
        return False


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.rstrip("/") == "/metrics":
                body = render_metrics().encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.end_headers()
                self.wfile.write(body)
            else:
                self.send_response(404)
                self.end_headers()

        def do_POST(self):
            try:
                raw = self.rfile.read(int(self.headers.get("Content-Length", 0)))
                payload = json.loads(raw)
                firing = [a for a in payload.get("alerts", []) if a.get("status") == "firing"]
                if not firing:
                    raise ValueError("nothing firing")
                group_id = hashlib.sha256(
                    payload.get("groupKey", "nokey").encode()
                ).hexdigest()[:12]
                if seen(group_id):
                    raise ValueError("group already queued")
                name = payload.get("commonLabels", {}).get("alertname") or firing[0].get(
                    "labels", {}
                ).get("alertname", "unknown")
                slug = re.sub(r"[^A-Za-z0-9_-]", "-", name)[:40]
                os.makedirs(os.path.join(QUEUE, "backlog"), exist_ok=True)
                path = os.path.join(QUEUE, "backlog", f"alert-{slug}-{group_id}.md")
                tmp = path + ".partial"
                severity = payload.get("commonLabels", {}).get("severity", "")
                with open(tmp, "w") as f:
                    f.write(f"Alert group: {name} ({len(firing)} firing)\n\n")
                    f.write("role: cluster-guardian\n")
                    if severity == "critical":
                        f.write("model: fable\n")
                    f.write("\nCommon labels:\n\n")
                    for k, v in sorted(payload.get("commonLabels", {}).items()):
                        f.write(f"- {k}: {v}\n")
                    f.write("\nCommon annotations:\n\n")
                    for k, v in sorted(payload.get("commonAnnotations", {}).items()):
                        f.write(f"- {k}: {v}\n")
                    f.write("\nMember alerts:\n\n")
                    for alert in firing[:MAX_LISTED]:
                        labels = alert.get("labels", {})
                        detail = ", ".join(
                            f"{k}={v}"
                            for k, v in sorted(labels.items())
                            if k not in payload.get("commonLabels", {})
                        )
                        f.write(f"- {detail or 'identical to common labels'}\n")
                    if len(firing) > MAX_LISTED:
                        f.write(f"- ... and {len(firing) - MAX_LISTED} more\n")
                    f.write(f"\nstartsAt: {firing[0].get('startsAt', '')}\n")
                os.rename(tmp, path)
            except Exception:
                pass
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass


    HTTPServer(("0.0.0.0", 9096), Handler).serve_forever()
