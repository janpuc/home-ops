---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: orchestrator-secret
    creationPolicy: Owner
    template:
      data:
        GH_TOKEN: "{{ .GH_TOKEN }}"
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        LITELLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
        MATRIX_HOMESERVER: "{{ .MATRIX_HOMESERVER }}"
        MATRIX_ACCESS_TOKEN: "{{ .MATRIX_ACCESS_TOKEN }}"
        AGENTS_ROOM: "{{ .MATRIX_ROOM_ASSISTANT }}"
  data:
    - secretKey: MEMINI_API_KEY
      remoteRef:
        key: memini
        property: MEMINI_API_KEY
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: hermes
    - extract:
        key: hermes-rooms
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orchestrator-signing
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: orchestrator-signing
    creationPolicy: Owner
    template:
      data:
        id_ed25519: "{{ .SSH_SIGNING_KEY }}"
  dataFrom:
    - extract:
        key: claude-code
