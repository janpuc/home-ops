---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-lan
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-lan
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter-lan
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 48Mi
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: LanProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter-lan"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
        # aether runs Pi Pocket, the agent that triages the alerts the
        # Alertmanager sends to the agent receiver. If aether or Pi Pocket
        # is down, every alert goes into the void and the only thing that
        # still works is the Pushover route, so this one pages.
        - alert: AgentHostDown
          expr: |-
            probe_success{service="blackbox-exporter-aether"} == 0
          for: 10m
          labels:
            severity: critical
            scope: agent
          annotations:
            summary: |-
              Pi Pocket on aether is not answering
            description: |-
              The probe of {{ $labels.instance }} from inside the cluster has
              failed for 10 minutes. Pi Pocket is the agent receiver, so
              alerts that should be triaged there are not being picked up,
              and aether carries the sessions that act on the cluster.
