---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-sidecar-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: GatusEndpointDown
          expr: |-
            gatus_results_endpoint_success{group=~"external|services"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint is down
          labels:
            severity: critical

        # Fires a minute before GatusEndpointDown for the external probe of the
        # same name, so the Alertmanager inhibit (equal: name) already holds
        # when that alert is first sent: one outage, one page.
        - alert: GatusLanEndpointDown
          expr: |-
            gatus_results_endpoint_success{group="lan"} == 0
          for: 4m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint is down on the LAN
          labels:
            severity: critical

        - alert: GatusEndpointExposed
          expr: |-
            gatus_results_endpoint_success{group="internal"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint has a public DNS record and is exposed
          labels:
            severity: critical
