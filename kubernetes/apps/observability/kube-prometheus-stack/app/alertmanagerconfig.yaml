---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    receiver: blackhole
    repeatInterval: 12h
    routes:
      - receiver: blackhole
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # Everything else goes to the agent, which triages it. `continue` keeps
      # the critical route below reachable, so criticals reach both the agent
      # and Pushover. Grouping by alertname + namespace keeps the same alert
      # in two namespaces in two webhooks.
      - receiver: agent
        continue: true
        repeatInterval: 24h
        groupBy:
          - alertname
          - namespace
      - receiver: pushover
        matchers:
          - name: severity
            value: critical
            matchType: =
    groupBy:
      - alertname
      - cluster
      - job
    groupInterval: 5m
    groupWait: 1m

  inhibitRules:
    - equal:
        - alertname
        - namespace
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
    # A Gatus LAN probe that is down (e.g. name `home-assistant`, group `lan`)
    # explains the failing external probe of the same name, so one outage
    # pages once.
    - equal:
        - name
      sourceMatch:
        - name: alertname
          value: GatusLanEndpointDown
          matchType: =
      targetMatch:
        - name: alertname
          value: GatusEndpointDown
          matchType: =
        - name: group
          value: external
          matchType: =
    # aether down explains why the deliveries to the agent receiver fail,
    # so one outage pages once. The other way round (the host answers but
    # the receiver does not take alerts) still pages the delivery alert.
    - equal:
        - scope
      sourceMatch:
        - name: alertname
          value: AgentHostDown
          matchType: =
      targetMatch:
        - name: alertname
          value: AlertmanagerAgentDeliveryFailing
          matchType: =

  receivers:
    - name: blackhole
    # Pi Pocket, Jan's agent on aether. The hook URL (with its own token)
    # stays in the secret, so nothing lands in git.
    - name: agent
      webhookConfigs:
        - maxAlerts: 20
          sendResolved: true
          urlSecret:
            name: alertmanager-secret
            key: PI_POCKET_HOOK_URL
    - name: pushover
      pushoverConfigs:
        - html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          monospace: false
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sendResolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: alertmanager-secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: alertmanager-secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
