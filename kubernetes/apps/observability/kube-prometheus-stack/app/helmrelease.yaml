---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      route:
        main:
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/description: Alertmanager for Prometheus alerts
            gethomepage.dev/group: Observability
            gethomepage.dev/icon: mdi-alert-octagram
            gethomepage.dev/name: Alertmanager
            gethomepage.dev/pod-selector: app.kubernetes.io/name=alertmanager
            gethomepage.dev/weight: "10"
          enabled: true
          hostnames:
            - alertmanager.janpuc.com
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.janpuc.com
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 96Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/description: Prometheus monitoring system
            gethomepage.dev/group: Observability
            gethomepage.dev/icon: si-prometheus
            gethomepage.dev/name: Prometheus
            gethomepage.dev/widget.type: prometheus
            gethomepage.dev/widget.url: "http://prometheus-operated.observability.svc.cluster.local:9090"
            gethomepage.dev/pod-selector: app.kubernetes.io/name=prometheus
            gethomepage.dev/weight: "10"
          enabled: true
          hostnames:
            - prometheus.janpuc.com
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.janpuc.com
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 300m
            memory: 2048Mi
          limits:
            memory: 5120Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi
    prometheusOperator:
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 48Mi
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 96Mi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 96Mi
      extraArgs:
        - --collector.amdgpu
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          dashboards: grafana
    additionalPrometheusRulesMap:
      amd-gpu-rules:
        groups:
          - name: amd-gpu-memory
            interval: 30s
            rules:
              - record: node:amd_gtt_free_bytes
                expr: |
                  node_amdgpu_gpu_memory_total_bytes{type="gtt"}
                    - node_amdgpu_gpu_memory_used_bytes{type="gtt"}
              - record: node:amd_vram_free_bytes
                expr: |
                  node_amdgpu_gpu_memory_total_bytes{type="vram"}
                    - node_amdgpu_gpu_memory_used_bytes{type="vram"}
              - record: node:effective_mem_available_bytes
                expr: |
                  node_memory_MemAvailable_bytes
                    + on(instance) node_amdgpu_gpu_memory_total_bytes{type="gtt"}
                    - on(instance) node_amdgpu_gpu_memory_used_bytes{type="gtt"}
              - alert: AmdGttRunningLow
                expr: node:amd_gtt_free_bytes < 2 * 1024^3
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: "AMD iGPU GTT free < 2 GiB on {{ $labels.instance }}"
                  description: |
                    Only {{ $value | humanize1024 }}B of GTT (shared system RAM used by
                    the AMD iGPU) is free. With a Vulkan/ROCm workload pulling buffer
                    sizes this large, you are close to the point where kubelet can no
                    longer see the pressure. Node {{ $labels.instance }}.
              - alert: AmdGttCritical
                expr: node:amd_gtt_free_bytes < 1 * 1024^3
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "AMD iGPU GTT free < 1 GiB on {{ $labels.instance }}"
                  description: |
                    Critical: only {{ $value | humanize1024 }}B of GTT left. GPU work
                    on this node is starving other workloads of memory that kubelet
                    cannot see. Expect cascading OOMs on the same node very soon.
              - alert: NodeEffectiveMemoryLow
                expr: node:effective_mem_available_bytes < 2.5 * 1024^3
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: "Effective memory low on {{ $labels.instance }} ({{ $value | humanize1024 }}B)"
                  description: |
                    cgroup-reclaimable memory + free GTT combined is below 2.5 GiB on
                    {{ $labels.instance }}. Consider draining the GTT workload.
              - alert: NodeKernelMemoryPressureHigh
                expr: |
                  (
                    node_memory_MemAvailable_bytes
                      / on(instance) node_memory_MemTotal_bytes
                  ) < 0.08
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "MemAvailable < 8 % on {{ $labels.instance }}"
                  description: |
                    Node {{ $labels.instance }} has <8% cgroup-visible memory free.
                    OOMKilled fires are imminent. Check which pods on this node are
                    drawing the most.
              - alert: AmdGpuCollectorMissing
                expr: absent(node_amdgpu_gpu_memory_total_bytes{type="gtt"})
                for: 5m
                labels:
                  severity: warning
                  description: "Re-apply node-exporter extraArgs in kube-prometheus-stack HelmRelease."
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
