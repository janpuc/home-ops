---
# yaml-language-server: $schema=https://prometheus-operator.dev/doc/api/v1/#monitoring.coreos.com/v1.PrometheusRule
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: miroir-pool-watch
spec:
  groups:
    - name: miroir-system.pool
      interval: 30s
      rules:
        - alert: MiroirPoolFilling
          expr: miroir_pool_allocated_bytes / miroir_pool_capacity_bytes > 0.6
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Miroir pool past 60% allocated on {{ $labels.node }} ({{ $labels.pool }})"
            description: >-
              Every volume is provisioned with three diskful replicas, so each
              node carries a full copy and the thin pool grows on all three at
              once. Watch for the chart's MiroirPoolUsageHigh (80%, 15m) to fire
              next. Current usage: {{ $value | humanizePercentage }}.
    - name: miroir-system.agent
      interval: 30s
      rules:
        - alert: MiroirAgentReconcileStuck
          expr: >-
            sum by (node, controller) (
              rate(controller_runtime_reconcile_errors_total{job="miroir-system/miroir"}[15m])
            ) > 0
          for: 2h
          labels:
            severity: critical
          annotations:
            summary: "Miroir {{ $labels.controller }} stuck retrying on {{ $labels.node }}"
            description: >-
              The agent has failed the same reconcile continuously for two
              hours, so whatever it is trying to apply to DRBD is being
              refused and will not clear on its own. Volumes already mounted
              keep serving, which is why nothing else alerts; the damage
              shows up only when a pod next needs to stage one and
              NodeStageVolume refuses. Read the error with `kubectl -n
              miroir-system logs -l app.kubernetes.io/name=miroir -c agent
              --tail=200 | grep 'Reconciler error'` and expect it to name a
              single volume.
