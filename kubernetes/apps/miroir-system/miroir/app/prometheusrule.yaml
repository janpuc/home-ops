---
# yaml-language-server: $schema=https://prometheus-operator.dev/doc/api/v1/#monitoring.coreos.com/v1.PrometheusRule
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: miroir-pool-watch
spec:
  groups:
    - name: miroir-system.pool
      interval: 30s
      rules:
        - alert: MiroirPoolFilling
          expr: miroir_pool_allocated_bytes / miroir_pool_capacity_bytes > 0.6
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Miroir pool past 60% allocated on {{ $labels.node }} ({{ $labels.pool }})"
            description: >-
              This node's thin pool backs every volume replica placed on it:
              single-replica (-local) volumes grow only the pool of the node
              they live on, while replicated volumes grow the pool on each of
              their diskful nodes at once. Watch for the chart's
              MiroirPoolUsageHigh (80%, 15m) to fire next. Current usage:
              {{ $value | humanizePercentage }}.
