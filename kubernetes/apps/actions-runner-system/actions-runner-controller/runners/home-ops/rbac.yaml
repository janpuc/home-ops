---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-ops-runner
---
# The rules gha-runner-scale-set grants in containerMode kubernetes (its
# kube_mode_role.yaml), which it skips because the template sets its own
# serviceAccountName. The container hooks need nothing beyond this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-ops-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-ops-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-ops-runner
subjects:
  - kind: ServiceAccount
    name: home-ops-runner
    namespace: actions-runner-system
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: home-ops-runner
spec:
  roles:
    - os:admin
