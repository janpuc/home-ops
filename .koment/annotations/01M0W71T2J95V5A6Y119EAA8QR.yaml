  title: One model backend per provider; do not cross-wire them
  body: |-
    The three enabled providers each own exactly one model backend, and that
    separation is the point rather than an accident:

    - claude -> Anthropic directly, on `CLAUDE_CODE_OAUTH_TOKEN`.
    `ANTHROPIC_BASE_URL` is deliberately unset. - codex -> OpenAI, on a ChatGPT
    device login persisted in `/data/codex`. No `model_provider` and no
    `model_providers` table. - opencode -> LiteLLM, the only provider carrying
    the MiniMax/GLM/Qwen/Kimi set.

    An earlier revision defined `[model_providers.litellm]` in this Codex config
    without selecting it, on the theory that it cost nothing and kept a switch
    one line away. It was not free. It carried `wire_api = "chat"`, which
    codex-cli 0.146 rejects outright, and because Codex fails on config *parse*,
    that broke every `codex` invocation including `t3-auth codex login` — the
    command that gives Codex its only credential. An unused convenience block
    took out the provider it was meant to help.

    So: if Codex should ever move to LiteLLM, change it deliberately and verify
    `codex login status` still runs. Do not leave an unselected provider block
    sitting here.

    `LITELLM_API_KEY` still appears in every provider's environment, and that is
    not a contradiction — it is the bearer for the LiteLLM *MCP gateway*
    (`/mcp/<alias>/mcp`), which is tool access, not model routing.
  anchor:
    scope: excerpt
    excerpt: |2-
        codex-config.toml: |-
          [mcp_servers.koment]
          command = "koment"
          args = ["mcp", "--write"]
    before: |2-
