  type: why
  title: PLEX_NO_AUTH_NETWORKS matches LB-IPAM LAN
  body: |-
    `PLEX_NO_AUTH_NETWORKS` is the home LAN CIDR Plex uses to skip the auth
    prompt for known-local clients. The CIDR must match the LAN side of
    `lbipam.cilium.io/ips: 192.168.69.60` (the cilium LB-IPAM reservation for
    this service). When the home network was previously `192.168.10.0/24` this
    entry pointed at a non-existent subnet and Plex treated every LAN client as
    remote (auth wall, Relay fallback). Renamed to `192.168.69.0/24` so it
    agrees with the LB IPAM reservation.

    **Why:** silent breakage — Plex doesn't error on a no-auth CIDR that
    doesn't match the local network, it just keeps prompting for auth. **How to
    apply:** keep the LB-IPAM IP and the no-auth CIDR in sync. If either moves,
    both must move together.
  anchor:
    scope: excerpt
    excerpt: "              PLEX_NO_AUTH_NETWORKS: 192.168.69.0/24"
