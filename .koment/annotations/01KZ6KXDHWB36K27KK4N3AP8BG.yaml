kind: gotcha
title: gluetun entrypoint strips wireguard rules to coexist with Cilium
body: |-
  gluetun's entrypoint is wrapped only to delete its own wireguard policy
  routes before starting. Those rules collide with Cilium's routing and the
  pod loses connectivity with them in place — see
  https://github.com/qdm12/gluetun/issues/2521#issuecomment-3935931910. Both
  deletes are best-effort (2>/dev/null) because they are absent on a first
  start, and the final exec must stay so gluetun keeps PID 1 and its signal
  handling.
created: "2026-08-04"
anchor:
  scope: excerpt
  excerpt: '              - "ip rule del table 51820 2>/dev/null; ip -6 rule del table 51820 2>/dev/null; exec /gluetun-entrypoint"'
  before: |2-
                command:
                  - /bin/sh
                  - -c
  after: |2-
                env:
                  DNS_UPSTREAM_RESOLVER_TYPE: plain
                  FIREWALL_INPUT_PORTS: "80,9999"
