file: kubernetes/apps/ai/hermes/app/configmap.yaml
kind: gotcha
body: |-
  cron_mode is binary: "deny" blocks every approval-gated command in a cron
  session, "approve" auto-approves ALL of them. approvals.mode: smart above
  does NOT apply to cron — approval.py::_get_cron_approval_mode only ever
  returns deny or approve. It is set to approve so scheduled jobs can actually
  act (remediate, commit, restart) instead of only reading.

  What makes that safe is the deny list immediately below, not the approval
  mode. Read that annotation before changing either.
created: "2026-08-04"
anchor:
  scope: excerpt
  excerpt: "      cron_mode: approve"
  before: |2-
        approvals:
          mode: smart
          timeout: 60
  after: |2-
          deny:
            - "*talosctl*reset*"
            - "*talosctl*wipe*"
