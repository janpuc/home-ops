spec:
  target:
    file: kubernetes/apps/ai/agents/claude-code/scripts/queue-loop.sh
  type: why
  title: "Role routes to runtime: OpenCode for triage, Claude only on escalation"
  body: |-
    P2 of the agents redesign (Janek, 2026-08-24): routine queue runs stopped
    burning the shared Max window. Routing: an explicit `runtime:` line in the
    task wins; else `model: fable|opus` or role miroir-dev selects claude (deep
    work), everything else runs on OpenCode against LiteLLM (flat-rate
    subscriptions, full catalog — fx was rejected because its auth is
    Vercel-gateway-only). The comparison that gated this
    (opencode-comparison-stuck-snapshots.result.md vs the Opus original):
    MiniMax matches Opus on mechanical diagnosis but is weaker on
    destructive-action judgment — hence exit 43 from queue-finish: an OpenCode
    run whose result says ESCALATE is requeued once with runtime claude + model
    fable (`escalated: true` marks it so it cannot loop). Exit 42 stays the
    rate-limit backoff for claude runs. Transcripts: claude runs keep
    stream-json (.jsonl), opencode runs keep plain text (.txt) — both catted
    to stdout for VictoriaLogs and closed out by queue-finish.py, which also
    counts runs per runtime for the dashboard.
  anchor:
    scope: excerpt
    excerpt: |2-
          if [ -z "$runtime" ]; then
            case "${model:-}" in
              fable|opus) runtime=claude ;;
    before: |2-
          runtime=$(sed -n "s/^runtime: //p" "$claimed" | head -1)
          ROLE="/nas/roles/${rolename:-cluster-guardian}.md"
          [ -f "$ROLE" ] || ROLE=/nas/roles/cluster-guardian.md
    after: |2-
              *) case "${rolename:-cluster-guardian}" in
                   miroir-dev) runtime=claude ;;
                   *) runtime=opencode ;;
  author:
    name: claude-code
    kind: agent
    source: session
