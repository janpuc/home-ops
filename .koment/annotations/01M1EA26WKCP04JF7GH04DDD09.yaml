spec:
  target:
    file: kubernetes/apps/kopiur-system/kopiur/repository/clusterrepository.yaml
  type: why
  title: Scratch must fit the largest volume's deep-verify restore
  body: |-
    Deep verification restores a full snapshot into this scratch PVC, so its
    capacity must cover the used data of the largest protected volume — plex
    and the Prometheus TSDB are both 50Gi. At 10Gi the monthly deep tier (`H 5 1
    * *`) failed for plex on 2026-09-01 with ENOSPC mid-restore, and there is no
    per-SnapshotPolicy scratch override in the CRD, so this global value is the
    only knob.

    60Gi is safe to overcommit: the PVC is thin-provisioned on miroir-fast-local
    and lives only for the mover run (ttlSecondsAfterFinished 300), so real pool
    usage is bounded by the bytes actually restored, not by concurrent 60Gi
    claims. Grow this alongside the largest volume, not alongside pool usage.
  anchor:
    scope: excerpt
    excerpt: |2-
          scratch:
            capacity: 60Gi
            storageClassName: miroir-fast-local
    before: |2-
          podSecurityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    after: |2-
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
