kind: why
title: GH_TOKEN mapped from HOMELAB_GH_TOKEN so a rebuilt PVC still works
body: |-
  gh reads GH_TOKEN or GITHUB_TOKEN, but the pod only exposes HOMELAB_GH_TOKEN
  (named that way to keep it out of gh's implicit reach elsewhere). Mapping it
  across here is deliberate — the alternative is depending on `gh auth
  login` state persisted on the PVC, which a rebuilt volume would silently
  lose.
created: "2026-08-04"
