  type: gotcha
  body: |-
    The coordinator account is cluster-wide `view` plus namespaced create on
    sessions, which is what lets the guardian delegate to workers. That is real
    authority in the hands of a model reading untrusted alert payloads: a prompt
    injection could make it spawn sessions. Two things bound the blast radius
    — a spawned session runs under its own agent's service account and
    budgets, not the guardian's, and every agent here is read-only toward the
    cluster — but the spend is real, so keep the worker's daily maxSessions
    honest and review `kubectl -n ai get sessions` if a bill looks wrong. Do not
    widen this account to cluster-write without revisiting that exposure.
  anchor:
    scope: excerpt
    excerpt: "  serviceAccountName: dispatch-agent-coordinator"
