spec:
  target:
    file: kubernetes/apps/ai/hermes/app/configmap.yaml
  type: why
  title: cert health judged by cert-manager renewal, not expiry window
  body: |-
    Certificate health is judged against cert-manager's own renewalTime and
    Ready condition rather than a fixed "expires within 30 days" window. These
    are 7-day certificates, so a 30-day window would fire every single week on a
    perfectly healthy cert. The question worth asking is whether cert-manager is
    keeping up, not how close expiry is.
  anchor:
    scope: excerpt
    excerpt: '            overdue = age_days(st.get("renewalTime"))'
    before: |2-
                      problems.append("<code>%s/%s</code> not Ready — %s"
                                      % (h(ns), h(name), h(reason or ready)))
                      continue
    after: |2-
                  if overdue is not None and overdue > 0:
                      problems.append("<code>%s/%s</code> renewal overdue by %.1fd"
                                      % (h(ns), h(name), overdue))
  author:
    name: claude-code
    kind: agent
    source: session
