kind: why
title: patched volume mounts app-only so the init reads pristine upstream
body: |-
  Holds the patched matrix.py that the init container produces. It is mounted
  over the site-packages copy for the app container ONLY — the init
  container needs the pristine upstream file at that path to read from, so
  mounting it for both would make the patch read its own output.

  The other three volumes split by secrecy: `config` is the ConfigMap, which
  carries the patch script and the persona template with {{ }} placeholders
  and no real room IDs, so it stays in git; `config-secret` is the
  ExternalSecret-rendered config.yaml with the private room IDs substituted
  in.
