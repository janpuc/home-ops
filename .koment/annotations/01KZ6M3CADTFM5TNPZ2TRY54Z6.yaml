spec:
  target:
    file: kubernetes/apps/ai/hermes-matrix/app/configmap.yaml
  type: invariant
  title: patch-matrix.py fails closed when anchor count drifts
  body: |-
    The patch fails closed on purpose. Requiring exactly one match per anchor
    means a base-image bump that reshapes either MessageEvent construction
    aborts the init container, and the pod never starts. The alternative —
    patching best-effort — would leave a running bot that quietly serves one
    shared persona to every room, which is far harder to notice than a pod that
    will not come up.

    Both anchored methods take room_id: str as a parameter, which is what makes
    the injected _rcp(self.config.extra, room_id) call valid at both sites.
  anchor:
    scope: excerpt
    excerpt: |2-
              count = out.count(anchor)
              if count != 1:
    before: |2-

          out = src
          for label, anchor in ANCHORS:
    after: |2-
                  sys.stderr.write(
                      "FATAL: anchor for %s matched %d times (expected exactly 1).\n"
                      "The base image changed; re-derive the patch before deploying.\n"
