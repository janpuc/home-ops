spec:
  target:
    file: kubernetes/apps/ai/t3-code/app/configmap.yaml
  type: gotcha
  title: $$ escaping keeps the bearer token out of the PVC
  body: |-
    The `$$` is not a typo and the single `$` that survives is not a literal
    token.

    Two expansions run in sequence. Flux postBuild collapses `$${...}` to
    `${...}` when it renders this Kustomization, so the ConfigMap in the cluster
    carries `${LITELLM_API_KEY}`. Claude Code then expands that itself when it
    dials the MCP server. Verified empirically against a local HTTP listener: a
    `${VAR}` in a user-scope `.claude.json` header arrives at the server as the
    resolved value, and `claude mcp get` still prints the unexpanded template.

    The point is that the LiteLLM master key is never written to disk. The
    `init-config` container jq-merges this file into
    `/data/claude-home/.claude.json` on the backed-up PVC, which is also
    snapshotted to the NAS by kopiur. A literal bearer token there would be a
    credential at rest in a backup repository.

    Writing a single `$` here would make Flux try to substitute
    `LITELLM_API_KEY` at build time, find nothing, and emit an empty header.
  anchor:
    scope: excerpt
    excerpt: |2-
              "kubectl": {
                "type": "http",
                "url": "http://litellm.ai.svc.cluster.local:4000/mcp/kubectl/mcp",
                "headers": { "Authorization": "Bearer $${LITELLM_API_KEY}" }
              },
    before: |2-
          {
            "hasCompletedOnboarding": true,
            "mcpServers": {
    after: |2-
              "prometheus": {
                "type": "http",
                "url": "http://litellm.ai.svc.cluster.local:4000/mcp/prometheus/mcp",
  author:
    name: claude-code
    kind: agent
    source: session
