  target:
    file: kubernetes/apps/ai/agents/claude/configmap.yaml
  type: why
  title: koment gets a version marker file; memini plugin failures are non-fatal
  body: |-
    koment's CLI has no stable --version output to gate on (unlike claude and
    gh), so the install is gated on a $BIN/.koment-version marker written after
    a successful install. The memini plugin steps (marketplace add from
    eleboucher/memini + plugin install) deliberately swallow failures with a
    logged warning instead of letting set -eu kill the init container: memini is
    a memory enhancement, and a GitHub outage or a plugin-CLI change must not
    make the whole workbench unschedulable. The koment MCP server needs no
    server-side auth here — repo checkouts carry .mcp.json launching `koment
    mcp --write` as local stdio against the checkout's own .koment/ directory,
    so the binary on PATH is the entire integration. memini's MCP connects to
    the in-cluster service via MEMINI_BASE_URL (the plugin appends /mcp) with
    MEMINI_API_KEY from the claude-code-secret; MEMINI_NAMESPACE_PREFIX=homelab
    mirrors the laptop's fish-hook namespace mapping so pod sessions land in the
    same memory tree.
  anchor:
    scope: excerpt
    excerpt: '    if ! [ "$(cat "$BIN/.koment-version" 2>/dev/null)" = "$KOMENT_CLI_VERSION" ]; then'
    before: |2-
            install -m 755 "/tmp/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" "$BIN/gh"
            rm -rf "/tmp/gh_${GH_CLI_VERSION}_linux_amd64"
          fi
    after: |2-
            curl -fsSL "https://github.com/koment-dev/koment/releases/download/v${KOMENT_CLI_VERSION}/koment_${KOMENT_CLI_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp koment
            install -m 755 /tmp/koment "$BIN/koment"
            rm -f /tmp/koment
