  title: pinned to v2.13.0 — the operator hard-halts on v2.14.0
  body: |-
    Held at v2.13.0 deliberately. Reverted from v2.14.0 on 2026-08-19 (PR #1211,
    merge 41c112f4) because pocket-id-operator 0.13.1 refuses to manage it:

    ERROR Pocket-id version is unsupported by this operator; halting.
    detectedVersion: 2.14.0 firstUnsupportedVersion: v2.14.0
    latestTestedVersion: v2.13.0

    The operator crash-loops by design — `haltIfUnsupportedVersion` in
    `internal/controller/instance/controller.go`. It is a guard, not a bug.

    **This image version is coupled to the operator version.** Do not raise it
    past whatever the deployed pocket-id-operator declares as
    `latestTestedVersion`. Check that first:

    kubectl -n security logs deploy/pocket-id-operator | grep
    latestTestedVersion

    **Why it slipped through.** Renovate raises the app image (this file) and
    the operator chart (../app/ocirepository.yaml) as two independent PRs. #1211
    and #1188 were each individually green — CI verifies the image pulls, and
    konflate renders each PR in isolation — so a compatibility constraint that
    only exists *between* two PRs is invisible to both checks. Merging them in
    the same batch is what broke it.

    **Blast radius when it happens:** pocket-id itself keeps serving (Deployment
    stays Ready, SSO/OIDC continues to work). What stops is the management plane
    — the operator cannot reconcile PocketIDInstance, so LDAP mapping, SMTP,
    route and user-management changes declared here silently never apply.

    Raise this again only together with an operator release that lists 2.14.x as
    tested.
