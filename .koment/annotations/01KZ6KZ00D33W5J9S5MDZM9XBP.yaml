kind: why
title: reranker flags must enable /v1/rerank or memini falls back
body: |-
  bge-reranker-v2-m3 is a BERT cross-encoder, not an embedding model.
  --reranking together with --pooling rank is what exposes the Cohere-style
  /v1/rerank endpoint that memini calls; without both, the server comes up
  healthy but memini's rerank requests fail and recall silently falls back to
  composite ordering.
created: "2026-08-04"
