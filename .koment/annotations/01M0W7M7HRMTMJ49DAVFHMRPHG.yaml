  title: Agents here commit, sign and push as a real human identity
  body: |-
    This block gives every agent on the Workstation the ability to author, sign
    and push commits that GitHub attributes to a person, not a bot. Treat it as
    a credential boundary.

    Three pieces make that work together. Commits are authored as `janpuc
    <janpuc@proton.me>`, so GitHub attributes them by email. They are signed
    with the ed25519 key from 1Password (`signingKeySecretRef`), registered on
    GitHub as the `claude-code-agent@home-ops` signing key, which is why they
    render **Verified** rather than merely claiming the identity. Pushes
    authenticate with `credentialSecretRef`, the `janpuc` PAT carrying `repo`
    scope, so they reach every repository that account can write.

    Signing every commit is deliberate. An unsigned commit from this pod would
    still be attributed to the human by email while being indistinguishable from
    a forgery, so signing is what makes the attribution meaningful. The operator
    writes the git config, the key and `allowed_signers` from the two secrets,
    so nothing can drift from what 1Password carries.

    The consequence worth stating plainly: an agent that acts on untrusted
    repository content can push signed, verified commits under a human identity.
    The signing key is separate from the human's own laptop key, so it can be
    revoked on GitHub independently without disturbing local signing. That
    separation is the containment mechanism and should be preserved.
