file: kubernetes/apps/ai/hermes-matrix/app/externalsecret.yaml
kind: why
body: |-
  A second Secret purely so the rendered config.yaml never reaches the app
  container via envFrom. "config.yaml" is not a valid env var identifier, so
  it would be skipped with a warning event on every single start if it shared
  the hermes-matrix Secret.

  Its content is assembled here rather than committed: templateFrom pulls the
  persona template out of hermes-matrix-configmap and fills the MATRIX_ROOM_*
  placeholders from the `hermes-rooms` item, so nothing room-identifying ever
  lands in git.
created: "2026-08-04"
