spec:
  target:
    file: kubernetes/apps/ai/hermes-matrix/app/helmrelease.yaml
  type: why
  title: hermes-matrix forwards into the main hermes API server
  body: |-
    This deployment is a proxy, not a second agent: it terminates Matrix
    encryption and forwards the decrypted text to the main hermes API server,
    which does the actual work.

    The secret is pulled in whole rather than key-by-key because the room IDs
    are private. MATRIX_HOME_ROOM arrives that way and resolves to the dedicated
    Notify room, so no room ID ever appears in this manifest.
  anchor:
    scope: excerpt
    excerpt: |2-
                    GATEWAY_PROXY_URL: http://hermes.ai.svc.cluster.local:8642
                  envFrom:
                    - secretRef:
                        name: hermes-matrix
    before: |2-
                  env:
                    HERMES_HOME: /data
                    MATRIX_ENCRYPTION: "true"
    after: |2-
                  resources:
                    requests:
                      cpu: 25m
