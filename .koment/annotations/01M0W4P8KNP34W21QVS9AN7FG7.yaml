spec:
  target:
    file: kubernetes/apps/ai/t3-code/app/configmap.yaml
  type: gotcha
  title: wire_api must be responses; chat is a hard error in Codex 0.146
  body: |-
    This started as `wire_api = "chat"` and Codex refused to start at all:

    Error loading configuration: /data/codex/config.toml:5:12: `wire_api =
    "chat"` is no longer supported.

    It is not a warning or a fallback. The bundled CLI is codex-cli 0.146.0, and
    the chat-completions wire protocol was removed (openai/codex discussion
    7782), so every `codex` invocation fails on config parse — including
    `t3-auth codex login`, which is how Codex gets its credential in the first
    place. The failure therefore looks like a broken login rather than a broken
    config.

    `responses` works against LiteLLM here. Verified directly: `POST
    http://litellm.ai.svc.cluster.local:4000/v1/responses` with
    `minimax/MiniMax-M3` returns 200 with a real completion, so the provider
    block stays usable if `model_provider` is ever switched on.

    Worth knowing that this block is inert today — Codex authenticates by
    ChatGPT device login and no `model_provider` is set — so a regression here
    stays silent until someone selects the LiteLLM provider.
  anchor:
    scope: excerpt
    excerpt: |2-
          env_key = "LITELLM_API_KEY"
          wire_api = "responses"
    before: |2-
          [model_providers.litellm]
          name = "LiteLLM"
          base_url = "http://litellm.ai.svc.cluster.local:4000/v1"
    after: |2-

          [mcp_servers.koment]
          command = "koment"
