kind: why
title: matrix-post.py delivers into named Matrix rooms from anywhere
body: |-
  Delivers a message into a named Matrix room from anywhere the agent runs —
  cron jobs, skills, scripts. The init container installs it as
  /opt/data/.local/bin/matrix-post, which is already on PATH.

  It replaces the file-delivery-to-chat approach of shelling out to kubectl to
  scrape MATRIX_ACCESS_TOKEN from the running hermes-matrix pod: the
  credentials now arrive as env from the hermes-matrix-access Secret, so
  nothing is coupled to a pod name.

  Rooms are addressed by alias (cluster, notify, alerts, digest, ...) which
  resolves to MATRIX_ROOM_<ALIAS>. That is what keeps the private room IDs out
  of every caller and out of git.

  This script deliberately contains no "${...}" sequences. Flux postBuild
  substitution runs over this ConfigMap and would eat them.
