  type: why
  title: plex-gpu claim via shared gpu component
  body: |-
    Plex's hardware video transcoding uses the AMD GPU exposed by the
    `gpu.amd.com` DRA driver. The `gpu` component under
    `kubernetes/components/gpu` ships a `ResourceClaimTemplate` named
    `${APP}-gpu` (rendered here as `plex-gpu`); the helmrelease consumes it
    through `defaultPodOptions.resourceClaims` and the per-container
    `resources.claims` reference.

    **Why:** the `${APP}` substitution in the component is templated by Flux
    postBuild, so the naming convention must match — renaming the ks breaks
    the binding silently. **How to apply:** do not change
    `resourceClaimTemplateName` to anything other than `${APP}-gpu`; rename the
    ks (not the file) if you need to retarget the claim.
  anchor:
    scope: excerpt
    excerpt: |2-
          defaultPodOptions:
            resourceClaims:
              - name: gpu
                resourceClaimTemplateName: plex-gpu
    before: |2-
                      cpu: 100m
                    limits:
                      memory: 2560Mi
    after: |2-
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
