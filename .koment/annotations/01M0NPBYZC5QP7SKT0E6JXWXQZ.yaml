  title: Remote Control server loop, not official self-hosted runners
  body: |-
    The in-cluster Claude Code agent on Janek's Max subscription. The official
    Claude Code self-hosted environment runners were evaluated 2026-08-22 and
    rejected on two hard blockers: they are Team/Enterprise-only public beta (an
    org Owner must enable them in claude.ai admin settings), and runner sessions
    authenticate with Anthropic-issued session tokens, so inference cannot route
    through an LLM gateway. A second LiteLLM-routed Sandbox twin was built and
    then cut for the same reason from the other side: Remote Control requires an
    eligible claude.ai login, which a gateway-routed profile can never have. The
    Max-compatible design is Remote Control (all plans): the main command loops
    `claude remote-control` (server mode), so after a one-time `kubectl exec` +
    `/login` the pod serves sessions drivable from claude.ai/code and the Claude
    mobile app. Before that first login the loop logs a failed attempt every 30s
    — expected, not a crash. OAuth credentials persist in /home/agent/.claude
    on the PVC, so the loop self-heals across pod restarts. The image is stock
    node:22-bookworm (this repo builds no custom images); the init container
    seeds claude, t3, and gh onto the home PVC, and the full non-slim image is
    load-bearing because t3's node-pty dependency compiles from source. GH_TOKEN
    (classic PAT, repo scope, verified 2026-08-22 to cover every repo janpuc can
    access) plus `gh auth setup-git` in bootstrap lets the agent clone any of
    Janek's repos over HTTPS. volumeClaimTemplates are immutable — resizing
    means delete and recreate the Sandbox (PVCs survive).
  anchor:
    scope: excerpt
    excerpt: |2-
            containers:
              - name: workbench
                image: docker.io/library/node:22-bookworm
                command: ["/bin/sh", "/opt/claude-code/run-native.sh"]
    before: |2-
                  - name: bootstrap
                    mountPath: /opt/claude-code
                    readOnly: true
    after: |2-
                workingDir: /workspace
                env:
                  - name: HOME
  author:
    name: claude-code
    kind: agent
    source: session
