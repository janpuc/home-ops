body: |-
  The cron entrypoint. It prints nothing on success — stdout is redirected
  to /dev/null — so the job stays silent unless delivery actually fails.
  That is the point: the #notify room is for output, #digest receives the
  rollup itself, and a healthy run should be invisible. Adding logging here
  would post noise into a room chosen for being unmuted.
