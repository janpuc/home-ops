spec:
  target:
    file: kubernetes/apps/ai/agents/claude/configmap.yaml
  type: gotcha
  title: Bootstrap must stay idempotent and version-gated
  body: |-
    The init container runs this on every pod start against the persistent home
    volume. The `claude --version` gate makes the download run only when the
    pinned CLAUDE_CODE_VERSION (renovate-managed env in sandbox.yaml) differs
    from what is on the PVC — without it every restart pays a ~340 MB
    download; the gh install is gated the same way. The `.partial` + `mv` dance
    keeps a crashed download from leaving a half-written binary that the version
    gate would then try to execute. The t3 install is gated on the binary's
    existence, not a version, because t3 is `@latest` by design (the project is
    pre-1.0 and moves fast); reinstalling it means deleting
    /home/agent/.npm-global/bin/t3. The git identity and credential-helper lines
    are set-if-unset so anything Janek configures inside the pod survives
    restarts.
  anchor:
    scope: excerpt
    excerpt: '    installed="$("$BIN/claude" --version 2>/dev/null | cut -d" " -f1 || true)"'
    before: |2-
          set -eu
          BIN="$HOME/.local/bin"
          mkdir -p "$BIN" "$HOME/.npm-global"
    after: |2-
          if [ "$installed" != "$CLAUDE_CODE_VERSION" ]; then
            curl -fsSL "https://downloads.claude.ai/claude-code-releases/${CLAUDE_CODE_VERSION}/linux-x64/claude" -o "$BIN/claude.partial"
            chmod 755 "$BIN/claude.partial"
  author:
    name: claude-code
    kind: agent
    source: session
status:
