body: |-
  One Hermes entry per upstream MCP server, rather than a single aggregated
  "homelab" entry pointing at http://litellm.ai:4000/mcp. Two reasons:

  1. The aggregate registered all 418 tools unfiltered — mcp_tool.py
  _register_server_tools treats "neither include nor exclude set" as
  register-everything — costing roughly 154k tokens of schema JSON on EVERY
  request. Note that `hermes prompt-size` does NOT reveal this: it runs
  offline and only counts the 35 built-in tools, so the cost was invisible
  from the obvious diagnostic. 2. Split entries become separate `mcp-<name>`
  toolsets, which can later be scoped per platform via platform_toolsets.

  The URL form matters: LiteLLM routes a single server at /mcp/<name>/ and the
  TRAILING SLASH is required — /mcp/<name>/mcp returns 0 tools with no
  error.

  Splitting also renamed every tool: mcp__homelab__kubectl_get_pods became
  mcp__kubectl__kubectl_get_pods. Skills under /opt/data/skills were rewritten
  to match, so reverting this shape breaks them.
created: "2026-08-04"
