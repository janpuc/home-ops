spec:
  target:
    file: kubernetes/apps/ai/hermes-matrix/app/kustomization.yaml
  type: why
  title: Hermes-Matrix backup tolerates unreadable skill state files
  body: |-
    skills/.curator_state is unreadable even by the workload's own user, so a
    strict snapshot fails on it and no backup is taken at all. Tolerating file
    and directory read errors trades an exact snapshot for one that actually
    completes. If backups start silently missing real data, this is the first
    thing to suspect.
  anchor:
    scope: excerpt
    excerpt: |2-
              value:
                ignoreFileErrors: true
                ignoreDirErrors: true
    before: |2-
          patch: |
            - op: add
              path: /spec/errorHandling
