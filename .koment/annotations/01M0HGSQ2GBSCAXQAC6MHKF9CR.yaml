spec:
  target:
    file: .zed/settings.json
  type: gotcha
  title: Zed has no per-project equivalent of .vscode/extensions.json
  body: |-
    The nearest setting, `auto_install_extensions`, is read through
    ExtensionSettings::get_global, so Zed only ever sees the value from
    ~/.config/zed/settings.json. Putting it here is silently ignored — do not
    add it and assume a fresh clone picks the extensions up.

    The set that matches .vscode/extensions.json is oxc, json5, just, env and
    material-icon-theme, plus helm for the *.gotmpl under bootstrap/helmfile.
    YAML needs nothing: Zed bundles yaml-language-server. mise has no Zed
    extension at all, so the .mise/config.toml tool versions and env only reach
    Zed when it is launched from a shell where mise has already activated.
  anchor:
    scope: excerpt
    excerpt: |2-
