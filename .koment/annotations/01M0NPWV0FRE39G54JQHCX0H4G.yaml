  type: gotcha
  title: Signing key provenance and rotation
  body: |-
    The `claude-code` 1Password item (vault Kubernetes,
    SSH_SIGNING_KEY/SSH_SIGNING_PUB fields) was created 2026-08-22 through the
    in-cluster Connect API — the Connect token has write access, so rotation
    can go the same way: generate a new ed25519 pair, PUT the item fields via
    Connect (or the 1Password app), and register the new public key as a
    *signing* key on github.com/settings/keys (the old one was added as id
    1129343 via `gh api /user/ssh_signing_keys`, which needs the
    admin:ssh_signing_key scope — the cluster GH_TOKEN does NOT have it, only
    Janek's local gh login does). defaultMode 288 is 0440: secret files are
    root-owned, and the agent (uid 1000) reads via fsGroup; 0400 would lock it
    to root only. ssh-keygen -Y sign does not enforce the strict permission
    check the ssh client applies to identity files, so group-readable is fine.
  anchor:
    scope: excerpt
    excerpt: |2-
              - name: signing
                secret:
                  secretName: claude-code-signing
                  defaultMode: 288
    before: |2-
              - name: bootstrap
                configMap:
                  name: claude-code-bootstrap
    after: |2-
        volumeClaimTemplates:
          - metadata:
              name: home
