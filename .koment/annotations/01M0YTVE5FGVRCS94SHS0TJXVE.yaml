  type: why
  title: The agent-kit pin lives here, not in the managed mise config
  body: |-
    This is the one string that pins the skill batch, and it is the whole
    consumer contract: agent-kit publishes a single semver and a single sha256
    for all seven skills, so pinning the tag pins the content.

    It is an env var rather than an entry in the ConfigMap's `mise.toml`, where
    the koment tag lives, because agent-kit ships no binary. mise has nothing to
    install, so there would be no reason for the tag to be there and the block
    below would have to parse it back out of a config file it does not otherwise
    touch.

    Renovate keeps it current through a `customManagers` entry in
    `.renovaterc.json5` keyed on this exact `AGENT_KIT_VERSION: v<semver>` shape
    against the `janpuc/agent-kit` GitHub releases. Renaming the variable or
    reformatting the line silently stops the updates; the regex is the only
    thing connecting them.

    The `v` prefix is load-bearing in both directions. `gh release download`
    takes the tag, and the archive name is built by interpolating this value
    directly, so it must match the published `agent-kit_v<version>.tar.gz`. Only
    the checksum filename wants the bare version, which is why that one is
    stripped locally rather than a second variable being pinned here.
  anchor:
    scope: excerpt
    excerpt: '              AGENT_KIT_VERSION: v0.1.0'
    before: |2-
                    repository: ghcr.io/traktuner/docker-t3-code
                    tag: 0.0.33-3@sha256:023429ff9fd1cc6e8e5ae83925d90d649f2669433ffb398fd2151e2192f1ac2b
                  env:
    after: |2-
                    GH_TOKEN:
                      valueFrom:
                        secretKeyRef:
