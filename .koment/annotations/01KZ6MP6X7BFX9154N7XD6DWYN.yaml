  target:
    file: kubernetes/apps/kube-system/cilium/app/networking.yaml
  type: why
  title: kube-apiserver LB can use Local safely; not like Envoy
  body: |-
    Local is safe here and deliberately differs from the Envoy gateway service,
    which must use Cluster. kube-apiserver is a static pod on every
    control-plane node and all three nodes in this cluster are control-plane, so
    whichever node Cilium hands the L2 lease to always has a local endpoint. The
    pod-less-node blackhole that forces Cluster on the Envoy service cannot
    happen for this Service.

    Local also keeps the real client address on API requests. Do not harmonise
    these two settings in either direction without checking endpoint coverage
    per node first.
  anchor:
    scope: excerpt
    excerpt: |2-
        type: LoadBalancer
        externalTrafficPolicy: Local
    before: |2-
          external-dns.alpha.kubernetes.io/hostname: k8s.janpuc.com
          lbipam.cilium.io/ips: 192.168.69.50
      spec:
    after: |2-
        selector:
          k8s-app: kube-apiserver
          tier: control-plane
