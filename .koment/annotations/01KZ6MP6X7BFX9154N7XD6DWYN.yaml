  type: why
  title: kube-apiserver LB can use Local safely; not like Envoy
  body: |-
    Cluster is required even though kube-apiserver runs as a static pod on every
    control-plane node. Cilium can keep the L2 lease on a node after its local
    API becomes unready; the endpoints controller then removes that local
    endpoint, and externalTrafficPolicy Local rejects the VIP traffic instead of
    forwarding it to a healthy control-plane peer. The 2026-08-25 incident
    demonstrated k8s-0 advertising the VIP and refusing connections while the
    direct APIs on k8s-1 and k8s-2 remained healthy. API availability therefore
    takes precedence over preserving the original client address for this
    Service.
  anchor:
    scope: excerpt
    excerpt: |2-
        type: LoadBalancer
        externalTrafficPolicy: Cluster
    before: |2-
          external-dns.alpha.kubernetes.io/hostname: k8s.janpuc.com
          lbipam.cilium.io/ips: 192.168.69.50
      spec:
    after: |2-
        selector:
          k8s-app: kube-apiserver
          tier: control-plane
