  type: why
  title: install-tools adds bash-language-server and shellcheck to PATH
  body: |-
    This block and the three after it install the language servers and linters
    that `hermes lsp` needs. `hermes lsp status` used to warn
    "bash-language-server is installed but shellcheck is missing - diagnostics
    will be empty", with only pyright registered; everything here lands under
    /opt/data/.local/bin, which is already on PATH.

    ShellCheck is a static binary with no runtime deps, so it is fetched
    directly rather than through a package manager.

    Watch out when writing anything in this script that starts a line with
    "shellcheck": that form parses as a lint directive and errors out with
    SC1073.
  anchor:
    scope: excerpt
    excerpt: "                if [ ! -f /opt/data/.local/bin/shellcheck ]; then"
    before: |2
                        rm -rf memini-src
                      fi
    after: |2-
                        cd /tmp
                        curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o sc.tar.xz
                        tar xJf sc.tar.xz
