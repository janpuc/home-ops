title: iGPU GTT aperture held at 2 GiB for llmkube batch sizing
body: |-
  Caps the iGPU GTT aperture at 2 GiB, down from the 8 GiB default. Everything
  that shares this iGPU is sized against that ceiling: the llmkube
  InferenceService batch/context settings for bge-embedding-m3 and
  bge-reranker-v2-m3 were measured against a 2 GiB aperture, and the reranker
  already ran the graph to 1.82/2.00 GiB. Raising this number is not free —
  it hands the GPU memory the host would otherwise keep, and it invalidates
  the batch sizing recorded on those two manifests.
created: "2026-08-04"
