  type: why
  title: matrix-post init container creates .local/bin before install-tools
  body: |-
    matrix-post delivers into a named Matrix room from cron jobs and skills.
    /opt/data/.local/bin is already on PATH, and this init container runs before
    install-tools, so it has to create the directory itself rather than assume
    it exists.
  anchor:
    scope: excerpt
    excerpt: |2-
                      mkdir -p /opt/data/.local/bin
                      cp /run/config/matrix-post.py /opt/data/.local/bin/matrix-post
    before: |2-
                      mkdir -p /opt/data/hook-scripts
                      cp /run/config/home-ops-guard.py /opt/data/hook-scripts/home-ops-guard.py
                      chmod 644 /opt/data/hook-scripts/home-ops-guard.py
    after: |2-
                      chmod 755 /opt/data/.local/bin/matrix-post
                      cp /run/config/weekly-digest.py /opt/data/.local/bin/weekly-digest
                      chmod 755 /opt/data/.local/bin/weekly-digest
