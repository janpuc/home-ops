title: matrix-post init container creates .local/bin before install-tools
body: |-
  matrix-post delivers into a named Matrix room from cron jobs and skills.
  /opt/data/.local/bin is already on PATH, and this init container runs before
  install-tools, so it has to create the directory itself rather than assume
  it exists.
created: "2026-08-04"
