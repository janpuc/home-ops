spec:
  target:
    file: kubernetes/apps/ai/claude-code/app/externalsecret.yaml
  type: why
  title: GH_TOKEN rides in the hermes 1Password item
  body: |-
    The two dataFrom extracts mirror hermes-config: GH_TOKEN lives in the
    `hermes` 1Password item and LITELLM_MASTER_KEY in `litellm`; there is no
    separate claude-code item to extract, and creating one would just duplicate
    secrets that rotate together with hermes.
  anchor:
    scope: excerpt
    excerpt: |2-
        dataFrom:
          - extract:
              key: litellm
          - extract:
              key: hermes
    before: |2-
            data:
              GH_TOKEN: "{{ .GH_TOKEN }}"
              LITELLM_API_KEY: "{{ .LITELLM_MASTER_KEY }}"
  author:
    name: claude-code
    kind: agent
    source: session
