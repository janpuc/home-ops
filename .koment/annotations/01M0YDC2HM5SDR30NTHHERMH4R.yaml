spec:
  target:
    file: kubernetes/apps/ai/t3-code-operator/instance/extensions.yaml
  type: gotcha
  title: Codex needs the released local marketplace archive
  body: |-
    The koment repository root is not a Codex marketplace. Release packaging
    puts the required `.agents/plugins/marketplace.json` and `plugins/koment`
    tree in `koment-plugin-codex_v<version>.tar.gz`, so a Marketplace-type
    extension pointing at `koment-dev/koment` cannot discover this plugin for
    Codex. The Claude plugin does live at the repository root, which is why
    `koment-claude` below is a Marketplace extension while this one is a GitHub
    release asset: two extension types for one tool.

    Unlike the `tools:` pin above, the tag, asset name and sha256 here have no
    Renovate manager. Bump them by hand together with each Koment Group PR, or
    the Codex plugin drifts from the koment binary the harnesses run.
  anchor:
    scope: excerpt
    excerpt: |2-
          type: GitHubRelease
          githubRelease:
            repository: koment-dev/koment
    before: |2-
        name: koment
      spec:
        source:
    after: |2-
            tag: v3.2.0
            asset: koment-plugin-codex_v3.2.0.tar.gz
            sha256: a8b3dfe698339455072ae6009ec70b831ede689b73789b26033886b0157c7f48
