spec:
  target:
    file: kubernetes/apps/ai/t3-code/app/helmrelease.yaml
  type: gotcha
  title: Codex needs the released local marketplace archive
  body: |-
    The koment repository root is not a Codex marketplace. Release packaging
    puts the required `.agents/plugins/marketplace.json` and `plugins/koment`
    tree in `koment-plugin-codex_v<version>.tar.gz`, so adding
    `koment-dev/koment` directly cannot discover this plugin.

    The pod reads the release tag from its managed mise configuration. This
    keeps the Codex plugin on the exact release used by the koment binary.
    Renovate updates that pin with every other koment installation. The pod
    verifies the archive against the release checksum before it replaces the
    stable local marketplace path. Codex treats a repeated add from that same
    path as idempotent, and `codex plugin add` atomically refreshes the installed
    version.

    A GitHub lookup or download failure does not fail the pod. The previous
    plugin cache remains installed, and the explicit koment MCP entry still
    supplies the tools.
  anchor:
    scope: excerpt
    excerpt: |2-
                      koment_plugin_stage="$(mktemp -d)"
                      koment_plugin_tag="$(
                        awk -F '"' '$2 == "github:koment-dev/koment" { print $4; exit }' \
                          /data/home/.config/mise/config.toml
                      )"
                      if [ -n "$koment_plugin_tag" ]; then
                        koment_plugin_version="$(printf '%s' "$koment_plugin_tag" | sed 's/^v//')"
                        koment_plugin_archive="koment-plugin-codex_$koment_plugin_tag.tar.gz"
                        koment_plugin_checksums="$(
                          printf 'koment-plugins_%s_checksums.txt' "$koment_plugin_version"
                        )"
    before: |2
                      codex plugin add memini@memini \
                        || echo "codex plugin install unavailable; memini reaches Codex over MCP"
    after: |2-
                        if gh release download "$koment_plugin_tag" \
                          --repo koment-dev/koment \
                          --pattern "$koment_plugin_archive" \
