  title: Same fail-closed trap as the zeroscaler component
  body: |-
    This is the same nas_health trigger as in
    kubernetes/components/zeroscaler/scaledobject.yaml, and it fails closed the
    same way: an empty Prometheus result (ingestion dead, metric missing) keeps
    the app parked at 0 with no fallback. The full failure story from the
    2026-09-01→03 outage — a read-only TSDB volume making Prometheus look
    healthy while every query returned empty — and the debugging order that
    finds it are recorded on that file's trigger block; read it before
    concluding the NAS or this component is broken.
