spec:
  target:
    file: kubernetes/apps/ai/hermes/app/configmap.yaml
  type: gotcha
  title: hooks_auto_accept is required or headless hooks never register
  body: |-
    Required, not a convenience. Registration normally prompts for consent on
    first use of each (event, command) pair and records the answer in
    ~/.hermes/shell-hooks-allowlist.json. The gateway and cron have no TTY, so
    without this the hook silently never registers — the guard appears
    configured and simply never runs.
  anchor:
    scope: excerpt
    excerpt: "    hooks_auto_accept: true"
    before: |2-
              - command: /usr/bin/python3 /opt/data/hook-scripts/home-ops-guard.py
                matcher: terminal
                timeout: 10
    after: |2-
          security:
            redact_secrets: true
            website_blocklist:
