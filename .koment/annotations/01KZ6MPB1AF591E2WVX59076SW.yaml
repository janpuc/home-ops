file: kubernetes/components/kopiur/backup/snapshotschedule.yaml
kind: why
body: |-
  H is a hashed minute, not a literal — every app including this component
  gets a stable but different offset within the hour, so a few dozen PVCs do
  not all snapshot to the same NAS repository on the hour and stampede it.

  The 2-hour cadence is depended on elsewhere: the weekly digest in
  kubernetes/apps/ai/hermes/app/configmap.yaml flags a policy as stale after
  24h without a successful snapshot, a threshold derived from this interval.
  Lengthening the cadence past a day would make that check fire on healthy
  backups.
created: "2026-08-04"
