spec:
  target:
    file: kubernetes/components/kopiur/backup/restore.yaml
  type: why
  title: Backoff spans the repo's read-after-write lag; offset is the plex knob
  body: |-
    Without a failurePolicy the mover Job exhausts its few default retries in
    minutes and the Restore goes terminal. backoffLimit 8 gives the Job
    exponential backoff spanning roughly 25 minutes, so a genuinely transient
    read failure on this NFS-backed repository becomes a self-healing wait
    instead of "terminal, recreate the CR by hand". A Failed Restore never
    retries, so CRs that failed before this knob existed still need manual
    deletion.

    Correction, 2026-09-04. This knob was added during the 2026-09-03
    local-storage migration on the theory that the kopia "content not found"
    failures seen on first-attempt restores (17 across three batches, every
    recreation succeeding) were transient reads of fresh writes. The failures
    examined afterwards (qbittorrent, stash) were nothing of the kind: each
    Restore had pinned its snapshot at admission weeks earlier and retention had
    since pruned it, so no amount of retrying could find the content, while a
    recreated CR re-resolved to a live snapshot and succeeded at once. See the
    gotcha on `source:` below. Keep the backoff for real transients, but do not
    expect it to rescue a stale Restore.

    KOPIUR_RESTORE_OFFSET exists for restoring an older snapshot than latest (0
    = newest): set it in an app's ks postBuild when the newest snapshots are
    known-bad, as plex's recovery needed on 2026-09-03 when Preferences.xml was
    found empty, and REMOVE the override right after the restore completes, or
    every future PVC rebuild silently resurrects old data. Because the source is
    pinned at admission, changing the offset on an existing Restore does
    nothing; delete the CR so Flux recreates it with the new value.
  anchor:
    scope: excerpt
    excerpt: |2-
        failurePolicy:
          backoffLimit: ${KOPIUR_RESTORE_BACKOFF:=8}
    before: |-
      metadata:
        name: ${APP}
      spec:
    after: |2-
        policy:
          onMissingSnapshot: Continue
        source:
