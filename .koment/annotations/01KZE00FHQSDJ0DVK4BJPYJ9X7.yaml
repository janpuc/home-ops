  type: why
  body: |-
    With Cilium L2 IPAM owning the VIP and `externalTrafficPolicy: Local`, the
    lease can land on a node that does not host the Plex pod, in which case that
    node returns TCP RST and the LAN sees "Connection refused" even though the
    service and pod report healthy. The L2 lease does not consider backend
    locality, so the only pod-less node can win the election (2 replicas on 3
    nodes in the analogous Envoy Gateway case, 1 of 1 here). `Cluster` lets
    Cilium forward to whichever node holds the pod; client source IP is still
    preserved because this cluster runs Cilium in DSR mode (`bpf-lb-mode: dsr`
    on the cilium-config ConfigMap), so the original-cip argument for `Local`
    does not apply.

    **Why:** exact symptom observed 2026-08-07 — ARP resolved the VIP to
    k8s-2's MAC while the Plex pod was on k8s-1, nc to 32400 returned RST,
    in-pod curl returned 302. Root cause and fix are the same as the Envoy
    Gateway VIP outage recorded in the `envoy-gateway-l2-etp-local-issue`
    memory; the earlier annotation on this line gave the opposite advice and is
    superseded by this one.

    **How to apply:** keep `Cluster` as long as the cluster runs Cilium in DSR.
    If LB mode is ever switched away from DSR (e.g. SNAT), this needs to go back
    to `Local` AND the L2 reachability problem solved some other way (separate
    VIP advertisement, TopologyHints, etc.) — otherwise LAN traffic blackholes
    again. Supersedes the 2026-08-07 annotation that was anchored to the `Local`
    line.
  anchor:
    scope: excerpt
    excerpt: "        externalTrafficPolicy: Cluster"
    before: |2-
              type: LoadBalancer
              annotations:
                lbipam.cilium.io/ips: 192.168.69.60
    after: |2-
              ports:
                http:
                  port: *port
