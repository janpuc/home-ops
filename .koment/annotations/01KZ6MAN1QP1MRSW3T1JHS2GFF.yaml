title: hermes-matrix-access gives the main agent its own Matrix creds
body: |-
  Matrix posting credentials for the MAIN agent, which previously had none of
  its own. Anything the agent produced outside a live chat turn — cron
  output, a generated file — could only reach a room through the
  file-delivery-to-chat skill, which scraped MATRIX_ACCESS_TOKEN out of the
  running hermes-matrix pod with kubectl at runtime. That worked, but it was
  fragile and coupled a skill to a pod name.

  Giving the agent its own read of the same credentials is what lets
  matrix-post deliver to a named room directly, which the digest cron and any
  future alert triage depend on.

  It is a separate Secret rather than more keys on hermes-config specifically
  so it can be envFrom'd whole: the room IDs are private and belong in env,
  never in this manifest.
