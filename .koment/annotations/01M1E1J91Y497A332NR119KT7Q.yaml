spec:
  target:
    file: kubernetes/apps/ai/t3-code/app/helmrelease.yaml
  type: gotcha
  title: Merge tolerates a deformed state file; plain .[0] * .[1] does not
  body: |-
    The obvious `jq -s '.[0] * .[1]'` crashloops the whole init container the
    moment `/data/claude-home/.claude.json` is not exactly one JSON object. With
    an empty state file the slurped array shifts: the managed config becomes
    `.[0]`, `.[1]` is null, and jq dies with "object and null cannot be
    multiplied" pointing confusingly at the *managed* file's last line — which
    is how it presented on 2026-09-01 (15 restarts), after the DRBD wedge left
    the pod's /data mount read-only so the `printf '{}'` seed above silently
    failed and the empty file survived the guard.

    `map(select(type == "object")) | reduce .[] as $doc ({}; . * $doc)` keeps
    the exact same deep-merge semantics for well-formed inputs (state first,
    managed config last and winning, user-added mcpServers preserved) while
    ignoring empty files and stray non-object values, so a torn write on the PVC
    costs at most the state it lost, never the pod. Parse errors still fail
    loudly, and the seed guard above still repairs those on the next start —
    the two are complementary, not redundant.
  anchor:
    scope: excerpt
    excerpt: |2-
                      jq -s 'map(select(type == "object")) | reduce .[] as $doc ({}; . * $doc)' \
                        /data/claude-home/.claude.json \
                        /run/config/claude-mcp.json > /tmp/claude-merged.json
    before: |2-
                      if ! jq -e . /data/claude-home/.claude.json >/dev/null 2>&1; then
                        printf '{}\n' > /data/claude-home/.claude.json
                      fi
    after: |2
                      install -m 0600 /tmp/claude-merged.json /data/claude-home/.claude.json
                      rm -f /tmp/claude-merged.json
