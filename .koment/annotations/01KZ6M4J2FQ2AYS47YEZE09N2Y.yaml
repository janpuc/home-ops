  type: invariant
  title: replicas 1 with Recreate keeps Matrix crypto store single-writer
  body: |-
    Both halves are load-bearing and neither is a default worth "tidying up".
    Two Matrix clients sharing one account and one crypto store clash over
    device identity, so a second replica — or a RollingUpdate that briefly
    runs two pods — breaks encryption for the bot rather than scaling it.
  anchor:
    scope: excerpt
    excerpt: "        strategy: Recreate"
    before: |2-
              annotations:
                reloader.stakater.com/auto: "true"
              replicas: 1
    after: |2-
              type: deployment
              initContainers:
                patch-matrix:
