spec:
  target:
    file: kubernetes/apps/ai/t3-code-operator/app/helmrelease.yaml
  type: gotcha
  title: Pairing tokens are one-time and expire in 5 minutes
  body: |-
    Keeping the auth proxy off means every browser and phone must pair, and the
    startup banner is a trap for how that is done.

    The token printed at boot is single-use. The first client consumes it, in
    practice the T3 Code Desktop app, and every later attempt fails with "The
    one-time pairing token was already submitted." That reads like a broken
    deployment when it is just a spent token. `t3 auth session list` tells the
    two apart: an existing session proves pairing works.

    Do not restart the pod to get a new banner. Mint one from inside the runtime
    container:

    t3 auth pairing create --ttl 2h --label Cluster --base-url
    https://t3.janpuc.com

    The default TTL is 5 minutes, which is not long enough to walk to a phone.
    `--base-url` prints a complete `/pair#token=...` link on the public
    hostname; without it the banner prints the pod IP, which no client can
    reach, and the pair page can fail with "This pairing link is missing its
    backend host or token."

    `--label` names the *client session*, not the environment. It shows up as
    the first field of `client:` in `t3 auth session list`. The environment name
    the client displays comes from `machineInfo.prettyHostname` on this
    Workstation instead.

    Sessions are durable: 30 days, listed and revoked through `t3 auth session`.
    Pairing is a per-device one-off, not a per-visit login.
  anchor:
    scope: excerpt
    excerpt: |2-
                  - name: T3_AUTH_PROXY
                    value: "0"
    before: |2-
                  limits:
                    memory: 8Gi
                env:
    after: |2-
                  - name: T3_GIT_REPOSITORY_SCAN_DEPTH
                    value: "4"
                  - name: TERM
