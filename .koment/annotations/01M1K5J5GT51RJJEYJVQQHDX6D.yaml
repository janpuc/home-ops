spec:
  target:
    file: kubernetes/apps/kopiur-system/kopiur/repository/maintenance.yaml
  type: why
  title: Explicit because the operator's managed Maintenance never materialized
  body: |-
    Upstream (onedr0p/home-ops) defines no Maintenance CR — the operator
    projects one from ClusterRepository.spec.maintenance defaults. On this
    cluster that projection silently never happened: MaintenanceConfigured
    reported True while `kubectl get kopiamaint -A` stayed empty, no error in
    controller or webhook logs, and IndexBlobHealth had been False since
    2026-08-27 (index blobs 2263 vs threshold 1000). Un-compacted indexes made
    freshly written snapshot contents unreadable to fresh clients, which is what
    failed the spoolman migration restore on 2026-09-03.

    This CR pins maintenance explicitly with the operator's documented default
    cadence (quick 6-hourly, full daily; H = deterministic jitter).
    `takeoverPolicy: Force` claims the kopia-side maintenance lease from
    whatever stale owner identity held it. If a future kopiur release starts
    projecting its managed CR and they collide, prefer deleting this file over
    disabling the projection — but confirm the projected one actually exists
    first, because "configured" did not mean "created" when this was written.
  anchor:
    scope: excerpt
    excerpt: |-
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Maintenance
      metadata:
        name: nas
    before: |-
      ---
      # yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/maintenance_v1alpha1.json
    after: |-
      spec:
        ownership:
          owner: kopiur/nas
  author:
    name: claude-code
    kind: agent
    source: session
