spec:
  target:
    file: kubernetes/apps/ai/t3-code/app/helmrelease.yaml
  type: gotcha
  title: Update plugins after idempotent install
  body: |-
    Claude reports success when `plugin install` finds an existing installation,
    but that command does not refresh its version. The marketplace update
    refreshes release metadata. The plugin update then moves an existing
    installation to that version. Each command remains non-fatal so a temporary
    network failure does not block the pod.
  anchor:
    scope: excerpt
    excerpt: |2-
                      for marketplace in memini koment-dev; do
                        claude plugin marketplace update "$marketplace" \
                          || echo "claude plugin marketplace $marketplace update unavailable"
                      done
                      for plugin in memini@memini koment@koment-dev; do
                        claude plugin install "$plugin" \
                          || echo "claude plugin install $plugin unavailable"
                        claude plugin update "$plugin" \
                          || echo "claude plugin update $plugin unavailable"
                      done
    before: |2-
                        claude plugin marketplace add "$marketplace" \
                          || echo "claude plugin marketplace $marketplace unavailable"
                      done
    after: |2-
                      claude plugin list || true
                  securityContext: &containerSecurity
                    allowPrivilegeEscalation: false
