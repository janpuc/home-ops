  title: hermes writes at homelab root, reads personal/jan as ancestor
  body: |-
    Hermes writes at the ROOT of the namespace tree — renamed from the flat
    "hermes" on 2026-07-30. It is a general assistant rather than a per-project
    agent, so its durable facts belong where every project below can inherit
    them. Its session churn stays put regardless: the ancestor cascade reads
    durable tiers ONLY, so working and episodic writes here never leak into
    homelab/* reads.

    MEMINI_HOME is the personal namespace, merged read-only into every recall.
    The morning brief depends on it — Janek's profile, voice preferences and
    news framing live there, not in homelab.
  anchor:
