  type: why
  title: rerank pool and doc cap sized to fit inside MEMINI_RERANK_TIMEOUT
  body: |-
    Sized from measurements on this iGPU: roughly 130 ms/doc at 350 chars and
    335 ms/doc at 1024. Latency is linear in POOL x doc length, so a pool of 20
    at the 2048 cap would take about 14s, blow MEMINI_RERANK_TIMEOUT, and
    silently drop every recall back to composite ordering — the failure is
    invisible, which is what makes it worth pinning. 10 x 1024 holds the worst
    case near 3.4s (typically ~1.3s) while still giving three times the recall
    limit of rescue depth, which is the whole point of having a pool.
  anchor:
    scope: excerpt
    excerpt: |2-
                    MEMINI_RERANK_POOL: "10"
                    MEMINI_RERANK_MAX_DOC_CHARS: "1024"
    before: |2-
                    MEMINI_RECALL_EMBED_TIMEOUT: "10s"
                    MEMINI_RERANK: http://bge-reranker-v2-m3.ai.svc.cluster.local:8080/v1
                    MEMINI_RERANK_MODEL: bge-reranker-v2-m3
    after: |2-
                    MEMINI_RERANK_MAX_BATCH_CHARS: "48000"
                    MEMINI_RERANK_TIMEOUT: "10s"
                    MEMINI_RERANK_MIN_SCORE: "0"
