  title: reranker batch numbers pinned between GTT ceiling and doc cap
  body: |-
    These four are pinned between a hard upper and a hard lower bound; do not
    copy them from bge-embedding-m3, whose compute buffer is far smaller at the
    same batch because it is an embedding model rather than a cross-encoder.

    Upper bound — the 2 GiB GTT aperture (amdgpu.gttsize=2048). At uBatchSize
    4096 llama.cpp forces n_batch = n_ubatch = 4096, and the graph alone took
    GTT to 1.82/2.00 GiB; any batch past roughly 700 tokens then killed the
    device with `vk::Queue::submit: ErrorDeviceLost`.

    Lower bound — the physical batch must hold a WHOLE (query, doc) pair or
    llama.cpp rejects it with "input (N tokens) is too large to process". memini
    caps a doc at MEMINI_RERANK_MAX_DOC_CHARS=2048, measured at 619 tokens for
    English prose, so 1024 covers it with room for denser text.

    So: uBatchSize >= the largest pair you expect, and n_ctx_slot
    (contextSize/parallelSlots) >= uBatchSize.
  anchor:
    scope: excerpt
    excerpt: |2-
        contextSize: 4096
        parallelSlots: 2
        batchSize: 1024
        uBatchSize: 1024
    before: |2-
        runtime: llamacpp
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10335@sha256:36fc10912782f77d9b10b21b0bec43f76d33932a8db4c17bcc3e472e04c0063b
        replicas: 1
    after: |2-
