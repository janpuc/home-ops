kind: gotcha
title: koment version input must move with the mise config pin
body: |-
  The koment version is pinned in TWO places and they must be bumped together:
  this `version` input and `"github:janpuc/koment"` in .mise/config.toml.
  Renovate's mise manager tracks the config.toml pin and its action manager
  tracks the SHA above, but nothing tracks this input value — there is no
  customManager configured for workflow inputs in .renovaterc.json5.

  Letting them drift means CI runs `koment check` on a different build than
  the one developers run locally, so a check can pass on a laptop and fail
  here for reasons nobody can reproduce. If the two ever disagree,
  .mise/config.toml is the source of truth.
