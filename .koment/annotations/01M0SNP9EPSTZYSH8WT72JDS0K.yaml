  type: why
  body: |-
    The image is pinned by digest because this cluster runs spegel: the p2p
    mirror resolves mutable tags from peer caches, so :main with pullPolicy
    Always still served a stale digest (observed 2026-08-24 — the operator
    CrashLoopBackOff'ed on an old image missing the gateway flag). Deploying a
    new dispatch build means bumping this digest; move to Renovate-managed
    vX.Y.Z tags once dispatch cuts releases. The same rule covers the runner
    digest in agent-guardian.yaml. The single replica runs without
    --leader-elect because the generated ClusterRole carries no
    coordination.k8s.io lease rules.
  anchor:
    scope: excerpt
    excerpt: "      tag: main@sha256:a426ac4ee6dcf1adb1a2360f36b7f229be81a4f3edfc047a7f53f70732c64859"
    before: |2-
        interval: 30m
        values:
          image:
    after: |2-
            pullPolicy: IfNotPresent
          serviceMonitor:
            enabled: true
