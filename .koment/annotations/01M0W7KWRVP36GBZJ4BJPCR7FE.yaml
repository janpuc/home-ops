apiVersion: koment.dev/v1alpha
kind: Annotation
metadata:
  id: 01M0W7KWRVP36GBZJ4BJPCR7FE
  created: "2026-08-25T10:31:51Z"
spec:
  target:
    file: kubernetes/apps/ai/t3-code-operator/app/externalsecret.yaml
  type: gotcha
  title: 1Password stores the signing key on one line; it must be rewrapped
  body: |-
    `SSH_SIGNING_KEY` in the 1Password `t3-code` item arrives as a **single
    line**: the newlines were collapsed to spaces when the value was saved.
    OpenSSH requires the header, a wrapped base64 body and the footer on
    separate lines, so whatever consumes this secret must rewrap it before
    ssh-keygen can load it.

    The t3-code-operator does that itself: verified 2026-09-04 in the
    Workstation pod, the installed private key has seven lines, `ssh-keygen -y`
    loads it, and `commit.gpgsign` is on. The app-template deployment this
    secret used to serve needed an explicit normalizer script for the same
    reason. Anything else that mounts the key verbatim fails at the first commit
    with:

    error: No private key found for "/data/home/.ssh/id_signing"? fatal: failed
    to write commit object

    That names the path, which reads like the file is missing or the permissions
    are wrong. It is neither: the file exists, is mode 0600 and owned by the
    right uid. Only its line structure is wrong.

    Fixing the 1Password field instead would work today and silently regress the
    next time the value is re-pasted, so keep the rewrap on the consumer side.
    The rebuilt key's fingerprint
    `SHA256:sGvpOUgEVjXsip/pfYIQJllFVUaJLTTW2Ynyx/IRB88` matches
    `SSH_SIGNING_PUB`.
  anchor:
    scope: excerpt
    excerpt: '        id_signing: "{{ .SSH_SIGNING_KEY }}"'
    before: |2-
          creationPolicy: Owner
          template:
            data:
    after: |2-
              id_signing.pub: "{{ .SSH_SIGNING_PUB }}"
        dataFrom:
          - extract:
