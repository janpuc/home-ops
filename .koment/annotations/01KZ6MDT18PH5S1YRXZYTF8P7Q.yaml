file: kubernetes/apps/ai/hermes/app/configmap.yaml
kind: why
body: |-
  This include list is a token-budget decision, not a capability one: 275
  tools upstream (~44.9k tokens) down to 95 (~16.8k). What was dropped is
  whole families this cluster does not run — kind, vind, kubevirt, istio,
  capi, keda, argo-rollouts, flagger, velero backup/restore, multi-cluster —
  plus the roughly 35 helm_* tools, since Flux owns Helm here.

  Adding a tool back is fine; adding a family back costs real tokens on every
  request.
created: "2026-08-04"
