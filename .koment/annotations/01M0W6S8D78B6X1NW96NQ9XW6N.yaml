  type: why
  title: This name is the environment label every T3 client displays
  body: |-
    The object name is the environment name. t3-code-operator 0.2.0 defaults
    `machineInfo.prettyHostname` to the Workstation name, so this file no longer
    sets it and the name in `kubectl get workstations` is the name in the T3
    client picker. Renaming the object renames the environment.

    Without a value the client falls back to the pod name, which changes on
    every rollout, so the same backend would appear under a new name after each
    deploy. T3 resolves its `ExecutionEnvironmentDescriptor.label` on Linux by
    reading `PRETTY_HOSTNAME` from `/etc/machine-info`, then `hostnamectl
    --pretty`, then the raw hostname — verified against t3 0.0.38 on
    2026-09-04, which still has no environment variable override. The operator
    writes the label into `/data/t3-coded/machine-info`, which the runtime image
    symlinks to `/etc/machine-info`.

    Set `spec.machineInfo.prettyHostname` only to display something a DNS-label
    object name cannot spell, such as mixed case or spaces. This deployment
    deliberately does not: "Cluster" was the old app-template value, and
    matching the Kubernetes object name is worth more than the prettier string.
  anchor:
    scope: excerpt
    excerpt: |-
      kind: Workstation
      metadata:
        name: t3-code
    before: |-
      ---
      apiVersion: t3code.janpuc.com/v1alpha1
    after: |-
