spec:
  target:
    file: kubernetes/apps/ai/t3-code-operator/app/helmrelease.yaml
  type: why
  title: This value is the environment name clients display
  body: |-
    Without it the T3 client shows the pod name, which changes on every rollout,
    so the same backend appears under a new name after each deploy.

    T3 resolves its `ExecutionEnvironmentDescriptor.label` on Linux by reading
    `PRETTY_HOSTNAME` from `/etc/machine-info`, then falling back to
    `hostnamectl --pretty`, then the raw hostname. Neither of the first two
    exists in the runtime image, so without this it lands on the hostname, which
    Kubernetes sets to the pod name. The operator renders this value into
    `/etc/machine-info` for the runtime container.

    `PRETTY_HOSTNAME` is not a DNS label, so it accepts arbitrary casing. A pod
    `hostname` would also stabilise the name but is restricted to a lowercase
    DNS label and could not produce `Cluster`.

    One failure mode carried over from the app-template deployment this
    replaced: if `/etc/machine-info` ends up as an empty directory instead of a
    file (a subPath mount whose source key vanished), T3's existence check
    passes, the read fails, and it quietly falls back to the pod name. If the
    name reverts after a change here, inspect the rendered file in the pod
    before suspecting T3.
  anchor:
    scope: excerpt
    excerpt: |2-
                machineInfo:
                  prettyHostname: Cluster
    before: |2-
                    value: /data/npm-cache
                  - name: NPM_CONFIG_PREFIX
                    value: /data/npm-global
    after: |2-
                storage:
                  data:
                    type: ClaimTemplate
