  type: why
  title: --prefix targets PVC so language servers survive pod restarts
  body: |-
    --prefix is what keeps the Node-based language servers out of the image's
    read-only /usr/local and inside the PVC, so they survive a pod restart
    without being reinstalled. The same applies to the yaml-language-server
    install below it, which is here because this repo is almost entirely YAML
    and validates against the `# yaml-language-server: $schema=` directives at
    the top of every manifest.
