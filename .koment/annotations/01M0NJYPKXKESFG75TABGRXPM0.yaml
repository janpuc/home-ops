  title: "LiteLLM agent: exec-driven only, no Remote Control possible here"
  body: |-
    Agent 2 of 2: identical workbench but inference goes through LiteLLM's
    anthropic-native MiniMax routes. AGENT_PROFILE=litellm makes bootstrap seed
    /home/agent/.claude/settings.json (ANTHROPIC_BASE_URL +
    minimax/MiniMax-M3-anthropic + apiKeyHelper echoing $LITELLM_API_KEY at call
    time — no secret on disk). Only the `-anthropic` minimax model groups work
    on /v1/messages: the opencode-go upstreams speak Responses-API and LiteLLM
    v1.97.0 converts them to empty Anthropic envelopes (verified 2026-08-22).
    The main command stays `sleep infinity` deliberately: Remote Control
    requires an eligible claude.ai login, and signing the Max account in here
    would fight the forced BASE_URL — this agent is driven by `kubectl exec`,
    t3, or Hermes instead. Shares the claude-code-secret ExternalSecret and
    bootstrap ConfigMap with the native sandbox; each Sandbox gets its own
    home/workspace PVC pair, so the two agents never share state.
  anchor:
