spec:
  target:
    file: kubernetes/apps/ai/t3-code-operator/instance/mcpservers.yaml
  type: gotcha
  title: MEMINI_HOME in the environment does not scope an HTTP MCP client
  body: |-
    `MEMINI_HOME` in a harness environment does not scope an HTTP MCP client.
    The server reads the namespace from a request header, so a client that only
    sends the bearer token lands in the default namespace and sees none of the
    personal memories.

    Measured against the live service, calling `memory_briefing` with the same
    token and changing only the headers:

    no namespace header -> "Scope: default" X-Memini-Home -> "Scope: default <-
    personal/jan(52)"

    So the failure is silent and total: memini answers normally, reports itself
    healthy, and recalls nothing. Fifty-two memories were invisible to Codex
    when this was found.

    `X-Memini-Namespace` is deliberately absent. memini derives the per-project
    namespace itself, and `MEMINI_HOME` is the personal tier merged into every
    recall. The `MEMINI_HOME` env entries on the harnesses serve the memini
    plugins' lifecycle hooks; they are not a substitute for this header.
  anchor:
    scope: excerpt
    excerpt: |2-
          - name: X-Memini-Home
            value: personal/jan
    before: |2-
          name: t3-code-config
          key: MEMINI_API_KEY
        headers:
    after: |-
      ---
      apiVersion: t3code.janpuc.com/v1alpha1
      kind: MCPServer
