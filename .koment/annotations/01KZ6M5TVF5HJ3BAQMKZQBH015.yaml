  type: gotcha
  title: room IDs live in a Secure Note to dodge 1Password CLI validator
  body: |-
    The private Matrix room IDs live in their own `hermes-rooms` Secure Note
    rather than in the `hermes` item, and that split is a 1Password CLI
    workaround, not organisation. Every PASSWORD-category item in this vault has
    an empty password field, which makes `op item edit` fail the CLI validator
    with "Password item requires ps value" — those items are only editable
    through the Connect API or the GUI. A Secure Note has no such constraint, so
    the room IDs stay editable from the CLI.
