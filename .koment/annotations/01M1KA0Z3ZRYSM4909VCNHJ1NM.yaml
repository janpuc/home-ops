  type: why
  title: "Hot maintenance crons and Force takeover: 2026-09 index backlog recovery"
  body: |-
    Recovery settings from 2026-09-03, when IndexBlobHealth had been False since
    2026-08-27 (2400+ index blobs vs threshold 1000) and a kopiur Restore failed
    with kopia "content not found" on freshly written content — the restore
    path for every app was silently broken while snapshots kept succeeding.

    Contributing causes, in order of discovery: the mass-deletion breaker held
    322 retention deletions (user acked 2026-09-03 ~07:49Z); the kopia
    maintenance lease needed Force takeover (claimed 08:27Z); epoch minDuration
    was 24h against a 2h snapshot cadence (lowered to 6h, see the parameters
    annotation); and compaction of an epoch-mode repo happens substantially in
    FULL maintenance, which only ran daily at 05:xx.

    The schedule override lives HERE, not on the Maintenance CR: the operator
    projects kopiamaint `nas` from this spec and reverts direct edits to the CR
    — a schedule set only in repository/maintenance.yaml produced exactly one
    run before being stomped. maintenance.yaml is kept aligned with these crons
    to avoid an SSA tug-of-war between Flux and the operator over the shared
    object; treat the two as one unit when editing.

    These crons are deliberately hot to burn down the backlog. Once
    IndexBlobHealth is True and a restore has been proven good, relax to the
    defaults (quick `H */6 * * *`, full `H 5 * * *`) and consider dropping
    takeoverPolicy back to default once the lease has settled under the operator
    identity.
  anchor:
    scope: excerpt
    excerpt: |2-
        maintenance:
          schedule:
            quick:
              cron: "*/10 * * * *"
            full:
              cron: "*/30 * * * *"
          takeoverPolicy: Force
    before: |2-
            name: kopiur-nas-secret
            namespace: kopiur-system
            key: KOPIA_PASSWORD
    after: |2-
        parameters:
          epoch:
            minDuration: 6h
