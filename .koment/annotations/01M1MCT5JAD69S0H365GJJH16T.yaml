  type: why
  title: Default moved to the local class during the DRBD exodus
  body: |-
    Moved from miroir-fast on 2026-09-03 as part of the user-mandated migration
    of every volume off DRBD-replicated classes ("until drbd fix let's move
    all") after the 2026-09-01 wedge. Any PVC that names no class — operator
    claim templates, ad-hoc claims, future apps — now lands on single-replica
    local LVM instead of a 2-replica DRBD device. Move it back to miroir-fast
    only together with the decision to trust DRBD again (upstream miroir 0.12.0
    retest or a LINBIT/drbd#137 fix), and remember local volumes pin their pod
    to one node — the memory-headroom constraints that shaped the migration
    apply to anything new that lands here.
  anchor:
    scope: excerpt
    excerpt: |2-
        name: miroir-fast-local
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
    before: |-
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
    after: |-
      provisioner: miroir.home-operations.com
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
