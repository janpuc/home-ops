  title: parked at zero until an operator release supports pocket-id 2.14.x
  body: |-
    Parked deliberately on 2026-08-19. This is a hold, not a sizing decision.
    Restore it to 1 when the condition at the bottom is met.

    pocket-id runs v2.14.0 (see the annotation on
    ../instance/pocketidinstance.yaml, which explains why going back is not an
    option). Operator 0.13.1 declares `firstUnsupportedPocketIDVersion =
    "v2.14.0"` and calls `haltIfUnsupportedVersion`, so the process exits on
    every reconcile. That left a permanent CrashLoopBackOff firing three alerts
    — KubePodCrashLooping, KubePodNotReady and KubeDeploymentReplicasMismatch
    — that nobody could act on, because there was nothing to upgrade to.

    Zero replicas yields the same functional state the crash-loop already
    produced, minus the noise. pocket-id keeps serving SSO/OIDC from its own
    Deployment; only the management plane stops. While this is 0, edits to
    PocketIDInstance, PocketIDUserGroup and PocketIDOIDCClient silently do not
    apply — that is the cost of the park, and it is why this must not be left
    here indefinitely.

    **Un-park when a release ships that supports 2.14.x.** Renovate will raise
    the chart bump; set this back to 1 in that same PR.

    **Do not shortcut it with a main-built image.** Upstream lifted the guard on
    main already (commit e7bc8ae9, 2026-08-18, back to `v3.0.0`) and publishes
    `main`-tagged operator images, so this looks temptingly available. The guard
    existed because pocket-id 2.14.0 replaced the single-secret OIDC client
    endpoints with the `/oidc/clients/:id/secrets` collection, and the operator
    support for that is still unmerged in PR #566. Running main today points an
    operator that cannot speak the new API at six live PocketIDOIDCClient
    resources gating SSO for hermes, open-webui, autobrr, qui, kavita and
    mealie. A halted operator is recoverable; rewritten client secrets are an
    outage across six apps.
  anchor:
    scope: excerpt
    excerpt: "      replicas: 0"
    before: |2-
          instance:
            enabled: false
          operator:
    after: |2-
            resources:
              requests:
                cpu: 10m
