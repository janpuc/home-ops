spec:
  target:
    file: kubernetes/apps/dispatch/operator/app/externalsecret.yaml
  type: why
  body: |-
    The 1Password item `dispatch` carries a CLAUDE_CODE_OAUTH_TOKEN field with
    the long-lived token from `claude setup-token` on a Max-plan login. The
    extract maps every item field 1:1 into the claude-max-primary Secret, and
    the dispatch operator injects that Secret's keys as environment variables
    into runner pods — CLAUDE_CODE_OAUTH_TOKEN is exactly the variable headless
    `claude -p` reads for subscription auth, which keeps sessions off API
    billing (dispatch repo, ADR-0003). Rotate by replacing the field in
    1Password; add further runner env (e.g. GH_TOKEN) as new fields on the same
    item.
  anchor:
    scope: excerpt
    excerpt: |2-
        dataFrom:
          - extract:
              key: dispatch
    before: |2-
        target:
          name: claude-max-primary
