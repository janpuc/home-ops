spec:
  target:
    file: kubernetes/apps/dispatch/operator/app/externalsecret.yaml
  type: why
  body: |-
    The 1Password item `dispatch` must carry a CLAUDE_CREDENTIALS field holding
    the JSON content of ~/.claude/.credentials.json from a machine logged into
    the Claude Max plan (the long-lived token from `claude setup-token` also
    works). The dispatch-run shim copies the rendered .credentials.json into
    each session's persistent HOME so headless `claude -p` authenticates against
    the subscription instead of API billing — bare mode cannot do this, which
    is why runners run non-bare (dispatch repo, ADR-0003).
  anchor:
    scope: excerpt
    excerpt: |2-
        dataFrom:
          - extract:
              key: dispatch
    before: |2-
          template:
            data:
              .credentials.json: "{{ .CLAUDE_CREDENTIALS }}"
