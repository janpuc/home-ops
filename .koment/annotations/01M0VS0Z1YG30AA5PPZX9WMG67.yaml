  body: |-
    Sonnet 5, not Fable 5, because the guardian shares one Claude Max usage
    window with Janek's interactive sessions. On 2026-08-24 the first guardian
    fleet ran Fable 5 and exhausted the top-tier window within the hour ("You're
    out of usage credits" in every session's termination message); Haiku still
    had quota at the same moment, so the exhaustion is per-tier, not
    account-wide. Sonnet 5 gives near-Opus agentic and coding quality at a
    fraction of the window burn, which is the right default for an always-on
    duty agent that fires on every alert. Raise a single session to Fable or
    Opus deliberately when a task earns it, rather than paying top tier for
    routine triage. ADR-0004's subscriptionWindowReserve is the structural fix
    and is not implemented yet — the reserve field here is inert.
