spec:
  target:
    file: kubernetes/apps/ai/open-webui/app/helmrelease.yaml
  type: why
  title: memini filter wiring lives in env to survive reinstalls
  body: |-
    The memini Open WebUI filter seeds its base_url and home Valves from these
    env vars, so declaring them here keeps the wiring in git instead of only in
    the UI's Valve settings, where a container rebuild or a reinstalled filter
    would lose them. MEMINI_API_KEY is deliberately not here — it arrives from
    open-webui-secret via envFrom.
  anchor:
    scope: excerpt
    excerpt: |2-
                    MEMINI_BASE_URL: http://memini.ai.svc.cluster.local:8080
                    MEMINI_HOME: personal/jan
    before: |2-
                    ENABLE_WEBSOCKET_SUPPORT: true
                    WEBSOCKET_MANAGER: redis
                    WEBSOCKET_REDIS_URL: redis://open-webui-dragonfly:6379
    after: |2-
                  envFrom:
                    - secretRef:
                        name: open-webui-secret
