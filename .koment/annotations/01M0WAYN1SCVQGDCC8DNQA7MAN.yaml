spec:
  target:
    file: kubernetes/apps/ai/t3-code/app/configmap.yaml
  type: why
  title: opencode needs the memini namespace header too
  body: |-
    Same defect and same fix as the Codex `env_http_headers` table annotated
    above: without a namespace header this client reads `Scope: default` and
    recalls nothing, however correct the bearer token is.

    Only `X-Memini-Home` is set. opencode substitutes `{env:...}` literally, so
    an `X-Memini-Namespace` line would send an empty header when the variable is
    unset rather than omitting it the way Codex does.

    The `@eleboucher/opencode-memini` entry in the `plugin` array is not a
    substitute for this server and does not duplicate it. That plugin is a
    lifecycle hook — it recalls before a turn and captures after one — while
    this MCP entry is what gives the model the `memory_*` tools to call
    directly.
  anchor:
    scope: excerpt
    excerpt: |2-
                "headers": {
                  "Authorization": "Bearer {env:MEMINI_API_KEY}",
                  "X-Memini-Home": "{env:MEMINI_HOME}"
                }
    before: |2-
                "type": "remote",
                "url": "http://memini.ai.svc.cluster.local:8080/mcp",
                "enabled": true,
    after: |2-
              },
              "kubectl": {
                "type": "remote",
