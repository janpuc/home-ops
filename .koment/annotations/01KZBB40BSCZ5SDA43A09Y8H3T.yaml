  type: why
  title: action owner is koment-dev and its SHA must match the CLI
  body: |-
    Pin the owner `koment-dev/koment`, not `janpuc/koment`. The latter was
    archived when the project moved organisations in v2.0.0 (`koment-dev/koment`
    #71) and pinning it now causes the workflow to fail with a "repository not
    found" error before any step runs.

    The action code uses a commit SHA, while the `version` input selects the
    release tarball. Both must identify the same release. Renovate's native
    GitHub Actions manager updates the SHA and marker. The custom manager
    updates the input in the same five-way Koment Group PR.
  anchor:
    scope: excerpt
    excerpt: "- name: Setup Koment"
