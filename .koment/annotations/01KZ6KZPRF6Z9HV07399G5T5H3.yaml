spec:
  target:
    file: kubernetes/apps/ai/llmkube/models/bge-embedding-m3.yaml
  type: invariant
  title: embedder alias stays bge-m3 to avoid a forced re-embed
  body: |-
    DO NOT rename this alias to match the resource name. memini records the
    value of MEMINI_EMBED_MODEL in its store and refuses to boot if it ever
    disagrees (cmd/memini/root.go reconcileEmbedModel). The check is a plain
    string compare, so changing the alias would force a full re-embed of every
    memory even though the weights are identical. The k8s resource was
    deliberately renamed to bge-embedding-m3 while the served model identity
    stays bge-m3 — the divergence is the point, not an oversight.
  anchor:
    scope: excerpt
    excerpt: |2-
          - --alias
          - bge-m3
    before: |2-
          - "0"
          - --sleep-idle-seconds
          - "300"
    after: |2-
          - --metrics
        endpoint:
          port: 8080
