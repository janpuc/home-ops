  type: why
  title: weekly digest is --no-agent so the script IS the job
  body: |-
    Weekly digest into the #digest Matrix room, Mondays at 08:00. --no-agent
    means no LLM runs at all — the script IS the job. It posts to Matrix
    itself and prints nothing, so a healthy run is silent and costs nothing.

    `schedule` is positional, which is why the cron expression comes before the
    flags rather than behind a --schedule.
  anchor:
    scope: excerpt
    excerpt: |2-
                        $HERMES cron create "0 8 * * 1" \
                          --name weekly-digest \
                          --script weekly-digest-run.sh \
                          --no-agent \
    before: |2-
                        -d "Homelab cluster debugging: resource pressure, Flux, MCP, cron" || true

                      if ! $HERMES cron list 2>/dev/null | grep -q "weekly-digest"; then
    after: |2-
                          --deliver local || true
                      fi
