spec:
  target:
    file: kubernetes/apps/ai/hermes/app/helmrelease.yaml
  type: gotcha
  title: agent copy filters playwright Permission denied, not real errors
  body: |-
    The copy cannot simply be `cp -r ... || exit 1`: hermes-agent >= v2026.7.x
    ships root-only playwright .deps files, so a non-root copy always produces
    Permission denied lines. The grep filter tolerates exactly those and still
    fails the container on any other copy error, which is why the `|| true` is
    safe. The `test -e /agent-src/.venv` after it is the real success check.
  anchor:
    scope: excerpt
    excerpt: |2-
                      cp -r /opt/hermes/. /agent-src/ 2>/tmp/cp.err || true
                      if grep -v 'Permission denied' /tmp/cp.err; then exit 1; fi
    before: |2-
                    - -c
                    - |
                      set -e
    after: |2-
                      test -e /agent-src/.venv
                  securityContext:
                    allowPrivilegeEscalation: false
  author:
    name: claude-code
    kind: agent
    source: session
