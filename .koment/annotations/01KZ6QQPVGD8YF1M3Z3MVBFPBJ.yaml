file: .lefthook.toml
kind: why
title: koment checks run last so anchors see post-format line numbers
body: |-
  Placed last so every `format-*` step has finished and amended the index
  before these read the worktree. `koment check` resolves annotation anchors
  against the on-disk source — if formatters are still mid-flight,
  LastSeenLine values race against pending rewrites. `koment agents check`
  verifies the adapter contracts (AGENTS.md / .codex/hooks.json /
  .codex/config.toml / Claude plugin hooks.json); it does not touch source but
  should still run after the formatters have produced the final tree.
created: "2026-08-04"
anchor:
  scope: excerpt
  excerpt: |-
    [pre-commit.commands.koment-check]
    run = "koment check"

    [pre-commit.commands.koment-agents-check]
    run = "koment agents check"
  before: |
    glob = [".github/workflows/*.yaml", ".github/actions/**/action.yaml", "actions/**/action.yaml"]
    run = "zizmor --offline {staged_files}"
  last_seen_line: 64
