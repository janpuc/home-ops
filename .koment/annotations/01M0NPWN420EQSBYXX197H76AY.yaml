spec:
  target:
    file: kubernetes/apps/ai/agents/claude/externalsecret.yaml
  type: why
  title: "Two secrets: env token from the hermes item, key file from claude-code"
  body: |-
    GH_TOKEN lives in the `hermes` 1Password item (a classic PAT with repo
    scope, shared with the hermes agent) — no point duplicating a secret that
    rotates together with hermes. The signing key is different: it is
    agent-owned, so it gets its own `claude-code` item. Two ExternalSecrets
    because the consumption differs — GH_TOKEN is envFrom'd
    (claude-code-secret), while the signing key must be a file mount
    (claude-code-signing): a multiline private key in envFrom would produce an
    invalid env var name and be silently dropped. Inference auth is neither —
    it is the claude.ai OAuth login persisted on the pod's home PVC.
  anchor:
    scope: excerpt
    excerpt: |2-
        dataFrom:
          - extract:
              key: claude-code
    before: |2-
          template:
            data:
              id_ed25519: "{{ .SSH_SIGNING_KEY }}"
