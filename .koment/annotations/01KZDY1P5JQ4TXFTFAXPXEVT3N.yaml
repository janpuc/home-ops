  type: why
  title: "wai: GPU + zeroscaler + kopiur backup"
  body: |-
    Plex is the only media app that needs all three of these components
    together: GPU for HW transcoding, zeroscaler because it's a personal-use
    server with predictable off-hours, and kopiur/backup for the `/config` claim
    that holds the libraries DB and metadata. Sonarr/Radarr don't need GPU;
    kavita doesn't need GPU either. Both `dependsOn` entries gate on infra being
    ready (DRA driver must exist before the ResourceClaim is admitted;
    miroir-config must exist before kopiur can snapshot).

    **Why:** dropping any of these three components breaks a different feature;
    bundling them as the default Plex kustomization is intentional. **How to
    apply:** if adding another media app that wants GPU + backup, follow this ks
    as the template; the `KOPIUR_CAPACITY: 50Gi` in postBuild matches Plex's
    metadata DB size and should be retuned per app.
  anchor:
    scope: excerpt
    excerpt: |2-
        components:
          - ../../../../components/gpu
          - ../../../../components/zeroscaler
          - ../../../../components/kopiur/backup
        dependsOn:
          - name: k8s-gpu-dra-driver
            namespace: kube-system
          - name: miroir-config
            namespace: miroir-system
    before: |-
      metadata:
        name: plex
      spec:
    after: |2-
        interval: 1h
        path: ./kubernetes/apps/media/plex/app
        postBuild:
