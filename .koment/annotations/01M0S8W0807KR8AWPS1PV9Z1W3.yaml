  type: why
  title: "One pod, seven jobs: containers named for what they do"
  body: |-
    Re-organized 2026-08-24 on Janek's "make it make sense": the Sandbox keeps
    its name claude-code because renaming it cascade-deletes the PVCs (owner
    references) and with them the claude.ai login — learned the hard way.
    Containers are the concept model: orchestrator (the Max-powered brain —
    Remote Control session Janek talks to, spawns ephemeral OpenCode worker
    sessions), queue-runner (the role→runtime loop, split out so its logs and
    lifecycle are separate from the interactive session), t3 (the
    agents.janpuc.com control surface — all sessions, live view,
    steer/answer), bridge (Matrix commands in, results out), intake
    (Alertmanager webhook → queue tasks + /metrics), codeserver
    (agents-code.janpuc.com over the workspaces). Scripts are real files under
    scripts/ via configMapGenerator — the previous
    single-configmap-with-seven-embedded-scripts was unreviewable and
    unlintable. The separate worker Sandbox was deleted the same day: workers
    became ephemeral OpenCode sessions in this pod, which is cheaper, visible in
    t3, and needs no second PVC set.
  anchor:
    scope: excerpt
    excerpt: |2-
            containers:
              - name: orchestrator
                image: docker.io/library/node:22-bookworm
                command: ["/bin/sh", "/opt/agents/orchestrator.sh"]
    before: |2-
                  - name: scripts
                    mountPath: /opt/agents
                    readOnly: true
    after: |2-
                workingDir: /workspace
                env:
                  - name: HOME
