# yaml-language-server: $schema=https://raw.githubusercontent.com/koment-dev/koment/main/schema/v1alpha/annotation.schema.json
apiVersion: koment.dev/v1alpha
kind: Annotation
metadata:
  id: 01KZ6QPSPJQNA1YKY5YAFA77NW
  created: "2026-08-04T00:00:00Z"
spec:
  target:
    file: .lefthook.toml
  type: invariant
  title: parallel = false keeps format-then-check from racing itself
  body: |-
    Pre-commit commands run sequentially so every `format-*` step finishes (and
    `stage_fixed = true` amends the index) before `koment-check` and
    `koment-agents-check` read source. The previous upstream-imported
    lefthook.common.toml had `parallel = true`, which raced formatters against
    the koment checks — gofmt would rewrite lines while `koment check` was
    already resolving anchors, leaving stale state. Sequential execution is the
    contract the comment-gated formatter + comment-gated checker both depend on.
  anchor:
    scope: excerpt
    excerpt: |-
      [pre-commit]
      parallel = false
    after: |-
      skip = ["merge", "rebase"]

      [pre-commit.commands.format-go]
  author:
    name: claude-code
    kind: agent
    source: session
  git:
    commit: 1fdb7a6db043a9dc382ed8623ba9de62d8e8dc0f
    path: .lefthook.toml
    line: 1
status:
  lastSeenLine: 1
