file: .lefthook.toml
kind: invariant
body: |-
  Pre-commit commands run sequentially so every `format-*` step finishes (and
  `stage_fixed = true` amends the index) before `koment-check` and
  `koment-agents-check` read source. The previous upstream-imported
  lefthook.common.toml had `parallel = true`, which raced formatters against
  the koment checks — gofmt would rewrite lines while `koment check` was
  already resolving anchors, leaving stale state. Sequential execution is the
  contract the comment-gated formatter + comment-gated checker both depend on.
created: "2026-08-04"
anchor:
  scope: excerpt
  excerpt: |-
    [pre-commit]
    parallel = false
  after: |-
    skip = ["merge", "rebase"]

    [pre-commit.commands.format-go]
  last_seen_line: 1
