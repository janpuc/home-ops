  type: gotcha
  title: One bootstrap serves both profiles; stays idempotent and version-gated
  body: |-
    Shared by the coordinator and every worker; AGENT_PROFILE branches the
    differences. Version gates: claude and gh gate on --version output,
    koment/kubectl/flux on $BIN/.<tool>-version marker files (their version
    output is not worth parsing) — without gates every restart pays a ~340 MB
    claude download. The `.partial` + `mv` dance keeps a crashed download from
    leaving a half-written binary the gate would then execute. t3 is `@latest`
    by design (pre-1.0), gated on existence; reinstall = delete
    /home/agent/.npm-global/bin/t3. The worker settings.json seed is gated on
    file absence so in-pod edits survive restarts, and its heredoc terminator is
    quoted so $LITELLM_API_KEY lands literally in apiKeyHelper and resolves from
    pod env at call time — never baked in at bootstrap. The coordinator gets
    no settings.json: its auth is the claude.ai OAuth login, and forcing
    ANTHROPIC_BASE_URL would break Remote Control. memini plugin steps swallow
    failures with a warning instead of letting set -eu kill the init container
    — a GitHub outage must not make the workbench unschedulable. Git identity,
    credential helper, and signing config are set-if-unset so operator changes
    inside the pod survive restarts.
  anchor:
    scope: excerpt
    excerpt: '    installed="$("$BIN/claude" --version 2>/dev/null | cut -d" " -f1 || true)"'
    before: |2-
          set -eu
          BIN="$HOME/.local/bin"
          mkdir -p "$BIN" "$HOME/.npm-global"
    after: |2-
          if [ "$installed" != "$CLAUDE_CODE_VERSION" ]; then
            curl -fsSL "https://downloads.claude.ai/claude-code-releases/${CLAUDE_CODE_VERSION}/linux-x64/claude" -o "$BIN/claude.partial"
            chmod 755 "$BIN/claude.partial"
