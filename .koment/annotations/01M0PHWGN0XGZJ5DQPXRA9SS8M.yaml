  type: why
  title: Vendored manifests, folded into ai — never a new namespace
  body: |-
    kubernetes-sigs/agent-sandbox publishes no OCI chart (checked 2026-08-23; no
    proxy at ghcr.io/home-operations/charts either, 404), so this vendors
    upstream's primary install artifact from the v0.5.6 release, byte-identical,
    listed under vendoredPaths in .koment/policy.yaml. The transformer stack
    exists because of a design rule this app violated once and must not violate
    again: namespaces in this repo are created only by
    kubernetes/apps/<ns>/namespace.yaml, so upstream's bundled
    agent-sandbox-system is deleted and everything is folded into ai. Two things
    the plain `namespace: ai` transformer cannot do alone: it does not remove
    the Namespace object (the $patch: delete does), and it does not rewrite the
    CRD conversion-webhook clientConfig.service.namespace that all four CRDs
    hardcode (the JSON6902 patch does — miss it and every Sandbox CR
    conversion call dials a service in a namespace that does not exist).
    ValidatingWebhookConfiguration service refs and RBAC subjects ARE rewritten
    by the transformer, and the controller patches its own CA bundle into the
    CRDs at startup, so certs need no handling. Upgrading = re-download the
    release file verbatim; Renovate cannot bump a vendored manifest.
  anchor:
    scope: excerpt
    excerpt: |-
      namespace: ai
      resources:
        - ./sandbox-with-extensions.yaml
    before: |-
      # yaml-language-server: $schema=https://json.schemastore.org/kustomization
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
    after: |-
      patches:
        - patch: |-
            $patch: delete
