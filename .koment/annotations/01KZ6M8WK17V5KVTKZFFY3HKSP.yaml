  type: why
  title: home-ops-guard.py is 644 because shlex names the interpreter
  body: |-
    The pre_tool_call shell hook. 644 rather than 755 is deliberate and correct:
    config.yaml invokes it as "/usr/bin/python3 .../home-ops-guard.py" through
    shlex.split with shell=False, so the interpreter is named explicitly and no
    exec bit is needed — but the file must be readable by the agent's uid.
  anchor:
    scope: excerpt
    excerpt: |2-
                      cp /run/config/home-ops-guard.py /opt/data/hook-scripts/home-ops-guard.py
                      chmod 644 /opt/data/hook-scripts/home-ops-guard.py
    before: |2-
                      cp /run/config/config.yaml /opt/data/config.yaml
                      chmod 600 /opt/data/config.yaml
                      mkdir -p /opt/data/hook-scripts
    after: |2-
                      mkdir -p /opt/data/.local/bin
                      cp /run/config/matrix-post.py /opt/data/.local/bin/matrix-post
                      chmod 755 /opt/data/.local/bin/matrix-post
