  title: "FluxFluxInstanceArtifactfailed: temporary IPv6 noise suppression"
  body: |-
    Silence the `FluxFluxInstanceArtifactfailed` alert because it's pure
    notification noise, not a real failure. The alert fires when the
    flux-operator tries to pull
    `ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.57.0` from
    `pkg-containers.githubusercontent.com` over IPv6 first, fails with `dial tcp
    [2606:50c0:8003::154]:443: connect: network is unreachable`, and recovers
    automatically on the IPv4 fallback in 2-4 seconds. Alertmanager sees the
    fire+resolve cycle as a real blip and pushes a Pushover notification for
    every blip. Cluster has been working fine through hundreds of these.

    This was moved from `alertmanagerconfig.yaml` to silence-operator on
    2026-08-08 so it sits with the other suppressions and is independently
    auditable. The `FluxOCIRepositoryOciartifactpullfailed` silence below
    shares the same IPv6-pull root cause — see that annotation.

    **Why:** this is a stopgap, not a permanent fix. **How to apply:** to remove
    the suppression, fix the underlying IPv6 unreachable condition for
    `pkg-containers.githubusercontent.com` (and any other AAAA-only host) by
    doing ONE of:

    1. Set `GODEBUG=preferipv4=1` on the flux-operator container env in
    `kubernetes/apps/flux-system/flux-operator/app/helmrelease.yaml`. This is
    the cleanest fix because it's per-binary and survives node network
    reconfigs. 2. Add `ip6tables -I OUTPUT -d 2606:50c0:8003::/48 -j DROP` on
    each Talos node (machine config). Wider blast radius — affects every
    binary, not just flux-operator. 3. Deploy NodeLocal DNSCache with
    `preferIPv4: true` and route cluster DNS through it. Most invasive.

    Option 1 is recommended — smallest change, scoped to flux-operator. Option
    3 also fixes any other Go binary that hits AAAA-only hosts (kopiur, miroir,
    etc.).

    **Trigger to revisit:** when migrating flux-operator off
    `controlplaneio-fluxcd` to a registry that resolves only on IPv4 (or when
    all three nodes get IPv6 connectivity from the LAN). Confirm the blip is
    actually gone by tailing `kubectl logs -n flux-system flux-operator` for
    `network is unreachable` before removing the silence. Keep this annotation
    alive until then so the next reader knows why a "real" alert is being
    silently dropped.
