spec:
  target:
    file: kubernetes/apps/ai/t3-code/app/helmrelease.yaml
  type: gotcha
  title: Reap by name from the last batch; never wipe the skill roots
  body: |-
    Neither skill root belongs to agent-kit alone, so the obvious `rm -rf
    "$skills_root"` before each install is wrong.

    `$HOME/.agents/skills` is shared with the image's own provisioner:
    `scripts/provision-promo-video-skill.py --scope container` installs
    `promo-video-script` there whenever any of Codex, OpenCode or Cursor is
    enabled. Wiping the root would delete it on every pod start and leave the
    two provisioners fighting over the same directory.

    Reaping by name from the previously extracted release is what makes this
    both safe and complete. `$agent_kit_installed` is the last release tree this
    pod unpacked, so its `skills/` listing is the exact set the pod owns —
    which means a skill dropped between two agent-kit versions is removed rather
    than left behind forever, and nothing else in the root is touched. The tree
    is kept rather than deleted precisely because it is this manifest; it also
    carries `VERSION`, `agent-kit.lock.json` and `licenses/`, so the provenance
    of what is installed is answerable from inside the pod.

    Verified against the real v0.1.0 artifact in a scratch HOME: a neighbouring
    `promo-video-script` survived a re-run, a planted skill that the new batch
    no longer ships was removed from both roots, and a second run was a no-op.
  anchor:
    scope: excerpt
    excerpt: |2-
                        for previously_installed in "$agent_kit_installed"/skills/*/; do
                          [ -d "$previously_installed" ] || continue
                          for skills_root in $agent_kit_skill_roots; do
                            rm -rf "$skills_root/$(basename "$previously_installed")"
                          done
                        done
    before: |2-
                        tar -xzf "$agent_kit_stage/$agent_kit_archive" \
                          -C "$agent_kit_stage/release" \
                          --strip-components=1
    after: |2-
                        for skills_root in $agent_kit_skill_roots; do
                          mkdir -p "$skills_root"
                          cp -a "$agent_kit_stage/release/skills/." "$skills_root/"
