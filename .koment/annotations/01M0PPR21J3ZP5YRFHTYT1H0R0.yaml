  type: why
  title: CRDs are vendored files, not URLs — IPv6 egress killed the URL form
  body: |-
    Janek originally asked for URL-linked CRDs here (2026-08-23) and that
    shipped first — resources pointing at raw.githubusercontent.com pinned to
    the release tag. It broke the same day: kustomize-controller re-fetches
    remote resources on every revision build, the cluster has no IPv6 egress,
    and whenever DNS returned an AAAA record first the build failed with `dial
    tcp [2606:...]:443: connect: network is unreachable`, stalling the whole
    agents dependency chain (crds → operator → claude-code) for up to the
    60m build timeout. So the same four files from helm/crds@v0.5.6 are vendored
    byte-identical instead (vendoredPaths in .koment/policy.yaml) — same
    separate-ks lifecycle, no network at build time. The prune: false on the
    agents-crds Flux ks stays: a pruned CRD cascade-deletes every Sandbox and
    their PVCs. Upgrading = re-download all four files at the new tag plus the
    operator's sandbox-with-extensions.yaml in one commit. The JSON6902 patch
    still rewrites the conversion-webhook namespace all four CRDs hardcode to
    agent-sandbox-system. If cluster IPv6 egress ever lands, the URL form is
    safe to restore.
  anchor:
    scope: excerpt
    excerpt: |-
      resources:
        - ./agents.x-k8s.io_sandboxes.yaml
    before: |-
      # yaml-language-server: $schema=https://json.schemastore.org/kustomization
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
    after: |2-
        - ./extensions.agents.x-k8s.io_sandboxclaims.yaml
        - ./extensions.agents.x-k8s.io_sandboxtemplates.yaml
        - ./extensions.agents.x-k8s.io_sandboxwarmpools.yaml
