  title: "One pod, role-named: containers are the concept model"
  body: |-
    Named by role at Janek's request (2026-08-24): the app dir, Flux ks,
    Sandbox, SA, and secrets all say orchestrator. The rename knowingly paid the
    Sandbox rename tax — PVC cascade via ownerReferences, costing one
    claude.ai /login and a fresh t3 pairing; NAS state (queue, roles, worktrees,
    logs) survives, which is exactly why durable state lives on /nas and only
    caches/credentials live on the PVCs. The 1Password item and its
    ExternalSecret extract key stay `claude-code` — external identities don't
    churn with k8s naming. Containers: orchestrator (the Max-powered brain —
    the Remote Control session Janek talks to; spawns ephemeral OpenCode worker
    sessions), queue-runner (the role→runtime loop, split out so its logs and
    lifecycle are separate from the interactive session), t3 (agents.janpuc.com
    control surface — all sessions, live view, steer/answer), bridge (Matrix
    in/out), intake (Alertmanager → queue tasks + /metrics), codeserver
    (agents-code.janpuc.com over the workspaces). Scripts are real files under
    scripts/ via configMapGenerator so shellcheck and review actually see them.
    The separate worker Sandbox was deleted: workers are ephemeral OpenCode
    sessions in this pod — cheaper, t3-visible, no second PVC set.
  anchor:
    scope: excerpt
    excerpt: |2-
            containers:
              - name: orchestrator
                image: docker.io/library/node:24-bookworm
                command: ["/bin/sh", "/opt/agents/orchestrator.sh"]
    before: |2-
                  - name: scripts
                    mountPath: /opt/agents
                    readOnly: true
    after: |2-
                workingDir: /workspace
                env:
                  - name: HOME
