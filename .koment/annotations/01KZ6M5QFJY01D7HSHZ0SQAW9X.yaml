kind: why
title: MATRIX_HOME_ROOM points at Notify so muted rooms don't lose output
body: |-
  The home room is pointed at Notify rather than at a conversational room so
  scheduled output and reminders all land in one place. That is what lets the
  Cluster/Assistant/Home rooms be muted without losing anything the agent was
  asked to say later.
created: "2026-08-04"
