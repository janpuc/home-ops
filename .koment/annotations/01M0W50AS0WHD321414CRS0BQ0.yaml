  target:
    file: kubernetes/apps/ai/t3-code/app/helmrelease.yaml
  type: gotcha
  title: Pairing tokens are one-time, expire in 5m, and carry the env name
  body: |-
    Keeping the auth proxy off means every browser and phone must pair, and the
    startup banner is a trap for how that is done.

    The token printed at boot is single-use. The first client consumes it — in
    practice the T3 Code Desktop app — and every later attempt fails with "The
    one-time pairing token was already submitted." That reads like a broken
    deployment when it is just a spent token. `t3 auth session list` tells the
    two apart: an existing session proves pairing works.

    Do not restart the pod to get a new banner. Mint one:

    t3 auth pairing create --ttl 2h --label Cluster --base-url
    https://t3.janpuc.com

    Three things about that command. The default TTL is 5 minutes, which is not
    long enough to walk to a phone. `--base-url` prints a complete
    `/pair#token=...` link on the public hostname; without it the banner prints
    the pod IP, which no client can reach, and the pair page can fail with "This
    pairing link is missing its backend host or token."

    `--label` names the *environment*, not the device. It is stored on the
    credential (`t3 auth pairing list` shows it in parentheses) and the pair
    page renders it as "<label> is saved in this browser", so it becomes how
    this backend appears in the client's environment list. Use a stable name
    like `Cluster` for every token rather than a per-device name, or the same
    backend shows up under different names depending on which token paired it.
    The boot-banner token has no label, so a client paired that way falls back
    to a generic name and has to be re-paired to pick one up.

    Sessions themselves are durable — 30 days, listed and revoked through `t3
    auth session`. Pairing is a per-device one-off, not a per-visit login.
  anchor:
    scope: excerpt
    excerpt: '              T3_AUTH_PROXY: "0"'
    before: |2-
                    PATH: /data/home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/data/home/.local/share/mise/shims
