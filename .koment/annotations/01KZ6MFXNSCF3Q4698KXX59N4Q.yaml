body: |-
  Weekly homelab rollup, emitted as HTML on stdout and delivered by the
  weekly-digest-run wrapper. It is deterministic on purpose: a factual rollup
  is cheaper and more reliable as a script than as an agent turn, and the
  #digest room persona is there to handle follow-up questions about it.

  Every section degrades to a one-line note rather than raising, so a missing
  RBAC grant or an uninstalled CRD costs one section instead of the whole
  digest.

  Like matrix-post.py, this deliberately contains no "${...}" sequences —
  Flux postBuild substitution runs over this ConfigMap.
