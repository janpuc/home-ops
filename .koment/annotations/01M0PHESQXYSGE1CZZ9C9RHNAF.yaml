spec:
  target:
    file: kubernetes/apps/ai/agents/claude-code/configmap.yaml
  type: gotcha
  title: Bootstrap must stay idempotent and version-gated
  body: |-
    The init container runs this on every pod start against the persistent home
    volume. The `claude --version` gate makes the download run only when the
    pinned CLAUDE_CODE_VERSION (renovate-managed env in sandbox.yaml) differs
    from what is on the PVC — without it every restart pays a ~340 MB
    download; gh is gated the same way, while koment, kubectl, and flux gate on
    marker files ($BIN/.<tool>-version) because their version output is not
    worth parsing. The `.partial` + `mv` dance keeps a crashed download from
    leaving a half-written binary that the version gate would then try to
    execute. The t3 install is gated on the binary's existence, not a version,
    because t3 is `@latest` by design (pre-1.0, moves fast); reinstalling it
    means deleting /home/agent/.npm-global/bin/t3. The memini plugin steps
    deliberately swallow failures with a logged warning instead of letting set
    -eu kill the init container — a GitHub outage must not make the workbench
    unschedulable. Git identity, credential helper, and signing config are
    set-if-unset so anything Janek configures inside the pod survives restarts.
  anchor:
    scope: excerpt
    excerpt: '    installed="$("$BIN/claude" --version 2>/dev/null | cut -d" " -f1 || true)"'
    before: |2-
          set -eu
          BIN="$HOME/.local/bin"
          mkdir -p "$BIN" "$HOME/.npm-global"
    after: |2-
          if [ "$installed" != "$CLAUDE_CODE_VERSION" ]; then
            curl -fsSL "https://downloads.claude.ai/claude-code-releases/${CLAUDE_CODE_VERSION}/linux-x64/claude" -o "$BIN/claude.partial"
            chmod 755 "$BIN/claude.partial"
  author:
    name: claude-code
    kind: agent
    source: session
