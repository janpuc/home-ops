spec:
  target:
    file: kubernetes/apps/network/cloudflare-tunnel/app/helmrelease.yaml
  type: gotcha
  title: TUNNEL_POST_QUANTUM requires the quic transport
  body: |-
    These two settings are a pair. Post-quantum key agreement is implemented
    only on cloudflared's QUIC transport; it has no effect over HTTP/2. If
    `TUNNEL_TRANSPORT_PROTOCOL` is ever switched to `http2` — a common
    workaround when UDP/7844 is blocked on the network path —
    `TUNNEL_POST_QUANTUM` must be set to false at the same time, or cloudflared
    refuses to start rather than quietly downgrading.

    Change one, change the other.
  anchor:
    scope: excerpt
    excerpt: |2-
                    TUNNEL_POST_QUANTUM: true
                    TUNNEL_TRANSPORT_PROTOCOL: quic
    before: |2-
                  env:
                    NO_AUTOUPDATE: true
                    TUNNEL_METRICS: 0.0.0.0:8080
    after: |2-
                  envFrom:
                    - secretRef:
                        name: "{{ .Release.Name }}-secret"
