spec:
  target:
    file: kubernetes/apps/media/kavita/ks.yaml
  type: why
  title: Kavita must wait on pocket-id before its own startup
  body: |-
    Kavita authenticates via OIDC against PocketID, so it depends on
    pocket-id-instance being up rather than on anything it consumes at build
    time. Dropping this dependsOn does not break reconciliation — it breaks
    login after a cold cluster start, when Kavita comes up before its identity
    provider.
  anchor:
    scope: excerpt
    excerpt: |2-
          - name: pocket-id-instance
            namespace: security
    before: |2-
          - ../../../../components/zeroscaler
          - ../../../../components/kopiur/backup
        dependsOn:
    after: |2-
          - name: miroir-config
            namespace: miroir-system
        interval: 1h
  author:
    name: claude-code
    kind: agent
    source: session
