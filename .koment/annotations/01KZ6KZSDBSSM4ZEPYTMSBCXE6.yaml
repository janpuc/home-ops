  type: why
  title: embedder context sizing prioritises per-slot room
  body: |-
    What matters is per-slot context, which llama.cpp derives as
    contextSize/parallelSlots — so 8192 across 2 slots gives 4096 each, enough
    for long memini docs. Raising parallelSlots without raising contextSize
    shrinks every slot and starts truncating documents.

    This pair is deliberately NOT the lever for GTT pressure. Per-slot context
    costs KV; what actually fills the 2 GiB aperture is the compute graph,
    which is sized by uBatchSize on the two lines below — see the invariant
    recorded there. Shrink the batch, not the context.
  anchor:
    scope: excerpt
    excerpt: |2-
        contextSize: 8192
        parallelSlots: 2
    before: |2-
        runtime: llamacpp
        image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10603@sha256:033d0cd1352d6e9cd87337772f530e2087cffed6284d9f47c2b859982c470b3b
        replicas: 1
    after: |2-
