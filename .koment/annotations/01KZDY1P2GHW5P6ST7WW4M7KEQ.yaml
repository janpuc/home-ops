spec:
  target:
    file: kubernetes/apps/media/plex/app/helmrelease.yaml
  type: why
  title: "externalTrafficPolicy: Local on LB IPAM"
  body: |-
    Without `externalTrafficPolicy: Local`, cilium LB IPAM routes external
    traffic to a node that may not have the Plex pod scheduled, which manifests
    as "Plex is not reachable" from the LAN while the cluster reports healthy.
    `Local` preserves the source IP and only forwards to nodes that actually
    host a backend pod.

    **Why:** symptom is a periodic blackout correlated with pod reschedules;
    root cause is L2 IPAM landing on a pod-less node. **How to apply:** if the
    L2 reachability issue is solved a different way (e.g. cilium feature flag),
    this can revert to `Cluster` — see also the Envoy Gateway VIP outage
    memory for the same root cause.
  anchor:
    scope: excerpt
    excerpt: |2-
          service:
            app:
              type: LoadBalancer
              annotations:
                lbipam.cilium.io/ips: 192.168.69.60
              externalTrafficPolicy: Local
              ports:
                http:
                  port: *port
    before: |2-
              runAsGroup: 1000
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
    after: |2-
          route:
            app:
              annotations:
