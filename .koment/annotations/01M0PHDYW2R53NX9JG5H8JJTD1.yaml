spec:
  target:
    file: kubernetes/apps/ai/agents/orchestrator/rbac.yaml
  type: why
  title: Read-everything plus targeted mutations, deliberately short of admin
  body: |-
    Janek asked (2026-08-23) for "pretty permissive RBAC to allow for debugging"
    on the workbench. The shape: get/list/watch on * / * (including secrets and
    CRs — full read visibility is the point), plus the mutations debugging
    actually needs: exec/port-forward/ephemeral debug containers, pod
    delete+evict (bouncing workloads), patch on workload controllers (rollout
    restarts are a template-annotation patch), and patch on the Flux CRDs
    (reconcile/suspend annotations). Deliberately NOT cluster-admin: this pod
    runs model-directed code with outbound internet, so it cannot create
    arbitrary workloads, mutate RBAC, or delete anything beyond pods. Widening
    later is a one-line roleRef change to cluster-admin if the friction ever
    warrants it. This is intentionally broader than the curated hermes SA —
    hermes is a headless automation surface, this is Janek's interactive
    debugging seat.
  anchor:
    scope: excerpt
    excerpt: |2-
        - apiGroups: ["*"]
          resources: ["*"]
          verbs: ["get", "list", "watch"]
    before: |-
      metadata:
        name: orchestrator-debug
      rules:
    after: |2-
        - apiGroups: [""]
          resources: ["pods/exec", "pods/portforward", "pods/ephemeralcontainers", "pods/eviction"]
          verbs: ["create"]
  author:
    name: claude-code
    kind: agent
    source: session
