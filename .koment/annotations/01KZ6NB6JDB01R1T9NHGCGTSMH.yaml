file: .github/workflows/koment-pages.yaml
kind: why
body: |-
  These two are the minimum GitHub Pages deployment needs and they live on the
  deploy job alone, never at workflow level: pages: write publishes the
  artifact, and id-token: write mints the OIDC token actions/deploy-pages
  exchanges for it. The build job stays on the read-only default, so nothing
  that renders untrusted repository content ever holds a publish token.

  zizmor's `undocumented-permissions` audit asks for an inline comment here.
  Do not add one — it only fires under --persona=pedantic or auditor, and
  the repo's default zizmor run reports the workflow clean. This annotation is
  that documentation.
created: "2026-08-04"
anchor:
  scope: excerpt
  excerpt: |2-
          pages: write
          id-token: write
  before: |2-
        runs-on: ubuntu-latest
        permissions:
          contents: read
  after: |2-
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
  last_seen_line: 68
