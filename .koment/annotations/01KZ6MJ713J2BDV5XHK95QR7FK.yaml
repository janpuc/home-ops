body: |-
  Enforces the standing home-ops convention — pull first, never auto-commit,
  edit only when asked — as a hard gate rather than relying on the agent
  remembering it. The init container copies it to /opt/data/hook-scripts/ and
  config.yaml registers it as the pre_tool_call hook.

  Like the other embedded scripts here it deliberately contains no "${...}"
  sequences, because Flux postBuild substitution runs over this ConfigMap.
