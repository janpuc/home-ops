  title: "kimi-k2.6, not k3: the council seat is latency-bound, same lineage"
  body: |-
    The Moonshot council seat runs kimi-k2.6 rather than the newer kimi-k3 on
    purpose. In the 2026-08-22 benchmark k3 took ~29s to first token even on a
    trivial prompt (it always reasons deeply), threw a transient 500, and missed
    the tool-call task; k2.6 answered everything cleanly at 2.1s TTFT. Council
    advisors are capped at 600 tokens and fan out once per user turn, so the
    seat is latency-bound, not depth-bound — the aggregator only needs the
    gist. Swapping k3 back in makes every council turn wait half a minute for
    its slowest member. k3 stays available for explicit use via the `k3` alias.

    The `glm` alias two blocks up pins glm-5.2 for the same reason: 5.3
    benchmarked at 30 tok/s vs 74 for 5.2 (needle 13.8s vs 4.5s) with no
    measured accuracy gain, so the interactive alias keeps the fast one and 5.3
    is reachable by full name.
  anchor:
    scope: excerpt
