  type: invariant
  title: WRITE_SUBCOMMANDS is allow-by-omission; new git verbs slip through
  body: |-
    WRITE_SUBCOMMANDS is every git subcommand that mutates history, refs or the
    working tree — unconditionally blocked. CONDITIONAL below holds the two
    that are destructive only with a delete or force flag (tag, branch) and
    read-only otherwise, so they are matched on their flags instead.

    Both sets are allow-by-omission: a subcommand missing from here passes the
    guard. That is the correct failure direction for a hook that must not wedge
    the agent, but it means adding a new mutating git subcommand to the list is
    the only way it gets blocked.
  anchor:
    scope: excerpt
    excerpt: "    WRITE_SUBCOMMANDS = {"
    before: |2
          import shlex
          import sys
    after: |2-
              "commit", "push", "merge", "rebase", "cherry-pick", "revert",
              "reset", "clean", "am", "apply", "restore", "checkout", "switch",
              "stash", "filter-branch", "update-ref", "gc", "prune", "mv", "rm",
