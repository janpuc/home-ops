  type: why
  title: Two secrets, and the 1P item name outlives k8s renames
  body: |-
    GH_TOKEN lives in the `hermes` 1Password item (classic PAT, repo scope,
    shared with the hermes agent), MEMINI_API_KEY in `memini`, Matrix
    credentials in `hermes`/`hermes-rooms` — no point duplicating secrets that
    rotate with their owners. The signing key is agent-owned so it has its own
    item, still named `claude-code`: 1Password item names are external identity
    and deliberately did NOT follow the 2026-08-24 role rename (the k8s Secrets
    did: orchestrator-secret, orchestrator-signing). Two ExternalSecrets because
    consumption differs — tokens are envFrom'd, the signing key must be a file
    mount: a multiline private key in envFrom yields an invalid env var name and
    is silently dropped. Inference auth is neither — the claude.ai OAuth login
    lives on the pod's home PVC.
  anchor:
    scope: excerpt
    excerpt: |2-
        dataFrom:
          - extract:
              key: claude-code
    before: |2-
          template:
            data:
              id_ed25519: "{{ .SSH_SIGNING_KEY }}"
