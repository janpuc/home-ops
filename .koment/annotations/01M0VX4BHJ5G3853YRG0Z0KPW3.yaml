  type: why
  body: |-
    MiniMax M3 through the litellm anthropic endpoint is the fan-out tier: it is
    the model Janek has the most tokens for, and it spends none of the Claude
    Max window that the guardian and his interactive sessions share. The
    `-anthropic` variant matters — the dispatch runner drives the Claude Code
    CLI, which speaks the Anthropic /v1/messages API, so the worker's
    credentials Secret carries ANTHROPIC_BASE_URL pointing at litellm plus
    ANTHROPIC_AUTH_TOKEN holding the litellm master key, and deliberately no
    CLAUDE_CODE_OAUTH_TOKEN: if both were present the CLI would prefer the
    subscription and silently bill the wrong pool.
  anchor:
    scope: excerpt
    excerpt: "    session: minimax/MiniMax-M3-anthropic"
    before: |2-
          credentialsRef:
            name: dispatch-minimax
        models:
    after: |2-
        workspaceRef:
          name: homeops-worker
        serviceAccountName: dispatch-agent-readonly
