spec:
  target:
    file: kubernetes/apps/downloads/slskd/app/externalsecret.yaml
  type: invariant
  title: Do not re-add the shared gluetun item; each VPN pod needs its own key
  body: |-
    This deliberately does NOT extract from the shared `gluetun` 1Password item
    the way qbittorrent does. The slskd item carries its own GLUETUN_* fields,
    including a WireGuard private key generated separately in the ProtonVPN
    dashboard.

    Both apps pulled the same key until 2026-08-10. WireGuard identifies a peer
    by public key and keeps one endpoint per peer, so two gluetun pods
    handshaking with the same key made Proton rewrite the peer endpoint to
    whichever handshook last. Return traffic landed on the wrong pod and both
    flapped: the forwarded port churned every ~80-90s in both (`ERROR [port
    forwarding] external port changed`), slskd's Soulseek connection reset on
    the same cadence, and gluetun healthchecks failed with `lookup github.com on
    127.0.0.1:53: server misbehaving`. qbittorrent had run 19h with zero VPN
    restarts, then took 8 within 15 minutes of slskd starting; both went quiet
    the moment slskd got its own key.

    Adding a second `extract` here to deduplicate the GLUETUN_* fields
    reintroduces the collision. Any future VPN-attached app needs its own
    dashboard-generated key too.
  anchor:
    scope: excerpt
    excerpt: |2-
        dataFrom:
          - extract:
              key: slskd
    before: |2-
              VPN_SERVICE_PROVIDER: "{{ .GLUETUN_VPN_SERVICE_PROVIDER }}"
              WIREGUARD_PRIVATE_KEY: "{{ .GLUETUN_WIREGUARD_PRIVATE_KEY }}"
              SERVER_COUNTRIES: "{{ .GLUETUN_SERVER_COUNTRIES }}"
  author:
    name: claude-code
    kind: agent
    source: session
