title: quick preset can afford per_iteration fanout with two advisors
body: |-
  `quick` is deliberately left on the default per_iteration fanout, unlike
  `council` above. With only two advisors, refreshing their advice on every
  iteration stays cheap — the cost blow-up that forced council onto
  user_turn does not apply here.
