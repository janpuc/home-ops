body: |-
  Storage and backup read access, granted in response to a concrete failure.
  Without the miroir and kopiur groups the agent is blind to exactly the layer
  that caused the 2026-07-31 snapshot-freeze incident — it could not have
  triaged that alert storm even if asked. Strictly get/list/watch; nothing
  here mutates storage.

  The cert-manager group below feeds certificate expiry into the weekly
  digest, and metrics.k8s.io backs `kubectl top` for capacity trends.
