  type: invariant
  title: MEMINI_EMBED_MODEL value pinned across memini and the embedder
  body: |-
    Stays "bge-m3" even though the InferenceService next to it is named
    bge-embedding-m3. memini persists this string in its store and refuses to
    boot if it ever disagrees, so renaming it to match the resource would force
    a full re-embed of every memory for no benefit — llama.cpp still serves
    the identical weights under --alias bge-m3. The matching invariant is
    recorded on kubernetes/apps/ai/llmkube/models/bge-embedding-m3.yaml; the two
    must be changed together or not at all.
  anchor:
    scope: excerpt
    excerpt: "              MEMINI_EMBED_MODEL: bge-m3"
    before: |2-
                    MEMINI_SHORT_TERM_CAP: "300"
                    MEMINI_DEMOTE_AFTER: 1440h
                    MEMINI_EMBED_BASE_URL: http://bge-embedding-m3.ai.svc.cluster.local:8080/v1
    after: |2-
                    MEMINI_EMBED_DIMS: "1024"
                    MEMINI_EMBED_MAX_CONCURRENCY: "2"
                    MEMINI_LOG_FORMAT: json
