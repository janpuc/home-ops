spec:
  target:
    file: kubernetes/apps/ai/agents/claude-code/externalsecret.yaml
  type: why
  title: "Two secrets: env tokens from shared items, key file from claude-code"
  body: |-
    GH_TOKEN lives in the `hermes` 1Password item (a classic PAT with repo
    scope, shared with the hermes agent) and MEMINI_API_KEY in the `memini` item
    — no point duplicating secrets that rotate with their owners. The signing
    key is different: it is agent-owned, so it gets its own `claude-code` item.
    Two ExternalSecrets because the consumption differs — the tokens are
    envFrom'd (claude-code-secret), while the signing key must be a file mount
    (claude-code-signing): a multiline private key in envFrom would produce an
    invalid env var name and be silently dropped. Inference auth is neither —
    it is the claude.ai OAuth login persisted on the pod's home PVC.
  anchor:
    scope: excerpt
    excerpt: |2-
        dataFrom:
          - extract:
              key: claude-code
    before: |2-
          template:
            data:
              id_ed25519: "{{ .SSH_SIGNING_KEY }}"
  author:
    name: claude-code
    kind: agent
    source: session
