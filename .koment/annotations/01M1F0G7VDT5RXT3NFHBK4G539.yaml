  title: Freeze exists because auto-merge rolled the control plane mid-incident
  body: |-
    Added 2026-09-01, hours into a multi-week period with no hardware access.
    That afternoon the base preset auto-merged the Kubernetes 1.36→1.37 group
    and a breaking flux-operator group while the cluster was still convalescing
    from a DRBD wedge; tuppr picked up the 1.37 target and sat in
    HealthChecking, primed to roll every node the moment the cluster looked
    green, with nobody around to catch a wedge mid-upgrade (upgrade churn is
    exactly the replica-transfer load that triggers LINBIT/drbd#137). The 1.37
    bump was reverted the same evening and this rule keeps it, and anything like
    it, behind a manual dashboard checkbox.

    The list is blast-radius-based, not cadence-based: control plane and talos
    roll nodes; miroir and kopiur are the storage and backup planes; flux and
    cilium can take down reconciliation or all networking; koment gates every
    commit via CI, so a broken koment release would lock the repo remotely;
    alpine is the miroir-medic base image, and a bump rolls the self-healing
    DaemonSet itself (observed 2026-09-01 17:57, mid-incident).

    This must stay the LAST packageRule — later rules win, and several earlier
    rules turn automerge on for overlapping matches. Deliberately no
    schedule/expiry field: drop the whole rule after the unattended period
    rather than letting it silently expire. Routine app bumps (media, ai,
    selfhosted) stay auto-merged; freezing those would just pile up PRs for no
    safety gain.
  anchor:
    scope: excerpt
    excerpt: |2-
          {
            description: "Unattended freeze: high-blast-radius updates need dashboard approval",
    before: |2-
            matchUpdateTypes: ["digest"],
            addLabels: ["type/digest"],
          },
    after: |2-
            matchPackageNames: [
