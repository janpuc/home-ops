file: kubernetes/apps/ai/hermes-matrix/app/configmap.yaml
kind: why
title: per-room Matrix personas with private IDs filled in by Secret
body: |-
  Per-room personas. The proxy resolves each entry against the real Matrix
  room ID and forwards the result to the main agent as a system message, so
  every room behaves differently while sharing one bot account and one
  gateway. Rooms are separate Hermes sessions for free — the Matrix adapter
  derives a session per room — so context does not bleed between them.

  Room IDs are deliberately absent. The {{ }} placeholders are rendered by the
  hermes-matrix ExternalSecret (templateFrom pointing at this key) from the
  1Password `hermes` item, which is what keeps this file safe to publish; the
  rendered result lands in the hermes-matrix Secret as config.yaml.

  Per-room prompts only work at all because of the patched matrix.py built by
  patch-matrix.py further down this file. Remove that patch and every room
  silently collapses to one shared persona.
created: "2026-08-04"
