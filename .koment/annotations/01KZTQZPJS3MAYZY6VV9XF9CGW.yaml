spec:
  target:
    file: kubernetes/apps/miroir-system/miroir/ks.yaml
  type: why
  body: |-
    `force: true` is here because StorageClass parameters are immutable.

    This Kustomization owns storageclass.yaml, and Kubernetes rejects any edit
    to `parameters` on an existing StorageClass:

    The StorageClass "miroir-fast" is invalid: parameters: ... field is
    immutable

    Without `force`, changing `miroir.home-operations.com/replicas` from "2" to
    "3" leaves the Kustomization permanently ReconciliationFailed while the live
    StorageClass silently keeps the old value — the dangerous outcome, because
    the repo then claims a replica count the cluster is not using. `force` lets
    Flux delete and recreate the object so the change actually lands.

    Recreating a StorageClass does not disturb existing volumes: PVs record
    their provisioner and parameters at creation time and never re-read the
    class, so only subsequently provisioned PVCs see the new value.
  anchor:
    scope: excerpt
    excerpt: |2-
        dependsOn:
          - name: miroir
        force: true
    before: |-
      metadata:
        name: miroir-config
      spec:
    after: |2-
        interval: 1h
        path: ./kubernetes/apps/miroir-system/miroir/config
        prune: true
