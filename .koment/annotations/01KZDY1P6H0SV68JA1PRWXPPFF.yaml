spec:
  target:
    file: kubernetes/apps/media/plex/ks.yaml
  type: why
  title: "KOPIUR_CAPACITY: 50Gi for Plex"
  body: |-
    Plex's `/config` holds watched-state, library metadata, the SQLite DB, and a
    sizable transcode temporary tree — far larger than the 5Gi used by Sonarr
    or 20Gi used by Jellyfin/Kavita. 50Gi is the round number that survived a
    real kopiur restore after the openebs → miroir migration when 20Gi filled
    within a week.

    **Why:** kopiur restore fails terminally when capacity is too small; sizing
    was chosen post-incident, not from docs. **How to apply:** if Plex starts
    failing kopiur Restores with "no space", bump this in 10Gi increments —
    kopiur does not auto-grow.
  anchor:
    scope: excerpt
    excerpt: |2-
        postBuild:
          substitute:
            APP: plex
            KOPIUR_CAPACITY: 50Gi
    before: |2-
            namespace: miroir-system
        interval: 1h
        path: ./kubernetes/apps/media/plex/app
    after: |2-
        prune: true
        sourceRef:
          kind: GitRepository
