  title: home-ops-guard scopes the block to home-ops only
  body: |-
    Scoped to home-ops only — other repos in the workspace are fair game and
    the agent is expected to commit freely in them. The check is deliberately
    loose (cwd OR the command text) so a `git -C .../home-ops push` issued from
    elsewhere is still caught.
  anchor:
    scope: excerpt
    excerpt: |2-
              if "home-ops" not in cwd and "home-ops" not in command:
                  return
    before: |2
              command = (payload.get("tool_input") or {}).get("command") or ""
              cwd = payload.get("cwd") or ""
    after: |2-

              for segment in segments(command):
                  sub = offending_subcommand(segment)
