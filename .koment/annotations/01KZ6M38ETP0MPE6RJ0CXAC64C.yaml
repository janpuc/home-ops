title: patch-matrix.py backports Matrix channel prompts upstream lacks
body: |-
  A backport, and it should not outlive its cause. Upstream hermes wires
  per-channel prompts into MessageEvent for Telegram and Slack but never for
  Matrix. This deployment runs hermes v0.15.2 (2026.5.29.2), roughly two
  months behind the main agent's v0.18.2, predating channel_overrides
  entirely.

  Everything needed is already in the image — MessageEvent.channel_prompt
  and resolve_channel_prompt() in platforms/base.py, and run.py consumes
  event.channel_prompt in half a dozen places. Only the two MessageEvent
  constructions in platforms/matrix.py fail to set it, so this touches those
  two call sites and nothing else.

  Delete this key and the patch-matrix init container once the upstream image
  ships a hermes new enough to wire Matrix channel prompts itself.
