file: kubernetes/apps/ai/hermes/app/configmap.yaml
kind: gotcha
title: snapshot freshness must read lastSuccessfulSnapshot, not time
body: |-
  The field is lastSuccessfulSnapshot, not lastSnapshotTime — the latter
  exists and updates on failed attempts, so reading it would report healthy
  backups that never actually succeeded.

  The 1.0-day threshold is derived from cadence: snapshots run every 2h, so
  24h without a successful one is genuinely stale rather than merely unlucky.
created: "2026-08-04"
