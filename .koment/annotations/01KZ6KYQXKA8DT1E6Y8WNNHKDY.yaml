title: reranker Q8_0 sized to share 2 GiB GTT with the embedder
body: |-
  Q8_0 is 606 MiB, chosen to match bge-m3 rather than for accuracy reasons.
  The iGPU GTT aperture is capped at 2 GiB by amdgpu.gttsize=2048 in
  talos/schematic.yaml.j2 and this model shares it with bge-embedding-m3, so
  weights and compute buffer together have very little headroom. Check
  mem_info_gtt_used before reaching for a larger quant.
