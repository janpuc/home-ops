spec:
  target:
    file: kubernetes/apps/ai/hermes/app/configmap.yaml
  type: why
  title: body stays plain text so non-HTML Matrix clients render cleanly
  body: |-
    The plain `body` field is left as-is and doubles as the plain-text fallback
    for clients that do not render HTML — only formatted_body carries the
    markup. Overwriting body with the HTML would make those clients show tags.
  anchor:
    scope: excerpt
    excerpt: |2-
                  content["format"] = "org.matrix.custom.html"
                  content["formatted_body"] = body
    before: |2-

              content = {"msgtype": msgtype, "body": body}
              if as_html:
    after: |2-

              txn = "hermes-%d" % int(time.time() * 1000)
              url = "%s/_matrix/client/v3/rooms/%s/send/m.room.message/%s" % (hs, room, txn)
