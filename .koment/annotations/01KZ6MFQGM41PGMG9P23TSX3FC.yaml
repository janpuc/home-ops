title: body stays plain text so non-HTML Matrix clients render cleanly
body: |-
  The plain `body` field is left as-is and doubles as the plain-text fallback
  for clients that do not render HTML — only formatted_body carries the
  markup. Overwriting body with the HTML would make those clients show tags.
