  type: why
  title: format-go block kept verbatim for clean upstream re-syncs
  body: |-
    Verbatim from home-operations/.github/lefthook.common.toml. Kept
    byte-identical so any future re-sync from upstream is a no-op for this
    block. `stage_fixed = true` is what makes the sequential ordering
    self-healing — gofmt's rewrite lands in the index before `koment-check`
    reads the worktree, so anchors see the formatted line numbers.
  anchor:
    scope: excerpt
    excerpt: |-
      [pre-commit.commands.format-go]
      glob = ["*.go"]
      run = "gofmt -s -w {staged_files}"
      stage_fixed = true
    before: |
      parallel = false
      skip = ["merge", "rebase"]
    after: |2-

      [pre-commit.commands.format-rust]
      glob = ["*.rs"]
