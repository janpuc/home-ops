  type: why
  body: |-
    The operator runs without --sessions-pvc on purpose: every miroir storage
    class provisions ReadWriteOnce only (verified against live PVs 2026-08-24),
    so a shared session-records volume cannot be attached across runner pods.
    Records therefore land inside each workspace PVC (dispatch ADR-0005
    deployment note). When an RWX class exists, add a dispatch-sessions claim
    and the --sessions-pvc flag to centralize them.
