kind: gotcha
body: |-
  THIS DEPLOYMENT RUNS A PATCHED gateway/platforms/matrix.py. The upstream
  image is hermes v0.15.2 (2026.5.29.2) and never wires per-channel prompts
  into MessageEvent for Matrix, though Telegram and Slack get them. Everything
  else the feature needs is already in the image, so the patch touches only
  the two MessageEvent constructions. Full rationale and the removal condition
  are recorded on the patch-matrix.py key in configmap.yaml.

  The patch is anchored and fails closed: if a base-image bump reshapes those
  blocks this container exits non-zero and the pod stays down, rather than
  quietly reverting every room to a single shared persona. A pod stuck in Init
  after a tag bump is the expected signal, not a mystery — re-derive the
  patch.
