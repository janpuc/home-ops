  type: why
  title: Alerts are the trigger that starts agent runs
  body: |-
    Janek's directive (2026-08-23): alerts ARE the trigger for the agents
    system. Since 2026-08-24 this route tees every non-noise alert (continue:
    true, so pushover still fires) to the dispatch operator's event gateway
    (janpuc/dispatch), which replaced the earlier claude-code coordinator
    Sandbox queue on the NAS. The gateway normalizes each alert into an event,
    runs zero-token CEL gates from Trigger CRs in the ai namespace (where
    dispatch and its guardian agent live), and creates a Session CR per
    surviving alert — Trigger dedupe on
    event.data.fingerprint with a cooldown replaces the old
    one-queue-task-per-fingerprint rule. sendResolved: false and firing-only
    intake remain deliberate: a resolved alert must not spawn a second triage
    run (Trigger `when` gates also filter on status == "firing"). The
    blackhole routes for Watchdog/InfoInhibitor sit above and are terminal,
    and the !~ matcher here is belt-and-braces if route order ever changes. If
    the gateway is down Alertmanager retries; a lost alert is acceptable
    because the duty agent's next alert-driven or patrol run sees current
    cluster state anyway. With no Trigger CRs defined the gateway accepts and
    drops everything, so this route is safe to point at a fresh install.
  anchor:
    scope: excerpt
    excerpt: |2-
            - receiver: agents
              continue: true
    before: |2-
                - name: alertname
                  value: InfoInhibitor
                  matchType: =
    after: |2-
              matchers:
                - name: alertname
                  value: Watchdog|InfoInhibitor
  author:
    name: claude-code
    kind: agent
    source: session
