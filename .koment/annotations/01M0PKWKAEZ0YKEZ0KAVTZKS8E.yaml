  type: why
  title: Alerts are the trigger that starts agent runs
  body: |-
    Janek's directive (2026-08-23): alerts ARE the trigger for the agents
    system. This route tees every non-noise alert (continue: true, so pushover
    still fires) to the alert-intake container in the claude-code coordinator
    Sandbox, which writes one queue task per alert fingerprint to
    /nas/queue/backlog; the guardian loop in the same pod consumes them with the
    cluster-guardian role file. sendResolved: false and firing-only intake are
    deliberate — a resolved alert must not spawn a second triage run; the
    dedupe key is the alert fingerprint across all queue states. The webhook URL
    is the Sandbox's headless-service FQDN, so it survives pod recreation; the
    blackhole routes for Watchdog/InfoInhibitor sit above and are terminal, and
    the !~ matcher here is belt-and-braces if route order ever changes. If the
    intake is down Alertmanager retries, and losing an alert task is acceptable:
    the guardian's next alert-driven run sees current cluster state anyway.
  anchor:
    scope: excerpt
    excerpt: |2-
            - receiver: agents
              continue: true
    before: |2-
                - name: alertname
                  value: InfoInhibitor
                  matchType: =
    after: |2-
              matchers:
                - name: alertname
                  value: Watchdog|InfoInhibitor
  author:
    name: claude-code
    kind: agent
    source: session
