  type: why
  title: CRDs come straight from upstream URLs, split from the controller
  body: |-
    Janek's call (2026-08-23): CRDs get their own ks and dir, linked by URL, so
    their lifecycle is decoupled from the controller — the closest achievable
    form of a crds chart given upstream publishes no chart artifact. The four
    files are the helm chart's crds/ directory pinned at the release tag;
    bumping the version means updating the tag in all four URLs (Renovate does
    not manage these). The JSON6902 patch rewrites the conversion-webhook
    service namespace that every CRD hardcodes to agent-sandbox-system — same
    fix the operator dir carried when it owned the CRDs; without it every
    Sandbox conversion call dials a nonexistent namespace. The agents-crds Flux
    ks runs with prune: false deliberately: a pruned CRD cascade-deletes every
    Sandbox and their PVC state, so CRD removal must always be a human act.
    Ownership transfer note: these CRDs were first applied by agents-operator;
    agents-crds reconciles before it (dependsOn), relabels them, and Flux GC
    skips objects labeled to another Kustomization, which is what makes the
    split safe without an outage.
  anchor:
    scope: excerpt
    excerpt: |-
      resources:
        - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/v0.5.6/helm/crds/agents.x-k8s.io_sandboxes.yaml
    before: |-
      # yaml-language-server: $schema=https://json.schemastore.org/kustomization
      apiVersion: kustomize.config.k8s.io/v1beta1
      kind: Kustomization
    after: |2-
        - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/v0.5.6/helm/crds/extensions.agents.x-k8s.io_sandboxclaims.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/v0.5.6/helm/crds/extensions.agents.x-k8s.io_sandboxtemplates.yaml
        - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/v0.5.6/helm/crds/extensions.agents.x-k8s.io_sandboxwarmpools.yaml
  author:
    name: claude-code
    kind: agent
    source: session
