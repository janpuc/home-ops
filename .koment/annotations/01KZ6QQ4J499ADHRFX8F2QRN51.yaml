  type: why
  title: lefthook common commands inlined locally to escape parallel=true
  body: |-
    Mirrored from home-operations/.github/lefthook.common.toml. The upstream
    sync was broken deliberately on 2026-08-04 because lefthook merges remotes
    after the local config and refuses to let the local file override the
    remote's `parallel = true`. Inlining the common commands locally is the only
    way to control command ordering without giving up the rest of the
    format-*/lint suite. Re-syncing from upstream would re-introduce the race;
    review the upstream config before re-merging.
  anchor:
    scope: excerpt
    excerpt: |-
      [pre-commit]
      parallel = false
      skip = ["merge", "rebase"]
    after: |2-

      [pre-commit.commands.format-go]
      glob = ["*.go"]
