spec:
  target:
    file: kubernetes/apps/ai/hermes-matrix/app/helmrelease.yaml
  type: why
  title: config.yaml is copied onto the PVC for HERMES_HOME consumption
  body: |-
    The per-room personas are rendered with the private room IDs by the
    hermes-matrix-config ExternalSecret, and have to be copied onto the PVC
    because the proxy reads config.yaml from HERMES_HOME (/data), not from a
    mounted secret path. Mounting the secret at /data directly is not an option
    — it would shadow the rest of the PVC.
  anchor:
    scope: excerpt
    excerpt: |2-
                      cp /run/secret/config.yaml /data/config.yaml
                      chmod 600 /data/config.yaml
    before: |2-
                      python3 /run/config/patch-matrix.py \
                        /usr/local/lib/python3.12/site-packages/gateway/platforms/matrix.py \
                        /patched/matrix.py
    after: |2-
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
