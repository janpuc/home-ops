file: kubernetes/apps/selfhosted/koment/app/helmrelease.yaml
kind: why
title: fullnameOverride stops the chart naming the Service koment-koment
body: |-
  Without this the chart names everything `koment-koment` (release name +
  chart name), and hermes' mcp_servers URL in
  kubernetes/apps/ai/hermes/app/configmap.yaml points at
  http://koment.selfhosted.svc.cluster.local:8080/mcp. Removing the override
  renames the Service and silently breaks that lookup — hermes just loses
  the koment toolset with no obvious error.
created: "2026-08-04"
