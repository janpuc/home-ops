spec:
  target:
    file: kubernetes/apps/ai/hermes/app/configmap.yaml
  type: invariant
  title: matrix-post error path never echoes the bearer token
  body: |-
    Never surface the access token in an error path. The HTTP response body is
    safe to show and is genuinely useful for diagnosis, so it is included; the
    generic handler below deliberately reports only the exception type, because
    an arbitrary exception's str() can carry the request headers and therefore
    the bearer token.
  anchor:
    scope: excerpt
    excerpt: |2-
                  die("HTTP %s posting to %s: %s" % (e.code, alias, e.read()[:300].decode("utf-8", "replace")))
              except Exception as e:
                  die("%s posting to %s" % (type(e).__name__, alias))
    before: |2-
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print(json.loads(r.read().decode()).get("event_id", ""))
              except urllib.error.HTTPError as e:
    after: |2-


          main()
