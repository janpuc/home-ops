spec:
  target:
    file: kubernetes/apps/ai/t3-code/app/configmap.yaml
  type: why
  title: LiteLLM is defined for Codex but deliberately not selected
  body: |-
    The provider block exists without a matching `model_provider = "litellm"`
    line, and that asymmetry is intentional.

    Codex here authenticates through ChatGPT device login against `/data/codex`
    on the PVC, which is a subscription rather than API billing. Setting
    `model_provider` would route every Codex session to LiteLLM instead and make
    the login pointless.

    Defining the provider anyway costs nothing and keeps the switch one line
    away: adding `model_provider = "litellm"` moves Codex onto the
    MiniMax/GLM/Qwen set with no other change. That matters because T3 drives
    the model through its own picker, so a mismatch between the picker's model
    id and the selected provider is silent until a request fails.

    There is no OpenAI or ChatGPT credential in 1Password, so until `t3-auth
    codex login` is run once, Codex has no working auth at all. Claude is the
    seeded default for exactly that reason.
  anchor:
    scope: excerpt
    excerpt: |2-
          [model_providers.litellm]
          name = "LiteLLM"
          base_url = "http://litellm.ai.svc.cluster.local:4000/v1"
    before: |2-
            }
          }
        codex-config.toml: |-
    after: |2
          env_key = "LITELLM_API_KEY"
          wire_api = "responses"
  author:
    name: claude-code
    kind: agent
    source: session
