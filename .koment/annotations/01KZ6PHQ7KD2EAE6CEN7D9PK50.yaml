file: kubernetes/apps/ai/hermes/app/configmap.yaml
kind: why
body: |-
  The one MCP server here that does not go through LiteLLM, because koment is
  self-hosted in this cluster and LiteLLM would add a proxy hop with nothing
  to contribute. KOMENT_API_KEY is a scoped bearer whose SHA-256 hash lives in
  koment's credentials.yaml, not a LiteLLM key.

  Over this transport hermes gets koment_get, koment_search,
  koment_repositories and — because the credential carries write scope —
  koment_add, which opens a review pull request rather than committing.
  koment_reanchor, koment_convert_comment and koment_acknowledge_comment are
  stdio-only and deliberately out of reach, which suits this repo: convert has
  no YAML detector and acknowledge is forbidden by AGENTS.md.
created: "2026-08-04"
