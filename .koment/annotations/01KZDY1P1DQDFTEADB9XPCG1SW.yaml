  type: why
  title: PLEX_ADVERTISE_URL three-way list
  body: |-
    Plex clients discover servers over the network by trying each
    `PLEX_ADVERTISE_URL`. Listing all three (public HTTPS via Envoy, the
    LB-IPAM-reserved LAN IP, and the in-cluster ClusterIP service) lets the same
    Plex claim be reached from outside the home (LAN roaming + mobile + VPN)
    without needing Plex Relay, while still letting in-cluster jobs
    (Bazarr/Sonarr/Radarr sidecars) resolve a stable service name.

    **Why:** picking only one breaks either remote clients or in-cluster tooling
    — discovered after LAN-only clients went dark when the public URL was
    removed. **How to apply:** if the cilium LB IPAM reservation
    (`lbipam.cilium.io/ips: 192.168.69.60`) changes, update the LAN entry too;
    clients will silently prefer the wrong endpoint otherwise.
  anchor:
    scope: excerpt
    excerpt: |2-
                    PLEX_ADVERTISE_URL: https://plex.janpuc.com:443,http://192.168.69.60:32400,http://plex.media.svc.cluster.local:32400
                    PLEX_NO_AUTH_NETWORKS: 192.168.69.0/24
