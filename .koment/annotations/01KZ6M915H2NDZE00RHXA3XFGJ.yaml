body: |-
  The weekly rollup is split across two paths on purpose. The generator goes
  on PATH as /opt/data/.local/bin/weekly-digest, but the cron wrapper must
  live under HERMES_HOME/scripts — that is the only location `hermes cron
  --script` will accept. Moving the wrapper anywhere else breaks the cron job
  with no error at install time.
created: "2026-08-04"
