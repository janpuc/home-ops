spec:
  target:
    file: kubernetes/apps/ai/hermes/app/helmrelease.yaml
  type: invariant
  title: weekly digest wrapper lives under HERMES_HOME/scripts for hermes cron
  body: |-
    The weekly rollup is split across two paths on purpose. The generator goes
    on PATH as /opt/data/.local/bin/weekly-digest, but the cron wrapper must
    live under HERMES_HOME/scripts — that is the only location `hermes cron
    --script` will accept. Moving the wrapper anywhere else breaks the cron job
    with no error at install time.
  anchor:
    scope: excerpt
    excerpt: |2-
                      mkdir -p /opt/data/scripts
                      cp /run/config/weekly-digest-run.sh /opt/data/scripts/weekly-digest-run.sh
    before: |2-
                      chmod 755 /opt/data/.local/bin/matrix-post
                      cp /run/config/weekly-digest.py /opt/data/.local/bin/weekly-digest
                      chmod 755 /opt/data/.local/bin/weekly-digest
    after: |2-
                      chmod 755 /opt/data/scripts/weekly-digest-run.sh
                  securityContext:
                    allowPrivilegeEscalation: false
  author:
    name: claude-code
    kind: agent
    source: session
