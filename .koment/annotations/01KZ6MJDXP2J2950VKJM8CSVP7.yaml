body: |-
  Both of these loops exist to stop trivial evasion of the guard. The first
  strips env-var prefixes and a sudo wrapper, so `FOO=bar git push` and `sudo
  git push` still resolve to git. The second skips git's own global flags —
  importantly -C, -c, --git-dir and --work-tree consume a following argument,
  so they are advanced by two rather than one; without that, `git -C /repo
  push` would present "-C" as the subcommand and slip through.
