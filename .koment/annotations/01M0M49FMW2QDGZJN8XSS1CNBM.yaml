  title: Only the current generation of each Go-plan family is tracked here
  body: |-
    The Go plan (https://opencode.ai/zen/go/v1/models) serves ~29 model ids, but
    this list deliberately carries only the newest generation of each family.
    Older generations still served upstream — glm-5.1/glm-5, kimi-k2.5,
    qwen3.5-plus, minimax-m2.5, mimo-v2-pro/omni, hy3-preview — are omitted
    because they are strictly dominated by their successors and each entry costs
    a fallback line, a Hermes models entry, and open-webui menu noise.

    muse-spark-1.2-contributor is omitted for a different reason: probing it
    on 2026-08-22 returned 403 DataPolicyError — the "contributor" pricing is
    paid for with your prompts (explicit opt-in to data collection for model
    training). That conflicts with the redact-PII posture in the Hermes
    config, so do not opt in casually.

    Specs for new entries (context, output, modalities) come from
    models.dev/api.json under the opencode-go provider, not from the OpenCode
    docs pages, which omit limits.
