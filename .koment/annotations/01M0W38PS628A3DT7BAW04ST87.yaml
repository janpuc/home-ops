  title: Workspace dataset is dual-access; do not chown or use fsGroup on it
  body: |-
    `Vault/Workspace` on bigmouth is a dedicated dataset shared two ways at
    once: NFS to this pod, and SMB as the `workspace` share to macOS. Its
    permissions are deliberate and easy to destroy.

    The dataset is `acltype=NFSV4`, owned `1000:3100` — uid 1000 is the
    TrueNAS `k8s` user, which is exactly the uid this pod runs as, so the pod
    matches `owner@`. The ACL carries four inheriting FULL_CONTROL ACEs
    (`owner@`, `group@`, `USER 3000` for jan.pucilowski over SMB, `GROUP 3100`)
    and an `everyone@` ACE with no permissions. New files therefore land as
    `1000:3100` mode `rwxrwx---`, writable from both sides with no world access.

    Three things must not happen. Do not recursively chown the workspace to the
    container uid; that is what breaks SMB ACL expectations, and it is
    unnecessary because the pod already owns it. Do not add `fsGroup` scoped to
    this volume expecting it to help — fsGroup does not apply to NFS volumes
    at all. Do not switch the dataset to POSIX acltype; the inheritance that
    keeps both sides working is an NFSv4 feature.

    `aclmode=PASSTHROUGH` rather than the `RESTRICTED` used on
    `Vault/BigMouth/Janek` is also deliberate: RESTRICTED forbids chmod, and git
    legitimately sets the executable bit. Verified from a pod: mkdir, write and
    `chmod +x` all succeed as uid 1000.

    `casesensitivity=SENSITIVE` is fixed at dataset creation and cannot be
    changed later. Source trees require it.
  anchor:
    scope: excerpt
    excerpt: |2-
              type: nfs
              server: bigmouth.internal
              path: /mnt/Vault/Workspace
              globalMounts:
                - path: /workspace
    before: |2-
              globalMounts:
                - path: /data
            workspace:
    after: |2-
            config:
              type: emptyDir
              globalMounts:
