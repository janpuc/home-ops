  type: why
  title: Limit GitHub credentials in init
  body: |-
    The GitHub CLI in `init-config` reads `GH_TOKEN` while it resolves and
    downloads the koment Codex plugin and the agent-kit skill batch. This
    container receives only that key. It does not receive every credential from
    `t3-code-config`.
  anchor:
    scope: excerpt
    excerpt: |2-
                    GH_TOKEN:
                      valueFrom:
                        secretKeyRef:
                          name: t3-code-config
                          key: GH_TOKEN
    before: |2-
                    tag: 0.0.33-3@sha256:023429ff9fd1cc6e8e5ae83925d90d649f2669433ffb398fd2151e2192f1ac2b
                  env:
                    AGENT_KIT_VERSION: v0.1.0
    after: |2-
                  command:
                    - /bin/bash
                    - -c
