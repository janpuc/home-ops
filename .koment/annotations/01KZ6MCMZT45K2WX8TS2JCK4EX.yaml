spec:
  target:
    file: kubernetes/apps/ai/hermes/app/configmap.yaml
  type: why
  title: aggregator stays on a different provider from the four advisors
  body: |-
    The council's four reference models are four distinct pretraining lineages
    — Moonshot, Zhipu, DeepSeek, Qwen — chosen so the members fail
    differently rather than for individual quality; all four are served by
    opencode-go.

    The aggregator is deliberately a fifth family on a DIFFERENT provider. That
    keeps aggregation working through an opencode-go outage and stops it being
    biased toward any one reference. Consolidating it onto opencode-go would
    quietly remove both properties.
  anchor:
    scope: excerpt
    excerpt: |2-
                aggregator:
                  provider: custom:litellm
                  model: minimax/MiniMax-M3
    before: |2-
                    model: opencode-go/deepseek-v4-pro
                  - provider: custom:litellm
                    model: opencode-go/qwen3.7-max
    after: |2-
                reference_temperature: 0.6
                aggregator_temperature: 0.4
                fanout: user_turn
