spec:
  target:
    file: talos/controlplane.yaml.j2
  type: gotcha
  title: "A ca: block merges as a unit — crt and key must appear together"
  body: |-
    Both `crt` and `key` are listed even where only one of them differs from the
    generated config, and the same shape repeats for `cluster.ca` below.

    Talos merges a machine-config patch one mapping at a time: supplying a `ca:`
    block replaces the whole block rather than merging into it field by field.
    Listing only `key:` therefore drops `crt:` from the result, and the node
    comes up with a CA it cannot present. The pairing is the invariant — if
    you add another CA here (`aggregatorCA`, `etcd.ca`, `serviceAccount`), give
    it both halves too.
  anchor:
    scope: excerpt
    excerpt: |2-
        ca:
          crt: op://Kubernetes/talos/MACHINE_CA_CRT
          key: op://Kubernetes/talos/MACHINE_CA_KEY
    before: |-
      ---
      machine:
        type: controlplane
    after: |2-
        features:
          kubernetesTalosAPIAccess:
            enabled: true
