file: .yayamlls.yaml
kind: why
title: yayamlls only needs flate to render Flux references inline
body: |-
  The Flux renderer is the only thing worth configuring here. yayamlls already
  enables Kubernetes apiVersion+kind schema auto-detect and the schemastore
  catalog by default, so this file exists solely to turn on flate, which
  renders HelmReleases and Kustomizations inline (code lens + diagnostics) by
  following Flux source references down from the cluster root.
created: "2026-08-04"
anchor:
  scope: excerpt
  excerpt: |-
    renderers:
      flate:
        enabled: true
        path: kubernetes
  before: "# https://github.com/home-operations/yayamlls"
