kind: why
title: workspace bootstrap is declarative so a rebuilt PVC returns identical
body: |-
  Everything below this line bootstraps the workspace — kanban board,
  project and skill bundles — declaratively, so a rebuilt PVC comes back
  identical instead of depending on someone having created them by hand in the
  pod.

  HERMES_HOME has to be exported explicitly: this init container does not
  inherit the app container's env, and the hermes CLI silently targets the
  wrong root without it.

  Each step is guarded differently for a reason. `kanban init` is documented
  idempotent, so it runs unconditionally. Board slugs are immutable, so the
  board is guarded on its slug rather than its name. A project is a named
  multi-folder workspace bound to that board. Bundles use --force so this
  block, not whatever happens to be on the PVC, is the single source of truth
  for what the /slash commands contain.
created: "2026-08-04"
