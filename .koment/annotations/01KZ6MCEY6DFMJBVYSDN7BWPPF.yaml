spec:
  target:
    file: kubernetes/apps/ai/hermes/app/configmap.yaml
  type: why
  title: pre_tool_call hook names the python interpreter explicitly
  body: |-
    Shell hooks live in agent/shell_hooks.py. A pre_tool_call hook refuses a
    tool call by printing {"decision": "block", "reason": "..."} on stdout.

    The interpreter is named explicitly because commands run through shlex.split
    with shell=False — a shebang plus exec bit would not be honoured. That is
    also why the init container chmods the script 644 rather than 755.
  anchor:
    scope: excerpt
    excerpt: |2-
          hooks:
            pre_tool_call:
              - command: /usr/bin/python3 /opt/data/hook-scripts/home-ops-guard.py
    before: |2-
              - "*wipefs*"
              - "*curl*|*sh*"
              - "*wget*|*sh*"
    after: |2-
                matcher: terminal
                timeout: 10
          hooks_auto_accept: true
  author:
    name: claude-code
    kind: agent
    source: session
