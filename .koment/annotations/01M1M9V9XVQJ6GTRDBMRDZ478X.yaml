  type: why
  title: User-approved destructive verbs for the local-storage migration loop
  body: |-
    Two grants, both approved by the user on 2026-09-03 during the local-storage
    migration, both revertable by deleting this file.

    restores delete: roughly 40% of first-attempt kopiur restores on this
    NFS-backed repository fail terminally with kopia "content not found"
    (mechanism never pinned down; settle delays and maintenance-quiet windows
    were both disproven), while a recreated Restore CR succeeded 19 of 19 times.
    A Failed Restore never retries and Flux only recreates it after deletion, so
    delete closes the retry loop without a human paste-block.

    persistentvolumeclaims delete: approved when the user extended the migration
    to ALL remaining volumes ("until drbd fix let's move all", 2026-09-03).
    Runtime-created PVCs — StatefulSet volumeClaimTemplates (prometheus,
    alertmanager, victoria-logs) and operator-created claims (grafana, gatus,
    t3-code canary) — keep their old storage class forever because a template
    class change only affects newly created claims; the old PVC must be deleted
    while the workload is parked so the controller recreates it on the new
    class. Every deletion in that flow is immediately rebuilt, and the
    kopiur-backed ones repopulate from snapshots.

    The SA remains read-only otherwise: no create, patch, or broader delete.
  anchor:
    scope: excerpt
    excerpt: |-
      kind: ClusterRole
      metadata:
        name: t3-code-kopiarestore-delete
    before: |-
      ---
      # yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/clusterrole_v1.json
      apiVersion: rbac.authorization.k8s.io/v1
    after: |-
      rules:
        - apiGroups:
            - kopiur.home-operations.com
