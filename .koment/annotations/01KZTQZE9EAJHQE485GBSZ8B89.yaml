  target:
    file: kubernetes/apps/miroir-system/miroir/config/storageclass.yaml
  type: why
  body: |-
    Three replicas so that no volume needs converting from diskless later.

    With `replicas: "2"` one of the three nodes holds no local copy, and
    `autoDiskfulAfter: 10m` in the HelmRelease then converts it and runs a full
    resync. That conversion had fired on essentially the whole cluster — 33 of
    37 fast-pool volumes were already at 3 replicas, each still carrying
    `fullSync: true` — so the declared replica count was a fiction and resyncs
    were near-permanent background churn. Provisioning all three diskful up
    front makes the spec match reality and removes the churn.

    It costs nothing: the volumes were already at 3 replicas via that same
    auto-conversion, and the fast thin pool was 14.5% allocated (36.7 GB of
    253.9 GB) when measured.

    IMPORTANT — this setting does NOT prevent the 2026-08-11 data loss, and an
    earlier version of this annotation wrongly claimed it did. The root cause
    was established later that day from VictoriaLogs and Prometheus: a
    filesystem freeze taken by the snapshot path leaked, and a routine
    KEDA scale-to-zero relocated the pod onto another node while the device was
    still frozen. `NodeStageVolume` there ran `blkid`, which cannot probe a
    frozen device and exits 2 — a code Kubernetes' `GetDiskFormat` treats as
    "unformatted" — so `mount_linux.FormatAndMount` ran `mkfs.ext4 -F` on a
    populated volume and DRBD replicated the wipe to every peer. Replica count
    is irrelevant to that sequence.

    The real fix is upstream in miroir: never format a device that failed to
    probe, and consult `MiroirVolume.status.formatted` before formatting. See
    the evidence pack referenced from the storage memory notes.
  anchor:
    scope: excerpt
    excerpt: |2-
        miroir.home-operations.com/pool: fast
        miroir.home-operations.com/replicas: "3"
    before: |-
      volumeBindingMode: WaitForFirstConsumer
      allowVolumeExpansion: true
      parameters:
    after: |2-
        miroir.home-operations.com/quorum: freeze
        csi.storage.k8s.io/fstype: ext4
      ---
