spec:
  target:
    file: kubernetes/apps/ai/t3-code/app/helmrelease.yaml
  type: gotcha
  title: Replace stale Memini marketplace state
  body: |-
    The PVC can retain a marketplace named `memini` with an obsolete source.
    Codex rejects a new source when that name already exists. The init container
    first installs the managed config into `CODEX_HOME`. It then removes and
    re-adds Memini so the snapshot matches the declared Git source. The later T3
    config copy restores the same managed settings if a network failure prevents
    the add.
  anchor:
    scope: excerpt
    excerpt: |2-
                      mkdir -p "$CODEX_HOME"
                      install -m 0644 /run/config/codex-config.toml "$CODEX_HOME/config.toml"
                      codex plugin marketplace remove memini >/dev/null 2>&1 || true
                      codex plugin marketplace add eleboucher/memini \
                        || echo "codex plugin marketplace unavailable; memini reaches Codex over MCP"
                      codex plugin add memini@memini \
                        || echo "codex plugin install unavailable; memini reaches Codex over MCP"
    before: |2-

                      export HOME=/data/home
                      export CODEX_HOME=/data/codex
    after: |2-

                      koment_plugin_stage="$(mktemp -d)"
                      if koment_plugin_tag="$(
  author:
    name: codex-mcp-client
    kind: agent
    source: session
