# yaml-language-server: $schema=https://raw.githubusercontent.com/koment-dev/koment/main/schema/v1alpha/policy.schema.json
apiVersion: koment.dev/v1alpha
kind: Policy
spec:
  comments:
    mode: strict
    intrinsic:
      - toolchain-directive
      - generated-marker
      - upstream-link
      - deprecated
      - public-api
    allowedAnnotations:
      - "^v\\d+(\\.\\d+)*"
      - "zizmor: ignore\\["
      - "^!"
      - "^(Bootstrap|Kube|Talos) Recipes$"
    generatedPaths:
      - kubeconfig
      - talosconfig
    vendoredPaths:
      - .venv/**
      - .github/labels.yaml
      - bootstrap/helmfile/apps.yaml
      - bootstrap/helmfile/crds.yaml
      - kubernetes/apps/media/sonarr/app/resources/refresh-series.sh
      - kubernetes/apps/selfhosted/searxng/app/resources/limiter.toml
      - kubernetes/flux/cluster/ks.yaml
  agents:
    adapters:
      - agents
      - claude
      - copilot
