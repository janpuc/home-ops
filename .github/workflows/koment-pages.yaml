---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Koment Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Koment Pages - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Koment
        uses: koment-dev/koment@c44fa3fe356b82bd28e785f1387df8b4a62ab91f # v3.0.0
        with:
          version: 2.2.0

      - name: Check Annotations
        run: |
          koment check
          koment comments check
          koment agents check

      - name: Render Site
        run: |
          koment site --out dist --name home-ops \
            --commit "${GITHUB_SHA}" \
            --commit-link "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            --banner "Annotations recorded against the manifests that run this cluster." \
            --banner-link "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

      - name: Verify Publication
        run: |
          test -f dist/index.html
          test -f dist/annotations.json
          test -f dist/search.json
          grep -q "snapshot of" dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Koment Pages - Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
