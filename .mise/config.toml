monorepo_root = true

[env]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"

[hooks]
postinstall = "lefthook install"

[tools]
"1password-cli" = "2.35.0"
actionlint = "1.7.12"
"github:home-operations/flate" = "v0.7.3"
"github:mitsuhiko/minijinja" = "3.1.0"
helm = "4.3.1"
helmfile = "1.8.3"
jq = "1.8.2"
kubectl = "1.37.2"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "26.13.0"
oxfmt = "0.75.0"
shellcheck = "0.11.0"
talos = "1.14.5"
yq = "4.54.3"
zizmor = "1.32.0"

# Shell completion runs this outside the task environment, from the caller's directory.
[task_templates.node]
usage = '''
complete "node" run="find \"$(git rev-parse --show-toplevel)/talos/nodes\" -name '*.yaml.j2' ! -name '*.schematic.yaml.j2' -exec basename {} .yaml.j2 \\; | sort"
'''

[tasks.log]
hide = true
run = "gum log -t rfc3339 -s -l"

# Runs in the caller's directory, so callers pass template paths relative to it.
[tasks.template]
hide = true
dir = "{{ cwd }}"
usage = '''
arg "<file>" help="Template path, or - for stdin"
arg "[args]" var=#true help="Extra arguments for minijinja-cli"
'''
run = '''
eval "args=(${usage_args:-})"
minijinja-cli "$usage_file" "${args[@]}" | op inject
'''

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

[monorepo]
config_roots = ["bootstrap", "kubernetes", "talos"]

[settings]
task.quiet = true
