---
# yaml-language-server: $schema=https://kritika.home-operations.com/kritika.schema.json
# Routine image updates that Renovate merges itself (.renovaterc.json5) get no
# review: a review would race the merge and nobody would read it. Reviewed: a
# major update, a pull request without a Renovate type label (agents' and Jan's),
# a chart (an ocirepository.yaml bump can carry CRDs), and anything under the
# paths pr-lane protects. Skipped pull requests show `kritika: skipped`.
trigger:
  include:
    - name: not-routine
      expr: '!pr.labels.exists(l, l.name in ["type/digest", "type/patch", "type/minor"])'
    - name: charts
      paths: ["**/ocirepository.yaml"]
    - name: protected
      paths:
        - "talos/**"
        - ".github/**"
        - ".renovaterc.json5"
        - ".mise*"
        - ".mise/**"
        - "kubernetes/apps/kube-system/**"
        - "kubernetes/apps/flux-system/**"
        - "kubernetes/apps/network/**"
        - "kubernetes/apps/security/**"
        - "kubernetes/apps/cnpg-system/**"
        - "kubernetes/apps/miroir-system/**"
        - "kubernetes/apps/kopiur-system/**"
        - "kubernetes/apps/external-secrets/**"
        - "kubernetes/apps/cert-manager/**"
        - "kubernetes/apps/ai/litellm*/**"
skills:
  scope:
    renovate-review:
      when: [{ expr: pr.headRef.startsWith("renovate/") }]
tools:
  # The runner image carries curl, find, gh, grep and jq. The other commands
  # the reviews used come from the aqua registry: flate renders the charts a
  # review needs, the other three are the search and query tools the old
  # agent command list named.
  # renovate: datasource=github-releases depName=home-operations/flate
  aqua:home-operations/flate: v0.6.5
  # renovate: datasource=github-releases depName=sharkdp/fd
  aqua:sharkdp/fd: v10.5.2
  # renovate: datasource=github-releases depName=BurntSushi/ripgrep
  aqua:BurntSushi/ripgrep: 15.2.0
  # renovate: datasource=github-releases depName=mikefarah/yq
  aqua:mikefarah/yq: v4.54.1
